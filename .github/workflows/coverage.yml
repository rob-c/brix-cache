name: coverage finite DNS lifecycle probe
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NGINX_SRC: /tmp/nginx-1.31.8
      PYTHONPATH: tests
      PYTHONUNBUFFERED: '1'
      COVERAGE_MIN: 90
      COVERAGE_OUT: /tmp/brix-coverage-report
      COVERAGE_PRIVILEGED: '0'
      COVERAGE_CEPH: '0'
      COVERAGE_CEPH_IMAGE: quay.io/ceph/demo@sha256:2c5efcb089f5e50f9cd3213b995a6ad7428122b80ac140c41f2d4a780a3b7fc6
      COVERAGE_USERNS_PROFILE: brix-coverage-userns-tests
      BRIX_CVMFS_APPARMOR_PROFILE: brix-coverage-userns-tests
      BRIX_MINIO_BIN: /tmp/brix-minio-bin/minio
      PYTEST_ADDOPTS: -p no:brixtest -p no:platformdirs
      COVERAGE_TEST_CMD: python3 -m pytest --noconftest test_dns_driver_native.py -n0 -o addopts= -ra -q -p no:randomly
        -p no:rerunfailures
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Reserve disk space for the instrumented SDK and test filesystem
      run: '# This job uses neither SDK. Remove them only on this disposable host.

        sudo rm -rf /usr/local/lib/android /usr/share/dotnet

        df -h /

        '
    - name: Install build + coverage deps
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends build-essential lcov \\\n  libssl-dev\
        \ zlib1g-dev libpcre2-dev \\\n  libcurl4-openssl-dev libsqlite3-dev libkrb5-dev \\\n  libjansson-dev libxml2-dev\
        \ librados-dev libradospp-dev libradosstriper-dev libcephfs-dev \\\n  libseccomp-dev liburing-dev \\\n \
        \ libbz2-dev liblzma-dev libzstd-dev liblz4-dev libbrotli-dev \\\n  libfuse3-dev fuse3 libcap-dev libacl1-dev\
        \ libattr1-dev attr \\\n  python3-venv python3-dev pkg-config rsync git sudo uidmap bubblewrap tini apparmor\
        \ apparmor-utils \\\n  xrootd-client xrootd-server xrootd-server-plugins \\\n  xrootd-scitokens-plugins\
        \ xrootd-voms-plugins \\\n  krb5-kdc krb5-admin-server krb5-user haproxy nghttp2-server \\\n  rpm dnf createrepo-c\
        \ brotli lz4 zstd gnupg fail2ban iproute2 nftables \\\n  xfsprogs python3-gfal2-util gfal2-util-scripts\
        \ gfal2-plugin-file gfal2-plugin-xrootd \\\n  gfal2-plugin-http gfal2-plugin-gridftp globus-gass-copy-progs\n\
        python3 -m venv .venv-coverage\n.venv-coverage/bin/pip install --only-binary=xrootd \\\n  -r requirements.txt\
        \ -r requirements-optional.txt './brixtest[all]'\n.venv-coverage/bin/pip check\necho \"$PWD/.venv-coverage/bin\"\
        \ >> \"$GITHUB_PATH\"\necho \"$NGINX_SRC/objs\" >> \"$GITHUB_PATH\"\nsudo modprobe fuse\necho user_allow_other\
        \ | sudo tee -a /etc/fuse.conf\n"
    - name: Prepare disposable test hostname and filesystem
      run: '# Azure''s FQDN can exceed the 64-byte certificate CN limit. Globus

        # also needs the local host name to resolve for parallel MODE E.

        echo ''127.0.0.1 brix-ci.test brix-ci'' | sudo tee -a /etc/hosts

        sudo hostname brix-ci.test

        python3 -c ''import socket; name = socket.getfqdn(); assert len(name) <= 64, name; socket.gethostbyname(name)''

        # ext4''s aggregate xattr limit cannot hold the full wire contract.

        # Only format this new sparse file on the disposable runner.

        image="$RUNNER_TEMP/brix-coverage.xfs"

        # Keep test data outside the runner''s home so switched UIDs can

        # traverse the parents of their own fixtures.

        filesystem=/tmp/brix-coverage-fs

        (set -o noclobber; : > "$image")

        truncate -s 24G "$image"

        sudo mkfs.xfs -q -f "$image"

        mkdir "$filesystem"

        sudo mount -o loop,nosuid,nodev "$image" "$filesystem"

        sudo chown root:root "$filesystem"

        sudo chmod 1777 "$filesystem"

        # Watermark eviction contracts require actual usage above 10%.

        # Reserve space only in this newly created disposable filesystem.

        fallocate -l 3G "$filesystem/.watermark-fixture-space"

        echo "TEST_ROOT=$filesystem/brix-cov" >> "$GITHUB_ENV"

        '
    - name: Permit the test user-namespace launchers
      id: coverage_userns
      run: sudo apparmor_parser --add tools/ci/coverage_userns.apparmor
    - name: Fetch nginx source
      run: curl -fsSL https://nginx.org/download/nginx-1.31.8.tar.gz | tar -xz -C /tmp
    - name: Build instrumented module and freeze the production inventory
      id: prepare
      run: 'set -o pipefail

        python3 tests/rpm/make_fixtures.py

        python3 tools/ci/coverage_host.py prepare 2>&1 | tee /tmp/coverage-prepare.txt

        '
    - name: Upload build checkpoint
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-build-checkpoint
        path: '/tmp/coverage-prepare.txt

          /tmp/brix-coverage-report/stages.json

          /tmp/brix-coverage-report/coverage.initial.info

          '
    - name: Run finite DNS lifecycle contracts
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      run: 'set -o pipefail

        python3 tools/ci/coverage_host.py ordinary 2>&1 | tee /tmp/coverage-ordinary.txt

        '
    - name: Upload ordinary suite checkpoint
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-ordinary-checkpoint
        path: '/tmp/coverage-ordinary.txt

          /tmp/brix-coverage-report/stages.json

          '
    - name: Capture focused counters for gap diagnosis
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      run: 'python3 - <<''PYDIAG''

        import json, os

        from pathlib import Path

        from tools.ci import coverage, coverage_merge

        root=str(Path.cwd()); report=Path(os.environ[''COVERAGE_OUT''])

        state=json.loads((report/''stages.json'').read_text()); units=report/state[''units'']

        requests=report/''coverage.focused-requests.info''; standalone=report/''coverage.focused-units.info''

        coverage._capture(root, [''/tmp/nginx-1.31.8/objs'', root+''/client'', root+''/shared''], str(requests))

        coverage._capture(root, [str(units)], str(standalone))

        coverage_merge.merge_execution(report/''coverage.initial.info'', [requests, standalone], report/''coverage.info'')

        print(''Diagnostic native-client/S3/binding/cache/root/namespace/Ceph counters captured; NOT a complete
        coverage measurement.'')

        PYDIAG

        '
    - name: Remove the test user-namespace profile
      if: ${{ always() && steps.coverage_userns.outcome == 'success' }}
      run: sudo apparmor_parser --remove tools/ci/coverage_userns.apparmor
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-report
        path: '/tmp/coverage-report.txt

          /tmp/coverage-*.txt

          /tmp/brix-coverage-report/stages.json

          /tmp/brix-coverage-report/coverage.info

          /tmp/brix-coverage-report/html

          '
    - name: Unmount the disposable test filesystem
      if: always()
      run: "filesystem=/tmp/brix-coverage-fs\nif mountpoint -q \"$filesystem\"; then\n  # Reports are already captured.\
        \ Idle test brokers can retain log\n  # descriptors until the runner reaps them during job cleanup.\n  sudo\
        \ umount --lazy \"$filesystem\"\nfi\n"
'on':
  workflow_dispatch: {}

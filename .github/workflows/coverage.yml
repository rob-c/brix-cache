name: coverage host isolation probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: bce4d3ed562cdcb6db69f5c1128d9f27b0379e50
      - name: Verify workload remains inside its memory cgroup
        run: |
          python3 - <<'PYPROBE'
          import os
          from pathlib import Path
          import pwd
          import subprocess
          import sys
          import tempfile
          from tools.ci import coverage_host
          root=Path.cwd()
          probe=Path(tempfile.mkdtemp(prefix='brix-ci-scope-')) / 'probe.py'
          probe.write_text("""import os, pwd
          from pathlib import Path
          assert os.getuid() != 0
          assert os.environ['HOME'] == pwd.getpwuid(os.getuid()).pw_dir
          assert os.readlink('/proc/self/ns/pid') != os.environ['TEST_ROOT']
          assert os.readlink('/proc/self/ns/net') == os.environ['COVERAGE_OUT']
          row=next(row for row in Path('/proc/self/cgroup').read_text().splitlines() if row.startswith('0::'))
          path=Path('/sys/fs/cgroup') / row[3:].lstrip('/') / 'memory.max'
          print('Workload cgroup:', row, 'memory.max:', path.read_text().strip(), flush=True)
          assert path.read_text().strip() == str(96 * 1024**2)
          """)
          environment={'PATH': os.defpath, 'TEST_ROOT': os.readlink('/proc/self/ns/pid'),
                       'COVERAGE_OUT': os.readlink('/proc/self/ns/net')}
          command=coverage_host._command('ordinary', root, sys.executable,
                                       pwd.getpwuid(os.getuid()).pw_name, 128 * 1024**2, environment)
          command[-3:]=[str(probe)]
          assert subprocess.run(command).returncode == 0
          probe.write_text('data = bytearray(256 * 1024**2)\nprint("unexpected survival")\n')
          assert subprocess.run(command).returncode != 0
          print('Hosted runner memory boundary and isolated OOM: passed')
          PYPROBE

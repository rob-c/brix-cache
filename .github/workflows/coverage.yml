# gcov/lcov line-coverage report for src/ and client/ (QUALITY_ROADMAP §2.3/§3.4).
#
# Blocking line-coverage ratchet. The 67% floor is 1.9 points below the reviewed
# 2026-09-03 instrumented fast-tier baseline of 68.9%; increase it only after a
# new reproducible observation. The report is still uploaded on every failure.
#
# The fast tier boots the test fleet (self-provisioned PKI); a meaningful figure
# needs that to run. A failed fleet or test command is a failed coverage job;
# partial counters remain available through the always-run artifact step.
name: coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00, after fanalyzer (03:00) + codechecker (04:00)

permissions:
  contents: read

# Cron/dispatch only: never cancel a run in flight — the weekly figure is the
# whole product of this lane.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Install build + coverage deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential lcov \
            libssl-dev zlib1g-dev libpcre3-dev libpcre2-dev \
            libcurl4-openssl-dev libsqlite3-dev libkrb5-dev \
            libjansson-dev libxml2-dev librados-dev
          pip install --user pytest pytest-xdist pytest-timeout
          pip install --user -e brixtest/
      - name: Fetch nginx source
        run: curl -fsSL https://nginx.org/download/nginx-1.28.3.tar.gz | tar -xz -C /tmp
      - name: Build instrumented module, run suite, capture coverage
        env:
          NGINX_SRC: /tmp/nginx-1.28.3
          PYTHONPATH: tests
          COVERAGE_MIN: 67
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          tools/ci/coverage.py 2>&1 | tee /tmp/coverage-report.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            /tmp/coverage-report.txt
            coverage/coverage.info
            coverage/html

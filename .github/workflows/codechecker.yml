# CodeChecker ratchet — Clang Static Analyzer + clang-tidy — BLOCKING, per-PR
# (hyper-hardening B-1). Findings are gated against tools/ci/codechecker_baseline.txt,
# keyed by CodeChecker's content-based report_hash: only a NEW finding fails.
#
# WHY THIS IS NOW BLOCKING (was advisory / weekly-cron-only).  report_hash is
# stable but the CHECKER SET a given clang/clang-tidy version emits is not: a
# different clang than the one that produced the baseline surfaces a different
# finding set, which is exactly why this gate used to be continue-on-error. The
# baseline was generated on the dev box (AlmaLinux 9, clang 21.1.8); this job now
# runs inside `container: almalinux:9` — the dev distro — so the runner's clang IS
# that clang, the findings reproduce, and the ratchet is stable enough to block.
# That is the "pin clang 21.x to match dev" step B-1 called for. If the el9 clang
# package is bumped, regenerate the baseline on the new toolchain
# (tools/ci/run_codechecker.py --regen, reviewed) — NEVER --regen from CI output.
#
# Complements fanalyzer.yml (GCC -fanalyzer, same container discipline); the two
# engines catch different bugs.
name: codechecker
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00, an hour after fanalyzer
jobs:
  codechecker:
    runs-on: ubuntu-latest
    # Pin the toolchain to the dev distro so the Clang SA / clang-tidy finding set
    # reproduces the frozen baseline exactly — the prerequisite for blocking.
    container: almalinux:9
    steps:
      - name: Install build deps + pinned clang toolchain
        run: |
          # jansson-devel + librados-devel live in CRB on EL9 (and librados2-devel
          # is the EL7-era package name — it does not exist on EL9).
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install git gcc make python3 python3-pip tar \
            clang clang-tools-extra \
            openssl-devel zlib-devel pcre2-devel \
            libcurl-devel sqlite-devel krb5-devel \
            jansson-devel libxml2-devel librados-devel
          clang --version
      - uses: actions/checkout@v4
      - name: Install CodeChecker
        run: pip install --user codechecker
      - name: Fetch and configure nginx with the module
        run: |
          curl -fsSL https://nginx.org/download/nginx-1.28.3.tar.gz | tar -xz -C /tmp
          cd /tmp/nginx-1.28.3
          ./configure --with-stream --with-stream_ssl_module \
            --with-http_ssl_module --with-http_dav_module --with-threads \
            --add-module="$GITHUB_WORKSPACE"
      - name: Run CodeChecker ratchet (blocking on new findings vs baseline)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          NGX_BUILD=/tmp/nginx-1.28.3 \
            tools/ci/run_codechecker.py 2>&1 | tee /tmp/codechecker-report.txt
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codechecker-report
          path: /tmp/codechecker-report.txt

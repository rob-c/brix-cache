# GCC -fanalyzer zero-findings gate — BLOCKING, per-PR (hyper-hardening B-1).
#
# ANY finding (use-after-free / leak / NULL-deref) fails the job. The old
# frozen-baseline ratchet (tools/ci/fanalyzer_baseline.txt) was burned to zero
# and deleted 2026-08-27: every waived false positive was restructured into a
# shape the analyzer can prove safe — verified on BOTH the dev gcc 13.3 and
# this job's el9 gcc 11.5. The recurring shapes: advance-before-free queue
# drain; the exec'd child's dup2'd stdout given a named close;
# allocate-before-grow container inserts with the post-increment split out of
# the array-store index; SHM zone accessors reading zone->data exactly once;
# compound `tbl == NULL || x` guards split into separate ifs (gcc 11 drops
# the non-NULL constraint on an accessor-returned pointer inside a || guard);
# table layout fields snapshotted into locals before locks/loops. Two
# tightly-scoped `#pragma GCC diagnostic ignored "-Wanalyzer-malloc-leak"`
# blocks remain where gcc 11 cannot see a symbolic-index store as an escape
# (sd_pblock_catalog_ns.c path_list_push, evict_candidates.c grow block) —
# each carries its rationale in a comment. There is no waiver path — a
# finding is fixed in code, never re-baselined.
# fanalyzer.yml's first run caught a REAL latent NULL-deref (ngx_log.h /
# stage_engine reconcile with a NULL cycle log — fixed, regression-tested in
# tests/c/run_stage_reconcile_tests.sh); the gate's whole point is that the next
# one blocks the PR instead of merging.
#
# -fanalyzer output is GCC-version and build-flag sensitive, so the job stays
# pinned inside `container: almalinux:9` (the dev distro): the zero-findings
# state was verified on that toolchain, and the pin keeps a distro gcc bump
# from redding every PR at once. If the el9 gcc package is bumped and its
# analyzer flags a new idiom, restructure the code on the new toolchain —
# do not reintroduce a baseline to silence it.
#
# Complements codechecker.yml (Clang SA + clang-tidy, same container discipline).
name: fanalyzer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: fanalyzer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fanalyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Pin the toolchain to the dev distro so the verified zero-findings state
    # reproduces exactly — the prerequisite for keeping this gate blocking.
    container: almalinux:9
    steps:
      - name: Install build deps + pinned gcc toolchain
        run: |
          # jansson-devel + librados-devel live in CRB on EL9 (and librados2-devel
          # is the EL7-era package name — it does not exist on EL9).
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install git gcc make python3 tar \
            openssl-devel zlib-devel pcre2-devel \
            libcurl-devel sqlite-devel krb5-devel \
            jansson-devel libxml2-devel librados-devel
          gcc --version
      - uses: actions/checkout@v7
      - name: Fetch and configure nginx with the module
        run: |
          curl -fsSL https://nginx.org/download/nginx-1.28.3.tar.gz | tar -xz -C /tmp
          cd /tmp/nginx-1.28.3
          ./configure --with-stream --with-stream_ssl_module \
            --with-http_ssl_module --with-http_dav_module --with-http_auth_request_module --with-threads \
            --add-module="$GITHUB_WORKSPACE"
      - name: Run analyzer gate (blocking on any finding)
        run: |
          NGX_BUILD=/tmp/nginx-1.28.3 FANALYZER_RAW=/tmp/fanalyzer-raw.txt \
            tools/ci/run_fanalyzer.py 2>&1 | tee /tmp/fanalyzer-report.txt
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fanalyzer-report
          path: |
            /tmp/fanalyzer-report.txt
            /tmp/fanalyzer-raw.txt

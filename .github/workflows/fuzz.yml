# libFuzzer smoke + nightly (hyper-hardening B-3).
#
# The harnesses under tests/fuzz/ (fuzz_zip_dir, fuzz_b64url, fuzz_safe_size,
# fuzz_jwt_json, fuzz_urlcodec — the full set enumerated by cmdscripts.fuzz_all)
# build with clang -fsanitize=fuzzer,address,undefined and replay their committed
# corpora. Until this lane existed nothing ran them in CI, so a harness could
# silently rot (fuzz_zip_dir did: a sd_posix.c file-split left its unity build
# unlinkable — fixed 2026-07-18 when this lane was added).
#
# BLOCKING on PRs — the harnesses are self-contained deterministic clang builds
# with no baseline to drift, so a crash/leak here is a real, reproducible fault,
# not toolchain noise (contrast fanalyzer.yml, which is advisory precisely
# because its baseline is GCC-version-sensitive). Each harness runs the fast
# FUZZ_TIME the runner honours; the nightly cron runs the same targets longer.
#
# Corpus growth is now realised: the `corpus-writeback` job below runs the
# nightly `-merge=1` minimization and commits the coverage-minimal corpora back
# (hyper-hardening B-3 Fix 2). The C-1/C-2 auth/wire-framing harnesses
# (fuzz_gsi_bucket, fuzz_sss_frame, fuzz_macaroon_frame, fuzz_sigv4_canonical,
# fuzz_root_frame) attach to this same lane via cmdscripts.fuzz_all — see
# docs/07-security/hyper-hardening-plan.md B-3/C-1/C-2.
name: fuzz
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          # libssl-dev provides -lcrypto for fuzz_gsi_bucket; libjansson-dev for
          # fuzz_jwt_json; zlib1g-dev for fuzz_zip_dir.
          sudo apt-get install -y --no-install-recommends \
            clang zlib1g-dev libssl-dev libjansson-dev
      - name: Run libFuzzer harnesses
        working-directory: tests
        env:
          # Longer soak on the nightly cron; fast smoke on PR/push.
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: python3 -m cmdscripts.fuzz_all
      # A crash is only actionable if the input that caused it survives the run.
      # cmdscripts.fuzz_all points libFuzzer's -artifact_prefix here; without
      # this step the reproducer dies with the runner and triage is left with a
      # truncated log (that is what happened to fuzz_b64url on 2026-08-05).
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore

  # Nightly (and manual) corpus write-back — the git-write half of B-3.
  # NEVER runs on pull_request: an untrusted PR must not be able to push. It
  # minimizes every harness corpus with `-merge=1` and commits ONLY the reduced
  # tests/fuzz/corpus_* dirs back to main so coverage compounds across nights.
  corpus-writeback:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A full checkout with push credentials so the bot can commit back.
          persist-credentials: true
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang zlib1g-dev libssl-dev libjansson-dev
      - name: Minimize corpora and commit back
        run: python3 tools/ci/fuzz_corpus_writeback.py --commit

# Run the tools/ci/ invariant guards on every PR and push to main.
#
# These guards encode the project's hardest-won invariants (VFS seam,
# config coverage, shared-helper discipline, SD driver conformance,
# file-size cap). They were manual-only until 2026-07-07 — and the
# file-size check accumulated 18 violations in that time. Never remove
# a step here without removing the invariant it enforces.
#
# `if: '!cancelled()'` on each step so ALL guards report, not just the
# first failure.
name: guards
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # guards use `git ls-files`
      - name: config coverage — every .c built or reasoned
        run: tools/ci/check_config_coverage.py
      - name: client build coverage — every client/shared .c built or reasoned
        if: '!cancelled()'
        run: tools/ci/check_client_build_coverage.py
      - name: make recipes — one target, one recipe
        if: '!cancelled()'
        run: tools/ci/check_make_recipes.py
      - name: vfs seam — no new storage-plane bypasses
        if: '!cancelled()'
        run: tools/ci/check_vfs_seam.py
      - name: vfs mutation gate — no ungated export mutation (phase-105)
        if: '!cancelled()'
        run: tools/ci/check_vfs_mutation_gate.py
      - name: http helper reimplementation
        if: '!cancelled()'
        run: tools/ci/check_http_helper_reimpl.py
      - name: curl enum ifdef — no preprocessor tests on CURLOPT_/CURLINFO_ names
        if: '!cancelled()'
        run: tools/ci/check_curl_enum_ifdef.py
      - name: auth verdict sentinel — no unsanctioned auth_done setters (C-3)
        if: '!cancelled()'
        run: tools/ci/check_auth_verdict_sentinel.py
      - name: metric cardinality — no unbounded Prometheus label values
        if: '!cancelled()'
        run: tools/ci/check_metric_cardinality.py
      - name: metric names — docs cite families and labels the exporters emit
        if: '!cancelled()'
        run: tools/ci/check_metric_names.py
      - name: client flags — docs cite flags the client tools actually parse
        if: '!cancelled()'
        run: tools/ci/check_client_flags_doc.py
      - name: sd driver conformance
        if: '!cancelled()'
        run: tools/ci/check_sd_driver_conformance.py
      - name: shm mutex — no bare ngx_shmtx_create (INVARIANT 10)
        if: '!cancelled()'
        run: tools/ci/check_shm_mutex.py
      - name: file-size hard cap (600 lines)
        if: '!cancelled()'
        run: tools/ci/check_file_size.py
      - name: python file-size cap (600 logical lines, tests/utils/tools)
        if: '!cancelled()'
        run: tools/ci/check_py_file_size.py
      - name: python complexity cap (CCN 15, tests/utils/tools)
        if: '!cancelled()'
        run: |
          pip install --quiet 'lizard>=1.17,<2'
          tools/ci/check_py_complexity.py
      # Two halves of one contract: CCN 15 for the native trees, and five
      # metrics for every Python tree. Neither has a backlog, so neither can be
      # made green by appending to a file. The Python half runs through its own
      # CLI rather than pytest: this job is a bare checkout, and the suite's
      # conftest starts a server fleet for any pytest run under tests/ — it
      # would fail on the missing objs/nginx, not on the code.
      - name: complexity gate — native, absolute CCN 15, no exemptions
        if: '!cancelled()'
        run: |
          pip install --quiet 'lizard>=1.17,<2'
          tools/ci/check_complexity.py
      # Copy-paste detector over src/client/shared. No backlog: like the
      # complexity gates it cannot be made green by appending to a file, only
      # by not cloning. lizard is already installed by the step above.
      - name: duplication gate — copy-paste detector, no backlog
        if: '!cancelled()'
        run: |
          pip install --quiet 'lizard>=1.17,<2'
          tools/ci/check_duplication.py
      - name: complexity gate — Python (CCN/cognitive/NPath/Halstead/nesting)
        if: '!cancelled()'
        run: |
          pip install --quiet 'lizard>=1.17,<2' 'complexipy>=6,<8' 'radon>=6,<7'
          tools/ci/check_python_quality.py
      - name: "directive registry — config-surface drift (phase-105 W5.4: R1/R2/R4/R5/R6 gate; R3 WARN until W6)"
        if: '!cancelled()'
        run: tools/ci/check_directive_registry.py --fail
      - name: todo/fixme ratchet (no new deferred-work markers)
        if: '!cancelled()'
        run: tools/ci/check_todo_fixme.py
      - name: doc path drift — CLAUDE.md/README/index reference real paths
        if: '!cancelled()'
        run: tools/ci/check_doc_paths.py
      - name: doc links — relative markdown links resolve
        if: '!cancelled()'
        run: tools/ci/check_doc_links.py
      - name: readme coverage — substantial src/ dirs are documented
        if: '!cancelled()'
        run: tools/ci/check_readme_coverage.py
      - name: ports registry — settings.py constants all documented
        if: '!cancelled()'
        run: tools/ci/check_ports_doc.py
      - name: template refs — no NEW unreferenced tests/configs template
        if: '!cancelled()'
        run: tools/ci/check_template_refs.py
      - name: brix namespace — no pre-rebrand xrootd_/xrdc_ tokens reintroduced
        if: '!cancelled()'
        run: tools/ci/check_brix_namespace.py
      - name: vfs identity branch — no per-identity forks below the seam
        if: '!cancelled()'
        run: tools/ci/check_vfs_identity_branch.py
      - name: gridftp interop — client-image/runner/matrix contract intact
        if: '!cancelled()'
        run: tools/ci/check_gridftp_interop_image.py
      - name: python deps — every import declared, every bound two-sided
        if: '!cancelled()'
        run: tools/ci/check_python_deps.py
      - name: version sync — ident.h, RPM spec and CHANGELOG agree
        if: '!cancelled()'
        run: tools/ci/check_version_sync.py
      - name: import direction — brixtest core never imports the brix_suite adapter
        if: '!cancelled()'
        run: tools/ci/check_import_direction.py
      - name: shim completeness — a moved module still exports every name
        if: '!cancelled()'
        run: tools/ci/check_shim_completeness.py
      - name: shard entry points — a CLI in an exec-composed shard still runs
        if: '!cancelled()'
        run: tools/ci/check_shard_entrypoints.py
      - name: shim entry points — a CLI survives its body moving to a package
        if: '!cancelled()'
        run: tools/ci/check_shim_entrypoints.py
      - name: shard name collisions — one composed module, one namespace
        if: '!cancelled()'
        run: tools/ci/check_shard_name_collisions.py
      # Guards the guards: every ratchet above compares the tree against a frozen
      # backlog, so appending to the backlog is the one way to turn any of them
      # green while making the code worse. Backlogs may shrink, never grow.
      - name: ratchet monotonicity — no backlog may grow
        if: '!cancelled()'
        run: tools/ci/check_ratchet_monotonic.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"

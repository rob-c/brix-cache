# Build the BriX-Cache container image (deploy/docker/Dockerfile) and publish it
# to GHCR — phase-115 W1.1. Every compose stack under deploy/compose/ pulls
# ghcr.io/<owner>/brix-cache:latest by default, so a green main always has a
# runnable image behind it.
#
#   pull_request        build only (proves the Dockerfile still builds)
#   push to main        build + push :latest and :sha-<short>
#   tag v*              build + push :<tag> as well
name: image
on:
  pull_request:
    paths:
      - deploy/docker/**
      - deploy/compose/common/**
      - config
      - src/**
      - shared/**
      - client/**
      - .github/workflows/image.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/brix-cache
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the shipped configs boot inside it. Load the
      # PR build locally and run the standalone stack's `nginx -t` in it.
      - name: The standalone compose config parses inside the image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -f deploy/docker/Dockerfile -t brix-cache:pr .
          docker run --rm -e BRIX_DEMO_PKI=1 \
            -v "$PWD/deploy/compose/standalone/nginx.conf:/etc/brix/nginx.conf:ro" \
            brix-cache:pr sh -c 'brix-pki-init && nginx -t -c /etc/brix/nginx.conf'

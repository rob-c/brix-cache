name: Build with Platform Detection
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-and-build:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/build-native
        with:
          detect-features: 'true'
          artifact-name: ${{ matrix.os }}
      - name: Upload native build and detection evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: detected-native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/nginx-1.31.8/objs/nginx
            /tmp/platform.json
            test-results/
          retention-days: 7

name: Platform Matrix Tests
on:
  push:
    branches: [main, develop]
    paths: ['src/platform/**', 'shared/cvmfs/platform/**', 'config', '.github/actions/build-native/**', '.github/workflows/platform-matrix.yml']
  pull_request:
    branches: [main, develop]
    paths: ['src/platform/**', 'shared/cvmfs/platform/**', 'config', '.github/actions/build-native/**', '.github/workflows/platform-matrix.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        type: choice
        default: all
        options: [all, linux-x86_64, linux-arm64, macos-intel, macos-arm64, windows]

permissions:
  contents: read

concurrency:
  group: platform-matrix-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NGINX_VERSION: '1.31.8'

jobs:
  platform-detect:
    timeout-minutes: 5
    name: Detect Platform Configuration
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix configuration
        id: set-matrix
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          platforms = [
              {'os': 'ubuntu-24.04', 'platform': 'linux-x86_64'},
              {'os': 'ubuntu-24.04-arm', 'platform': 'linux-arm64'},
              {'os': 'macos-26-intel', 'platform': 'macos-intel'},
              {'os': 'macos-26', 'platform': 'macos-arm64'},
          ]
          selected = os.environ['SELECTED_PLATFORM']
          matrix = {'include': [row for row in platforms
                                if selected in ('all', row['platform'])]}
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY

  native:
    name: ${{ matrix.platform }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    needs: platform-detect
    if: inputs.platform != 'windows'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/build-native
        with:
          artifact-name: ${{ matrix.platform }}
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/nginx-1.31.8/objs/nginx
            test-results/
          retention-days: 7

  test-windows:
    timeout-minutes: 45
    name: Windows (MSVC) - PAL 100%
    runs-on: windows-2022
    needs: platform-detect
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' }}
    
    env:
      BRIX_PLATFORM: windows
      BRIX_ARCH: x86_64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
      
      - name: Install dependencies
        run: |
          choco install -y openssl.light pcre2 libxml2 jansson curl krb5 zstd lz4 bzip2 sqlite python3 pytest
          pip3 install pytest
      
      - name: Download nginx source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nginx.org/download/nginx-${{ env.NGINX_VERSION }}.tar.gz" -OutFile "nginx.tar.gz"
          tar xzf nginx.tar.gz
          Remove-Item nginx.tar.gz
      
      - name: Verify Windows PAL layer
        shell: pwsh
        run: |
          Write-Host "🎯 Windows PAL Implementation Status"
          Write-Host "======================================"
          Write-Host ""
          
          $palFiles = @(
            "src/platform/windows/posix_wrapper.c",
            "src/platform/windows/event_wrapper.c",
            "src/platform/windows/fs_watcher.c",
            "src/platform/windows/copy_range.c",
            "src/platform/windows/security_wrapper.c",
            "src/platform/windows/process.c",
            "src/platform/windows/xattr.c",
            "src/platform/windows/handle_abstraction.c"
          )
          
          $found = 0
          foreach ($file in $palFiles) {
            if (Test-Path "${{ github.workspace }}\$file") {
              Write-Host "✓ $file"
              $found++
            } else {
              Write-Host "✗ $file (missing)"
            }
          }
          
          Write-Host ""
          Write-Host "Windows PAL files: $found/$($palFiles.Count)"
          
          if ($found -eq $palFiles.Count) {
            Write-Host "✅ All Windows PAL files present - 100% implementation"
          } else {
            Write-Host "⚠ Some PAL files missing - implementation incomplete"
          }
      
      - name: Compile Windows PAL layer
        shell: pwsh
        run: |
          Write-Host "Compiling Windows PAL layer..."
          
          $sources = @(
            "src/platform/windows/posix_wrapper.c",
            "src/platform/windows/event_wrapper.c",
            "src/platform/windows/fs_watcher.c",
            "src/platform/windows/copy_range.c",
            "src/platform/windows/security_wrapper.c",
            "src/platform/windows/process.c",
            "src/platform/windows/xattr.c"
          )
          
          $compiled = 0
          foreach ($src in $sources) {
            if (Test-Path "${{ github.workspace }}\$src") {
              $obj = $src -replace '\.c$', '.obj'
              cl /c /I"${{ github.workspace }}\src" /I"${{ github.workspace }}\shared" `/W4 `
                 "${{ github.workspace }}\$src" 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✓ Compiled: $src"
                $compiled++
              } else {
                Write-Host "✗ Failed: $src"
              }
            }
          }
          
          Write-Host ""
          Write-Host "Compilation result: $compiled/$($sources.Count) files"
          
          if ($compiled -eq $sources.Count) {
            Write-Host "✅ All Windows PAL files compiled successfully"
          }
      
      - name: Run Windows PAL tests
        shell: pwsh
        run: |
          Write-Host "Running Windows PAL test suite..."
          Write-Host ""
          
          cd tests
          
          # Run comprehensive Windows PAL tests
          python3 -m pytest platform/test_windows_pal_complete.py -v `
            --junitxml=../test-results/pal-windows-complete.xml `
            --tb=short 2>&1 | Tee-Object -Variable testOutput
          
          Write-Host ""
          Write-Host "Test output saved to test-results/pal-windows-complete.xml"
          
          # Also run basic PAL API tests
          python3 -m pytest platform/test_pal_api.py -v `
            --junitxml=../test-results/pal-windows.xml `
            --tb=short 2>&1 | Tee-Object -Variable basicOutput
        
        continue-on-error: true
      
      - name: Generate Windows test summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "==========================================="
          Write-Host "Windows PAL Test Summary"
          Write-Host "==========================================="
          Write-Host ""
          
          if (Test-Path "test-results/pal-windows-complete.xml") {
            $xml = [xml](Get-Content "test-results/pal-windows-complete.xml")
            $tests = $xml.testsuites.tests
            $failures = $xml.testsuites.failures
            $errors = $xml.testsuites.errors
            
            Write-Host "Tests: $tests"
            Write-Host "Failures: $failures"
            Write-Host "Errors: $errors"
            Write-Host ""
            
            if ($failures -eq 0 -and $errors -eq 0) {
              Write-Host "✅ Windows PAL tests: PASSED"
            } else {
              Write-Host "⚠ Windows PAL tests: $failures failures, $errors errors"
            }
          } else {
            Write-Host "⚠ Test results file not found"
          }
      
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-windows
          path: test-results/
          retention-days: 7

[pytest]
# Pytest configuration for PAL test suite

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    linux: mark test to run only on Linux
    darwin: mark test to run only on macOS
    windows: mark test to run only on Windows
    x86_64: mark test to run only on x86_64
    arm64: mark test to run only on ARM64
    slow: mark test as slow (for CI exclusion)
    requires_root: mark test as requiring root privileges
    pal_function(name): mark test with PAL function name for coverage

# Verbosity
addopts = 
    -v
    --tb=short
    --strict-markers

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage options (when --cov is used)
# addopts = --cov=pal_test_helpers --cov-report=html --cov-report=term

# JUnit XML output (for CI)
# junit_family = xunit2
# junit_suite_name = PAL_Test_Suite

# Logging
log_cli = false
log_cli_level = INFO

# Timeout for slow tests (in seconds)
# timeout = 300

# Parallel execution (requires pytest-xdist)
# addopts = -n auto

# The separate-process control for brix_webdav_checksum_xattr_format
# (test_audit15aa_default_tokens.py).
#
# One WebDAV location that writes `text` and nothing else, in a process where no
# location anywhere writes `xrdcks`.  It exists because the format is a
# process-global (integrity_info.c:209) that config_merge.c:107 only ever writes
# UPWARDS — a location asking for `text` never calls the setter — so the control
# proving `text` is reachable at all cannot be a second location on the subject
# instance.  It has to be a second nginx.
#
# Without this face the measurement over there would be unfalsifiable: "the
# bytes are binary" could mean the global leaked, or it could mean this build
# never writes the text record for any configuration.  This instance is what
# distinguishes those.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.  Test-provided: BIND_HOST.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location /txt/ {
            brix_webdav                        on;
            brix_storage_backend               posix:{DATA_ROOT};
            brix_webdav_auth                   none;
            brix_allow_write                   on;
            brix_webdav_checksum_on_write      adler32;
            brix_webdav_checksum_xattr_format  text;
        }
    }
}

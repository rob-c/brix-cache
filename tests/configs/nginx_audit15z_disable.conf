# Running instance for the five never-written disabling tokens
# (test_audit15z_disable_tokens.py).
#
# THREE servers in ONE process, because the file's question — "does writing the
# off/none token differ from writing nothing at all?" — is not answerable from a
# single server:
#
#   {PORT}         the subject.  KNOBS_A carries the token under test.
#   {SECOND_PORT}  the sibling.  KNOBS_B carries a DIFFERENT token, so the pair
#                  separates a directive that is honestly per-server (the
#                  session on one port behaves differently from the session on
#                  the other) from one whose merge writes a process-global (both
#                  ports, and the error log, show the strictest token written
#                  anywhere).  brix_seccomp is the second kind; the whole point
#                  of the second listener is that it makes that visible.
#   {GSI_PORT}     a brix_auth gsi face.  brix_gsi_signed_dh selects the GSI
#                  version advertised in the kXR_login sec token — "v:10000" for
#                  off, "v:10600" for auto/require — and that string is on the
#                  wire before any certificate is exchanged, so this arm reads a
#                  real protocol byte without needing a Grid PKI or a client
#                  proxy.  CERT/KEY/CA are a throwaway self-signed triple the
#                  test forges; the CA-hash advertisement falls back to the
#                  leaf's issuer-name hash, which is exactly what a self-signed
#                  chain should produce.
#
# `worker_processes 1` is load-bearing twice over: the seccomp filter is
# installed once per worker and logs one NOTICE when it is, so counting that
# line is only a measurement while there is exactly one worker; and a
# process-global set at config-parse time is per-process, so a second worker
# would just repeat the same verdict and blur the count.
#
# error_log at `info` is required — the seccomp install line is a NOTICE, and
# the default `error` level would drop it.
#
# `brix_auth none` on the two anonymous faces is deliberate: it is the weakest
# session a client can present, which is what makes brix_min_sec_level's floor
# readable (a cleartext anonymous session is below `compat` and at `none`).
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + SECOND_PORT GSI_PORT.
# Test-provided: BIND_HOST CERT KEY CA + the KNOBS_A / KNOBS_B / KNOBS_C slots.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
{KNOBS_A}    }

    server {
        listen {BIND_HOST}:{SECOND_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
{KNOBS_B}    }

    server {
        listen {BIND_HOST}:{GSI_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
{KNOBS_C}    }
}

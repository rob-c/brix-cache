# §6.1 HTTP redirect-to-dataserver manager — registry-lifecycle template for
# test_webdav_redirect_ds.py.  Three faces on one worker + one SHM registry:
#   * stream root:// CMS server ({CMS_PORT}) — fake data nodes register here;
#   * http WebDAV manager ({HTTP_PORT}) — GET/HEAD/PUT are 307-redirected to
#     the registry-selected data server, the identity signed into the CGI;
#   * a bare stream listen ({PORT}) as the instance's primary readiness port.
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided: CMS_PORT HTTP_PORT SECRET DS_HTTP_PORT.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_manager_mode on;
        brix_listen_port {PORT};
    }
    server {
        listen 127.0.0.1:{CMS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_server on;
        brix_cms_server_interval 1;
    }
}

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;
    access_log off;

    server {
        listen 127.0.0.1:{HTTP_PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_webdav_redirect_dataserver on;
            brix_webdav_redirect_port {DS_HTTP_PORT};
            brix_webdav_redirect_window 120;
            brix_webdav_secretkey {SECRET};
        }
    }
}

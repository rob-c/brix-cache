# 2.0 readiness F1 (ADR-3b) - the brix_frm_* engine-knob lab.
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST MAIN_DIRECTIVES
# BACKEND SERVER_DIRECTIVES (the suite splices every knob under test in, so one
# template serves the exec-adapter legs and the dead-origin journal leg).
{MAIN_DIRECTIVES}
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;
thread_pool default threads=2 max_queue=4096;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_allow_write on;
        brix_lock_enforcement off;
        brix_thread_pool default;
        brix_storage_backend {BACKEND};
        {SERVER_DIRECTIVES}
    }
}

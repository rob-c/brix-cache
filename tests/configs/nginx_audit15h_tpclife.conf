# The two native-TPC lifetime kill-switches (test_audit15h_tpc_lifetime.py,
# audit §A2 "TPC lifetime enforcement" — `brix_tpc_max_transfer_secs` and
# `brix_tpc_transfer_max_age` had zero coverage of any kind).
#
# Both are bounds on a transfer that has stopped behaving, so both need a
# transfer that misbehaves in a specific way, and each needs a plane that does
# NOT carry the directive to attribute the outcome to it:
#
#   {PORT}       DESTINATION with both kill-switches armed.  The wall-clock cap
#                is 2s and is sampled once per 1 MiB kXR_read window, so a pull
#                slower than 512 KiB/s is killed at a chunk boundary rather than
#                at the end.
#   {FREE_PORT}  DESTINATION identical in every other respect and with NEITHER
#                kill-switch.  The same slow pull must COMPLETE here — without
#                that the capped failure is just "the link was slow".
#   {SRC_PORT}   plain posix SOURCE holding the seed object (read-only).  The
#                test splices brix-fault-proxy in front of it to pace the bytes;
#                the source itself is deliberately ordinary.
#   {DASH_PORT}  anonymous dashboard.  The TPC registry is one SHM table shared
#                by every worker of this master, so `/brix/api/v1/snapshot`
#                reports the very slots the stream planes above allocate — the
#                only way to see whether an abandoned slot is ever reclaimed.
#
# brix_tpc_transfer_max_age is a PROCESS GLOBAL set at config time
# (server_conf_merge_cluster.c:91 -> brix_tpc_registry_set_max_age), so it does
# not need to sit on the plane under test — but it is written on {PORT} anyway,
# where an operator would put it, and {FREE_PORT} is left bare so a future
# per-server scoping does not silently invalidate this file.
#
# worker_processes 4: a native pull rendezvouses through the SHM registry across
# workers, and one worker cannot be the source, the destination and the
# dashboard of the same transfer at once.
#
# brix_tpc_allow_local on: every source address here is a loopback literal,
# which is exactly what the directive exists to refuse by default.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + SRC_PORT FREE_PORT
# DASH_PORT.
# Test-provided: BIND_HOST SRC_DIR CAP_DIR FREE_DIR.
worker_processes 4;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=4 max_queue=256;

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{DASH_PORT};
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;  # whole suite shares one client IP: default per-IP cap trips under xdist
            brix_dashboard_password "a15h-tpclife-unused";
            brix_dashboard_anonymous on;
        }
    }
}

stream {
    # --- destination WITH both kill-switches --------------------------------
    server {
        listen                     {BIND_HOST}:{PORT};
        brix_listen_port           {PORT};
        brix_root                  on;
        brix_auth                  none;
        brix_allow_write           on;
        brix_tpc_allow_local       on;
        brix_storage_backend       posix:{CAP_DIR};
        brix_tpc_max_transfer_secs 2;
        brix_tpc_transfer_max_age  1;
    }

    # --- destination with NEITHER (the control) -----------------------------
    server {
        listen               {BIND_HOST}:{FREE_PORT};
        brix_listen_port     {FREE_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_tpc_allow_local on;
        brix_storage_backend posix:{FREE_DIR};
    }

    # --- plain posix source -------------------------------------------------
    server {
        listen               {BIND_HOST}:{SRC_PORT};
        brix_listen_port     {SRC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_tpc_allow_local on;
        brix_storage_backend posix:{SRC_DIR};
    }
}

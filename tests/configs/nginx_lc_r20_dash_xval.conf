# 2.0 readiness F13 — dashboard and /metrics on ONE http server ({PORT}) over
# one anonymous root:// export ({STREAM_PORT}); both read the same SHM, so the
# snapshot's totals and the metrics sums must agree exactly.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 128; }
stream {
    server {
        listen {BIND_HOST}:{STREAM_PORT};
        brix_root on;
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend posix:{DATA_ROOT};
    }
}
http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    server {
        listen {BIND_HOST}:{PORT};
        location /brix {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_dashboard_password "{PASSWORD}";
        }
        location /metrics { brix_metrics on; }
    }
}

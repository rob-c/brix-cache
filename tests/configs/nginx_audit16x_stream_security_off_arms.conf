# The last arm-gaps in root/stream/directives_security.h at VALUE granularity
# (test_audit16x_stream_security_off_arms.py) — the 16th tranche, 24th file.
# The audit's Method counts directive NAMES; a flag's name is answered by ONE of
# its two tokens, and re-running the census per (directive, VALUE) leaves four
# flags in this header whose second token is written nowhere in the corpus:
#
#   brix_ztn_cleartext    off   (18 `on`s, no `off`)
#   brix_zip_access       off   (8  `on`s, no `off`)
#   brix_zip_force_scratch off  (2  `on`s, no `off`)
#   brix_tls              off   (63 `on`s, no `off`)
#
# All four merge to 0 (server_conf_merge_security.c:249/251/312/316), so the
# unwritten token spells the compiled default — which is exactly why it is worth
# writing.  Every existing test of these four says "off" in its docstring and
# writes ABSENCE in its config, and the equality of the two is a claim the
# corpus makes everywhere and has measured nowhere.
#
# TWELVE listeners on ONE instance over ONE export.  All four directives are
# NGX_STREAM_SRV_CONF with no MAIN arm, so a `server {}` is the smallest thing
# that can hold a value: each flag needs the written OFF, the OMISSION and the
# ARMED control on a listener of its own, and one worker holding twelve answers
# is itself the per-server-independence proof.
#
#   {PORT}          ZIP OFF   — brix_zip_access off, written
#   {ZIP_ABS_PORT}  ZIP ABS   — the same plane with the directive omitted
#   {ZIP_ON_PORT}   ZIP ON    — the arm the corpus writes; serves members
#   {SCR_OFF_PORT}  SCR OFF   — zip on + a stage dir + force_scratch off: the
#                               cell nothing has ever configured, because the
#                               existing off arm omits the stage dir too
#   {SCR_ABS_PORT}  SCR ABS   — the same, directive omitted
#   {SCR_ON_PORT}   SCR ON    — staged, the arm test_zip_scratch.py writes
#   {ZTN_OFF_PORT}  ZTN OFF   — brix_ztn_cleartext off on a CLEARTEXT listener
#   {ZTN_ABS_PORT}  ZTN ABS   — the same, directive omitted
#   {ZTN_ON_PORT}   ZTN ON    — the lab opt-in every fleet config writes
#   {TLS_OFF_PORT}  TLS OFF   — brix_tls off WITH certificate + key present
#   {TLS_ABS_PORT}  TLS ABS   — the same material, directive omitted
#   {TLS_ON_PORT}   TLS ON    — the in-protocol upgrade armed
#
# WHY THE ZTN PLANES SAY `brix_auth both`.  ztn-over-cleartext is refused at TWO
# places: the login parms drop the ztn block (session/login.c:323-325) and the
# kXR_auth credential gate refuses a ztn credential the client sends anyway
# (auth/gsi/auth.c:222).  A token-only listener never reaches the second one —
# with ztn withheld the cleartext login has nothing left to advertise and is
# refused outright, which is the cell test_tls_require.py already covers.  `both`
# leaves GSI in the parms, so the login succeeds and the client can still put a
# ztn credential on the wire, which is the only way to reach the second gate.
#
# WHY THE TLS-OFF PLANES CARRY A CERTIFICATE.  `brix_tls off` beside no material
# at all would be indistinguishable from a listener that simply has no TLS to
# offer.  The certificate and key are configured on all three TLS planes so the
# only difference between them is the token, and `conf->tls_ctx != NULL` (the
# other half of the offer_tls test at session/protocol.c:65-66) is true on each.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ZIP_ABS_PORT ZIP_ON_PORT
# SCR_OFF_PORT SCR_ABS_PORT SCR_ON_PORT ZTN_OFF_PORT ZTN_ABS_PORT ZTN_ON_PORT
# TLS_OFF_PORT TLS_ABS_PORT TLS_ON_PORT.  Test-provided: BIND_HOST CERT KEY CA
# JWKS STAGE_OFF STAGE_ABS STAGE_ON.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- brix_zip_access: the written OFF ----------------------------------
    # The flag gates one branch (read/open_request_resolve.c:264): with it off
    # the ?xrdcl.unzip= opaque is never looked at, so the open falls through to
    # the ordinary whole-file path and the ARCHIVE is what the client reads.
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_zip_access off;
        brix_access_log {LOG_DIR}/zip_off.log;
    }

    # --- brix_zip_access: the omission -------------------------------------
    server {
        listen {BIND_HOST}:{ZIP_ABS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_access_log {LOG_DIR}/zip_absent.log;
    }

    # --- brix_zip_access: the armed control --------------------------------
    server {
        listen {BIND_HOST}:{ZIP_ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_zip_access on;
        brix_access_log {LOG_DIR}/zip_on.log;
    }

    # --- brix_zip_force_scratch: the written OFF, with a stage dir ----------
    # zip_stage_archive_maybe (zip/zip_member.c:302-307) skips staging when the
    # flag is off OR no stage dir is set.  Existing coverage takes the second
    # exit; this plane takes the first, which is the one the token names.
    server {
        listen {BIND_HOST}:{SCR_OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_zip_access on;
        brix_zip_stage_dir {STAGE_OFF};
        brix_zip_force_scratch off;
        brix_access_log {LOG_DIR}/scratch_off.log;
    }

    # --- brix_zip_force_scratch: the omission, with the same stage dir ------
    server {
        listen {BIND_HOST}:{SCR_ABS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_zip_access on;
        brix_zip_stage_dir {STAGE_ABS};
        brix_access_log {LOG_DIR}/scratch_absent.log;
    }

    # --- brix_zip_force_scratch: the armed control -------------------------
    server {
        listen {BIND_HOST}:{SCR_ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_zip_access on;
        brix_zip_stage_dir {STAGE_ON};
        brix_zip_force_scratch on;
        brix_access_log {LOG_DIR}/scratch_on.log;
    }

    # --- brix_ztn_cleartext: the written OFF -------------------------------
    server {
        listen {BIND_HOST}:{ZTN_OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth both;
        brix_ztn_cleartext off;
        brix_token_jwks     {JWKS};
        brix_token_issuer   "https://test.example.com";
        brix_token_audience "nginx-xrootd";
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_access_log {LOG_DIR}/ztn_off.log;
    }

    # --- brix_ztn_cleartext: the omission ----------------------------------
    server {
        listen {BIND_HOST}:{ZTN_ABS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth both;
        brix_token_jwks     {JWKS};
        brix_token_issuer   "https://test.example.com";
        brix_token_audience "nginx-xrootd";
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_access_log {LOG_DIR}/ztn_absent.log;
    }

    # --- brix_ztn_cleartext: the armed control -----------------------------
    # The arm twelve fleet configs write, and the reason they write it: without
    # it a raw cleartext ztn driver has no protocol to authenticate with.
    server {
        listen {BIND_HOST}:{ZTN_ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth both;
        brix_ztn_cleartext on;
        brix_token_jwks     {JWKS};
        brix_token_issuer   "https://test.example.com";
        brix_token_audience "nginx-xrootd";
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_access_log {LOG_DIR}/ztn_on.log;
    }

    # --- brix_tls: the written OFF, certificate present --------------------
    server {
        listen {BIND_HOST}:{TLS_OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_tls off;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_access_log {LOG_DIR}/tls_off.log;
    }

    # --- brix_tls: the omission, same material -----------------------------
    server {
        listen {BIND_HOST}:{TLS_ABS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_access_log {LOG_DIR}/tls_absent.log;
    }

    # --- brix_tls: the armed control ---------------------------------------
    server {
        listen {BIND_HOST}:{TLS_ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_tls on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_access_log {LOG_DIR}/tls_on.log;
    }
}

# TEN stream servers in ONE process — the measuring half of the node-capability
# flag table (test_audit16j_root_caps_flags.py, 16th tranche).
#
# Five directives in directives_caps.h have an `off` arm that no config in the
# suite writes: brix_metadata_only, brix_supervisor, brix_virtual_redirector,
# brix_collapse_redir and brix_recover_writes.  All five are
# NGX_STREAM_SRV_CONF|NGX_CONF_FLAG into caps.* and all five merge to 0
# (brix_node_caps_conf_merge, core/types/conf_structs.h:537-548), so `off` and
# absent produce the same merged value and no reading here can be a value
# comparison.  Each arm is read as the observable its flag owns.
#
# ONE process with ten servers rather than ten processes: these are srv_conf
# flags, so ten verdicts from one worker is also the statement that the scope
# really is per-server.  Two things in this config are NOT per-server and the
# test depends on knowing which — the manager registry
# (brix_srv_select_or_blacklisted takes no conf) and the collapse-redir cache
# (brix_redir_cache_insert/lookup take no conf) are process-global, so the two
# collapse arms share one cache and must be driven with DIFFERENT paths.  Their
# per-server gate is `conf->caps.collapse_redir` at the call site
# (root/read/open_manager.c:116 and :164), which is exactly what §E measures.
#
# The servers, and why each one exists:
#
#   PORT        REF     — plain writable export, none of the five written.  The
#                         `absent` arm for all five and the control that says an
#                         export exists at all.
#   OFF_PORT    OFF_ALL — byte-identical to REF plus all five written `off`.  One
#                         server serves as the `off` arm of all five because the
#                         reading is the whole flags word: if any single `off`
#                         misbehaved the word would differ, and it names the bit.
#   SUPER_PORT          — brix_supervisor on, WITHOUT brix_manager_mode.  The
#                         suite's only other supervisor (nginx_supervisor.conf)
#                         writes both, and brix_manager_mode alone already makes
#                         brix_server_has_runtime_export() false, so the flag's
#                         own effect on the export has never been isolated.
#   WRTS_PORT           — brix_recover_writes on over a writable export: the
#                         kXR_recoverWrts journal is per-HANDLE, so it needs a
#                         server where a client can open, write and rewrite.
#   MAP_PORT            — brix_manager_map with no CMS, carrying TWO subjects
#                         that cannot interfere: brix_virtual_redirector off
#                         (§D — the bit is set anyway, by the auto-detect at
#                         session/protocol.c:81-83) and brix_metadata_only on
#                         (§F — the open refusal is conditional on
#                         manager_map == NULL, so here it redirects instead).
#                         attrMeta cannot set attrVirtRdr and an `off` vrdr flag
#                         cannot reach the metadata_only branch; both readings
#                         are attributable.
#   COLLON_PORT         — brix_manager_mode + brix_collapse_redir on: the only
#                         shape in which the collapse cache is reachable at all.
#   COLLOFF_PORT        — the same with `off`, the control.
#   CMS_PORT            — brix_cms_server, the registration listener the two
#                         manager-mode servers select out of.  Without a
#                         registered data server the dynamic path declines and
#                         the cache is never consulted on EITHER arm.
#   DS_PORT             — a data node registering into CMS_PORT so that registry
#                         is not empty.  It writes none of the five.
#   ROLE_PORT           — brix_cms_role supervisor and NOT brix_supervisor: the
#                         two spellings of "supervisor" are independent (§G).
#
# worker_processes 1 is load-bearing: the registry and the collapse cache are
# process-global, so a second worker would answer some opens out of a registry
# that no data server had registered with yet.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the nine extra ports.
# Test-provided: BIND_HOST REF_DATA OFF_DATA SUPER_DATA WRTS_DATA ROLE_DATA
#                DS_DATA.
daemon on;
worker_processes 1;
thread_pool default threads=2;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # --- §A reference: none of the five written ---------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{REF_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/ref-access.log;
    }

    # --- §A subject: all five written `off`, nothing else changed ---------
    server {
        listen {BIND_HOST}:{OFF_PORT};
        brix_root            on;
        brix_storage_backend posix:{OFF_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/off-access.log;
        brix_metadata_only      off;
        brix_supervisor         off;
        brix_virtual_redirector off;
        brix_collapse_redir     off;
        brix_recover_writes     off;
    }

    # --- §B brix_supervisor alone, with an export it asks for -------------
    server {
        listen {BIND_HOST}:{SUPER_PORT};
        brix_root            on;
        brix_storage_backend posix:{SUPER_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/super-access.log;
        brix_supervisor      on;
    }

    # --- §C the kXR_recoverWrts journal ----------------------------------
    server {
        listen {BIND_HOST}:{WRTS_PORT};
        brix_root            on;
        brix_storage_backend posix:{WRTS_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/wrts-access.log;
        brix_recover_writes  on;
    }

    # --- §D + §F one static map, two independent subjects ----------------
    server {
        listen {BIND_HOST}:{MAP_PORT};
        brix_root            on;
        brix_auth            none;
        brix_access_log      {LOG_DIR}/map-access.log;
        brix_manager_map     / {BIND_HOST}:{PORT};
        brix_virtual_redirector off;
        brix_metadata_only      on;
    }

    # --- §E the collapse cache, reachable arm ----------------------------
    server {
        listen {BIND_HOST}:{COLLON_PORT};
        brix_root            on;
        brix_auth            none;
        brix_access_log      {LOG_DIR}/collon-access.log;
        brix_manager_mode    on;
        brix_collapse_redir  on;
        brix_collapse_redir_ttl 30s;
    }

    # --- §E the control: same shape, flag `off` --------------------------
    server {
        listen {BIND_HOST}:{COLLOFF_PORT};
        brix_root            on;
        brix_auth            none;
        brix_access_log      {LOG_DIR}/colloff-access.log;
        brix_manager_mode    on;
        brix_collapse_redir  off;
        brix_collapse_redir_ttl 30s;
    }

    # --- §E the registration listener the two managers select out of -----
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server      on;
    }

    # --- §E the data node that makes the registry non-empty --------------
    server {
        listen {BIND_HOST}:{DS_PORT};
        brix_root            on;
        brix_storage_backend posix:{DS_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_cms_manager     {BIND_HOST}:{CMS_PORT};
        brix_cms_paths       /;
        brix_cms_interval    2;
        brix_listen_port     {DS_PORT};
    }

    # --- §G the other spelling of "supervisor" ---------------------------
    server {
        listen {BIND_HOST}:{ROLE_PORT};
        brix_root            on;
        brix_storage_backend posix:{ROLE_DATA};
        brix_auth            none;
        brix_access_log      {LOG_DIR}/role-access.log;
        brix_cms_role        supervisor;
    }
}

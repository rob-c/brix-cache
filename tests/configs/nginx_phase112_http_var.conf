# HTTP-plane variable-resolution probe for phase-112's removed cache variables.
# Used by test_phase112_consumer_surface_closure.py: {VAR} is substituted with a
# single `$name` reference inside a log_format, so `nginx -t` either resolves the
# name or refuses the config with `unknown "<name>" variable`.
# Placeholders: {ROOT} {VAR}
error_log {ROOT}/logs/error.log info;
pid       {ROOT}/logs/nginx.pid;

events { worker_connections 64; }

http {
    client_body_temp_path {ROOT}/tmp/body;
    proxy_temp_path       {ROOT}/tmp/proxy;
    fastcgi_temp_path     {ROOT}/tmp/fastcgi;
    uwsgi_temp_path       {ROOT}/tmp/uwsgi;
    scgi_temp_path        {ROOT}/tmp/scgi;

    brix_storage_backend posix:{ROOT};

    log_format phase112 '$remote_addr {VAR}';
    access_log {ROOT}/logs/access.log phase112;
}

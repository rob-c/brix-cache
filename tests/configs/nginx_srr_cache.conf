# SRR endpoint co-resident with a live read-through cache (registry lifecycle)
# for test_audit15b_srr_cache.py — the §B3.15 pair: what the WLCG storage
# resource report claims about a CACHE-tier member.  One nginx process:
#   stream {PORT}        read-through cache, fills land in {CACHE_DIR}
#   stream {ORIGIN_PORT} the posix origin the cache pulls from
#   http   {SRR_PORT}    the SRR document, whose single share IS the cache store
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT + extras ORIGIN_PORT
# SRR_PORT.  Test-provided: BIND_HOST HOST CACHE_DIR.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend posix:{DATA_ROOT};
    }

    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend root://127.0.0.1:{ORIGIN_PORT};
        brix_cache_store    posix:{CACHE_DIR};
        brix_cache_export   /;
    }
}

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{SRR_PORT};
        location = /.well-known/wlcg-storage-resource-reporting {
            brix_srr on;
            brix_srr_name "TEST-CACHE-SE";
            brix_srr_quality testing;
            brix_srr_version "3.5";
            brix_srr_share cachedata {CACHE_DIR} atlas;
            brix_srr_endpoint root xroot root://{HOST}:{PORT}/;
        }
    }
}

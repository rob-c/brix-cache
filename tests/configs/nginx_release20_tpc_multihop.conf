# 2.0 F7 lab: native root:// TPC multihop delegation.
#
# Planes (all root://, anonymous, loopback pulls allowed):
#   PORT         destination with the default hop budget (brix_tpc_max_hops 4)
#   NOHOP_PORT   destination that follows no redirect at all (brix_tpc_max_hops 0)
#   GUARD_PORT   destination whose source allowlist names only {HOST}
#   SRC_PORT     the posix source the redirects finally land on
#   METRICS_PORT /metrics, for brix_stream_tpc_egress_refused_total
#
# Every plane exports a distinct root: the backend registry is keyed by the
# canonical export path, so two planes on one root would share one backend.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=4 max_queue=256;

events {
    worker_connections 128;
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port {PORT};
        brix_root on;
        brix_storage_backend posix:{DST_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_require_source_size on;
        brix_access_log {LOG_DIR}/brix_access_dst.log;
    }

    server {
        listen {BIND_HOST}:{NOHOP_PORT};
        brix_listen_port {NOHOP_PORT};
        brix_root on;
        brix_storage_backend posix:{NOHOP_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_max_hops 0;
        brix_access_log {LOG_DIR}/brix_access_nohop.log;
    }

    server {
        listen {BIND_HOST}:{GUARD_PORT};
        brix_listen_port {GUARD_PORT};
        brix_root on;
        brix_storage_backend posix:{GUARD_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_source_guard on;
        brix_tpc_source_allow {HOST};
        brix_access_log {LOG_DIR}/brix_access_guard.log;
    }

    server {
        listen {BIND_HOST}:{SRC_PORT};
        brix_listen_port {SRC_PORT};
        brix_root on;
        brix_storage_backend posix:{SRC_DIR};
        brix_auth none;
        brix_access_log {LOG_DIR}/brix_access_src.log;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics {
            brix_metrics on;
        }
    }
}

# Driver-backed Content-Encoding PUT template (phase-92 audit #3) for
# test_put_content_encoding_driver.py.  A WebDAV front whose storage backend is a
# co-hosted s3:// origin: the PUT writer is a driver-backed object session with
# NO kernel fd, so a Content-Encoding body must stream-decode through
# brix_vfs_writer_write (the fix) rather than reject with 501.  The client leg is
# anonymous; the front signs its OUTBOUND leg to the origin with the s3cred
# credential.
#
# (An S3 front over an s3:// backend is deliberately NOT included: that path has a
# separate, pre-existing whole-object staged-open failure that also breaks a plain
# identity PUT, so it is orthogonal to the #3 decode fix.  The S3 put_stream.c
# decode path calls the identical brix_http_body_decode_to_writer helper the
# WebDAV front exercises here.)
#
# Two workers (as nginx_root_s3_staged.conf): the WebDAV handler blocks on its
# outbound SigV4 PUT to the co-hosted origin at commit; a single worker would
# leave none to accept that inbound S3 connection — a self-deadlock.  A second
# worker services the origin leg.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT (=WebDAV front).
# Test-provided via extra_ports: ORIGIN_PORT.
# Test-provided via template_values (seeded under tmp_path, must exist at parse):
#   BIND_HOST ORIGIN_DIR S3_ACCESS_KEY S3_SECRET_KEY.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/sct;
    client_max_body_size 64m;

    brix_credential s3cred {
        s3_access_key {S3_ACCESS_KEY};
        s3_secret_key {S3_SECRET_KEY};
        s3_region     us-east-1;
    }

    # Origin object store: posix-backed brix_s3 (bucket "testbucket").
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_s3 on;
            brix_storage_backend posix:{ORIGIN_DIR};
            brix_s3_bucket testbucket;
            brix_s3_access_key {S3_ACCESS_KEY};
            brix_s3_secret_key {S3_SECRET_KEY};
            brix_s3_region us-east-1;
            brix_allow_write on;
        }
    }

    # WebDAV front over the s3:// origin — driver-backed writer (no kernel fd).
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_storage_backend    s3://{BIND_HOST}:{ORIGIN_PORT}/testbucket;
            brix_storage_credential s3cred;
            brix_webdav_auth none;
            brix_allow_write on;
        }
    }
}

# Anonymous READ-ONLY WebDAV endpoint (brix_allow_write off) — the security
# fixture for test_client_xrdfs_web_write.py. Proves the native client's WebDAV
# write-metadata verbs (mkdir/rm/rmdir/mv) surface the server's write-gate denial
# (INV-3: allow_write checked before token scope) as a non-zero exit rather than
# faking success.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log warn;
daemon on;
events { worker_connections 64; }
http {
    access_log off;
    client_max_body_size 32m;
    client_body_buffer_size 1k;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
            brix_allow_write off;
        }
    }
}

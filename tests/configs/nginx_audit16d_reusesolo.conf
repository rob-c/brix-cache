# ONE cvmfs location — the control half of the origin connection-reuse pair
# (audit tranche 16, file 4; test_audit16d_origin_reuse.py).
#
# brix_cvmfs_origin_reuse_conn is one of the seven flags whose BOTH arms are
# unwritten anywhere in the corpus.  Its entire effect is two libcurl options —
# CURLOPT_FORBID_REUSE and CURLOPT_FRESH_CONNECT, applied per request in
# src/fs/cache/origin/s3_transport_setup.c:381-383 — so what the flag does is
# not visible in any status code or any log line the listener writes.  It is
# visible in exactly one place: how many TCP connections the origin accepts for
# N origin requests.  That is why the mock this template fills from is started
# with --keepalive, and why the reading is taken at the origin rather than here.
#
# worker_processes 1 and thread_pool default threads=1 are both load-bearing.
# The connection pool the flag turns off lives on ONE curl easy handle per FILL
# THREAD (s3o_curl_acquire(), s3_transport_setup.c:264-281: curl_easy_reset()
# between requests preserves the live connections and the DNS cache).  A second
# worker or a second fill thread would each bring their own handle and their own
# first connection, so "reuse on" would read as 2 or 3 accepts instead of 1 and
# the arms would differ by a factor rather than by a fact.
#
# The flag line is NOT written here.  A case supplies it through the POLICY_A
# slot, because "the location says nothing" is one of the three values under
# test — brix_cvmfs_origin_reuse_conn merges to 1 (cvmfs_module_merge.c:209),
# and that identity with `on` is asserted rather than assumed.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + MOCK_PORT.
# Test-provided: BIND_HOST REPO_A CACHE_A BACKEND + the POLICY_A slot (named
# here without its braces — the renderer substitutes placeholders inside
# comments too, and a multi-line value spliced into a comment turns the tail of
# that comment into live config).
daemon on;
worker_processes 1;
thread_pool default threads=1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # brix_cvmfs_trace gives one upstream line per ORIGIN request.  The
        # origin's accept count alone cannot distinguish "reuse worked" from
        # "the cache answered and no request was made"; requests-from-here
        # against accepts-from-there is what makes the ratio a reading.
        location /cvmfs/{REPO_A}/ {
            brix_cvmfs           on;
            brix_cvmfs_trace     on;
            brix_cache_store     posix:{CACHE_A};
            brix_storage_backend "{BACKEND}";
{POLICY_A}        }
    }
}

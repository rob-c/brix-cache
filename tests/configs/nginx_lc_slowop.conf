# §3.15 OssStats slowop classifier template (test_metrics_slowop.py, registry
# lifecycle): a writable stream root server carrying brix_metrics_slowop, plus an
# HTTP /metrics endpoint sharing the same metrics SHM zone. A root op over :PORT
# files a latency sample; with a 1µs threshold it is booked as a slow op and
# surfaces in brix_io_slowop_total on the /metrics scrape at :METRICS_PORT.
# Launcher-provided: LOG_DIR PORT TMP_DIR METRICS_PORT.
# Test-provided: BIND_HOST ROOT_DIR SLOWOP_USEC.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

# A thread pool routes writes through the AIO done-callback path, which is where
# op latency (and thus the §3.15 slowop classification) is filed.
thread_pool default threads=2;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_export {ROOT_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_thread_pool default;
        brix_metrics_slowop {SLOWOP_USEC};
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

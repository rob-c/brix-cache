# Phase-118 OPN-012: identical token-auth planes differing only in read-only.
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{READONLY_ROOT};
        brix_auth token;
        brix_tls on;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_allow_write on;
        brix_read_only on;
        brix_token_jwks {JWKS};
        brix_token_issuer "{TOKEN_ISSUER}";
        brix_token_audience "{TOKEN_AUDIENCE}";
    }

    server {
        listen {BIND_HOST}:{PORT_WRITABLE};
        brix_root on;
        brix_storage_backend posix:{WRITABLE_ROOT};
        brix_auth token;
        brix_tls on;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_allow_write on;
        brix_read_only off;
        brix_token_jwks {JWKS};
        brix_token_issuer "{TOKEN_ISSUER}";
        brix_token_audience "{TOKEN_AUDIENCE}";
    }
}

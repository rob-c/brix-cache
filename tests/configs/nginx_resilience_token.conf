# Dedicated WLCG-token root:// stream server for the resilience sweeps
# (tests/resilience/servers.py, NginxTokenRoot).  Rendered through the phase-81
# registry (LifecycleHarness): {PORT}, {LOG_DIR} and {DATA_ROOT} come from the
# launcher; {JWKS_PATH}/{ISSUER}/{AUDIENCE} from the test's TokenIssuer.
#
# The token analogue of nginx_resilience_gsi.conf.  The sweep harness hard-coded
# GSI, so the ztn login exchange had never been damaged in flight: a login that
# is severed or corrupted mid-handshake must fail closed, never leave a session
# that proceeds to read data.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log error;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 1024; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_allow_write on;
        brix_auth token;
        brix_token_jwks {JWKS_PATH};
        brix_token_issuer "{ISSUER}";
        brix_token_audience "{AUDIENCE}";
    }
}

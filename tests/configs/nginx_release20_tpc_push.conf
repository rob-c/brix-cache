# 2.0 F16 lab: the native root:// TPC PUSH dialect (tpc.stage=push).
#
# A push inverts who dials: the SOURCE connects out to the destination and
# writes, instead of the destination connecting in and reading. Both legs are
# opted into with `brix_tpc_push on` — off (the default) is the posture every
# other lab in the suite runs with, and one plane here keeps it off so the
# refusal is testable.
#
# Planes (all root://, anonymous, loopback egress allowed):
#   PORT         the push SOURCE: dials out, streams the local file, 4 streams
#   ONE_PORT     the same source capped at a single stream (brix_tpc_streams 1)
#   OFF_PORT     a source with brix_tpc_push OFF — every push open is refused
#   DST_PORT     the push DESTINATION: accepts leg 1 (client) and leg 3 (source)
#   GUARD_PORT   a source whose egress allowlist names only an unrelated host,
#                so the destination is refused BEFORE any socket is dialled
#
# Every plane exports a distinct root: the backend registry is keyed by the
# canonical export path, so two planes on one root would share one backend.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=4 max_queue=256;

events {
    worker_connections 128;
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port {PORT};
        brix_root on;
        brix_storage_backend posix:{SRC_DIR};
        brix_auth none;
        brix_tpc_push on;
        brix_tpc_allow_local on;
        brix_tpc_streams 4;
        brix_access_log {LOG_DIR}/brix_access_src.log;
    }

    server {
        listen {BIND_HOST}:{ONE_PORT};
        brix_listen_port {ONE_PORT};
        brix_root on;
        brix_storage_backend posix:{ONE_DIR};
        brix_auth none;
        brix_tpc_push on;
        brix_tpc_allow_local on;
        brix_tpc_streams 1;
        brix_access_log {LOG_DIR}/brix_access_one.log;
    }

    server {
        listen {BIND_HOST}:{OFF_PORT};
        brix_listen_port {OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{OFF_DIR};
        brix_auth none;
        brix_tpc_allow_local on;
        brix_access_log {LOG_DIR}/brix_access_off.log;
    }

    server {
        listen {BIND_HOST}:{DST_PORT};
        brix_listen_port {DST_PORT};
        brix_root on;
        brix_storage_backend posix:{DST_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_push on;
        brix_tpc_allow_local on;
        brix_access_log {LOG_DIR}/brix_access_dst.log;
    }

    server {
        listen {BIND_HOST}:{GUARD_PORT};
        brix_listen_port {GUARD_PORT};
        brix_root on;
        brix_storage_backend posix:{GUARD_DIR};
        brix_auth none;
        brix_tpc_push on;
        brix_tpc_allow_local on;
        brix_tpc_source_guard on;
        brix_tpc_source_allow storage.example.invalid;
        brix_access_log {LOG_DIR}/brix_access_guard.log;
    }
}

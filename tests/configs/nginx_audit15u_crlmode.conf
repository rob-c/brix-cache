# brix_crl_mode at VALUE granularity (test_audit15u_crl_mode.py) — the 15th
# tranche.  The audit's Method counts directive NAMES, so a three-token enum
# scores "covered" the moment any one token is written.  `brix_crl_mode` is
# worse than that: on the ROOT/stream plane not one of its three tokens is
# written anywhere in the suite.  (The WebDAV twin `brix_webdav_crl_mode` IS
# covered, by test_wlcg_conformance_crl.py — but with bare EEC credentials over
# davs://, never with the PROXY chain a GSI login presents, which is exactly
# the distinction this file exists to make.)
#
# The token is a `server {}`-level directive whose whole observable is a login
# verdict, so every arm is a listener on ONE instance sharing ONE trust store:
#
#   {PORT}       brix_crl_mode off       — CRLs loaded and then ignored
#   {TRY_PORT}   brix_crl_mode try       — enforce where a CRL exists
#   {REQ_PORT}   brix_crl_mode require   — a missing CRL is fatal
#   {DEF_PORT}   the directive ABSENT    — pins the merge default (try)
#   {NOCRL_PORT} brix_crl_mode try, and NO brix_crl — `try` arms the store's
#                CRL flags only when at least one CRL was actually loaded
#                (store_policy_store.c:221), so this plane is the second half
#                of the `try` predicate and behaves like `off`.
#
# {CA} is a hashed directory holding TWO anchors: the CA whose CRL lives in
# {CRLDIR}, and a second CA with no CRL anywhere.  One store, two issuers, is
# what makes `try` and `require` distinguishable at all — they differ ONLY on a
# credential whose issuer publishes nothing.
#
# brix_crl names a directory holding only CRLs, never the CA dir itself: the
# loader counts what it loads (pki_build.c:229) and that count is the `try`
# predicate, so a path that also contains CA certificates would make the count
# an accident of directory contents.
#
# brix_allow_write is off everywhere.  Every assertion in the file is a login
# verdict on a read; a write gate would put a second reason in front of the
# refusals and the arms would stop being comparable.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + TRY_PORT REQ_PORT DEF_PORT
# NOCRL_PORT.  Test-provided: CERT KEY CA CRLDIR (every path must exist at
# config-parse time).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- off: the CRLs are loaded and then not consulted --------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        off;
    }

    # --- try: enforce where a CRL exists, tolerate a CA that has none -------
    server {
        listen {TRY_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        try;
    }

    # --- require: a missing CRL is fatal ------------------------------------
    server {
        listen {REQ_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        require;
    }

    # --- the directive absent: whatever the merge default is ----------------
    server {
        listen {DEF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
    }

    # --- try with nothing to try: no brix_crl, so no CRL is ever loaded -----
    server {
        listen {NOCRL_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl_mode        try;
    }
}

# Minimal stream + /metrics standup for test_tpc_gsi_deleg_metrics.py (registry
# lifecycle). Launcher-provided: LOG_DIR PORT TMP_DIR. Test-provided: BIND_HOST
# METRICS_PORT ROOT_DIR. The stream server exists only so the module initialises
# its shared-memory metrics table; the HTTP server exposes the unified export.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_export {ROOT_DIR};
        brix_auth none;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

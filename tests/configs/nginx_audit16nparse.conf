# Parse-tier scaffold for the WebDAV flag arms of audit tranche 16 — file 14's five
# location-scoped flags (test_audit16n_webdav_module_flag_arms.py, section J),
# file 15's three MAIN|SRV|LOC flags
# (test_audit16o_webdav_scoped_flag_arms.py, section D), and file 16's
# brix_webdav_proxy_certs (test_audit16p_proxy_certs.py, section F).
#
# The scaffold is deliberately subject-agnostic: it offers one slot per nginx scope
# and takes no position on which of them should accept.  That is each consumer's
# expectation table, because it is a property of the directive's declaration and not
# of this file — file 14's subjects accept in LOC_KNOBS alone, file 15's accept in
# LOC_KNOBS, SRV_KNOBS and HTTP_KNOBS, and file 16's accepts in SRV_KNOBS and
# LOC_KNOBS but not in HTTP_KNOBS (its mask omits NGX_HTTP_MAIN_CONF).
#
# Never started — it exists so `nginx -t` can be asked about a single line, in a
# single scope, with nothing else in the file that could answer instead.
#
# WHY THE PROBE LOCATION DOES NOT WRITE brix_webdav
#   The subject of this scaffold INCLUDES brix_webdav itself, and a scaffold that
#   already carried `brix_webdav on;` would make every negative about it ambiguous:
#   a second occurrence is diagnosed as a duplicate, and that error arrives before
#   the one a value or arity negative is reaching for.  A location with only a
#   storage backend is enough — parse acceptance does not need the feature enabled,
#   and webdav_validate_webdav_enabled (webdav/config_merge.c:517-522) returns OK
#   without validating anything when it is not.
#
# WHY THAT SAME GATE NEEDS A SECOND LOCATION
#   The skipped-validation half of section J is a comparison, not an assertion: the
#   SAME location body — one whose brix_export names a directory that does not
#   exist — must be refused with
#
#     [emerg] brix: brix_export path "..." is not accessible (2: No such file ...)
#
#   under `brix_webdav on` and accepted in silence under `brix_webdav off`.  That
#   needs a whole location the test writes itself, which is what EXTRA_LOC is for;
#   a test method has no business knowing where the scaffold puts it.
#
# SLOTS, named here WITHOUT their braces — the renderer replaces every occurrence
# of a placeholder, comments included, and a multi-line value spliced into a
# comment turns the tail of that comment into configuration:
#
#   LOC_KNOBS     inside the http location            (NGX_HTTP_LOC_CONF — legal)
#   SRV_KNOBS     inside the http server, outside any location (NGX_HTTP_SRV_CONF)
#   HTTP_KNOBS    inside http{}, outside any server   (NGX_HTTP_MAIN_CONF)
#   OUTER         main context, outside http{} and stream{} entirely
#   STREAM_KNOBS  inside a stream server              (the other plane)
#   STREAM_MAIN   inside stream{}, outside any server
#   EXTRA_LOC     a whole extra location inside the http server
#
#   Whichever slots a consumer expects to refuse, every refusal must read "directive
#   is not allowed here" and never "unknown directive": nginx searches every module's
#   command table before it checks the context, so a misplaced brix_webdav directive
#   is diagnosed by the table it belongs to.  A consumer whose subject IS legal in
#   http{} or server{} also has EXTRA_LOC available for the second location a
#   scope-inheritance comparison needs.
#
# `nginx -t` never binds, and at config time an http server and a stream server may
# name the same port, so PORT and STREAM_PORT may be the same placeholder; the
# stream server exists only so STREAM_KNOBS has somewhere legal-looking to sit.
#
# Test-provided: PORT STREAM_PORT LOG_DIR DATA + the seven slots.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix this
    # scaffold never creates.
    access_log off;

{HTTP_KNOBS}    server {
        listen {PORT};
{SRV_KNOBS}
        location /probe/ {
            brix_storage_backend posix:{DATA};
            brix_webdav_auth     none;
{LOC_KNOBS}        }

{EXTRA_LOC}    }
}

stream {
{STREAM_MAIN}    server {
        listen {STREAM_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA};
        brix_auth            none;
{STREAM_KNOBS}    }
}

# The native TPC egress guards + brix_require_pgwrite at VALUE granularity
# (test_audit16v_tpc_off_arms.py) — the 16th tranche, 22nd file.  The audit's
# Method counts directive NAMES, and a flag's name is answered by ONE of its two
# tokens; re-run per (directive, VALUE) over the `ngx_conf_set_flag_slot`
# directives, src/protocols/root/stream/directives_tpc.h is the single densest
# file in the census — SEVEN of its flags have never had one of their arms
# written anywhere in the corpus, and it is the same arm every time: the one
# that DISARMS the guard.
#
#   brix_tpc_allow_local          off   brix_tpc_outbound_tls         off
#   brix_tpc_source_guard         off   brix_tpc_require_source_size  off
#   brix_require_pgwrite          off   brix_tpc_delegate             off
#   brix_tpc_outbound_passthrough on    (default-ON flag: `on` is its unwritten arm)
#
# Every one of these is a fail-closed posture a hostile-network deployment turns
# ON, and the corpus writes only that arm — so "what a site that deliberately
# opens the gate actually gets" is a question no test has asked.  For four of
# the seven the disarmed arm is also the compiled default, which is why the
# ABSENT plane below exists: this file has to establish that the TOKEN and the
# OMISSION land on the same behaviour before it can claim anything about either.
#
# SIX listeners on ONE instance sharing ONE export.  The guards are all
# `server {}`-level (NGX_STREAM_SRV_CONF, no MAIN arm), so a plane is the only
# unit that can hold a value, and one worker holding six different answers is
# itself the per-server-independence proof:
#
#   {PORT}         ARMED     — every guard in the arm the corpus already writes
#   {OFF_PORT}     DISARMED  — the seven tokens nothing has ever written
#   {ABSENT_PORT}  ABSENT    — none of the seven written; the merge defaults
#   {PULL_PORT}    PULLING   — the disarmed arm, plus the one flag a loopback
#                              pull needs (allow_local on), so the arms that are
#                              only visible DURING a transfer can be measured
#                              against ARMED over the same source
#   {ORDER_PORT}   ORDERING  — naming gate armed, address gate closed: the only
#                              plane where both gates would refuse, so the
#                              message says which one ran first
#   {DELEG_PORT}   OVERRIDE  — an explicit `brix_tpc_delegate off` beside a GSI
#                              tap proxy, which brix_config_prepare_server turns
#                              back on at postconfiguration (runtime_server.c:444)
#
# THE ALLOWLIST IS TWO NAMES ON ARMED AND ONE ON ORDERING, deliberately.
# brix_tpc_source_guard matches the host STRING the client asked for, before any
# resolution (launch_prepare.c:284, ahead of the address policy at :303) — so
# `localhost` and the loopback literal are two different entries even though
# they name one machine, and the test drives the refusal with a third loopback
# literal that is on neither list.  ORDERING carries only `localhost` so an
# unresolvable name and the loopback literal are both refused there.
#
# WHAT IS NOT HERE.  brix_tpc_allow_private is absent from the list above
# because nginx_tpc_ssrf_deny_private.conf already writes its `off`; this file
# leaves it at its default (on) everywhere so the address gate has exactly one
# variable.  brix_tpc_verify_checksum likewise — nginx_tpc_harden.conf writes
# both arms, and a second post-copy verdict would give the size gate's refusals
# a competing reason.  No TLS material anywhere: the outbound-TLS arm under test
# is the destination's REFUSAL to be dragged into TLS, which happens before any
# certificate is needed.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + OFF_PORT ABSENT_PORT PULL_PORT
# ORDER_PORT DELEG_PORT.  Test-provided: BIND_HOST (the allowlist entry that has
# to match the literal the test's own URLs use).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

# A native TPC pull runs in a thread-pool worker; without this the destination
# refuses every pull with "TPC pull requires brix_thread_pool to be configured"
# and no guard below is ever consulted.
thread_pool default threads=4 max_queue=256;
events { worker_connections 64; }

stream {
    # --- ARMED: the arm the corpus writes, on every one of the seven ---------
    # allow_local on is what lets this plane reach a loopback source at all, so
    # it is both the control for the address gate and the precondition for the
    # transfer-time arms (outbound_tls, require_source_size) being measurable.
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local          on;
        brix_tpc_source_guard         on;
        brix_tpc_source_allow         localhost {BIND_HOST};
        brix_require_pgwrite          on;
        brix_tpc_outbound_tls         on;
        brix_tpc_require_source_size  on;
        brix_tpc_outbound_passthrough off;
        brix_tpc_delegate             on;
        brix_access_log {LOG_DIR}/armed.log;
    }

    # --- DISARMED: the seven tokens, written here for the first time ---------
    # Nothing else differs from ARMED, so every verdict this plane returns is
    # attributable to the token beside it.
    server {
        listen {OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local          off;
        brix_tpc_source_guard         off;
        brix_require_pgwrite          off;
        brix_tpc_outbound_tls         off;
        brix_tpc_require_source_size  off;
        brix_tpc_outbound_passthrough on;
        brix_tpc_delegate             off;
        brix_access_log {LOG_DIR}/disarmed.log;
    }

    # --- ABSENT: what a config that says nothing gets ------------------------
    # The claim every existing test of these flags rests on — nginx_root_require
    # _pgwrite.conf says it in a comment, "deliberately omitted (default off)" —
    # is that an omission stands in for the off token.  It is a claim, not a
    # measurement, until a plane writes the token beside a plane that does not.
    server {
        listen {ABSENT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_access_log {LOG_DIR}/absent.log;
    }

    # --- PULLING: disarmed, but able to reach a loopback source --------------
    # brix_tpc_allow_local is the one guard whose disarmed arm forecloses every
    # other measurement (a plane that refuses loopback never gets to the source
    # at all), so this plane carries its ARMED value and the other six disarmed.
    # It is the destination for every live transfer in the file.
    server {
        listen {PULL_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local          on;
        brix_tpc_source_guard         off;
        brix_require_pgwrite          off;
        brix_tpc_outbound_tls         off;
        brix_tpc_require_source_size  off;
        brix_tpc_outbound_passthrough on;
        brix_tpc_delegate             off;
        brix_access_log {LOG_DIR}/pulling.log;
    }

    # --- ORDERING: both gates would refuse; which message comes back? --------
    # The naming gate runs first and without a DNS lookup, which is a security
    # property in its own right: a host the operator never allowlisted cannot be
    # turned into a resolver query, so the guard is not a DNS oracle.  Nothing
    # proves that from a plane where only one gate is armed.
    server {
        listen {ORDER_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_source_guard  on;
        brix_tpc_source_allow  localhost;
        brix_tpc_allow_local   off;
        brix_access_log {LOG_DIR}/ordering.log;
    }

    # --- OVERRIDE: the explicit `off` that does not survive postconfiguration -
    # brix_config_prepare_server (src/core/config/runtime_server.c:444) sets
    # tpc_delegate back to 1 whenever a tap proxy authenticates with GSI, on the
    # reasoning that a proxy which must present the client's credential upstream
    # has to capture it.  The test it applies — !xcf->tpc_delegate — runs AFTER
    # the merge, where an explicit `off` and an unwritten directive are the same
    # zero, so the operator who wrote the token gets the same silent upgrade as
    # the operator who wrote nothing.  The upstream is the ABSENT plane so the
    # block is coherent rather than dangling; nothing in this file connects to
    # it, because the subject is a config-time decision recorded in error.log.
    server {
        listen {DELEG_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_tap_proxy on;
        brix_tap_proxy_upstream {BIND_HOST}:{ABSENT_PORT};
        brix_tap_proxy_auth gsi;
        brix_tpc_delegate off;
        brix_access_log {LOG_DIR}/override.log;
    }
}

# Parse-tier scaffold for the five node-capability flags (audit tranche 16,
# file 10; test_audit16j_root_caps_flags.py).
#
# Never started — it exists so `nginx -t` can be asked about a single line, in a
# single scope, with nothing else in the file that could answer instead.  It
# writes none of the five itself: a scaffold that already carried one would make
# every negative about that flag ambiguous, because a second occurrence is
# diagnosed as a duplicate and that error arrives before the one a value or arity
# negative is reaching for.
#
# WHY THE PLACEMENT MATRIX IS THE POINT HERE
#   All five are declared NGX_STREAM_SRV_CONF and nothing else
#   (directives_caps.h:8-71), so `server{}` inside `stream{}` is their ONLY legal
#   context — and yet brix_node_caps_conf_merge() (core/types/conf_structs.h:537)
#   implements parent inheritance for all five.  A directive that cannot be
#   written in the parent context has no parent value to inherit, so the matrix
#   below is what says the inheritance arm of that merge is unreachable rather
#   than untested.  That is measured, not assumed: STREAM_KNOBS puts the line at
#   stream{} level, where the answer must be a refusal and must say "not allowed
#   here" rather than "unknown directive".
#
# WHY A CROSS-CHECK LIVES IN THE PARSE TIER
#   brix_supervisor on makes brix_server_has_runtime_export() false
#   (core/config/runtime_server.c:25-29), which is the same predicate guarding
#   brix_server_guard_remote_authz() (:66-80).  That guard REFUSES a config whose
#   backend is remote and which carries no authz rules — so writing one flag can
#   turn a config that loaded into a config that is refused, with no mention of
#   the flag in the message.  BACKEND is a slot so the same scaffold can be given
#   a posix backend (accepted) and a remote one (the cross-check).
#
# SLOTS, named here WITHOUT their braces — the renderer replaces every occurrence
# of a placeholder, comments included, and a multi-line value spliced into a
# comment turns the tail of that comment into configuration:
#
#   KNOBS         inside the stream server             (NGX_STREAM_SRV_CONF)
#   STREAM_KNOBS  inside stream{}, outside any server  (NGX_STREAM_MAIN_CONF)
#   HTTP_KNOBS    inside an http server                (the wrong plane entirely)
#   LOC_KNOBS     inside an http location              (the wrong plane, nested)
#   OUTER         main context, outside stream{} — the fourth placement negative
#   BACKEND       the server's brix_storage_backend, quoted so a URL survives the
#                 parser as one argument
#   EXTRA         a whole extra stream server.  The sibling question — does one
#                 server's arm reach another's — needs a second server, and a
#                 test method has no business knowing where the scaffold puts it.
#
# `nginx -t` does not bind, so the listen ports are placeholders and BACKEND is
# never connected to; both only have to survive the parser.
#
# Test-provided: PORT PORT2 LOG_DIR DATA BACKEND + the six slots.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

    server {
        listen {PORT2};
{HTTP_KNOBS}
        location / {
{LOC_KNOBS}        }
    }
}

stream {
{STREAM_KNOBS}    server {
        listen {PORT};
        brix_root            on;
        brix_storage_backend "{BACKEND}";
        brix_auth            none;
{KNOBS}    }
{EXTRA}}

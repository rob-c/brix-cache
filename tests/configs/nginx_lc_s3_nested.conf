# Nested S3 gateway for test_s3_nested_gateway.py (registry lifecycle):
# `brix_s3 on` in FRONT of `brix_storage_backend s3://`, i.e. the S3 protocol on
# both ends of the same transfer.  The front terminates the client's SigV4,
# re-signs its own outbound leg with the `s3cred` credential, and the bytes come
# to rest in the co-hosted origin's bucket — never in the front's export.
#
# The two blocks deliberately carry DIFFERENT SigV4 keys.  That is the point of
# the topology, not decoration: one worker verifies for every brix_s3 block in
# the configuration, and the worker-local signing-key cache used to be keyed on
# date+region alone, so whichever block signed first captured the slot — the
# other block then accepted requests forged with the first block's secret and
# rejected its own.  Same-key blocks cannot see that.
#
# worker_processes 2: the front blocks on its synchronous outbound leg to the
# origin served by this same nginx; a single worker would have none left to
# accept its own connection (same reason as nginx_ce_driver_s3.conf).
#
# Launcher-provided: LOG_DIR TMP_DIR PORT ORIGIN_PORT.
# Test-provided: BIND_HOST ORIGIN_DIR FRONT_EXPORT
#                FRONT_ACCESS_KEY FRONT_SECRET_KEY
#                ORIGIN_ACCESS_KEY ORIGIN_SECRET_KEY.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/sct;

    # The credential the FRONT signs its outbound origin leg with. It is the
    # origin's key pair, and nothing the client ever sees.
    brix_credential s3cred {
        s3_access_key {ORIGIN_ACCESS_KEY};
        s3_secret_key {ORIGIN_SECRET_KEY};
        s3_region     us-east-1;
    }

    # Origin object store: a posix-backed S3 endpoint, bucket "testbucket".
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{ORIGIN_DIR};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   {ORIGIN_ACCESS_KEY};
            brix_s3_secret_key   {ORIGIN_SECRET_KEY};
            brix_s3_region       us-east-1;
            brix_allow_write     on;
        }
    }

    # Front: S3 in, s3:// out. Its own key pair terminates the client leg.
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_s3                 on;
            brix_export             {FRONT_EXPORT};
            brix_storage_backend    s3://{BIND_HOST}:{ORIGIN_PORT}/testbucket;
            brix_storage_credential s3cred;
            brix_s3_bucket          testbucket;
            brix_s3_access_key      {FRONT_ACCESS_KEY};
            brix_s3_secret_key      {FRONT_SECRET_KEY};
            brix_s3_region          us-east-1;
            brix_allow_write        on;
        }
    }
}

# Metadata walk thread-offload — template for test_walk_offload.py (phase-109).
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_DIR BIND_HOST.
# Test-provided: ORIGIN_PORT LOCAL_PORT.
#
# Two webdav servers:
#   {PORT}       REMOTE backend (http:// origin the test controls, and can make
#                slow) — the offload gate fires here; a stalled origin must NOT
#                stall unrelated requests on the worker.
#   {LOCAL_PORT} LOCAL posix backend — the gate must NOT fire (inline path,
#                byte-identical behaviour), asserted by the non-offload cell.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;
events { worker_connections 64; }
thread_pool default threads=2 max_queue=256;
http {
    access_log {LOG_DIR}/access.log;
    client_body_temp_path {TMP_DIR};
    # The offload posts to the shared "default" pool declared above; without
    # one the gate declines and the walk runs inline (also under test).
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth none;
        }
    }
    server {
        listen {BIND_HOST}:{LOCAL_PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
        }
    }
}

# OS-group resolution for the acc authorization engine
# (test_audit15f_acc_group_resolution.py, registry lifecycle) — audit §B1:
# brix_acc_pgo and brix_acc_gidretran are configured nowhere in the suite, so
# neither the primary-group-only restriction nor the ambiguous-gid skip list
# has ever changed a decision.
#
# `brix_auth unix` is the mechanism of choice: it is the one scheme where the
# client simply declares a name (loopback-gated, src/auth/unix/auth.c), so a
# test can authenticate as a REAL local account and have the acc engine resolve
# that account's Unix gidlist through NSS — which is the input both knobs act
# on (acc/groups.c acc_resolve_unix).
#
# Both knobs land in process globals (acc/config.c calls
# brix_acc_groups_set_primary_only / _set_gidretran), so each arm of the cross
# is its own nginx PROCESS, delivered through the substituted ACC_EXTRA block.
# Keep this header free of loose placeholder tokens: a substituted multi-line
# block would break out of the comment.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT.  Test-provided: BIND_HOST AUTHDB
# ACC_EXTRA (may be empty).
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth unix;
        brix_authdb_engine xrdacc;
        brix_authdb {AUTHDB};
        brix_acc_audit all;
        {ACC_EXTRA}
    }
}

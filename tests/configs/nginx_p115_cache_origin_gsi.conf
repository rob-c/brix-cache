# nginx_p115_cache_origin_gsi.conf — read-cache node whose ORIGIN requires GSI,
# for the phase-115 W2.4 cache-origin credential suite
# (tests/test_phase115_cache_origin_gsi.py).  Clients connect anonymously; the
# cache authenticates OUTBOUND to the origin with whatever CRED_BLOCK /
# SERVER_LINES carry (a brix_credential block with x509_proxy + a
# brix_storage_credential reference + brix_trusted_ca, or nothing at all).
#
# Launcher-provided : LOG_DIR PORT DATA_ROOT
# Test-provided     : ORIGIN_PORT CACHE_DIR CRED_BLOCK SERVER_LINES
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool p115_cache threads=2 max_queue=8192;

events { worker_connections 128; }

stream {
{CRED_BLOCK}
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_export {DATA_ROOT};
        brix_auth none;
        brix_allow_write off;
        brix_thread_pool p115_cache;
        brix_storage_backend root://127.0.0.1:{ORIGIN_PORT};
        brix_cache_store posix:{CACHE_DIR};
        brix_cache_export /;
{SERVER_LINES}
    }
}

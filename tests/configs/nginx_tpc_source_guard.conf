worker_processes 1;
error_log {LOG_DIR}/error.log info;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
        brix_allow_write on;
        # SSRF source-host allowlist: only these authorities may originate a
        # native TPC pull. Allowing an RFC-1918 host so the accept path can
        # fall through to the range gate (private allowed by default), and a
        # domain suffix to exercise the leading-'.' match arm.
        brix_tpc_source_guard on;
        brix_tpc_source_allow 10.255.255.1 .example.com;
        brix_access_log {LOG_DIR}/brix_access.log;
    }
}

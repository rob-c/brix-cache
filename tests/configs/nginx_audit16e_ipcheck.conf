# The krb5 AP-REQ source-IP check at value granularity (audit tranche 16,
# file 5; test_audit16e_krb5_ip_check.py).  brix_krb5_ip_check is one of the
# seven flag directives whose BOTH arms were written nowhere in the corpus.
#
# Three acceptors in ONE process, off ONE realm, ONE principal and ONE keytab.
# Everything except the directive is held identical on purpose: the file's whole
# claim is that a single AP-REQ, arriving from a single address, gets three
# different verdicts, and any other difference between the planes would give a
# refusal a second explanation.
#
#   {PORT}         brix_krb5_ip_check on   — the address the connection arrives
#                  from is bound into the auth context, so krb5_rd_req compares
#                  it against the ticket's own address list.
#   {OFF_PORT}     brix_krb5_ip_check off  — the stage is skipped
#                  (auth/krb5/auth.c:224 returns NGX_OK before binding).
#   {ABSENT_PORT}  the directive is not written at all.  This plane is the one
#                  that measures the merge default rather than reading it off
#                  server_conf_merge_security.c:240, and it is also the only
#                  plane a real deployment has.
#
# Three servers rather than three instances because this flag is srv_conf: if it
# were process-global (as the previous file's subject turned out to be) the three
# would have to agree, and the fact that they do not is itself the finding.
#
# brix_access_log is wired on every plane, to a DIFFERENT file each, because a
# refusal here has exactly two operator-visible traces and this is the one that
# names the client address that was turned away; separate files are what let a
# case say "the ON plane logged it and the OFF plane did not" without parsing
# out which server a shared line came from.
#
# The http block exists for the other trace: brix_auth_total lives in shared
# memory that the stream workers write and the http worker exports, so the
# metrics face is also the only assertion that the two agree about a refusal.
# access_log off and the five *_temp_path lines keep `nginx -t` from touching a
# default prefix this instance never creates.
#
# `listen {PORT};` with no address, deliberately: the test moves the client's
# SOURCE address between 127.0.0.1 and 127.0.0.2 — that is the entire
# instrument — so the acceptors have to answer on whichever loopback address the
# relay's onward connection lands on.  The service principal comes from the
# server's advert rather than from the URL, so a bare-address connect is fine.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + OFF_PORT ABSENT_PORT
# METRICS_PORT.  Test-provided: PRINCIPAL KEYTAB (both must exist at
# config-parse time — `nginx -t` runs before the daemon starts).  RELAY_PORT is
# in the ledger but not here: nothing in nginx binds it, it belongs to the
# in-process relay the test runs.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- the check enabled ---------------------------------------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_krb5_ip_check  on;
        brix_access_log     {LOG_DIR}/access-on.log;
    }

    # --- the check disabled: the other half of the pair ----------------------
    server {
        listen {OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_krb5_ip_check  off;
        brix_access_log     {LOG_DIR}/access-off.log;
    }

    # --- the directive unwritten: what every real server looks like ----------
    server {
        listen {ABSENT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_access_log     {LOG_DIR}/access-absent.log;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

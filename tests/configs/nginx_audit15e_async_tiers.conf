# The durable async backend-op queue co-resident with storage tiers
# (test_audit15e_backend_async_tiers.py, registry lifecycle) — audit §B2.12:
# `brix_backend_async on` never appeared in the same unit as
# `brix_cache_store` or `brix_stage`, though both subsystems mutate the
# backend namespace with different durability windows.
#
# One instance: a plain WebDAV posix ORIGIN, and a front with three locations
# over that origin —
#   /rt/  read-through cache tier  + backend_async  (the cache cross)
#   /wt/  write-through stage tier + backend_async  (the stage cross)
#   /ro/  the /rt/ shape with allow_write off       (fail-closed control)
# Each location carries its OWN brix_export: tiers are registered in the VFS
# backend registry keyed by the canonical export root, so shared roots would
# share ONE tier.
#
# The durable journal dir must be handed through with a main-context `env`
# directive (nginx rebuilds the worker environment, so a process-level
# variable never arrives) — same pattern as nginx_lc_backend_async_webdav.conf.
#
# worker_processes 2: the front's fills/flushes/queued unlinks all target the
# origin inside this same nginx; a single worker would deadlock on itself.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + ORIGIN_PORT extra.
# Test-provided: BIND_HOST ORIGIN_ROOT EXPORT_ROOT CACHE_ROOT STAGE_ROOT
#                JOURNAL_DIR.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
env BRIX_STAGE_JOURNAL_DIR={JOURNAL_DIR};
daemon on;

thread_pool default threads=2 max_queue=256;
events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # The origin. No tier or queue of its own — it IS the source of truth.
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{ORIGIN_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{PORT};

        location = / { return 204; }

        location /rt/ {
            brix_webdav              on;
            brix_storage_backend     http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth         none;
            brix_allow_write         on;
            brix_export              {EXPORT_ROOT}/rt;
            brix_cache_store         posix:{CACHE_ROOT}/rt;
            brix_backend_async       on;
            brix_backend_async_batch 64;
            brix_backend_async_wait  200ms;
        }

        location /wt/ {
            brix_webdav              on;
            brix_storage_backend     http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth         none;
            brix_allow_write         on;
            brix_export              {EXPORT_ROOT}/wt;
            brix_stage               on;
            brix_stage_store         posix:{STAGE_ROOT}/wt;
            brix_stage_flush         sync;
            brix_backend_async       on;
            brix_backend_async_batch 64;
            brix_backend_async_wait  200ms;
        }

        # Attribution controls: /noq/ carries the cache tier WITHOUT the async
        # queue, /bare/ carries neither — so a mutation that misbehaves on
        # /rt/ can be pinned to the queue, the tier, or their pairing.
        location /noq/ {
            brix_webdav          on;
            brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_export          {EXPORT_ROOT}/noq;
            brix_cache_store     posix:{CACHE_ROOT}/noq;
        }

        location /bare/ {
            brix_webdav          on;
            brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_export          {EXPORT_ROOT}/bare;
        }

        location /ro/ {
            brix_webdav              on;
            brix_storage_backend     http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth         none;
            brix_allow_write         off;
            brix_export              {EXPORT_ROOT}/ro;
            brix_cache_store         posix:{CACHE_ROOT}/ro;
            brix_backend_async       on;
            brix_backend_async_batch 64;
            brix_backend_async_wait  200ms;
        }
    }
}

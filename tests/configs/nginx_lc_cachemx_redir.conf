# cachemx cmsd:// manager (test_cachemx_cmsd.py): root:// redirector plane on
# {PORT}, cms registration listener on {CMS_PORT}, and a /metrics exposition
# server so the suite can assert the brix_cluster_* families as the cache
# data-server (nginx_lc_cachemx_cmsds.conf) registers and heartbeats.
# Launcher-provided: LOG_DIR PORT TMP_DIR + CMS_PORT METRICS_PORT.
# Session-provided: BIND_HOST.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_manager_mode on;
    }
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server on;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

# Phase-115 W8.3 CMS admin socket — the two-faced manager for
# test_phase115_cms_admin_socket.py.  Shaped on nginx_cms_parity_mgr.conf: one
# worker, one SHM registry, two stream faces.
#
# The two admin sockets sit on DIFFERENT faces on purpose, and the test leans on
# it.  brix_admin_socket administers root:// SESSIONS, which the redirector face
# owns; brix_cms_admin_socket administers the NODE REGISTRY, which the CMS face
# populates.  Each socket therefore exposes exactly one verb table, and a verb
# of the other table must be an unknown command on it — the disjointness that
# the shared transport (src/net/admin/admin_unix.c) has no way to enforce for
# itself, since it only ever sees the table it was handed.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided:     CMS_PORT.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    # root:// redirector face — clients log in here; sessions self-register.
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_manager_mode on;
        brix_listen_port {PORT};
        brix_admin_socket {TMP_DIR}/root.sock;
    }

    # CMS server face — data nodes register here; the registry is node-wide.
    server {
        listen 127.0.0.1:{CMS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_server on;
        brix_cms_server_interval 1;
        brix_cms_admin_socket {TMP_DIR}/cms.sock;
    }
}

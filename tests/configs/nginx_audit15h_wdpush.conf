# WebDAV HTTP-TPC: the GSI/delegation PUSH leg (test_audit15h_webdav_gsi_push.py)
# — audit §C, "WebDAV GSI/delegation *push* leg".
#
# The push leg itself is well covered (test_webdav_tpc.py drives ten pushes).
# What has never been stood up is the pair this template exists for:
#
#   1. a peer that can SAY WHO DIALLED IT.  Every destination in the tree is
#      `ssl_verify_client optional_no_ca` with `access_log` off or unformatted,
#      so no test has ever observed the client certificate the outbound leg
#      presents.  {PEER_PORT} and {STRICT_PORT} log $ssl_client_s_dn, which
#      turns "which identity did the push use" into an assertion.
#
#   2. a destination that REQUIRES a CA-verified client certificate
#      ({STRICT_PORT}, ssl_verify_client on).  Nothing in the tree has ever
#      made the push leg's certificate mandatory, so nothing has ever proven
#      the leg presents one at all.
#
# The four initiator faces differ in exactly one knob each, so every result is
# attributable:
#
#   {PORT}          delegation on (the default), service cert configured
#   {FWDOFF_PORT}   ...with brix_webdav_tpc_credential_forward off
#   {NOCERT_PORT}   ...with no brix_webdav_tpc_cert at all
#   {ROGUECA_PORT}  ...with a brix_webdav_tpc_cafile that does not sign the peer
#
# brix_backend_delegation passthrough is what arms X-Brix-Delegate-Proxy:
# access_capture_deleg_proxy (access.c:256) returns early for the default
# BRIX_CRED_SELECT export, so without it the header is never even read and the
# comparison this file makes would be vacuous on both legs.
#
# ssl_verify_client optional_no_ca on the initiators and on {PEER_PORT} is the
# WebDAV GSI idiom: an RFC 3820 proxy leaf is not a CA-issued certificate and
# cannot satisfy nginx's own verification, so nginx is told to REQUEST the cert
# and brix_webdav_cafile + brix_webdav_proxy_certs do the real work.
# {STRICT_PORT} is deliberately the other thing — a peer that will not complete
# a handshake without a CA-issued client certificate.
#
# The two data trees are subdirectories of one export root: {DATA_ROOT}/src is
# what the initiators read and write, {DATA_ROOT}/peer is what the peers do, so
# a file's location says which side of the transfer put it there.
#
# thread_pool is not optional — the push runs on a thread-pool worker, and the
# initiators and the peers are co-hosted in this one nginx.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + FWDOFF_PORT NOCERT_PORT
#                    ROGUECA_PORT PEER_PORT STRICT_PORT.
# Test-provided: HOSTCERT HOSTKEY CA ROGUE_CA SERVICE_CERT SERVICE_KEY CRED_DIR
#                (every path must exist at config-parse time — lifecycle.start
#                runs `nginx -t` first).
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=4 max_queue=256;
events { worker_connections 128; }

http {
    # The whole point of the peer faces: dn= is the subject of the certificate
    # the OUTBOUND leg presented, and probe= is a TransferHeader that survived
    # the crossing.  Both are otherwise invisible from outside the process.
    log_format brixpeer 'method=$request_method uri=$uri status=$status '
                        'dn="$ssl_client_s_dn" probe="$http_x_brix_probe" '
                        'authz="$http_authorization"';

    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;
    client_max_body_size  64m;

    # --- initiator: delegation on (default), service cert present ------------
    server {
        listen {PORT} ssl;
        server_name localhost;
        ssl_certificate        {HOSTCERT};
        ssl_certificate_key    {HOSTKEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT}/src;
            brix_webdav_auth            required;
            brix_webdav_cafile          {CA};
            brix_backend_delegation     passthrough;
            brix_storage_credential_dir {CRED_DIR};
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cert        {SERVICE_CERT};
            brix_webdav_tpc_key         {SERVICE_KEY};
            brix_webdav_tpc_cafile      {CA};
            brix_webdav_tpc_timeout     20;
        }
    }

    # --- initiator: the same, with credential forwarding turned OFF ----------
    server {
        listen {FWDOFF_PORT} ssl;
        server_name localhost;
        ssl_certificate        {HOSTCERT};
        ssl_certificate_key    {HOSTKEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT}/src;
            brix_webdav_auth            required;
            brix_webdav_cafile          {CA};
            brix_backend_delegation     passthrough;
            brix_storage_credential_dir {CRED_DIR};
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cert        {SERVICE_CERT};
            brix_webdav_tpc_key         {SERVICE_KEY};
            brix_webdav_tpc_cafile      {CA};
            brix_webdav_tpc_timeout     20;
            brix_webdav_tpc_credential_forward off;
        }
    }

    # --- initiator: no service certificate at all ----------------------------
    server {
        listen {NOCERT_PORT} ssl;
        server_name localhost;
        ssl_certificate        {HOSTCERT};
        ssl_certificate_key    {HOSTKEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT}/src;
            brix_webdav_auth            required;
            brix_webdav_cafile          {CA};
            brix_backend_delegation     passthrough;
            brix_storage_credential_dir {CRED_DIR};
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cafile      {CA};
            brix_webdav_tpc_timeout     20;
        }
    }

    # --- initiator: an outbound trust anchor that does not sign the peer -----
    server {
        listen {ROGUECA_PORT} ssl;
        server_name localhost;
        ssl_certificate        {HOSTCERT};
        ssl_certificate_key    {HOSTKEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT}/src;
            brix_webdav_auth            required;
            brix_webdav_cafile          {CA};
            brix_backend_delegation     passthrough;
            brix_storage_credential_dir {CRED_DIR};
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cert        {SERVICE_CERT};
            brix_webdav_tpc_key         {SERVICE_KEY};
            brix_webdav_tpc_cafile      {ROGUE_CA};
            brix_webdav_tpc_timeout     20;
        }
    }

    # --- the observing peer: pull source AND push destination ----------------
    server {
        listen {PEER_PORT} ssl;
        server_name localhost;
        ssl_certificate        {HOSTCERT};
        ssl_certificate_key    {HOSTKEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;
        access_log             {LOG_DIR}/peer.log brixpeer;

        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT}/peer;
            brix_webdav_auth     required;
            brix_webdav_cafile   {CA};
            brix_allow_write     on;
        }
    }

    # --- the strict peer: no CA-verified client certificate, no handshake ----
    server {
        listen {STRICT_PORT} ssl;
        server_name localhost;
        ssl_certificate        {HOSTCERT};
        ssl_certificate_key    {HOSTKEY};
        ssl_client_certificate {CA};
        ssl_verify_client      on;
        ssl_verify_depth       10;
        access_log             {LOG_DIR}/peer.log brixpeer;

        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT}/peer;
            brix_webdav_auth     required;
            brix_webdav_cafile   {CA};
            brix_allow_write     on;
        }
    }
}

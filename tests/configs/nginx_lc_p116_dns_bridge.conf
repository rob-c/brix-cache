# Phase-116 thread-pool -> event-loop resolver bridge (resolve_bridge.c), driven
# by the one blocking resolver a server reaches with no client at all: the cvmfs
# RTT origin probe (brix_cvmfs_origin_select rtt).  Its per-worker timer fires
# within 500 ms of init_process and posts a thread-pool task that calls
# brix_dns_resolve_sync() on {ORIGIN_HOST} — the code path every other blocking
# caller (TPC pins, cache-origin and gsiftp connects, OCSP fetches) shares.
#
# The whole point of the subject is WHICH resolver that thread reaches:
# {ORIGIN_HOST} is a name only the test's stub nameserver can answer, so a query
# arriving at the stub proves the thread crossed the bridge and used the
# worker's own `brix_resolver` policy; libc would have asked the host's real
# resolver and got NXDOMAIN.  brix_dns_bridge_requests_total is the same fact
# read from the exposition.
#
# Launcher-provided: LOG_DIR TMP_DIR DATA_ROOT PORT.  Test-provided: BIND_HOST
# RESOLV_CONF RESOLVER_EXTRA RETRY ORIGIN_HOST ORIGIN_PORT CACHE_STORE REPO.
worker_processes 1;
thread_pool default threads=2 max_queue=256;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    brix_resolver auto path={RESOLV_CONF} {RESOLVER_EXTRA};
    brix_dns_retry {RETRY};

    server {
        listen {BIND_HOST}:{PORT};

        location /metrics { brix_metrics on; }

        location /cvmfs/{REPO}/ {
            brix_cvmfs               on;
            brix_cache_store         posix:{CACHE_STORE};
            brix_storage_backend     "http://{ORIGIN_HOST}:{ORIGIN_PORT}";
            brix_cvmfs_origin_select rtt;
            brix_cvmfs_rtt_interval  1s;
        }
    }
}

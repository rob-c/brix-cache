# Dashboard session-TTL expiry (test_audit15h_dashboard_session_ttl.py, §A1 —
# `brix_dashboard_session_ttl` was configured by the 15c users file but its
# effect, the expiry itself, had no coverage at all).
#
# The dashboard's routes are absolute literals ("/brix/api/v1/...",
# module_dispatch.c:77-104), so every plane has to serve them at /brix and two
# auth modes cannot share one server.  Hence three:
#
#   {PORT}      single-password mode with an explicit 120s TTL.  The cookie is
#               HMAC(password, "<ts>") — the test knows the password, so it can
#               mint a cookie at any timestamp it likes and pin the boundary
#               without waiting for it.
#   {MU_PORT}   users-file mode, same 120s TTL.  Its cookie signs
#               "<ts>.<username>" under the user's stored hash, a different
#               message — the expiry check has to hold for both shapes.
#   {DEF_PORT}  single-password mode with NO ttl directive, so the 28800s merge
#               default (module.c:136) is what answers.  A cookie aged two
#               hours is refused above and accepted here; without that pairing
#               "expired" cannot be told apart from "not configured at all".
#
# TTL_SECONDS is a template value rather than a literal so the test and the
# config cannot drift apart on the one number every boundary assertion is
# computed from.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + MU_PORT DEF_PORT.
# Test-provided: BIND_HOST PASSWORD USERS_FILE TTL_SECONDS.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    # --- single password, explicit TTL --------------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        location /brix {
            brix_dashboard on;
            brix_admin_rate_limit off;  # whole suite shares one client IP: default per-IP cap trips under xdist
            brix_dashboard_password "{PASSWORD}";
            brix_dashboard_session_ttl {TTL_SECONDS};
        }
    }

    # --- users file, same TTL, "<ts>.<user>" cookie message ------------------
    server {
        listen {BIND_HOST}:{MU_PORT};
        location /brix {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_dashboard_users {USERS_FILE};
            brix_dashboard_session_ttl {TTL_SECONDS};
        }
    }

    # --- no TTL directive: the 28800s default answers ------------------------
    server {
        listen {BIND_HOST}:{DEF_PORT};
        location /brix {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_dashboard_password "{PASSWORD}";
        }
    }
}

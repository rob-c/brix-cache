# Cross-device (EXDEV) staged-commit WebDAV tier for
# test_stage_cross_device_commit.py (registry lifecycle).
#
# `brix_webdav_upload_resume on` routes a Content-Range PUT through the durable,
# identity-keyed partial in `brix_webdav_stage_dir`; the test points that dir at
# tmpfs while the export lives on the ordinary filesystem, so the commit's
# rename(2) fails EXDEV and brix_commit_staged has to take the
# copy → fsync → rename-onto-final fallback.  That fallback had no coverage on
# the HTTP plane.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT. Test-provided: BIND_HOST DATA_DIR
# STAGE_DIR.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_export {DATA_DIR};
            brix_webdav_auth none;
            brix_allow_write on;
            brix_webdav_upload_resume on;
            brix_webdav_stage_dir {STAGE_DIR};
        }
    }
}

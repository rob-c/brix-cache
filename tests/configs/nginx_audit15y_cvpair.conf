# TWO cvmfs locations on ONE listener — the measuring half of the CVMFS
# origin-policy value table (test_audit15y_cvmfs_origin_policy.py).
#
# Two repositories exported side by side is the ordinary shape of a Stratum-1
# cache, and it is also the only shape in which these directives can be read
# honestly.  brix_cvmfs_origin_http_version and brix_cvmfs_fill_retry_policy
# are location-level directives whose merge writes a process-wide global
# (src/protocols/cvmfs/cvmfs_module_merge.c:264 and :271), so what a location
# gets is decided by whichever cvmfs location merged LAST — including a
# location that wrote nothing at all.  One location cannot show that;
# nginx_audit15y_cvsolo.conf is the same config with the second one removed,
# and the pair of readings is the finding.
#
# brix_cvmfs_geo_answer is the control in the same config: it is read at
# REQUEST time (src/protocols/cvmfs/gate.c:422), not merged into a global, so
# each location here follows its own token.  Its presence is what makes the
# other two a defect rather than a house style.
#
# The two locations differ ONLY in repository, cache store and policy slot.
# They share one backend and one listener, so any difference between them is
# the directive under test and nothing else.  The stores are written separately
# because a shared one would let the first location's successful fill serve the
# second location's request and hide the very failure being measured.
#
# CORRECTION (measured by tranche 16 file 9, DEFECT CANDIDATE #81): writing two
# stores does not GET two stores.  A cvmfs cache location declares no root, so
# both of these canonicalise to the export "/" and
# brix_vfs_backend_entry_get_or_create() overwrites the entry it finds — the
# SECOND location's store is the one the export actually holds, for both.  That
# does not weaken anything this file measures (brix_cvmfs_geo_answer is read per
# request off the location's own merged value, which is the point of §D), but the
# separation is not the isolation the paragraph above claims, and a future case
# that needs one location's fill to be invisible to the other cannot get it here.
# See test_audit16i_cvmfs_resilience_flags.py §J.
#
# POLICY_A and POLICY_B are the location-level slots (named here without their
# braces — the renderer substitutes placeholders in comments too, and a
# multi-line value spliced into a comment turns the tail of that comment into
# live config).  Either may be EMPTY: "the location says nothing" is one of the
# values under test, not the absence of a case.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + MOCK_PORT DEAD_PORT.
# Test-provided: BIND_HOST REPO_A REPO_B CACHE_A CACHE_B BACKEND
#                + the POLICY_A and POLICY_B slots.
daemon on;
worker_processes 1;
thread_pool default threads=2;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # Merged FIRST.
        location /cvmfs/{REPO_A}/ {
            brix_cvmfs           on;
            brix_cvmfs_trace     on;
            brix_cache_store     posix:{CACHE_A};
            brix_storage_backend "{BACKEND}";
{POLICY_A}        }

        # Merged SECOND — and therefore, for two of the three directives, the
        # one that decides for both.
        location /cvmfs/{REPO_B}/ {
            brix_cvmfs           on;
            brix_cvmfs_trace     on;
            brix_cache_store     posix:{CACHE_B};
            brix_storage_backend "{BACKEND}";
{POLICY_B}        }
    }
}

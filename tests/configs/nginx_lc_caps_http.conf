# Backend capability negatives against the real sd_http driver, for
# test_backend_caps_negative.py (registry lifecycle).
#
# One WebDAV origin plus two root:// exports storing THROUGH it, so every
# truncate refusal is checked against a real driver, while xattrs must relay
# through the WebDAV origin's dead-property slots.  The staged export owns an
# explicit private spool; a foreign-owned default /tmp/staging must not silently
# change this test into another direct-backend test.
#
# worker_processes 2: both root:// exports connect back to the WebDAV origin
# served by this same nginx — a single worker blocked in a synchronous backend
# call could never accept its own connection.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT ORIGIN_PORT STAGE_OFF_PORT.
# Test-provided: BIND_HOST ORIGIN_DATA EXPORT_STAGED EXPORT_DIRECT STAGE_STORE.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_max_body_size 16m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {                                    # the ORIGIN of record
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_webdav on;
            brix_export {ORIGIN_DATA};
            brix_webdav_auth none;
            brix_allow_write on;
        }
    }
}

stream {
    server {                                    # http backend UNDER a stage tier
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_export {EXPORT_STAGED};
        brix_stage on;
        brix_stage_store posix:{STAGE_STORE};
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
    }

    server {                                    # http backend as the top driver
        listen {BIND_HOST}:{STAGE_OFF_PORT};
        brix_root on;
        brix_export {EXPORT_DIRECT};
        brix_auth none;
        brix_allow_write on;
        brix_stage off;
        brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
    }
}

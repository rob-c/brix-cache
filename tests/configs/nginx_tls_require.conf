# nginx_tls_require.conf — per-capability TLS gating (`brix_tls_require`) wire
# tests.  Registry LifecycleHarness template.
#
# The mask under test goes in the TLS-REQUIRE slot; the AUTH-LINES slot
# carries the token (ztn) directives for the cleartext-ztn stock-parity cases
# and is empty for the anonymous capability-mask cases.  (The slot names are
# deliberately NOT written in placeholder syntax here: the renderer
# substitutes placeholders inside comments too.)
#
# Launcher-provided : LOG_DIR PORT DATA_ROOT
# Test-provided     : BIND_HOST TLS_LINES AUTH AUTH_LINES TLS_REQUIRE
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
{TLS_LINES}        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth {AUTH};
{AUTH_LINES}        brix_tls_require {TLS_REQUIRE};
    }
}

# 2.0 readiness F8 — site checksum plugin (brix_checksum_plugin) lab.
# Launcher-provided: LOG_DIR TMP_DIR DATA_ROOT PORT HTTP_PORT.
# Test-provided: BIND_HOST, PLUGIN_DIRECTIVES (stream main level, may be
# empty), HTTP_MAIN_DIRECTIVES (http main level, may be empty),
# SERVER_DIRECTIVES (root:// server level, e.g. brix_checksum_default).
# One process-wide registry: a plugin registered in either block answers on
# both listeners (kXR_query cks / Qconfig chksum, WebDAV Want-Digest).
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 128; }
stream {
    {PLUGIN_DIRECTIVES}
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend posix:{DATA_ROOT};
        {SERVER_DIRECTIVES}
    }
}
http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    {HTTP_MAIN_DIRECTIVES}
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_storage_backend posix:{DATA_ROOT};
        }
    }
}

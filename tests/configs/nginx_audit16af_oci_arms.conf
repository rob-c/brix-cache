# SEVEN OCI registry fronts in ONE process — the measuring half of the two
# `protocols/oci` flags whose SECURING arm no config in this tree has ever
# written (test_audit16af_oci_security_arms.py, 16th tranche):
#
#   brix_oci_registry_allow_anonymous  `on` in configs/oci_registry.conf; the
#                                      authenticating leg of oci/registry_lane.py
#                                      passes anonymous=False, which renders an
#                                      EMPTY ANON_LINES slot rather than the token
#   brix_oci_mirror_insecure           `on` in oci_mirror.conf and oci_compose.conf,
#                                      "the ONE place in the tree that does" by
#                                      its own comment — and nowhere `off`
#
# Both merge to 0 (oci_merge.c:72,75) and both are load-bearing at LOAD time:
# oci_merge.c:176 refuses `brix_oci_registry on` that has named no authenticated
# context, and :117 refuses a cleartext mirror upstream.  `brix_oci_mirror_insecure`
# has no runtime arm at all — the field it merges into (`up->insecure`,
# oci_merge.c:312) is read nowhere — so its whole subject is the parse tier and
# it needs no plane here.  Anonymity does have a runtime arm, and these are it.
#
# Every directive is NGX_HTTP_LOC_CONF, so a plane could in principle have been a
# `location`; it is a `server` instead because the last three need their own
# `listen ... ssl` and a matrix that puts some planes on a different kind of
# block from the rest is a matrix with a second variable in it.
#
#   PORT       R_ANON — `allow_anonymous on`, NO issuer table.  The open lab
#                       registry configs/oci_registry.conf already renders, kept
#                       here so the comparison is inside one process.
#   OFF_PORT   R_OFF  — an issuer table AND the literal `allow_anonymous off`.
#                       The never-written token.
#   ABS_PORT   R_ABS  — the same issuer table and NO anonymity line: byte for
#                       byte what registry_lane.py's anonymous=False renders, and
#                       the control every R_OFF cell is compared against.
#   BOTH_PORT  R_BOTH — the same issuer table AND `allow_anonymous on`.  The
#                       composition the template has always permitted (its
#                       ANON_LINES and ISSUER_LINES slots are independent) and no lane has
#                       ever built.  brix_oci_registry_authz consults the flag
#                       AFTER the bearer path has DECLINED, and a token no issuer
#                       accepted declines exactly as a token that was never sent
#                       does — so this plane is where that is measured.
#
# The last three carry no issuer table and no anonymity line at all.  They load
# because of the THIRD route oci_merge.c:177 offers — oci_ssl_verifies_client(),
# which is `sslcf->verify != 0` and is therefore satisfied by every mode of
# ssl_verify_client except `off`.  What that predicate is worth is a different
# question from what it accepts, and it takes three listeners to ask:
#
#   VON_PORT   R_VON  — `ssl_verify_client on`.  The route the message means:
#                       nginx validates the chain against CA_CERT and refuses the
#                       handshake outright when it does not check out, so the
#                       registry's TLS identity branch only ever runs on a peer
#                       the transport already proved.
#   VOPT_PORT  R_VOPT — `ssl_verify_client optional`.  A cert is asked for, and
#                       one that fails validation is nginx's own 400.
#   TLS_PORT   R_TLS  — `ssl_verify_client optional_no_ca`, which asks for a
#                       certificate and validates NOTHING.  The load-time gate
#                       cannot tell this apart from the two above — and
#                       brix_oci_registry_authz's TLS branch asks only that
#                       ngx_ssl_get_subject_dn() succeed, which any string a
#                       client is willing to sign for itself satisfies.
#
# SEVEN distinct registry roots under the one DATA_ROOT, one per plane: the CAS
# is content-addressed, so a blob pushed to the wrong plane would be
# indistinguishable from one pushed to the right plane if they shared a store —
# and the whole file is about which plane accepted which client.
#
# `access_log` is ON and at http level, which is the opposite of what every other
# OCI template does — §D needs a log that a principal COULD have reached, so that
# "no log names the pusher" is a measurement rather than a consequence of logging
# being off.
#
# worker_processes 1 so an upload session started on one request and PATCHed on
# the next is always the same worker's; the session table is per-worker.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the six extra ports.
# Test-provided: BIND_HOST ISSUERS SERVER_CERT SERVER_KEY CA_CERT.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    access_log {LOG_DIR}/access.log combined;
    client_max_body_size 64m;

    # --- the open lab registry --------------------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        location /v2/ {
            brix_oci_registry                 on;
            brix_oci_registry_root            {DATA_ROOT}/anon;
            brix_allow_write                  on;
            brix_oci_registry_allow_anonymous on;
        }
    }

    # --- the never-written token ------------------------------------------
    server {
        listen {BIND_HOST}:{OFF_PORT};
        location /v2/ {
            brix_oci_registry                 on;
            brix_oci_registry_root            {DATA_ROOT}/off;
            brix_allow_write                  on;
            brix_oci_token_issuers            {ISSUERS};
            brix_oci_registry_allow_anonymous off;
        }
    }

    # --- the same server with nothing written -----------------------------
    server {
        listen {BIND_HOST}:{ABS_PORT};
        location /v2/ {
            brix_oci_registry      on;
            brix_oci_registry_root {DATA_ROOT}/abs;
            brix_allow_write       on;
            brix_oci_token_issuers {ISSUERS};
        }
    }

    # --- an issuer table AND an open door ---------------------------------
    server {
        listen {BIND_HOST}:{BOTH_PORT};
        location /v2/ {
            brix_oci_registry                 on;
            brix_oci_registry_root            {DATA_ROOT}/both;
            brix_allow_write                  on;
            brix_oci_token_issuers            {ISSUERS};
            brix_oci_registry_allow_anonymous on;
        }
    }

    # --- the third route, meant: the transport proves the peer -------------
    server {
        listen {BIND_HOST}:{VON_PORT} ssl;
        ssl_certificate        {SERVER_CERT};
        ssl_certificate_key    {SERVER_KEY};
        ssl_client_certificate {CA_CERT};
        ssl_verify_client      on;

        location /v2/ {
            brix_oci_registry      on;
            brix_oci_registry_root {DATA_ROOT}/von;
            brix_allow_write       on;
        }
    }

    # --- the third route, asked for but not required -----------------------
    server {
        listen {BIND_HOST}:{VOPT_PORT} ssl;
        ssl_certificate        {SERVER_CERT};
        ssl_certificate_key    {SERVER_KEY};
        ssl_client_certificate {CA_CERT};
        ssl_verify_client      optional;

        location /v2/ {
            brix_oci_registry      on;
            brix_oci_registry_root {DATA_ROOT}/vopt;
            brix_allow_write       on;
        }
    }

    # --- the third route, validating nothing -------------------------------
    server {
        listen {BIND_HOST}:{TLS_PORT} ssl;
        ssl_certificate        {SERVER_CERT};
        ssl_certificate_key    {SERVER_KEY};
        ssl_client_certificate {CA_CERT};
        ssl_verify_client      optional_no_ca;

        location /v2/ {
            brix_oci_registry      on;
            brix_oci_registry_root {DATA_ROOT}/tls;
            brix_allow_write       on;
        }
    }
}

# Parse-tier scaffold for the nine CVMFS resilience flags (audit tranche 16,
# file 9; test_audit16i_cvmfs_resilience_flags.py).
#
# Never started — it exists so `nginx -t` can be asked about a single line, in a
# single scope, with nothing else in the file that could answer instead.  It
# writes none of the nine itself: a scaffold that already carried one would make
# every negative about that flag ambiguous, because a second occurrence is
# diagnosed as a duplicate and that error arrives before the one a value or arity
# negative is reaching for.
#
# WHY THE PARSE TIER CARRIES REAL FINDINGS HERE
#   Three of the nine flags gate a config-time cross-check that is skipped
#   entirely when the flag is not on, so the `off` arm is not merely "the feature
#   is idle" — it is "a whole block of validation was never run":
#
#     brix_cvmfs_swarm on          requires brix_cache_peers with a self= slot
#                                  (cvmfs_module_build.c:299-312)
#     brix_cvmfs_unified_origin on requires an http(s) brix_storage_backend
#                                  (cvmfs_module_merge.c:228-247)
#     brix_scvmfs on               requires brix_cvmfs on, plus the authz-mode
#                                  checks behind the early return at
#                                  cvmfs_module_merge.c:281
#
#   Each of those is measured as a pair: the same broken block under `on` (a
#   reload-breaking EMERG) and under `off`/absent (silence).  BACKEND is a slot
#   precisely because one of them is about the backend: the unified_origin check
#   needs a config whose backend is deliberately NOT http(s).
#
# SLOTS, named here WITHOUT their braces — the renderer replaces every occurrence
# of a placeholder, comments included, and a multi-line value spliced into a
# comment turns the tail of that comment into configuration:
#
#   KNOBS       inside the cvmfs location            (NGX_HTTP_LOC_CONF)
#   SRV_KNOBS   inside the server, outside a location (NGX_HTTP_SRV_CONF)
#   HTTP_KNOBS  inside http{}, outside any server     (NGX_HTTP_MAIN_CONF)
#   OUTER       main context, outside http{} entirely — the placement negative
#   BACKEND     the cvmfs location's brix_storage_backend, quoted so a
#               "|"-separated origin set survives the parser as one argument
#   EXTRA       a whole extra location.  Two cases need one: a location that is
#               NOT a cvmfs export (where brix_scvmfs must be refused rather than
#               ignored), and a SECOND cvmfs export, which is where the question
#               "is a sibling's arm diagnosed at parse time" is asked.  Its cache
#               store is left as a CACHE2 marker for the test to fill in — a test
#               method has no reason to know where the scaffold puts its second
#               store.
#
# `nginx -t` does not bind, so the listen port is a placeholder and BACKEND is
# never connected to; both only have to survive the parser.
#
# Test-provided: PORT LOG_DIR CACHE CACHE2 BACKEND + the five slots.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

{HTTP_KNOBS}    server {
        listen {PORT};
{SRV_KNOBS}
        location /cvmfs/ {
            brix_cvmfs           on;
            brix_cache_store     posix:{CACHE};
            brix_storage_backend "{BACKEND}";
{KNOBS}        }
{EXTRA}    }
}

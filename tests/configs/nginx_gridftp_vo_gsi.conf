# gsiftp:// GridFTP gateway (GSI control channel) with a VO-ACL rule AND VOMS
# attribute carry, for test_gridftp_vo_acl_gsi.py.  Same event-engine GSI gateway
# as nginx_gridftp_gsiftp_ev.conf, but with:
#   * brix_gridftp_require_vo /vodata atlas   -- gate the /vodata prefix on VO
#   * brix_gridftp_vomsdir / _voms_cert_dir   -- lift the client proxy's VOMS
#                                                FQANs into the session identity
# so an /atlas VOMS proxy is ADMITTED to /vodata (the allow edge) while a plain
# GSI proxy carrying no VOMS AC is still refused (deny-until-VOMS-carry). PKI
# placeholders ({SERVER_CERT}, {SERVER_KEY}, {CA_DIR}, {VOMSDIR}) come from the
# session values; {PORT}/{LOG_DIR}/{DATA_ROOT}/{BIND_HOST} from the launcher.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 64; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_gridftp on;
        brix_gridftp_export      {DATA_ROOT};
        brix_gridftp_allow_write on;
        brix_gridftp_gsi         on;
        brix_gridftp_certificate      {SERVER_CERT};
        brix_gridftp_certificate_key  {SERVER_KEY};
        brix_gridftp_trusted_ca       {CA_DIR};
        brix_gridftp_vomsdir          {VOMSDIR};
        brix_gridftp_voms_cert_dir    {CA_DIR};
        brix_gridftp_require_vo       /vodata atlas;
    }
}

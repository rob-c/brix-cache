# 2.0 readiness F6 — the plain posix origin behind the RAM-cached export in
# nginx_lc_r20_ram_metrics.conf.  One anonymous root:// listener, no /metrics.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 128; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend posix:{DATA_ROOT};
    }
}

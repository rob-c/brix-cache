# WebDAV server whose bearer-token auth is driven by a scitokens.cfg issuer
# registry via brix_token_config (registry lifecycle) — the WebDAV twin
# of the stream plane's brix_token_config (nginx_token_registry.conf), which
# was tested while this directive had zero coverage.
# Launcher-provided: LOG_DIR TMP_DIR PORT.
# Test-provided via template_values (paths seeded under tmp_path, must exist at
# config-parse time): BIND_HOST DATA_DIR CADIR TOKEN_CFG.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth required;
            brix_trusted_ca_dir {CADIR};
            brix_token_config {TOKEN_CFG};
        }
    }
}

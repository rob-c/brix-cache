# Anonymous posix root:// origin for the cachemx metric-conformance suite
# (test_cachemx_*.py, lifecycle group lc-cachemx).  The matrix instance
# (nginx_lc_cachemx.conf) fills its stream-plane caches from this server, and
# the suite also asserts THIS instance's write/read byte counters when driving
# traffic straight at the origin.  Launcher-provided: LOG_DIR PORT TMP_DIR
# DATA_ROOT.  Session-provided: BIND_HOST.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend posix:{DATA_ROOT};
        brix_allow_write on;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

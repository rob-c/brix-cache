# native TPC pull SOURCE for the TLS x GSI cross (test_audit15h_tpc_gsi_tls.py)
# — audit §C.  Three faces on one worker, because the TPC rendezvous key lives
# in ONE process-wide shared-memory table (src/tpc/engine/key_registry.c: a flat
# namespace, no listener or server-conf binding), so a key armed on the
# anonymous face is consumable on either authenticated face.
#
#   {PORT}          gsi + brix_tls_require all.  This is the cross: the pulling
#                   destination must upgrade the pull socket (kXR_gotoTLS,
#                   src/tpc/outbound/tls.c) AND then present a credential in a
#                   GSI handshake over it (src/tpc/gsi/gsi_outbound_*.c).
#   {GSIONLY_PORT}  the same gsi acceptor with no TLS requirement.  It is the
#                   attribution control — a destination refused on {PORT} and
#                   served here failed the TLS half, not the GSI half.
#   {ARM_PORT}      anonymous, cleartext.  The rendezvous arm is the INITIATING
#                   CLIENT's leg, not the destination's; leaving it unauthenticated
#                   keeps the credential under test the destination's alone.
#
# brix_tls_require (not bare brix_tls) is what makes the negative meaningful:
# brix_tls only ADVERTISES kXR_ableTLS, so a destination with brix_tpc_outbound_tls
# off would simply decline the upgrade and be served in the clear.  `all` refuses
# every cleartext capability with kXR_TLSRequired.
#
# The host credential is a CA-signed EEC whose CN is the literal address the
# destination is told to dial; the outbound side pins the hostname with
# SSL_set1_host(t->src_host) whenever brix_trusted_ca gives it a chain to verify,
# and the certificate carries no subjectAltName, so OpenSSL falls back to the CN.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ARM_PORT GSIONLY_PORT.
# Test-provided: CERT_FILE KEY_FILE CA_DIR (each must exist at config-parse time
# — lifecycle.start runs `nginx -t` first).
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    # --- the cross: GSI over a mandatory in-protocol TLS upgrade -----------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_tls on;
        brix_tls_require all;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_access_log {LOG_DIR}/tls-acc.log;
    }

    # --- GSI alone: proves a refusal above was about TLS -------------------
    server {
        listen {GSIONLY_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_access_log {LOG_DIR}/gsi-acc.log;
    }

    # --- the rendezvous arm: the client's leg, deliberately anonymous ------
    server {
        listen {ARM_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_access_log {LOG_DIR}/arm-acc.log;
    }
}

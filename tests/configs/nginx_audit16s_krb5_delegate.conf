# The last arm-gap of root/stream/directives_auth.h at VALUE granularity (audit
# tranche 16, file 19; test_audit16s_krb5_delegate_arms.py).  THREE krb5
# acceptors over ONE realm, ONE principal, ONE keytab and ONE export in ONE
# process, differing only in which arm of `brix_krb5_delegate` each carries.
#
# THE SUBJECT — NGX_STREAM_SRV_CONF | NGX_CONF_FLAG, ngx_conf_set_flag_slot at
# NGX_STREAM_SRV_CONF_OFFSET (directives_auth.h:398), merged to 0
# (server_conf_merge_security.c:241):
#
#   {PORT}          brix_krb5_delegate on   — after a verified AP-REQ the
#                   acceptor does NOT finalize: it parks the session subkey and
#                   answers kXR_authmore "fwdtgt" (auth.c:560-563), so the login
#                   costs a second round AND a forwardable ticket.
#   {OFF_PORT}      brix_krb5_delegate off  — the arm written in no config
#                   anywhere in the corpus.  `on` reaches two
#                   (nginx_lc_native_krb5_delegate.conf, nginx_lc_krb5_cache_-
#                   origin.conf), so what the flag COSTS a client had never been
#                   read: this plane is where the cost is removed again.
#   {ABSENT_PORT}   the directive is not written at all — the plane that
#                   MEASURES the merge default instead of reading it off
#                   server_conf_merge_security.c:241, and the only plane a
#                   deployment that never heard of delegation actually has.
#
# Three servers rather than three instances: the gate is read per connection out
# of the server's conf (`conf->krb5.delegate == 1`, deleg_capture.c:23-26), so
# three acceptors in one worker really are three arms.  One keytab and one
# ccache are the point — the same client, holding the same ticket, has to reach
# all three, or a difference in rounds could be a difference in credentials.
#
# brix_access_log is wired per plane, to a DIFFERENT file each, because the
# whole operator-visible face of this flag is what it records: a login that ends
# at the fwdtgt challenge leaves the ON plane's log empty while the same client
# is accepted on the other two, and separate files are what let a case say that
# without parsing out which server a shared line came from.
#
# The http block is the second face: brix_auth_total lives in shared memory the
# stream workers write and the http worker exports, and it is where a refusal is
# counted — or, for the challenge nobody answered, is not.  access_log off and
# the five *_temp_path lines keep `nginx -t` off a default prefix this instance
# never creates.
#
# WHY brix_allow_write IS OFF
#   Every reading here is a LOGIN verdict plus the round structure that produced
#   it; nothing writes.  Leaving writes off keeps the export a constant.
#
# SLOTS, named without their braces because the renderer replaces every
# occurrence, comments included:
#
#   MAIN_ENV  main-scope nginx `env` directives, normally EMPTY.  nginx rebuilds
#             the worker environment from this list alone, and the captured
#             forwarded TGT is written into $TMPDIR falling back to /tmp
#             (deleg_capture.c:209-216) — so this slot is what turns "where does
#             a delegated user's TGT land" into a comparison between two
#             renderings rather than an assertion about one directory.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + OFF_PORT ABSENT_PORT
# METRICS_PORT.  Test-provided: PRINCIPAL KEYTAB (both must exist at
# config-parse time — `nginx -t` runs before the daemon starts) and MAIN_ENV.
# RELAY_PORT is in the ledger but not here: nothing in nginx binds it, it
# belongs to the in-process relay the test runs to count kXR_authmore rounds.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;
{MAIN_ENV}

events { worker_connections 64; }

stream {
    # --- delegation armed ----------------------------------------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_krb5_delegate  on;
        brix_access_log     {LOG_DIR}/access-on.log;
    }

    # --- the arm the corpus never wrote --------------------------------------
    server {
        listen {OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_krb5_delegate  off;
        brix_access_log     {LOG_DIR}/access-off.log;
    }

    # --- the directive unwritten: what every other krb5 server looks like ----
    server {
        listen {ABSENT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_access_log     {LOG_DIR}/access-absent.log;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

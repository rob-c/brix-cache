# GridFTP gateway + /metrics on one instance — for test_gridftp_metrics.py.
#
# The unified metrics zone is process-wide (one slab, created by
# ngx_stream_brix_postconfiguration), so an HTTP `brix_metrics` location and a
# stream `brix_gridftp` server in the SAME nginx read and write the same
# counters.  That is the whole point of this fixture: drive gsiftp verbs on the
# stream port, scrape {proto="gridftp"} on the HTTP port.
#
# Two gateways over two different exports:
#   {PORT}    — writable, the success/error paths.
#   {RO_PORT} — brix_gridftp_allow_write off, the security-negative path: a STOR
#               refused by the read-only gate must still book a `forbidden` row.
# They share the metrics zone, so the read-only refusals land in the same
# {proto="gridftp"} series the writable gateway feeds.
#
# Cleartext (no RFC 2228 GSI layer) so ftplib can drive it: the metric seam sits
# below the security layer and books the same rows either way.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided via extra_ports: HTTP_PORT RO_PORT.
# Test-provided via template_values: BIND_HOST RO_ROOT.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log {LOG_DIR}/access.log;
    client_body_temp_path {TMP_DIR};

    server {
        listen {BIND_HOST}:{HTTP_PORT};

        location /metrics { brix_metrics on; }
    }
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_gridftp on;
        brix_gridftp_export      {DATA_ROOT};
        brix_gridftp_allow_write on;
    }

    server {
        listen {BIND_HOST}:{RO_PORT};
        brix_gridftp on;
        brix_gridftp_export {RO_ROOT};
    }
}

# Pipeline-depth stream template for test_pipeline_depth.py (registry lifecycle).
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR
# PIPELINE_DEPTH.  Exercises the Phase-33 P1 runtime pipeline-depth directive
# (brix_pipeline_depth, was a fixed #define of 4; now merged/clamped to
# [BRIX_PIPELINE_DEPTH_MIN, MAX] and the out/read rings are sized to it).
# DATA_DIR must exist at config-parse time (the test seeds it under tmp_path).
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_pipeline_depth {PIPELINE_DEPTH};
    }
}

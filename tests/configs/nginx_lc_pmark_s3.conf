# SciTags pmark S3 server (registry lifecycle) for test_pmark_s3.py — phase-101 W1.
# Proves the brix_pmark* family, once moved to the http_common module, actually
# reaches the S3 protocol conf (it was dead there before: webdav preceded s3 in
# module order, so first-module-wins made S3's copy unreachable and SciTags on S3
# a silent no-op).
#
# Launcher-provided: LOG_DIR TMP_DIR PORT.
# Test-provided via template_values: BIND_HOST DATA_DIR FIREFLY_HOST FIREFLY_PORT
#   PMARK_SERVER  (pmark directives at server{} scope — new capability, or empty)
#   PMARK_LOC     (pmark directives at the S3 location scope, or empty)
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    # firefly collector address is set once at http{} scope so it is inherited by
    # the S3 location via the common module's adopt-at-merge (the W1 path).
    brix_pmark_firefly_dest {FIREFLY_HOST}:{FIREFLY_PORT};

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;
{PMARK_SERVER}
        location / {
            brix_s3 on;
            brix_storage_backend posix:{DATA_DIR};
            brix_s3_bucket testbucket;
            brix_allow_write on;
            brix_s3_max_keys 1000;
{PMARK_LOC}
        }
    }
}

# Phase-116 reverse-DNS template (registry lifecycle) for
# tests/test_phase116_reverse_dns.py.  Launcher-provided: LOG_DIR TMP_DIR
# DATA_ROOT PORT ROOT_PORT.  Test-provided: BIND_HOST RESOLV_CONF RESOLVER_EXTRA
# AUTHDB_PATH STREAM_EXTRA (stream-main knobs, e.g. brix_dns_cache_max).  The
# root:// server reverse-resolves every peer at accept time
# (brix_acc_resolve_hosts) through the brix_resolver policy, so the authdb `h`
# rule is decided by the stub nameserver's PTR record; /metrics exposes the
# reverse-cache and pending-fallback counters.
worker_processes 1;
thread_pool default threads=2 max_queue=256;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 256; }

stream {
    brix_kv_zone zone=authz:1m key=32 val=8;
    brix_resolver auto path={RESOLV_CONF} {RESOLVER_EXTRA};
{STREAM_EXTRA}

    server {
        listen {BIND_HOST}:{ROOT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_authdb_engine xrdacc;
        brix_authdb {AUTHDB_PATH};
        brix_acc_audit all;
        brix_acc_resolve_hosts on;
        brix_access_log {LOG_DIR}/access.log;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{PORT};
        location /metrics { brix_metrics on; }
    }
}

# brix_webdav_query_token at VALUE granularity (audit tranche 16, file 3;
# test_audit16c_query_token.py).  The flag is one of the seven whose BOTH arms
# are unwritten anywhere in the corpus: the ON behaviour is exercised only as
# the merge default, and OFF had never been configured at all.
#
# Three WebDAV locations, one server, one worker, one access log:
#   /on/       brix_webdav_query_token on   — the token transport enabled
#   /off/      brix_webdav_query_token off  — the token transport refused
#   /default/  the directive absent       — the merge default (config_merge.c:100)
#
# ONE listener is not a convenience here, it is the instrument.  The finding the
# file exists to pin is what reaches the ACCESS LOG when a URL carries a token
# the location will not honour, and two processes writing two logs could not be
# compared line for line.  All three locations share one JWKS, one issuer and
# one audience so that a verdict difference cannot be explained by anything but
# the flag.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST DATA_DIR JWKS ISSUER AUD.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # Exactly the three fields brix_http_redact_query_token() rewrites, and
    # nothing else: $request is r->request_line, $request_uri is
    # r->unparsed_uri, $args is r->args (http_headers.c:339-372, auth_token.c:
    # 206-213).  Logging all three makes "the token was redacted" an assertion
    # about the redactor rather than about whichever field one log format
    # happened to carry.
    log_format qtok '$status $request | $request_uri | $args';
    access_log {LOG_DIR}/access.log qtok;

    server {
        listen {BIND_HOST}:{PORT};

        # The transport enabled, written out.
        location /on/ {
            brix_webdav                on;
            brix_storage_backend       posix:{DATA_DIR};
            brix_webdav_auth           required;
            brix_token_jwks     {JWKS};
            brix_token_issuer   "{ISSUER}";
            brix_token_audience "{AUD}";
            brix_webdav_query_token      on;
        }

        # The transport refused — the arm nothing had ever configured.
        location /off/ {
            brix_webdav                on;
            brix_storage_backend       posix:{DATA_DIR};
            brix_webdav_auth           required;
            brix_token_jwks     {JWKS};
            brix_token_issuer   "{ISSUER}";
            brix_token_audience "{AUD}";
            brix_webdav_query_token      off;
        }

        # The directive absent: ngx_conf_merge_value(..., 1) makes this the same
        # configuration as /on/, and that identity is what the file asserts
        # rather than assumes.
        location /default/ {
            brix_webdav                on;
            brix_storage_backend       posix:{DATA_DIR};
            brix_webdav_auth           required;
            brix_token_jwks     {JWKS};
            brix_token_issuer   "{ISSUER}";
            brix_token_audience "{AUD}";
        }
    }
}

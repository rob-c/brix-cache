# FOUR stream fronts in ONE process — the companion to
# nginx_audit16ah_frm_hc_arms.conf and the half of that measurement in which the
# durable stage-request registry EXISTS (test_audit16ah_frm_hc_arms.py, 16th
# tranche).  The three FRM fronts below are the same three the other template
# carries, at their own ports, with one line added to the first.
#
# THE ONE LINE
#   brix_stage_registry_init() is reached only from brix_init_server_stage_registry
#   (process_server_init.c:132), whose gate is `frm.enable && control_dir.len > 0`.
#   The registry it initialises is a PROCESS SINGLETON (stage_request_registry.c:407,
#   `static brix_stage_registry_t srq_singleton`) and its init is first-wins by an
#   explicit early return on `reg->inited` (:412) that logs nothing.  So this file
#   asks the two questions one line in one server block decides for every other:
#
#     R_REG    the server that names a control dir.  Its brix_frm is live.
#     R_BLEED  brix_frm on, its own queue path, and NO control dir — exactly the
#              FRM_NOCTRL front of the other template, which is inert there.  Here
#              a sibling has stood the singleton up, so this front's `frm.enable &&
#              singleton() != NULL` is satisfied by a journal it never named and
#              cannot see in its own configuration.
#     R_SECOND brix_frm on with a control dir of its OWN, different from R_REG's.
#              One of the two directories gets a journal; the other gets nothing
#              and no diagnostic.
#     R_ABS    no brix_frm* line at all.  The control that proves the registry
#              reaches only servers that enabled the flag, not every server in the
#              process.
#
# R_REG carries `brix_frm_async_recall on` and R_BLEED carries the literal
# `brix_frm_async_recall off` — the arm no config in the tree writes.  Async
# recall parks a client on kXR_waitresp instead of kXR_wait and is reached only
# from the read-open residency gate (open_request_resolve.c:184), three gates deep:
# frm.enable, a live registry, and a VFS residency of NEARLINE.  A posix export is
# never NEARLINE, so on this plane the two arms are indistinguishable on the wire —
# which is the measurement, not a gap in it.
#
# Declaration order is load-bearing: R_REG is first so the first-wins init has a
# defined winner to be measured against.  Each front keeps its own export subtree
# for the same reason as in the other template — the journal records the LFN.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + the three extra ports.
# Test-provided: BIND_HOST QUEUE_DIR CTRL_DIR SECOND_CTRL_DIR.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    # --- the server that names the control dir -----------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/reg;
        brix_auth none;
        brix_frm on;
        brix_frm_queue_path {QUEUE_DIR}/reg.q;
        brix_frm_control_dir {CTRL_DIR};
        brix_frm_async_recall on;
        brix_frm_stage_ttl 30s;
    }

    # --- enabled, no control dir, a sibling's registry ---------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{BLEED_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/bleed;
        brix_auth none;
        brix_frm on;
        brix_frm_queue_path {QUEUE_DIR}/bleed.q;
        brix_frm_async_recall off;
        brix_frm_stage_ttl 30s;
    }

    # --- a second control dir, on a first-wins singleton -------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{SECOND_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/second;
        brix_auth none;
        brix_frm on;
        brix_frm_queue_path {QUEUE_DIR}/second.q;
        brix_frm_control_dir {SECOND_CTRL_DIR};
        brix_frm_stage_ttl 30s;
    }

    # --- no brix_frm* line at all ------------------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{ABS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/abs;
        brix_auth none;
    }
}

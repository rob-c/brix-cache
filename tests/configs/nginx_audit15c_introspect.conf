# WebDAV token introspection (RFC 7662) with a colocated mock IdP (registry
# lifecycle, test_audit15c_webdav_introspection.py).  Three policy locations on
# the main server: / uses the live IdP plus a revoke cache; /fc/ and /fo/ point
# at a dead introspector to pin fail-closed vs fail-open.  The IdP is a plain
# nginx server on {IDP_PORT} answering active:false only for the exact
# REVOKED_TOKEN value.  The introspection subrequest target must proxy_pass
# (completion requires r->upstream); a bare `return` in the internal location
# never counts as a completed introspection.
# Launcher-provided: LOG_DIR TMP_DIR PORT IDP_PORT.
# Test-provided: BIND_HOST DATA_DIR REVOKED_TOKEN.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    brix_kv_zone zone=rvk:1m key=32 val=8;

    server {
        listen {BIND_HOST}:{PORT};

        location = /_isp {
            internal;
            proxy_pass http://{BIND_HOST}:{IDP_PORT};
        }
        location = /_isp_dead {
            internal;
            proxy_pass http://127.0.0.1:1;
        }

        location /fc/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
            brix_token_introspect_loc /_isp_dead;
            brix_token_introspect_fail_open off;
        }
        location /fo/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
            brix_token_introspect_loc /_isp_dead;
            brix_token_introspect_fail_open on;
        }
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
            brix_token_introspect_loc /_isp;
            brix_token_introspect_ttl 60;
            brix_webdav_revoke_cache zone=rvk;
        }
    }

    server {
        listen {BIND_HOST}:{IDP_PORT};
        location = /_isp {
            default_type application/json;
            if ($arg_token = "{REVOKED_TOKEN}") {
                return 200 '{"active": false}';
            }
            return 200 '{"active": true}';
        }
    }
}

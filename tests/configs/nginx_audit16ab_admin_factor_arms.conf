# 16ab — the two arm-gaps of src/observability/dashboard/module.c, on ONE port.
#
# Both endpoints this file measures live at FIXED URIs (/brix/api/v1/admin/...
# and /brix/api/v1/vfs...), and both directives are location-scoped, so two
# planes cannot be two paths: they have to be two `server` blocks sharing one
# `listen` and separated by `server_name`.  Fourteen vhosts, one socket.
#
# Planes 1-10 vary brix_admin_require_both against the two factors it combines
# (a CIDR allowlist and a bearer secret), including the four cells where only
# ONE factor is configured.  192.0.2.0/24 is RFC 5737 TEST-NET-1 — it can never
# be the peer, so a plane that names it has a CONFIGURED allowlist that always
# fails, which is the only way to ask what the OR arm buys.
#
# Planes 11-14 vary brix_dashboard_vfs_browse, the table's only MAIN|SRV|LOC
# flag: the server writes `on` and a location takes it away again (the arm the
# corpus never wrote), against inheritance, against a bare-location `off`, and
# against the same feature on a dashboard with no password at all.
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;
    access_log off;

    # Plane 1 — both factors configured and both satisfiable, AND.
    server {
        listen {BIND_HOST}:{PORT};
        server_name both-on.arm;

        # The registered export the VFS census reports.  It lives here rather
        # than in its own vhost because the registry is process-wide: one
        # brix_storage_backend anywhere in the config is one export everywhere.
        location /data/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
        }
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_allow {ALLOW_CIDR};
            brix_admin_secret {SECRET_FILE};
            brix_admin_require_both on;
        }
    }

    # Plane 2 — the same two factors, OR.  The arm nothing had written.
    server {
        listen {BIND_HOST}:{PORT};
        server_name both-off.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_allow {ALLOW_CIDR};
            brix_admin_secret {SECRET_FILE};
            brix_admin_require_both off;
        }
    }

    # Plane 3 — the same two factors, directive absent: the merge default.
    server {
        listen {BIND_HOST}:{PORT};
        server_name both-absent.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_allow {ALLOW_CIDR};
            brix_admin_secret {SECRET_FILE};
        }
    }

    # Plane 4 — both configured, the CIDR factor unsatisfiable, AND.
    server {
        listen {BIND_HOST}:{PORT};
        server_name deny-on.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_allow 192.0.2.0/24;
            brix_admin_secret {SECRET_FILE};
            brix_admin_require_both on;
        }
    }

    # Plane 5 — the same, OR: the bearer alone is meant to be enough.
    server {
        listen {BIND_HOST}:{PORT};
        server_name deny-off.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_allow 192.0.2.0/24;
            brix_admin_secret {SECRET_FILE};
            brix_admin_require_both off;
        }
    }

    # Plane 6 — one factor only (CIDR), AND.
    server {
        listen {BIND_HOST}:{PORT};
        server_name allow-on.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_allow {ALLOW_CIDR};
            brix_admin_require_both on;
        }
    }

    # Plane 7 — one factor only (CIDR), OR.
    server {
        listen {BIND_HOST}:{PORT};
        server_name allow-off.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_allow {ALLOW_CIDR};
            brix_admin_require_both off;
        }
    }

    # Plane 8 — one factor only (secret), AND.
    server {
        listen {BIND_HOST}:{PORT};
        server_name secret-on.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_secret {SECRET_FILE};
            brix_admin_require_both on;
        }
    }

    # Plane 9 — one factor only (secret), OR.
    server {
        listen {BIND_HOST}:{PORT};
        server_name secret-off.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_admin_secret {SECRET_FILE};
            brix_admin_require_both off;
        }
    }

    # Plane 10 — neither factor configured: the API is not open, it is closed.
    server {
        listen {BIND_HOST}:{PORT};
        server_name none.arm;
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
        }
    }

    # Plane 11 — the SERVER-scope arm, inherited by a location that is silent.
    server {
        listen {BIND_HOST}:{PORT};
        server_name vfs-inherit.arm;
        brix_dashboard_vfs_browse on;
        location /brix/ {
            brix_dashboard on;
            brix_dashboard_password "{PASSWORD}";
        }
    }

    # Plane 12 — the same server arm, taken away again in the location.  This
    # is the arm the corpus never wrote in any form.
    server {
        listen {BIND_HOST}:{PORT};
        server_name vfs-locoff.arm;
        brix_dashboard_vfs_browse on;
        location /brix/ {
            brix_dashboard on;
            brix_dashboard_password "{PASSWORD}";
            brix_dashboard_vfs_browse off;
        }
    }

    # Plane 13 — `off` written where nothing turned it on: the merge default
    # under another name.
    server {
        listen {BIND_HOST}:{PORT};
        server_name vfs-bareoff.arm;
        location /brix/ {
            brix_dashboard on;
            brix_dashboard_password "{PASSWORD}";
            brix_dashboard_vfs_browse off;
        }
    }

    # Plane 14 — the feature on a dashboard with no password.  The endpoint's
    # own header says "always admin-auth ... never the anonymous tier"; this
    # plane is what asks whether that survives an unconfigured password.
    server {
        listen {BIND_HOST}:{PORT};
        server_name vfs-nopw.arm;
        location /brix/ {
            brix_dashboard on;
            brix_dashboard_vfs_browse on;
        }
    }
}

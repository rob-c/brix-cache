# cachemx cmsd:// cache data-server (test_cachemx_cmsd.py): an anonymous
# cache-fronted root:// server that registers with the cachemx redirector's cms
# listener, so redirected reads land here and bump BOTH the cache families and
# the manager's brix_cluster_* families.  Launcher-provided: LOG_DIR PORT
# TMP_DIR DATA_ROOT + METRICS_PORT.  Session-provided: BIND_HOST.
# Test-provided: CMS_PORT (the redirector's cms listener) CACHE_DIR.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_cache_store      posix:{CACHE_DIR};
        brix_cache_export     /;
        brix_cms_manager {BIND_HOST}:{CMS_PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
        brix_listen_port {PORT};
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

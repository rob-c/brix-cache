# Multi-manager CNS-emit data node — registry-lifecycle template for
# test_cms_multi_manager.py.  A writable data node in brix_cns emit mode logged
# into TWO stand-in managers: a namespace mutation must fan its CNS event out
# to EVERY live manager link, not just the first (split-brain prevention).
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: MANAGER_PORT_A MANAGER_PORT_B.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 64; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_cns emit;
        brix_cms_manager 127.0.0.1:{MANAGER_PORT_A} 127.0.0.1:{MANAGER_PORT_B};
        brix_cms_paths /;
        brix_cms_interval 1;
        brix_listen_port {PORT};
    }
}

# brix_fsoverload_stall postures (test_fsoverload_stall.py, registry lifecycle):
# a tiny brix_memory_budget so a second reader (while a first holds a large
# undrained read buffer) trips the budget-overload kXR_wait, whose seconds the
# directive sets. worker_processes 1 so both connections share one SHM budget.
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR
# STALL_LINE ("brix_fsoverload_stall <n>;"/"brix_max_delay <n>;" or empty).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
        brix_memory_budget 256k;
        {STALL_LINE}
    }
}

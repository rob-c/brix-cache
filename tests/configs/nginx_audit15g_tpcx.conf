# Native root:// TPC crossed with the three things the audit says it had never
# been crossed with (test_audit15g_tpc_crosses.py, registry lifecycle):
# brix_cache_store on either end (§C carry-over), a NON-POSIX storage backend
# (§C), and an xrdacc authdb (§B1.7).  Seven planes in one instance so a single
# pull driver reaches every combination and the ONLY difference between two
# runs is the port it was aimed at.
#
#   {PORT}         cache-tiered DESTINATION — a tier over the plain destination
#                  plane below, so a pull into it must traverse a cache store on
#                  the way to wherever the bytes come to rest.
#   {CTL_PORT}     plain posix DESTINATION: the control every other destination
#                  is attributed against, and the write-through target of the
#                  tier above.
#   {SRC_PORT}     plain posix SOURCE holding the seed object (read-only).
#   {CSRC_PORT}    cache-tiered SOURCE over {SRC_PORT}: serving a TPC read has
#                  to fill the store first, so the pull starts on a cold cache.
#   {HTTP_PORT}    DESTINATION whose storage backend is the http:// origin —
#                  the non-posix leg, where the "write" is an origin PUT rather
#                  than a file.
#   {ACC_PORT}  plain posix DESTINATION behind an xrdacc authdb.
#   {ASRC_PORT}    plain posix SOURCE behind an xrdacc authdb.
#
# Each tier carries its OWN brix_export: a composed tier registers in the VFS
# backend table under the export's canonical root, so two planes sharing a root
# would leave one registration answering both listeners.
#
# brix_listen_port is set on every plane — a native TPC rendezvous is addressed
# by port, and a server block that does not know its own listener cannot be
# named as one end of a transfer.
#
# worker_processes 4 because the tiered planes dial SIBLING listeners in this
# same instance and a native TPC pull rendezvouses through the SHM registry
# across workers — one worker would otherwise have to be the source, the
# destination and the fill of a single transfer at once.
#
# brix_tpc_allow_local is on everywhere: every source address here is a loopback
# literal, which is exactly what the directive exists to refuse by default.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ORIGIN_PORT SRC_PORT CSRC_PORT
# ASRC_PORT HTTP_PORT CTL_PORT ACC_PORT.
# Test-provided: BIND_HOST SRC_DIR CTL_DIR CDST_EXPORT CDST_STORE CSRC_EXPORT
# CSRC_STORE HDST_EXPORT ACC_DIR ACC_AUTHDB ASRC_DIR ASRC_AUTHDB.
worker_processes 4;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=4 max_queue=256;

stream {
    # --- cache-tiered destination (TPC x brix_cache_store, write side) ------
    server {
        listen                        {BIND_HOST}:{PORT};
        brix_listen_port              {PORT};
        brix_root                     on;
        brix_auth                     none;
        brix_allow_write              on;
        brix_tpc_allow_local          on;
        brix_export                   {CDST_EXPORT};
        brix_storage_backend          root://{BIND_HOST}:{CTL_PORT};
        brix_cache_store              posix:{CDST_STORE};
        brix_cache_export             /;
        brix_cache_eviction_threshold 99.9%;
        brix_cache_high_watermark     99.9%;
    }

    # --- plain posix destination (control, and the tier's origin) -----------
    server {
        listen               {BIND_HOST}:{CTL_PORT};
        brix_listen_port     {CTL_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_tpc_allow_local on;
        brix_storage_backend posix:{CTL_DIR};
    }

    # --- plain posix source -------------------------------------------------
    server {
        listen               {BIND_HOST}:{SRC_PORT};
        brix_listen_port     {SRC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_tpc_allow_local on;
        brix_storage_backend posix:{SRC_DIR};
    }

    # --- cache-tiered source (TPC x brix_cache_store, read side) ------------
    server {
        listen                        {BIND_HOST}:{CSRC_PORT};
        brix_listen_port              {CSRC_PORT};
        brix_root                     on;
        brix_auth                     none;
        brix_tpc_allow_local          on;
        brix_export                   {CSRC_EXPORT};
        brix_storage_backend          root://{BIND_HOST}:{SRC_PORT};
        brix_cache_store              posix:{CSRC_STORE};
        brix_cache_export             /;
        brix_cache_eviction_threshold 99.9%;
        brix_cache_high_watermark     99.9%;
    }

    # --- destination over a NON-POSIX (http://) backend ---------------------
    server {
        listen               {BIND_HOST}:{HTTP_PORT};
        brix_listen_port     {HTTP_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_tpc_allow_local on;
        brix_export          {HDST_EXPORT};
        brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
    }

    # --- destination behind an xrdacc authdb (audit B1.7) -------------------
    server {
        listen               {BIND_HOST}:{ACC_PORT};
        brix_listen_port     {ACC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_tpc_allow_local on;
        brix_storage_backend posix:{ACC_DIR};
        brix_authdb_engine   xrdacc;
        brix_authdb          {ACC_AUTHDB};
        brix_acc_audit    all;
    }

    # --- source behind an xrdacc authdb (audit B1.7) ------------------------
    server {
        listen               {BIND_HOST}:{ASRC_PORT};
        brix_listen_port     {ASRC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_tpc_allow_local on;
        brix_storage_backend posix:{ASRC_DIR};
        brix_authdb_engine   xrdacc;
        brix_authdb          {ASRC_AUTHDB};
        brix_acc_audit    all;
    }
}

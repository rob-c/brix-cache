# TPC-capable stream gateway — registry-lifecycle template for
# test_xrddiag_tpc_egress.py. A destination server able to ORIGINATE a native
# TPC pull (thread_pool + allow_write), so `xrddiag tpc-egress` can probe whether
# its egress guard refuses or permits an operator-named source.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: TPC_ALLOW_LOCAL — either "brix_tpc_allow_local on;" (loopback
#                targets permitted, so the self-test observes conn-refused/filtered)
#                or empty (default: loopback prohibited → the guard refuses).
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

thread_pool default threads=2 max_queue=256;
events { worker_connections 256; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        {TPC_ALLOW_LOCAL}
        brix_access_log {LOG_DIR}/brix_access.log;
    }
}

# Read-cache node that authenticates its INBOUND clients with native krb5 AND
# captures their forwarded TGT (brix_krb5_delegate on), then fills from a root://
# origin that itself requires krb5 (phase-70 §5.7 OUTBOUND leg).  For
# test_krb5_cache_origin_e2e.py.  This closes the last krb5 residual: proving the
# cache builds a RAW AP-REQ from the *captured* delegated TGT and presents it to a
# live stock-xrootd "&P=krb5" origin, end-to-end.
#
# Launcher-provided: LOG_DIR PORT.  Test-provided via template_values (dirs seeded
# under tmp_path, must exist at config-parse time): BIND_HOST PRINCIPAL KEYTAB
# CACHE_BACKEND CACHE_STORE.  KRB5_CONFIG is passed to the worker via env so both
# the inbound acceptor and the outbound AP-REQ builder reach the session realm.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;
thread_pool default threads=2;

# nginx strips the worker environment; the OUTBOUND krb5 leg's TGS-REQ needs the
# session realm's KDC location (KRB5_CONFIG) and the acceptor its keytab
# (KRB5_KTNAME) — inherit both from the launcher-set process env into the worker.
env KRB5_CONFIG;
env KRB5_KTNAME;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;

        # Inbound edge: native krb5 with two-round delegation capture.  The
        # captured forwardable TGT lands in a per-connection 0600 ccache that the
        # fill worker re-imports to authenticate the origin leg AS the user.
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab {KEYTAB};
        brix_krb5_delegate on;

        # Arm the krb5 EXCHANGE carry: with delegation != select AND
        # brix_backend_krb5_forwardable on, op_path.c binds the captured ccache +
        # derived origin SPN as an EXCHANGE live-cred (brix_vfs_deleg_set_krb5), so
        # the cred gate routes to the krb5 branch instead of the service credential.
        brix_backend_delegation exchange;
        brix_backend_krb5_forwardable on;

        # Outbound edge: fetch from the krb5-requiring root:// origin, caching
        # locally.  The origin advertises "&P=krb5,<spn>" at login, which (with the
        # carried EXCHANGE ccache) selects the raw-AP-REQ origin auth leg.
        brix_storage_backend {CACHE_BACKEND};
        brix_cache_store posix:{CACHE_STORE};
        brix_cache_export /;
    }
}

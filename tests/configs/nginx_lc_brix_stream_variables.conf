# $brix_session_* — template for test_brix_stream_variables.py (phase-106 W2).
#
# Launcher-provided: LOG_DIR PORT BIND_HOST DATA_DIR.
#
# The point: root:// sessions become loggable with nginx's OWN stream
# access_log.  Before phase-106 the stream plane registered no variables at
# all, so this log_format could not be written.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    log_format brixsess 'proto=$brix_protocol auth=$brix_session_auth '
                        'user=$brix_session_user vo=$brix_session_vo '
                        'tls=$brix_session_tls out=$brix_session_bytes_out '
                        'in=$brix_session_bytes_in';
    access_log {LOG_DIR}/brixsess.log brixsess;

    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
    }
}

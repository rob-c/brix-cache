# Parse-tier scaffold for the six pmark flags (audit tranche 16, file 7;
# test_audit16g_pmark_flags.py §G).
#
# Never started — it exists so `nginx -t` can be asked about a single line.  It
# writes none of the six itself: a scaffold that already carried one would make
# every negative about that directive ambiguous, because a second occurrence is
# diagnosed as a duplicate and that error arrives before the one a value or arity
# negative is reaching for.
#
# The six are declared ONCE (directives.h's BRIX_PMARK_DIRECTIVES X-macro) and
# instantiated in two command tables with two different scopes:
#
#   NGX_HTTP_LOC_CONF     webdav/directives_zones.h:75  → a WebDAV/S3 location
#   NGX_STREAM_SRV_CONF   root/stream/directives_pmark.h:10 → a stream server
#
# so a placement negative has to distinguish "wrong http context" from "unknown
# on this plane" from "right context, other plane".  Five slots, named here
# WITHOUT their braces — the renderer replaces every occurrence of a placeholder,
# comments included, and a multi-line value spliced into a comment turns the tail
# of that comment into configuration:
#
#   KNOBS         inside the WebDAV location — the http plane's only legal
#                 placement (NGX_HTTP_LOC_CONF).
#   SRV_KNOBS     inside the http server, outside any location.
#   HTTP_KNOBS    inside http {}, outside any server.
#   OUTER         main context, outside http {} and stream {} entirely.
#   STREAM_KNOBS  inside a stream server — the root:// plane, where the same six
#                 names ARE legal (NGX_STREAM_SRV_CONF), so this slot carries the
#                 positives that prove the X-macro reaches both tables.
#   STREAM_MAIN   inside stream {}, outside any server.
#
# The stream listen has to differ from the http one because a repeated
# address/port pair is refused by ngx_stream_core_listen before the directive
# under test is reached.  `nginx -t` never binds either.
#
# Test-provided: PORT STREAM_PORT LOG_DIR DATA.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

{HTTP_KNOBS}    server {
        listen {PORT};
{SRV_KNOBS}
        location /probe/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA};
            brix_webdav_auth     none;
{KNOBS}        }
    }
}

stream {
{STREAM_MAIN}    server {
        listen {STREAM_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA};
{STREAM_KNOBS}    }
}

# CMS parity-wave manager — registry-lifecycle template for
# test_cms_parity_wave.py.  TWO stream blocks sharing one worker + one SHM
# registry: the root:// redirector face (kXR_locate probes observe selection
# verdicts; policy directives via {CMS_EXTRA}) and the CMS server face fake
# Python data nodes register into ({CMSSRV_EXTRA} carries the CMS-server-side
# policies: max_direct, blacklist/whitelist files).
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided: CMS_PORT CMS_EXTRA CMSSRV_EXTRA (either may be empty).
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    # root:// redirector face — clients locate here.
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_manager_mode on;
        brix_listen_port {PORT};
        {CMS_EXTRA}
    }

    # CMS server face — fake data nodes register here.
    server {
        listen 127.0.0.1:{CMS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_server on;
        brix_cms_server_interval 1;
        {CMSSRV_EXTRA}
    }
}

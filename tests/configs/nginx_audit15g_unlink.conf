# Unlink racing an active transfer (test_audit15g_unlink_during_transfer.py,
# registry lifecycle) — audit §C, carried from the 2026-08-04 pass: "unlink
# during active transfer (no test)".  Every existing mid-transfer test is a
# reload or a failover, so the case where the OBJECT rather than the SERVER
# disappears under an open handle has never been driven.
#
# Two planes, because the object can be removed at two different layers and the
# server's defence is not the same one:
#
#   {PORT}        a plain posix export.  The removal is of the exported file
#                 itself; whether the read survives is a question about the
#                 handle's fd, and whether the NEXT opener is refused is a
#                 question about the namespace.
#   {CACHE_PORT}  a tier (brix_storage_backend root:// + brix_cache_store) over
#                 the origin instance.  Here the removal is of the CACHED COPY
#                 under the store, with the origin still holding the truth —
#                 so the read may legitimately survive by fd, by re-fill, or
#                 not at all, and the only unacceptable answer is a short read
#                 reported as a complete one.
#
# The cache plane carries its own brix_export: the composed tier registers in
# the VFS backend table under the export's canonical root, so sharing a root
# with the direct plane would make one registration answer both listeners.
#
# worker_processes 2 because the cache plane dials the origin instance and the
# fill runs on a thread-pool task while the direct plane keeps serving.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + CACHE_PORT.  Test-provided:
# BIND_HOST ORIGIN_PORT DIRECT_EXPORT CACHE_EXPORT CACHE_STORE.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=2 max_queue=256;

stream {
    # --- plain posix export -------------------------------------------------
    server {
        listen               {BIND_HOST}:{PORT};
        brix_root            on;
        brix_auth            none;
        brix_export          {DIRECT_EXPORT};
    }

    # --- read-cache tier over the origin instance ---------------------------
    server {
        listen               {BIND_HOST}:{CACHE_PORT};
        brix_root            on;
        brix_auth            none;
        brix_export          {CACHE_EXPORT};
        brix_storage_backend root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store     posix:{CACHE_STORE};
        brix_cache_export    /;
    }
}

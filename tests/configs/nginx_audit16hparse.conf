# Parse-tier scaffold for the six shared-http flags (audit tranche 16, file 8;
# test_audit16h_shared_http_flags.py, sections B and G).
#
# Never started — it exists so `nginx -t` can be asked about a single line, in a
# single scope, with nothing else in the file that could answer instead.  It
# writes none of the six itself: a scaffold that already carried one would make
# every negative about that directive ambiguous, because a second occurrence is
# diagnosed as a duplicate and that error arrives before the one a value or arity
# negative is reaching for.
#
# WHAT THE SLOTS DISCRIMINATE
#   All six are declared with BRIX_HTTP_ALL_CONF, i.e.
#   NGX_HTTP_MAIN_CONF|NGX_HTTP_SRV_CONF|NGX_HTTP_LOC_CONF (http_common.c:61),
#   so on the http plane there are THREE legal placements and no wrong one short
#   of leaving http{} altogether.  FOUR of the six are ALSO declared on the
#   stream plane — brix_verify_write and brix_read_only in
#   root/stream/directives_tpc.h:228 and :249, brix_backend_krb5_forwardable and
#   brix_session_log in root/stream/module.c:366 and :429 — while brix_compress
#   and brix_strict_security exist on the http plane only, so a stream placement
#   is the slot that tells the two tables apart: for four of the six it is legal
#   inside a stream server and refused at stream{} level, and for the other two
#   the name is refused in either.  Every refusal here is "directive is not
#   allowed here", never "unknown directive": nginx searches every module's
#   command table before it checks the context, so a misplaced brix_compress is
#   diagnosed by the http table it belongs to.
#
#   Six slots, named here WITHOUT their braces — the renderer replaces every
#   occurrence of a placeholder, comments included, and a multi-line value
#   spliced into a comment turns the tail of that comment into configuration:
#
#   KNOBS         inside the WebDAV location  (NGX_HTTP_LOC_CONF)
#   SRV_KNOBS     inside the http server, outside any location (NGX_HTTP_SRV_CONF)
#   HTTP_KNOBS    inside http{}, outside any server (NGX_HTTP_MAIN_CONF)
#   OUTER         main context, outside http{} and stream{} entirely
#   STREAM_KNOBS  inside a stream server — legal for four of the six
#   STREAM_MAIN   inside stream{}, outside any server
#
#   SUBJECT       a whole extra SERVER, for section B.  brix_strict_security has
#                 no runtime behaviour at all: its entire effect is to promote
#                 brix_shared_security_gate's [warn] to [emerg] at config time
#                 (webdav/config_merge.c:400, s3/module.c:121,
#                 dashboard/module.c:216), so the flag can only be measured
#                 against a configuration that is already insecure.  The three
#                 subjects — an anonymous writable WebDAV export, an anonymous S3
#                 bucket, an anonymous dashboard — are rendered by the test into
#                 this slot, together with the flag under test when the arm is
#                 the location- or server-level one, because both of those have
#                 to sit inside the offending location's own scopes.
#
#                 It is a whole server and not a location because brix_s3 and
#                 brix_webdav may not share a listen port ("one brix protocol per
#                 port"), and /probe/ below is a WebDAV location: an S3 subject
#                 dropped beside it is refused by the co-residency check before
#                 the security gate is ever consulted.
#
# The plain /probe/ location is deliberately NOT insecure (no brix_allow_write),
# so a section-B run sees exactly one advisory and it belongs to SUBJECT.
#
# WHY TWO PLACEHOLDER PORTS COVER THREE SERVERS
#   `nginx -t` never binds, and at config time an http server and a stream server
#   may name the same port — measured, both orders — so SUBJ_PORT and STREAM_PORT
#   are the same placeholder.  The two HTTP servers must differ from each other,
#   because a repeated http address/port pair with no distinguishing server_name
#   is a duplicate-default-server error, and the stream port must differ from any
#   other stream listen for the same reason inside ngx_stream_core_listen.
#
# Test-provided: PORT SUBJ_PORT STREAM_PORT LOG_DIR DATA.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

{HTTP_KNOBS}    server {
        listen {PORT};
{SRV_KNOBS}
        location /probe/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA};
            brix_webdav_auth     none;
{KNOBS}        }
    }

{SUBJECT}}

stream {
{STREAM_MAIN}    server {
        listen {STREAM_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA};
{STREAM_KNOBS}    }
}

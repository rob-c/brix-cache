# EIGHT httpguard faces in ONE process — the measuring half of the two
# `net/httpguard` flags whose unwritten arm is the one an operator reaches for
# (test_audit16ag_guard_arms.py, 16th tranche):
#
#   brix_guard                     `on` in eleven configs; `off` in NONE.  Every
#                                  "the guard is not running" control in the tree
#                                  is rendered as ABSENCE — the same shape file 32
#                                  found in the OCI lane, on the WAF this time.
#   brix_guard_default_signatures  `off` in configs/nginx_guard_knobs.conf, which
#                                  is the ONE place the token appears; `on` — the
#                                  arm that carries the built-in scanner set, and
#                                  the merge default (module.c:366) — in NONE.
#
# Both are NGX_HTTP_MAIN_CONF|NGX_HTTP_SRV_CONF|NGX_HTTP_LOC_CONF (module.c:29,43)
# and both go through ngx_conf_set_flag_slot.  `enable` merges to 0 and
# `default_sigs` merges to 1, so the two flags are not symmetric: writing `off`
# for the first says what absence already said, and writing `on` for the second
# says what the merge already said — which is exactly why neither has ever been
# written, and exactly why the arms are worth measuring rather than assuming.
#
# WHY EIGHT SERVERS AND NOT EIGHT LOCATIONS
#   The guard classifies `r->uri` (guard_http_req.c:118), not the location-relative
#   remainder, and the grammar's namespace prefixes are compared against the head
#   of that URI (guard_classify.c:106-113).  A matrix built out of sibling
#   locations would therefore measure the location prefix as much as the arm.
#   One `location /` per listener keeps every probe root-anchored, so the only
#   variable between two faces is the line this file is about.
#
#   PORT         G_OFF    — `brix_guard off;` beside a COMPLETE knob set: the
#                           profile, the bounce status and an audit log that the
#                           `on` faces prove are load-bearing.  The never-written
#                           token, and the one face that says what `off` costs.
#   ABS_PORT     G_ABSENT — byte for byte the same server with the `brix_guard`
#                           line deleted.  The control: `off` and its omission
#                           reach enable=0 by two different routes (an explicit 0
#                           and ngx_conf_merge_value's default), and nothing in
#                           the tree had ever compared them.
#   ON_PORT      G_ON     — the same knobs and `brix_guard on;`, with
#                           `brix_guard_default_signatures` UNWRITTEN.  The
#                           control for the second flag: this is what the merge
#                           default builds.
#   DEFON_PORT   G_DEFON  — `brix_guard_default_signatures on;` written out, plus
#                           an operator signature.  If this face and G_ON differ,
#                           the merge default is not what it says it is.
#   DEFOFF_PORT  G_DEFOFF — the same server with `off`, which is the arm the
#                           corpus does write.  The built-in scanner set is gone
#                           and the operator's own signature and the profile
#                           grammar are not — three sources of a bounce, and this
#                           face is what separates them.
#   BARE_PORT    G_BARE   — `brix_guard on; brix_guard_default_signatures off;`
#                           and NOTHING else.  guard_ruleset_load_profile("")
#                           takes the unknown-profile branch (guard_ruleset.c:180)
#                           and drops enforce_grammar to 0, so this ruleset has no
#                           signatures and no grammar: a guard that is enabled,
#                           reports enabled, and cannot bounce anything.
#   SRVON_PORT   G_SRVON  — `brix_guard on` at SERVER level.  `location /`
#                           inherits it; `location /quiet/` writes the
#                           never-written `off` and is the only way a child can
#                           opt out of a server-wide guard.
#   SRVOFF_PORT  G_SRVOFF — the mirror: `brix_guard off` at server level with
#                           `location /loud/` turning it back on.  Between the two
#                           servers, both directions of the inheritance are
#                           written, which no config in the tree does at all.
#
# ONE AUDIT LOG PER FACE, all under {LOG_DIR}.  `brix_guard_audit_log` opens its
# file at parse time (module.c, ngx_conf_open_file) with no reference to
# `enable`, so the two disabled faces get a file that is created and never
# written — which is a measurement this file makes, and the reason each face
# needs a log of its own rather than a shared one.
#
# `brix_guard_bounce_status 403` everywhere: 444 is the default and is nginx's
# close-without-response, which on the wire is indistinguishable from a worker
# that died.  Which status a bounce carries is the 15th tranche's subject
# (test_audit15_guard_knobs.py); holding it constant here keeps this file's
# variable to one.
#
# A LOCAL static root, as nginx_guard_knobs.conf does and the proxying guard
# suites do not: a request that PASSES is then observable as 200 (seeded) or 404
# (absent, and a `signal=notfound` audit line), with no stub backend's shared hit
# counter to serialise the whole file against.
#
# worker_processes 1 so an audit line written by the request just answered is the
# same worker's, and a poll for it cannot be satisfied by a sibling.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the seven extra ports.
# Test-provided: BIND_HOST.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    access_log off;

    # --- the never-written token -------------------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_guard               off;
            brix_guard_profile       xrdhttp;
            brix_guard_bounce_status 403;
            brix_guard_audit_log     {LOG_DIR}/guard-off.log;
            root {DATA_ROOT};
        }
    }

    # --- the same server with nothing written ------------------------------
    server {
        listen {BIND_HOST}:{ABS_PORT};
        location / {
            brix_guard_profile       xrdhttp;
            brix_guard_bounce_status 403;
            brix_guard_audit_log     {LOG_DIR}/guard-absent.log;
            root {DATA_ROOT};
        }
    }

    # --- the guard running, second flag left to the merge -------------------
    server {
        listen {BIND_HOST}:{ON_PORT};
        location / {
            brix_guard               on;
            brix_guard_profile       xrdhttp;
            brix_guard_bounce_status 403;
            brix_guard_audit_log     {LOG_DIR}/guard-on.log;
            root {DATA_ROOT};
        }
    }

    # --- the built-in scanner set, asked for out loud -----------------------
    server {
        listen {BIND_HOST}:{DEFON_PORT};
        location / {
            brix_guard                    on;
            brix_guard_default_signatures on;
            brix_guard_profile            xrdhttp;
            brix_guard_bounce_status      403;
            brix_guard_signature          /custom-probe;
            brix_guard_audit_log          {LOG_DIR}/guard-defon.log;
            root {DATA_ROOT};
        }
    }

    # --- the arm the corpus writes ------------------------------------------
    server {
        listen {BIND_HOST}:{DEFOFF_PORT};
        location / {
            brix_guard                    on;
            brix_guard_default_signatures off;
            brix_guard_profile            xrdhttp;
            brix_guard_bounce_status      403;
            brix_guard_signature          /custom-probe;
            brix_guard_audit_log          {LOG_DIR}/guard-defoff.log;
            root {DATA_ROOT};
        }
    }

    # --- enabled, and holding no rule at all --------------------------------
    server {
        listen {BIND_HOST}:{BARE_PORT};
        location / {
            brix_guard                    on;
            brix_guard_default_signatures off;
            brix_guard_bounce_status      403;
            brix_guard_audit_log          {LOG_DIR}/guard-bare.log;
            root {DATA_ROOT};
        }
    }

    # --- server-level on, one location opting out ---------------------------
    server {
        listen {BIND_HOST}:{SRVON_PORT};
        brix_guard               on;
        brix_guard_profile       xrdhttp;
        brix_guard_bounce_status 403;
        brix_guard_audit_log     {LOG_DIR}/guard-srvon.log;

        location / {
            root {DATA_ROOT};
        }
        location /quiet/ {
            brix_guard off;
            root {DATA_ROOT};
        }
    }

    # --- server-level off, one location opting in ---------------------------
    server {
        listen {BIND_HOST}:{SRVOFF_PORT};
        brix_guard               off;
        brix_guard_profile       xrdhttp;
        brix_guard_bounce_status 403;
        brix_guard_audit_log     {LOG_DIR}/guard-srvoff.log;

        location / {
            root {DATA_ROOT};
        }
        location /loud/ {
            brix_guard on;
            root {DATA_ROOT};
        }
    }
}

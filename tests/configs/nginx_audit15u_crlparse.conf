# Parse-tier scaffold for brix_crl_mode (test_audit15u_crl_mode.py §E/§F).
#
# The running instance lives in nginx_audit15u_crlmode.conf; this one exists
# only for `nginx -t`.  It differs from that template in the one way that
# matters: it writes NO brix_auth line of its own, so a case can supply
# `brix_auth gsi` plus a full PKI in the server slot below without colliding
# with a fixed one (nginx refuses a duplicate directive before it ever reaches
# the value under test, and a "is duplicate" parse error would look exactly
# like the rejection a negative case is trying to prove).
#
# Two slots, named here without their braces because the renderer substitutes
# every occurrence of a placeholder, comments included, and a multi-line value
# spliced into a comment turns its own tail into live config:
#
#   KNOBS         server-level lines — the token under test, and for the
#                 startup-warning cases the whole GSI block around it.
#   STREAM_EXTRA  stream-level lines, for the placement negatives: the
#                 directive is NGX_STREAM_SRV_CONF, so a line here must be
#                 refused with "directive is not allowed here".
#
# Never started: `nginx -t` does not bind, so the listen port is a placeholder.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

stream {
{STREAM_EXTRA}    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
{KNOBS}    }
}

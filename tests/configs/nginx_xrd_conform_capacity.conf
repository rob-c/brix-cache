# Phase-118 WRT-007: deterministic quota and backend-capacity endpoints.
# The first pblock store has ample backend capacity but an OSS max-size policy;
# the second is a POSIX export where the probe makes an unsatisfiable 1 PiB
# reserve declaration.  This produces distinct kXR_overQuota and kXR_NoSpace
# answers without filling the host disk.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend pblock://{QUOTA_ROOT}?quota=8m;
        brix_auth none;
        brix_allow_write on;
        brix_oss_maxsize 64k;
    }

    server {
        listen {BIND_HOST}:{CAPACITY_PORT};
        brix_root on;
        brix_storage_backend posix:{CAPACITY_ROOT};
        brix_auth none;
        brix_allow_write on;
    }
}

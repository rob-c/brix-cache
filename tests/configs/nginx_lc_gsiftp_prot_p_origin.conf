# phase-115 W5.1 — the two GridFTP ORIGINS the PROT P fronts reach.
#
# A SEPARATE nginx instance from the fronts, and deliberately so.  The fronts'
# gsiftp driver speaks a blocking FTP conversation, and only the READ path is
# moved off the event loop (BRIX_SD_CAP_BLOCKING_WIRE →
# brix_http_serve_offload_remote).  A PUT still runs its staged
# open/write/commit inline on the worker, so a front whose origin lives in the
# SAME single worker cannot upload: the loop the write is blocking is the loop
# the origin needs to answer on.  Co-locating them would be testing that
# deadlock rather than PROT P.  The read-path half of this is pinned on purpose
# in test_phase115_gsiftp_offload_wire.py, which co-locates them and requires
# the GET to succeed.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_gridftp on;
        brix_export {ORIGIN_ROOT};
        brix_allow_write on;
        brix_gridftp_gsi on;
        brix_certificate {SERVER_CERT};
        brix_certificate_key {SERVER_KEY};
        brix_trusted_ca {CA_DIR};
    }
    server {
        listen {BIND_HOST}:{PLAIN_ORIGIN_PORT};
        brix_gridftp on;
        brix_export {ORIGIN_ROOT};
        brix_allow_write on;
    }
}

# brix_webdav_tpc_credential_forward on/off, driven under REAL bearer auth
# (test_audit15f_tpc_cred_forward.py, registry lifecycle) — audit §A2: the
# directive had zero occurrences anywhere in the tree.
#
# The toggle only has anything to forward when the request actually
# authenticated with a bearer: webdav_tpc_forward_user_bearer() reads
# rctx->bearer_token (tpc_copy.c:270), which only webdav_verify_bearer_token()
# ever sets (auth_token.c:332).  So every location here runs
# `brix_webdav_auth required` against a scitokens.cfg issuer registry — an
# `auth none` location would make both settings look identical.
#
#   /fwd/    default (ON): the caller's own JWT is presented to the pull source
#   /nofwd/  brix_webdav_tpc_credential_forward off: the source leg is
#            anonymous — the user's token must not leave this host
#
# Both planes have their own export root so a COPY landing on the wrong one is
# a missing file, not a coincidence.  brix_tpc_allow_local: the mock
# source is on loopback, which the TPC egress guard refuses by default.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST EXPORT_ROOT CA_PEM CADIR TOKEN_CFG.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

thread_pool default threads=4 max_queue=256;
events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        location /fwd/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/fwd;
            brix_webdav_auth            required;
            brix_trusted_ca_dir           {CADIR};
            brix_token_config    {TOKEN_CFG};
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_tpc_allow_local on;
            brix_webdav_tpc_cafile      {CA_PEM};
        }

        location /nofwd/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/nofwd;
            brix_webdav_auth            required;
            brix_trusted_ca_dir           {CADIR};
            brix_token_config    {TOKEN_CFG};
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_tpc_allow_local on;
            brix_webdav_tpc_cafile      {CA_PEM};
            brix_webdav_tpc_credential_forward off;
        }
    }
}

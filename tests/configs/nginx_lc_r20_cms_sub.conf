# 2.0 readiness F12 — the SUB manager: its own redirector + CMS listener for the
# leaf, and a self-registering data-server face that joins the META manager's
# CMS at {META_CMS_PORT} advertising the redirector port ({PORT}).
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 128; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_manager_mode on;
    }
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server on;
    }
    server {
        listen {BIND_HOST}:{SELF_REGISTER_PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend posix:{DATA_ROOT};
        brix_cms_manager {BIND_HOST}:{META_CMS_PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
        brix_listen_port {PORT};
    }
}
http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

# Phase-116 W5.2 mirror template (registry lifecycle) for
# tests/test_phase116_mirror_failure_reresolve.py.  Launcher-provided: LOG_DIR
# TMP_DIR DATA_ROOT PORT ROOT_PORT.  Test-provided: BIND_HOST RESOLV_CONF
# RESOLVER_EXTRA RETRY MIRROR_TARGET MIRROR_TIMEOUT.  MIRROR_TARGET is either a
# stub-controlled hostname or an IP literal, so one template covers both the
# runtime-resolved shadow and the literal that must never arm a retry.
worker_processes 1;
thread_pool default threads=2 max_queue=256;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 256; }

stream {
    brix_resolver auto path={RESOLV_CONF} {RESOLVER_EXTRA};
    brix_dns_retry {RETRY};

    server {
        listen {BIND_HOST}:{ROOT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_mirror_url {MIRROR_TARGET};
        brix_mirror_timeout {MIRROR_TIMEOUT};
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{PORT};
        location /metrics { brix_metrics on; }
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_dashboard_password "p116-dashboard";
            brix_dashboard_anonymous on;
        }
    }
}

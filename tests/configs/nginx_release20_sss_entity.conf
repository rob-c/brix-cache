# 2.0 F9 lab: the SSS v2 entity fields (release-2.0-readiness F9).
#
# One shared secret, three keytabs, three faces — so every difference below is
# attributable to the keytab policy and nothing else:
#
#   PORT           u:anybody g:anygroup, brix_sss_getcreds on   the full entity
#                  (name, VO, role, groups, endorsements, proxied credential)
#   PINNED_PORT    u:brixpinned g:brixpinned                    the keytab pins
#                  the identity, so every client-asserted VO/role/endorsement
#                  is dropped and the mapped user is the keytab's
#   NOCREDS_PORT   u:anybody g:anygroup, brix_sss_getcreds off (the default)
#                  a proxied credential is dropped at the parser
#
# Launcher-provided: LOG_DIR PORT PINNED_PORT NOCREDS_PORT.
# Test-provided: BIND_HOST SRC_DIR PINNED_DIR NOCREDS_DIR ANY_KEYTAB
# PINNED_KEYTAB (absolute paths; the keytabs must exist at config-parse time).
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events {
    worker_connections 128;
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{SRC_DIR};
        brix_auth sss;
        brix_sss_keytab {ANY_KEYTAB};
        brix_sss_getcreds on;
    }

    server {
        listen {BIND_HOST}:{PINNED_PORT};
        brix_root on;
        brix_storage_backend posix:{PINNED_DIR};
        brix_auth sss;
        brix_sss_keytab {PINNED_KEYTAB};
        brix_sss_getcreds on;
    }

    server {
        listen {BIND_HOST}:{NOCREDS_PORT};
        brix_root on;
        brix_storage_backend posix:{NOCREDS_DIR};
        brix_auth sss;
        brix_sss_keytab {ANY_KEYTAB};
    }
}

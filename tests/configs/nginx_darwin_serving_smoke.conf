# Native Darwin verifier fixture. The verifier substitutes {SOCKET} and {EXPORT}.
worker_processes 1;
error_log stderr notice;
pid logs/nginx.pid;

events {
    worker_connections 16;
}

http {
    access_log off;

    server {
        listen unix:{SOCKET};

        location / {
            brix_webdav on;
            brix_storage_backend posix:{EXPORT};
            brix_webdav_auth none;
            brix_allow_write off;
        }
    }
}

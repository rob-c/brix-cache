# Phase-116 runtime-DNS template (registry lifecycle) for tests/test_phase116_*.py.
# Launcher-provided: LOG_DIR TMP_DIR DATA_ROOT PORT ROOT_PORT.  Test-provided:
# BIND_HOST RESOLV_CONF RESOLVER_EXTRA RETRY MANAGER_HOST MANAGER_PORT
# STREAM_EXTRA HTTP_EXTRA.  The stream server carries the start-safe
# brix_cms_manager hostname under test; the http server exposes /metrics and the
# anonymous dashboard (its "dns" panel) so the tests read the driver's own view.
worker_processes 1;
thread_pool default threads=2 max_queue=256;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 256; }

stream {
    brix_resolver auto path={RESOLV_CONF} {RESOLVER_EXTRA};
    brix_dns_retry {RETRY};

    server {
        listen {BIND_HOST}:{ROOT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_manager {MANAGER_HOST}:{MANAGER_PORT};
{STREAM_EXTRA}
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    brix_resolver auto path={RESOLV_CONF} {RESOLVER_EXTRA};
    brix_dns_retry {RETRY};
{HTTP_EXTRA}

    server {
        listen {BIND_HOST}:{PORT};
        location /metrics { brix_metrics on; }
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_dashboard_password "p116-dashboard";
            brix_dashboard_anonymous on;
        }
    }
}

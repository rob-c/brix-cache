# Self-contained `unix` (client-asserted UNIX name) auth template for
# test_unix_auth_wire.py (registry lifecycle).
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST TRUST_REMOTE.
#
# BIND_HOST is a parameter here because the loopback trust gate is decided from
# the PEER address: an instance bound to a non-loopback local address is dialled
# with a non-loopback source, which is the only way to exercise the
# brix_unix_trust_remote off/on boundary without privileges.
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth unix;
        brix_unix_trust_remote {TRUST_REMOTE};
    }
}

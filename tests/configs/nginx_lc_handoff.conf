worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
        {HANDOFF_DIRECTIVE}
        brix_http_handoff_connect_timeout 500ms;
        brix_http_handoff_idle_timeout 500ms;
    }
}

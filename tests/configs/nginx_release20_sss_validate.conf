# 2.0 F9 grammar probe: one stream server whose SSS lines are supplied by the
# test; rendered for `nginx -t` only, never started.  The SSS placeholder below
# carries a whole line of its own (indent and trailing newline included), so it
# never belongs inside a comment: there it would end the comment early and hand
# nginx the remainder of the sentence as a directive.
error_log {LOG_DIR}/error.log;
pid {LOG_DIR}/nginx.pid;

events {
    worker_connections 64;
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
{SSS_LINES}    }
}

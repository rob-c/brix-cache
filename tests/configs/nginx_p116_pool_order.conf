# Phase-116 parse-only template: an explicit `thread_pool default` declared
# AFTER the block that already asked for a DNS backend.
# Test-provided: LOG_DIR DATA_ROOT PORT ROOT_PORT BIND_HOST.
#
# WHY this shape exists.  brix_dns_backend_prepare() calls
# ngx_thread_pool_add(cf, NULL) from a merge handler, i.e. while http{} is
# still being processed.  If that call left the pool's `threads` set, the
# operator's own `thread_pool default threads=N;` further down the file would
# hit nginx's `if (tp->threads) -> "duplicate thread pool"` and the server
# would refuse to start — a hostname-driven startup failure, which is the one
# outcome phase 116 exists to prevent.  It does not set threads, so this file
# must parse clean; if the helper ever starts pre-setting them, this template
# is what reddens.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{ROOT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth host;
    }
}

http {
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_storage_backend posix:{DATA_ROOT};
            brix_acc_resolve_hosts on;
        }
    }
}

# Deliberately last: the merge handlers above have already registered the
# default pool by the time this line is parsed.
thread_pool default threads=2 max_queue=128;

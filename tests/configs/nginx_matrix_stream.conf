# Generic matrix instance, stream plane — ONE template behind every
# (root:// × auth × tls × backend) cell.  Rendered by tests/matrix_layer.py:
# the placeholders below are whole directive blocks, not single values, so a
# cell that needs no TLS or no credential collapses them to nothing rather than
# needing a template of its own.
#
# They are STORAGE (brix_export or brix_storage_backend), AUTH (brix_auth plus
# that mechanism's directives) and TLS (brix_tls plus the service certificate,
# or nothing at all).  Their names are spelled without braces here on purpose:
# a comment that quotes its own placeholder gets substituted like any other
# occurrence, and a multi-line block then lands at main scope.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.  Session-provided: BIND_HOST.
# See docs/refactor/testsuite-combinatorial-coverage-audit-2026-08-04.md item 19.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
{STORAGE}
{AUTH}
{TLS}
    }
}

# phase-115 W5.1 — the GridFTP PROT P (protected) outbound data channel.
#
# PROT P puts TLS on the DATA socket presenting the same X.509 proxy as the
# control channel, and pins the data peer's leaf DN to the control channel's
# identity.  Two GridFTP origins and four WebDAV fronts, so every claim is a
# difference between two fronts that are otherwise identical:
#
#   PORT           `prot=p` over the GSI origin                 (the subject)
#   CLEAR_PORT     the SAME origin, no params — PROT C          (the control)
#   REFUSE_PORT    `prot=p` over an origin with NO security layer: must fail
#                  closed, never move the bytes in the clear instead
#   PLAIN_OK_PORT  that same unsecured origin over plain ftp://, which DOES
#                  serve the file — so REFUSE_PORT's failure is provably about
#                  protection and not about a broken origin
#
# The two origins run in their own nginx instance
# (nginx_lc_gsiftp_prot_p_origin.conf) — see the header there for why they may
# not share this one's worker.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool gsiftp_io threads=4 max_queue=128;
events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/body;
    brix_credential std_proxy {
        x509_proxy {USER_PROXY};
        ca_dir {CA_DIR};
    }

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {P_EXPORT};
            brix_storage_backend gsiftp://{BIND_HOST}:{GSI_ORIGIN_PORT}/ prot=p;
            brix_storage_credential std_proxy;
            brix_allow_write on;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{CLEAR_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {C_EXPORT};
            brix_storage_backend gsiftp://{BIND_HOST}:{GSI_ORIGIN_PORT}/;
            brix_storage_credential std_proxy;
            brix_allow_write on;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{REFUSE_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {REFUSE_EXPORT};
            brix_storage_backend gsiftp://{BIND_HOST}:{PLAIN_ORIGIN_PORT}/ prot=p;
            brix_storage_credential std_proxy;
            brix_allow_write off;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{PLAIN_OK_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {PLAIN_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{PLAIN_ORIGIN_PORT}/;
            brix_allow_write off;
            brix_thread_pool gsiftp_io;
        }
    }
}


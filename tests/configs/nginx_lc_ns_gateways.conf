# Namespace mutations through a storage driver, for test_ns_mutation_gateways.py
# (registry lifecycle).
#
# Four listens, one nginx:
#   PORT              root:// plain POSIX export  — the CONTROL: whatever the
#                     kernel does here is the answer the gateways must match.
#   HTTP_ORIGIN_PORT  WebDAV origin of record for the sd_http gateway.
#   GW_HTTP_PORT      root:// gateway whose storage backend is that WebDAV
#                     origin (driver: fs/backend/http).
#   GW_XROOT_PORT     root:// gateway whose storage backend is the CONTROL
#                     export over root:// (driver: fs/backend/xroot).
#
# The point of the shape is the comparison: mkdir/rm/rmdir/mv/dirlist are issued
# against all three root:// ports with identical arguments, so a driver that
# answers differently from the POSIX control is a defect by construction rather
# than by an assertion someone had to guess.  Three shipped this way — an rmdir
# of a regular FILE deleted it through sd_http, a delete of a missing object
# reported success, and `mkdir -p` over a regular file reported success on every
# plane — none of which any test could see before this topology existed.
#
# worker_processes 2: both gateways open a synchronous backend connection to an
# origin served by this SAME nginx; a single worker blocked in that call could
# never accept its own inbound connection (self-deadlock).
#
# Launcher-provided: LOG_DIR TMP_DIR PORT HTTP_ORIGIN_PORT GW_HTTP_PORT
#                    GW_XROOT_PORT.
# Test-provided: BIND_HOST POSIX_DIR HTTP_ORIGIN_DIR GW_HTTP_EXPORT
#                GW_XROOT_EXPORT.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_max_body_size 16m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {                                    # WebDAV origin for the sd_http gw
        listen {BIND_HOST}:{HTTP_ORIGIN_PORT};
        location / {
            brix_webdav on;
            brix_export {HTTP_ORIGIN_DIR};
            brix_webdav_auth none;
            brix_allow_write on;
        }
    }
}

stream {
    server {                                    # CONTROL: plain POSIX export
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_export {POSIX_DIR};
        brix_auth none;
        brix_allow_write on;
    }

    server {                                    # gateway over the WebDAV origin
        listen {BIND_HOST}:{GW_HTTP_PORT};
        brix_root on;
        brix_export {GW_HTTP_EXPORT};
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend http://{BIND_HOST}:{HTTP_ORIGIN_PORT};
    }

    server {                                    # gateway over the CONTROL export
        listen {BIND_HOST}:{GW_XROOT_PORT};
        brix_root on;
        brix_export {GW_XROOT_EXPORT};
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend root://{BIND_HOST}:{PORT};
    }
}

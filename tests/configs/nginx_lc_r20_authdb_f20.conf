# 2.0 readiness F20 — the native-authdb grammar residuals, over GSI + VOMS.
#
# ONE root:// export whose authdb exercises what F20 added to the native
# engine: compound identity selectors in field 1 (`v` = VOMS vorg, `l` = VOMS
# role, ANDed with each other and with u/g/p) and the `x` privilege that
# kXR_prepare's kXR_stage / kXR_evict arms now demand on top of `r`.
#
# The authdb itself is written by the test into {DATA_ROOT}/authdb so each arm
# can pin the exact rule that produced the verdict.  brix_allow_write is on
# because kXR_stage is a typed export mutation; it is NOT what authorises the
# stage — the authdb's `x` bit is.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 128; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_allow_write on;
        brix_certificate     {SERVER_CERT};
        brix_certificate_key {SERVER_KEY};
        brix_trusted_ca      {CA_CERT};
        brix_vomsdir         {VOMSDIR};
        brix_voms_cert_dir   {CA_DIR};
        brix_authdb          {DATA_ROOT}/authdb;
    }
}
# The /metrics face exists for ONE assertion: the raw VOMS FQAN CSV that 2.0
# F20 added to the identity ("/atlas/Role=production/Capability=NULL") must
# never surface as a label value.  A VO name may (bounded, brix_vo_* only);
# an FQAN carries '/' and '=' and is unbounded, so INVARIANT 8 forbids it.
http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

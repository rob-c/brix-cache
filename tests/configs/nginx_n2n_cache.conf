daemon on;
worker_processes 1;
pid {PREFIX}/nginx.pid;
error_log {PREFIX}/error.log info;
thread_pool default threads=2;
events { worker_connections 64; }
stream {
    server { listen {BIND_HOST}:{ROOT_PORT};
        brix_root on; brix_auth none; brix_cache_export /; {COMMON} }
    server { listen {BIND_HOST}:{DENY_ROOT}; brix_root on; brix_auth none;
        brix_storage_credential_dir {CREDENTIALS};
        brix_storage_credential_fallback deny; {COMMON} }
}
http { access_log off;
    server { listen {BIND_HOST}:{HTTP_PORT}; location / {
        brix_webdav on; brix_webdav_auth none; {COMMON} } }
    server { listen {BIND_HOST}:{DENY_HTTP}; location / {
        brix_webdav on; brix_webdav_auth none;
        brix_storage_credential_dir {CREDENTIALS};
        brix_storage_credential_fallback deny; {COMMON} } }
}

# WebDAV HTTP-TPC pull completion gate
# (brix_webdav_tpc_require_source_size / brix_webdav_tpc_verify_checksum) —
# the HTTP-COPY twin of the native root:// pair brix_tpc_require_source_size /
# brix_tpc_verify_checksum.  Drives test_webdav_tpc_completion_gate.py, which
# renders this template three times, substituting the gate placeholder below:
# both halves on, size half only, and neither (the non-vacuity control that
# must still accept the same truncated/corrupted source).
#
# Cleartext listener + brix_webdav_auth none so the gate is the only thing under
# test; the SOURCE leg is still https-only with full peer verification, hence
# brix_webdav_tpc_cafile pointing at the test CA that signed the fake source's
# certificate.  No thread_pool and no marker interval, so the pull takes the
# synchronous tier and the gate's refusal surfaces as the COPY status itself.
worker_processes 1;
error_log {LOG_DIR}/error.log info;

events { worker_connections 64; }

http {
    access_log off;

    server {
        listen {PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
            brix_allow_write on;
            brix_webdav_tpc on;
            # The fake source lives on loopback; the range gate must let it
            # through so the completion gate is what decides the transfer.
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cafile {CA_PEM};
            brix_webdav_tpc_timeout 15;
            {GATE}
        }
    }
}

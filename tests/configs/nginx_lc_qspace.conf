# kXR_Qspace driver-space seam postures (test_qspace_driver.py, registry
# lifecycle): STORAGE_BACKEND is the full backend value —
#   pblock://<dir>?quota=150m  (quota-aware space via the driver seam), or
#   root://<host>:<port>       (sd_xroot forwarding Qspace to the origin), or
#   posix:<dir>                (plain export → statvfs fallback).
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST STORAGE_BACKEND.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend {STORAGE_BACKEND};
        brix_auth none;
        brix_allow_write on;
    }
}

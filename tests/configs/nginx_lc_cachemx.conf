# cachemx matrix instance — every protocol/auth plane the metric-conformance
# suite (test_cachemx_*.py) drives, each with its OWN cache store directory so
# per-plane cache hit/miss/byte deltas are attributable.
#
# Stream planes (read-through cache filled from the anon origin instance):
#   {PORT}      brix_auth none    cache {CACHE_ROOT}/none
#   {GSI_PORT}  brix_auth gsi     cache {CACHE_ROOT}/gsi
#   {TOK_PORT}  brix_auth token   cache {CACHE_ROOT}/tok
#   {SSS_PORT}  brix_auth sss     cache {CACHE_ROOT}/sss
# HTTP planes (posix backend + location-scoped cache tier):
#   {HTTP_PORT}     plain WebDAV, auth none        cache {CACHE_ROOT}/dav
#   {DAVS_PORT}     WebDAV over TLS, optional cert/token  cache {CACHE_ROOT}/davs
#   {DAVS_GSI_PORT} WebDAV over TLS, cert REQUIRED cache {CACHE_ROOT}/davsg
#   {S3_PORT}       S3 anonymous                   cache {CACHE_ROOT}/s3
#   {S3_SIG_PORT}   S3 SigV4 (fixed test keypair)  cache {CACHE_ROOT}/s3sig
#   {S3_TLS_PORT}   S3 SigV4 over TLS              cache {CACHE_ROOT}/s3tls
#   {METRICS_PORT}  /metrics exposition
# HTTP plane over a REMOTE origin (the only non-posix-backed http plane — every
# other one is posix:{DATA_ROOT}, so brix_cache_hits{proto=webdav} was never
# measured against a real remote origin):
#   {DAV_ORIGIN_PORT} plain WebDAV over root://origin  cache {CACHE_ROOT}/davo
# HTTP plane with third-party copy enabled (COPY + Source: → curl pull leg):
#   {DAV_TPC_PORT}    WebDAV + brix_webdav_tpc         cache {CACHE_ROOT}/davtpc
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT + ledger extras.
# Session-provided: BIND_HOST CA_CERT CA_DIR SERVER_CERT SERVER_KEY TOKEN_DIR.
# Test-provided: ORIGIN_PORT CACHE_ROOT SSS_KEYTAB.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend  root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store      posix:{CACHE_ROOT}/none;
        brix_cache_export     /;
        brix_cache_state_root {CACHE_ROOT}/none;
        brix_cache_eviction_threshold 99.9999%;
    }

    server {
        listen {BIND_HOST}:{GSI_PORT};
        brix_root on;
        brix_auth gsi;
        brix_certificate     {SERVER_CERT};
        brix_certificate_key {SERVER_KEY};
        brix_trusted_ca      {CA_CERT};
        brix_allow_write on;
        brix_storage_backend  root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store      posix:{CACHE_ROOT}/gsi;
        brix_cache_export     /;
        brix_cache_state_root {CACHE_ROOT}/gsi;
        brix_cache_eviction_threshold 99.9999%;
    }

    server {
        listen {BIND_HOST}:{TOK_PORT};
        brix_root on;
        brix_auth token;
        brix_ztn_cleartext on;   # lab opt-in: raw cleartext ztn drivers
        brix_token_jwks     {TOKEN_DIR}/jwks.json;
        brix_token_issuer   "https://test.example.com";
        brix_token_audience "nginx-xrootd";
        brix_allow_write on;
        brix_storage_backend  root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store      posix:{CACHE_ROOT}/tok;
        brix_cache_export     /;
        brix_cache_state_root {CACHE_ROOT}/tok;
        brix_cache_eviction_threshold 99.9999%;
    }

    server {
        listen {BIND_HOST}:{SSS_PORT};
        brix_root on;
        brix_auth sss;
        brix_sss_keytab {SSS_KEYTAB};
        brix_allow_write on;
        brix_storage_backend  root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store      posix:{CACHE_ROOT}/sss;
        brix_cache_export     /;
        brix_cache_state_root {CACHE_ROOT}/sss;
        brix_cache_eviction_threshold 99.9999%;
    }
}

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }

    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name localhost;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_cache_store     posix:{CACHE_ROOT}/dav;
        }
    }

    server {
        listen {BIND_HOST}:{DAVS_PORT} ssl;
        server_name localhost;
        ssl_certificate     {SERVER_CERT};
        ssl_certificate_key {SERVER_KEY};
        ssl_verify_client   optional_no_ca;
        ssl_verify_depth    10;
        brix_webdav_proxy_certs on;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_trusted_ca_dir    {CA_DIR};
            brix_webdav_auth     optional;
            brix_allow_write     on;
            brix_token_jwks     {TOKEN_DIR}/jwks.json;
            brix_token_issuer   "https://test.example.com";
            brix_token_audience "nginx-xrootd";
            brix_cache_store     posix:{CACHE_ROOT}/davs;
        }
    }

    server {
        listen {BIND_HOST}:{DAVS_GSI_PORT} ssl;
        server_name localhost;
        ssl_certificate     {SERVER_CERT};
        ssl_certificate_key {SERVER_KEY};
        ssl_verify_client   optional_no_ca;
        ssl_verify_depth    10;
        brix_webdav_proxy_certs on;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_trusted_ca_dir    {CA_DIR};
            brix_webdav_auth     required;
            brix_allow_write     on;
            brix_token_jwks     {TOKEN_DIR}/jwks.json;
            brix_token_issuer   "https://test.example.com";
            brix_token_audience "nginx-xrootd";
            brix_cache_store     posix:{CACHE_ROOT}/davsg;
        }
    }

    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name localhost;
        client_max_body_size 64m;
        location / {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_bucket       testbucket;
            brix_allow_write     on;
            brix_s3_max_keys     1000;
            brix_cache_store     posix:{CACHE_ROOT}/s3;
        }
    }

    # The one HTTP plane whose storage is a REMOTE origin rather than the local
    # posix tree: cache hit/miss/fill on proto="webdav" measured against the
    # same root:// origin instance the stream planes fill from.
    server {
        listen {BIND_HOST}:{DAV_ORIGIN_PORT};
        server_name localhost;
        location / {
            brix_webdav          on;
            brix_storage_backend root://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_cache_store     posix:{CACHE_ROOT}/davo;
        }
    }

    # The one plane with HTTP-TPC enabled: a COPY carrying a Source: header is
    # a third-party pull (curl leg), which is the only thing that books
    # brix_tpc_transfers_total / brix_tpc_bytes_total / brix_io_ops_total
    # {op="tpc"}.  Kept OFF every other plane so their COPY stays local and the
    # op="copy" rows remain attributable.  The pull leg always speaks https
    # (webdav_tpc_source_url refuses anything else), so its source is the
    # {DAVS_PORT} plane over the session CA.
    server {
        listen {BIND_HOST}:{DAV_TPC_PORT};
        server_name localhost;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_webdav_tpc      on;
            brix_tpc_allow_local on;
            brix_webdav_tpc_cafile {CA_CERT};
            brix_webdav_tpc_timeout 10;
            brix_cache_store     posix:{CACHE_ROOT}/davtpc;
        }
    }

    server {
        listen {BIND_HOST}:{S3_SIG_PORT};
        server_name localhost;
        client_max_body_size 64m;
        location / {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   cachemx-access;
            brix_s3_secret_key   cachemx-secret-key;
            brix_s3_region       us-east-1;
            brix_allow_write     on;
            brix_s3_max_keys     1000;
            brix_cache_store     posix:{CACHE_ROOT}/s3sig;
        }
    }

    # S3 SigV4 over TLS — the signing input is identical (SigV4 signs
    # host:port, never the scheme), so this plane pins that the ledger rows are
    # scheme-independent and that TLS adds no accounting of its own.
    server {
        listen {BIND_HOST}:{S3_TLS_PORT} ssl;
        server_name localhost;
        client_max_body_size 64m;
        ssl_certificate     {SERVER_CERT};
        ssl_certificate_key {SERVER_KEY};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   cachemx-access;
            brix_s3_secret_key   cachemx-secret-key;
            brix_s3_region       us-east-1;
            brix_allow_write     on;
            brix_s3_max_keys     1000;
            brix_cache_store     posix:{CACHE_ROOT}/s3tls;
        }
    }
}

# The phase-70 §5.2 backend audience gate, with and without a gate configured
# (test_audit15j_zero_coverage_stragglers.py).
#
# `brix_backend_token_audience_ok` decides whether a bearer the front door
# captured may be replayed VERBATIM to the origin.  aud_match.c's own header
# says why it exists: "Without this gate the directive was parsed but never
# enforced — a silent fail-open (P90-70.9)."  Nothing in the tree has ever set
# the directive, so nothing has ever watched it work.
#
# TWO LOCATIONS, ONE DIFFERENCE.  /gate/ names an origin audience the test
# tokens do not carry; /nogate/ names none at all.  Everything else — export,
# auth mode, JWKS, issuer, front-door audience, delegation mode — is identical,
# so a behavioural difference between them can only be the directive.  Without
# the /nogate/ half, "the gate logged nothing" would be indistinguishable from
# "there is nothing here to log".
#
# CLEARTEXT ON PURPOSE.  The gate is about the OUTBOUND leg — which origin a
# captured token may be presented to — and it runs at bind time, before any
# backend I/O.  TLS on the INBOUND leg would add a variable without adding a
# claim.  (The `non-TLS connection, cannot verify GSI` warning in error.log is
# expected here: the export accepts bearer tokens, not proxies.)
#
# brix_backend_delegation passthrough is load-bearing, not decoration:
# webdav_vfs_bind_deleg (access.c:513) returns early for the default
# BRIX_CRED_SELECT export, so without it the gate is never consulted at all and
# both halves of the comparison would be vacuous for the same reason.
#
# The front door pins {FRONT_AUD} while the gate wants {BACKEND_AUD}: a token
# minted for THIS gateway is exactly the token the gate exists to stop being
# replayed onward, and it is the one the tests send.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided: JWKS ISSUER FRONT_AUD BACKEND_AUD (the JWKS file must exist at
#                config-parse time — lifecycle.start runs `nginx -t` first).
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {PORT};

        # --- gated: a bearer may only be replayed to {BACKEND_AUD} ----------
        location /gate/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{DATA_ROOT};
            brix_webdav_auth               required;
            brix_webdav_token_jwks         {JWKS};
            brix_webdav_token_issuer       "{ISSUER}";
            brix_webdav_token_audience     "{FRONT_AUD}";
            brix_backend_delegation        passthrough;
            brix_backend_token_audience_ok {BACKEND_AUD};
        }

        # --- ungated: the documented back-compat default (unrestricted) -----
        location /nogate/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{DATA_ROOT};
            brix_webdav_auth               required;
            brix_webdav_token_jwks         {JWKS};
            brix_webdav_token_issuer       "{ISSUER}";
            brix_webdav_token_audience     "{FRONT_AUD}";
            brix_backend_delegation        passthrough;
        }
    }
}

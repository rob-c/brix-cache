# The bind/offload contract owns its connection table. The small send buffer
# forces the pipelined response test to exercise a queued first reply.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 1024; }

stream {
    server {
        listen {PORT} sndbuf=8k;
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_data_substreams on;
    }
}

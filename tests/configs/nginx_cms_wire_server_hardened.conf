# CMS *server* (accept leg) with the Phase-50/A3 resilience knobs turned DOWN
# to test-observable values so the hostile-network conformance suite can prove
# them in-band without waiting out production-scale deadlines:
#   * idle watchdog reaps a silent logged-in peer after 3s (prod default is
#     max(interval*3, 90s));
#   * a single source IP is capped at 8 concurrent connections so one hostile
#     peer cannot exhaust the accept leg;
#   * the global cap (64) sits above the per-IP cap so the per-IP limit is what
#     bites for a single-IP test client.
# Otherwise identical to nginx_cms_wire_server.conf.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }
stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
        brix_manager_mode on;
        brix_cms_server on;
        brix_cms_server_interval 60;
        brix_cms_server_idle_timeout 3s;   # explicit unit: msec-slot reads bare ints as SECONDS
        brix_cms_server_max_connections 64;
        brix_cms_server_max_connections_per_ip 8;
    }
}

# brix_chkpnt_maxsz knob template (test_chkpnt_maxsz.py, registry lifecycle).
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR and
# EXTRA_DIRECTIVES — either "brix_chkpnt_maxsz <size>;" or empty for the
# default-cap (kXR_ckpMinMax) posture.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
        brix_allow_write on;
        {EXTRA_DIRECTIVES}
    }
}

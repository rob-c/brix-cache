# The three acc-engine flag arms of root/stream/directives_auth.h at VALUE
# granularity (audit tranche 16, file 17; test_audit16q_acc_engine_flag_arms.py).
# THREE root:// servers and one http server in ONE process, differing only in
# which acc block each carries.
#
# THE SUBJECTS — all three NGX_STREAM_SRV_CONF | NGX_CONF_FLAG, all three
# ngx_conf_set_flag_slot at NGX_STREAM_SRV_CONF_OFFSET, all three merging to 0
# (core/config/server_conf_merge_security.c:70-72):
#
#   brix_acc_pgo            directives_auth.h:188   acc.pgo
#   brix_acc_resolve_hosts  directives_auth.h:202   acc.resolve_hosts
#   brix_acc_encoding       directives_auth.h:216   acc.encoding
#
# The corpus writes `on` for each of them and `off` for none, which is the gap
# this file closes.  Two of the three read their value out of the per-server
# conf every time they are consulted; the third installs it into a PROCESS
# global (auth/authz/acc/config.c:47), which is why the servers below are
# arranged as they are.
#
# WHY THREE root:// SERVERS RATHER THAN THREE PROCESSES
#   For a genuinely per-server flag, three servers in one process ARE the three
#   arms — `off`, `on` and absent side by side, so nothing but the token differs
#   between them.  For a flag that is really process-wide, the same three
#   servers are the measurement that says so: they answer identically however
#   they are configured.  Which of the two a subject is, is the file's question,
#   so the shape must not presuppose an answer.  Tests that need an arm measured
#   in isolation give the OTHER servers an empty acc block: with no
#   brix_authdb, brix_acc_init_server() returns before it installs anything
#   (acc/config.c:241-242), so such a server neither runs the engine nor
#   disturbs one that does.
#
# WHY brix_auth unix
#   It is the one scheme where a loopback client simply declares a name
#   (auth/unix/auth.c), so a test authenticates as the REAL account it runs as
#   and the engine resolves that account's Unix gidlist through NSS — the input
#   `g <group>` rules match on, and the input brix_acc_pgo narrows.  No fixture
#   users, no privileges.  The same reasoning built nginx_audit15f_accgroups.conf,
#   which this file's single-server arms deliberately do NOT reuse: that template
#   has one server and no http plane, and the question here is what a SECOND
#   engine in the process does to the first.
#
# WHY AN http SERVER IS HERE AT ALL
#   The same three names are declared a second time for the http plane
#   (webdav/module_commands.c:103, :111, :119 — NGX_HTTP_LOC_CONF | NGX_CONF_TAKE1
#   behind brix_acc_http_set_*), and that plane builds its tables LAZILY, on the
#   first request that reaches the location (acc/config.c:209-217).  A request is
#   therefore able to install the process globals — which is a runtime event, not
#   a configuration one, and cannot be measured without an http listener sharing
#   the process with the root:// ones.
#
# SLOTS, named here WITHOUT their braces because the renderer replaces every
# occurrence, comments included, and a multi-line acc block spliced into a
# comment turns the tail of that comment into configuration:
#
#   A_ACC     the whole acc block of the first  root:// server  (may be empty)
#   B_ACC     the whole acc block of the second root:// server  (may be empty)
#   C_ACC     the whole acc block of the third  root:// server  (may be empty)
#   HTTP_ACC  the whole acc block of the http location          (may be empty)
#
#   A test writes an engine block (brix_acc_format xrdacc, brix_authdb <path>,
#   brix_acc_audit all, the subject's arm) into whichever slots its reading
#   needs, and leaves the rest empty.  The blocks are whole rather than a single
#   ACC_EXTRA line because the presence of the ENGINE — not just the flag — is
#   one of the things being varied.
#
# Every server exports the same DATA_ROOT: the authdb decides what may be read
# from it, and an arm that changed the export too would confound the reading.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST B_PORT C_PORT HTTP_PORT A_ACC B_ACC C_ACC HTTP_ACC.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 128; }

stream {
    # ---- A: the arm the corpus never writes ------------------------------ #
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            unix;
        {A_ACC}
    }

    # ---- B: the arm the corpus does write -------------------------------- #
    server {
        listen {BIND_HOST}:{B_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            unix;
        {B_ACC}
    }

    # ---- C: the control that writes no arm at all ------------------------ #
    server {
        listen {BIND_HOST}:{C_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            unix;
        {C_ACC}
    }
}

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    # The other plane's declaration of the same three names, and the only place
    # in this file where the engine can be built by a REQUEST rather than at
    # worker start.
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name acc-http;

        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            {HTTP_ACC}
        }
    }
}

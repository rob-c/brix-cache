# brix_webdav_authz + brix_webdav_accel_redirect — template for
# test_brix_authz_accel.py (phase-106 W3/W4).
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_DIR.
# Test-provided: SECRET_HEX.
#
# Locations:
#   /protected/  plain nginx location; authz DELEGATED to brix via auth_request
#   /_authz      the brix auth_request target, admits (auth none) — internal
#   /denied/     same shape but its authz target REFUSES (auth token, none sent)
#   /_authz_deny the refusing target (auth required, none sent) — internal
#   /gated/      the X-Accel-Redirect seam: brix decides, nginx serves
#   /internal/   the internal target; must be unreachable from outside
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log {LOG_DIR}/access.log;
    client_body_temp_path {TMP_DIR};

    server {
        listen 127.0.0.1:{PORT};

        # --- W4: brix authorizes a location it does not serve --------------
        location /protected/ {
            auth_request /_authz;
            alias {DATA_DIR}/;
        }

        location = /_authz {
            internal;
            brix_webdav on;
            brix_webdav_authz on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
        }

        location /denied/ {
            auth_request /_authz_deny;
            alias {DATA_DIR}/;
        }

        location = /_authz_deny {
            internal;
            brix_webdav on;
            brix_webdav_authz on;
            brix_storage_backend posix:{DATA_DIR};
            # `required` with no credential presented => the ACCESS phase
            # refuses, which is exactly the deny arm this location exists for.
            # `required` fail-closes unless a verifier is configured, so give
            # it one; no credential is ever presented, so every request to this
            # target is refused — which is the deny arm's whole purpose.
            brix_webdav_auth required;
            brix_macaroon_secret {SECRET_HEX};
        }

        # --- W3: brix decides, nginx serves --------------------------------
        location /gated/ {
            brix_webdav on;
            brix_webdav_accel_redirect /internal;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
        }

        location /internal/ {
            internal;
            alias {DATA_DIR}/;
        }
    }
}

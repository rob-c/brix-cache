# An xrdacc authdb that fails to PARSE, on the two planes that read one
# (test_audit15g_authdb_load_failure.py, the tail of audit §B1.7).  The two
# planes differ in exactly one directive — `brix_authdb_refresh` — because that
# is the directive that decides whether a bad authdb is fatal or harmless:
#
#   {PORT}          STATIC plane.  Its authdb is read once, by each worker, in
#                   brix_acc_init_server() (auth/authz/acc/config.c:239) during
#                   init_process.  A parse failure there returns NGX_ERROR and
#                   the worker exits — but `nginx -t` never runs init_process,
#                   so the config it validated is the one that cannot run.
#   {REFRESH_PORT}  RELOADING plane.  Same engine, plus a 1-second re-read
#                   timer.  Its rebuild path (brix_acc_refresh_handler,
#                   config.c:57) swaps only `if (nt != NULL)`, so a file that
#                   stops parsing leaves the last good tables enforcing.
#
# Each plane carries its OWN authdb file and its OWN export: the point of the
# pair is that one file can be broken while the other stays valid, and a shared
# file would make every case a single case.
#
# worker_processes 1 — the subject is what a worker does with the file it was
# given, so one worker makes "the plane has no worker left" unambiguous rather
# than a race between three survivors and one casualty.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + REFRESH_PORT.
# Test-provided: BIND_HOST STATIC_DIR STATIC_AUTHDB REFRESH_DIR REFRESH_AUTHDB.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- authdb read once, at worker start ----------------------------------
    server {
        listen               {BIND_HOST}:{PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{STATIC_DIR};
        brix_authdb_format   xrdacc;
        brix_authdb          {STATIC_AUTHDB};
        brix_authdb_audit    all;
    }

    # --- same authdb engine, re-read on a 1s timer --------------------------
    server {
        listen               {BIND_HOST}:{REFRESH_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{REFRESH_DIR};
        brix_authdb_format   xrdacc;
        brix_authdb          {REFRESH_AUTHDB};
        brix_authdb_refresh  1;
        brix_authdb_audit    all;
    }
}

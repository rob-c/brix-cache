# Abandoned in-protocol TLS upgrade (test_audit15h_tls_upgrade_abort.py) —
# DEFECT CANDIDATE #23.  A client that arms the kXR_ableTLS upgrade and then
# closes before sending its ClientHello makes the worker dereference a session
# context the failure path has already freed (recv.c:262 reads ctx->state after
# brix_recv_process_frame -> brix_start_tls -> ngx_stream_finalize_session).
#
#   {PORT}         brix_tls on, brix_auth none — the plane the trigger kills.
#   {CLEAR_PORT}   the same server with the TLS block removed.  An ableTLS
#                  kXR_protocol arms nothing here (no kXR_gotoTLS in the reply),
#                  so the identical byte sequence is harmless — which is what
#                  makes the crash the upgrade path's and not the opcode's.
#   {AUTHED_PORT}  brix_tls on + brix_auth gsi.  Nobody without a proxy can ever
#                  be served by this listener, and the trigger still reaches it:
#                  the crash lands before login, before any credential.
#
# worker_processes 1 so a dead worker is unambiguous — the pid set the test
# watches has exactly one member, and any change to it is a respawn.
#
# `listen {PORT};` with no address, matching the other TLS templates: the test
# reaches the server by name so the host cert's SAN is meaningful.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + CLEAR_PORT AUTHED_PORT.
# Test-provided: CERT KEY CA (all must exist at config-parse time).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- anonymous, TLS-capable: the subject -------------------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_tls on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
    }

    # --- no TLS: nothing to arm, nothing to abandon --------------------------
    server {
        listen {CLEAR_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
    }

    # --- TLS + GSI: the crash is reachable with no credential at all ---------
    server {
        listen {AUTHED_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_tls on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
    }
}

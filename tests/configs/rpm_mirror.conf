# RPM/dnf pull-through mirror front (phase-104 D15.9; the C surface that
# replaces the D11 proxy_cache recipe).
#
# Drives test_rpm_mirror_native.py. The mock repo speaks plain http, so the
# template carries brix_rpm_mirror_insecure on — the merge refuses a cleartext
# upstream without it, because anyone on the path could swap a package before
# this mirror ever hashes it.
#
# Placeholders (rendered by render_config(strict=True) — every one must be
# supplied by the lane, so a forgotten value is a fatal render, not a server
# that silently comes up with the wrong policy):
#   LOG_DIR       error.log + nginx.pid live here; the registry's endpoint
#                 record names logs/nginx.pid — do not rename it.
#   BIND_HOST     PORT        this front's listener
#   MOCK_HOST     MOCK_PORT   the upstream repository — its ROOT, since the
#                 canonical cache key is the request URI verbatim and the
#                 upstream URL is base + key.
#   PREFIX        the location this mirror answers on (e.g. /el9/)
#   CACHE_DIR     the mirror's cache store (posix:)
#   METADATA_TTL  repomd.xml freshness window, seconds — the ONE mutable root
#   VERIFY_MODE   rpm-repodata for the real policy
#   EXTRA_LINES   per-lane additions
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;
thread_pool default threads=2;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen {BIND_HOST}:{PORT};
        location {PREFIX} {
            brix_rpm_mirror          http://{MOCK_HOST}:{MOCK_PORT};
            brix_rpm_mirror_insecure on;
            brix_rpm_metadata_ttl    {METADATA_TTL};
            brix_cache_store         posix:{CACHE_DIR};
            brix_cache_verify        {VERIFY_MODE};
            {EXTRA_LINES}
        }
    }
}

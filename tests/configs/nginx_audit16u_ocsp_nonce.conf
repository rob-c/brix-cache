# brix_ocsp_require_nonce at VALUE granularity (audit tranche 16, file 21;
# test_audit16u_ocsp_nonce.py).  FOUR GSI acceptors over ONE trust store in ONE
# process, differing only in the OCSP nonce policy each carries.
#
# THE SUBJECT — the last flag of the OCSP family with BOTH arms unwritten.  It
# is declared in core/types/conf_structs.h:30, unset at :392 and merged to 0 at
# :533; auth_cert.c:296 passes it into brix_ocsp_check_cert, and the branch it
# reaches is ocsp_request.c:224-230:
#
#     if (require_nonce) { ... "brix_ocsp_require_nonce is on — denying
#                              (replay guard)"; return -1; }
#
# — the CWE-294 guard against an on-path attacker replaying a captured, still
# validly signed GOOD response.  Neither token has ever been written in a config
# the suite renders, so the branch has never been entered: test_ocsp.py and
# test_ocsp_require_nonce.py pin it against the C source instead, and the latter
# says why in its own docstring ("Live OCSP negatives need a controllable
# responder that this suite does not stand up").  tests/lib/ocsp_responder.py,
# stood up by tranche 16 file 1, ships --omit-nonce for exactly this case.
#
#   {PORT}         require_nonce on,  soft_fail off — the guard, armed.  A
#                  responder that answers GOOD without echoing the nonce must
#                  be refused.
#   {OFF_PORT}     require_nonce off, soft_fail off — the arm that says a
#                  nonce-less GOOD is a warning and the login continues.  This
#                  is what every deployment in the corpus runs today, and until
#                  this file nothing had written the token that says so.
#   {ABSENT_PORT}  neither token written — the plane that MEASURES the merge
#                  default rather than reading it off conf_structs.h:533, and
#                  the only shape a site that never heard of the flag has.
#   {SOFT_PORT}    require_nonce on,  soft_fail ON — the composition.  soft_fail
#                  turns "nobody vouched for this" into GOOD (ocsp.c:84,
#                  `result = soft_fail ? 0 : -1`), and the question is whether
#                  the fail-open performance flag also swallows a deny the
#                  replay guard RAISED.  The three planes above cannot answer
#                  it: they all pin soft_fail off, where every negative denies
#                  for two reasons at once.
#
# All four carry brix_ocsp on — with it off no request is built at all
# (auth_cert.c:293) and there is no response to have a nonce, so `enable off` is
# not a fourth arm of this flag, it is the absence of the whole mechanism.
# test_audit16a_ocsp_flags.py owns that plane.
#
# WHICH RESPONDER ANSWERS IS NOT IN THIS FILE
#   brix_ocsp_check_cert reads the responder URL out of the LEAF's
#   authorityInfoAccess extension (X509_get1_ocsp(leaf), ocsp.c:143), so it is a
#   property of the CREDENTIAL.  The test mints one credential per nonce
#   behaviour — echoed, omitted, mismatched — each with an AIA naming its own
#   responder subprocess, and every one of them crosses all four planes.  That
#   is the whole reason four servers and not four instances: the same
#   certificate reaching four policies in one worker means a difference in
#   verdict cannot be a difference in credential, clock or trust store.
#
# brix_ocsp_stapling is absent everywhere.  It is a SERVER-side leg — the
# stapled response this server offers about its OWN certificate — and would put
# a second OCSP exchange, with its own nonce, in front of the client-credential
# check that is the subject here.
#
# brix_crl is absent for the same reason as in nginx_audit16a_ocsp.conf: a CRL
# would give every refusal a second possible revocation source.
#
# brix_allow_write is off everywhere: every assertion is a LOGIN verdict taken
# on a read, and a write gate would give the refusals another reason.
#
# The arms are written LITERALLY rather than handed in through placeholders,
# because the audit counts an arm as covered only when the token is spelled
# where a reader can grep it; a placeholder rendering to off at runtime leaves
# the corpus still never saying so.  Section A of the test reads this file back
# and asserts exactly that.  (Placeholder names appear here without their
# braces — the renderer substitutes every occurrence, comments included, then
# refuses to start on any brace pair it does not recognise.)
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + OFF_PORT ABSENT_PORT SOFT_PORT
# (and RESP_PORT / NONCELESS_PORT / BADNONCE_PORT, which belong to the test's
# responder subprocesses and to nothing in this file).  Test-provided: CERT KEY
# CA — every path must already exist at config-parse time.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- the guard, armed: a nonce-less GOOD is a deny --------------------- #
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend      posix:{DATA_ROOT};
        brix_auth                 gsi;
        brix_certificate          {CERT};
        brix_certificate_key      {KEY};
        brix_trusted_ca           {CA};
        brix_ocsp          on;
        brix_ocsp_soft_fail       off;
        brix_ocsp_require_nonce   on;
    }

    # --- the guard, disarmed: a nonce-less GOOD warns and continues -------- #
    server {
        listen {OFF_PORT};
        brix_root on;
        brix_storage_backend      posix:{DATA_ROOT};
        brix_auth                 gsi;
        brix_certificate          {CERT};
        brix_certificate_key      {KEY};
        brix_trusted_ca           {CA};
        brix_ocsp          on;
        brix_ocsp_soft_fail       off;
        brix_ocsp_require_nonce   off;
    }

    # --- unwritten: whatever the merge default turns out to be ------------- #
    server {
        listen {ABSENT_PORT};
        brix_root on;
        brix_storage_backend      posix:{DATA_ROOT};
        brix_auth                 gsi;
        brix_certificate          {CERT};
        brix_certificate_key      {KEY};
        brix_trusted_ca           {CA};
        brix_ocsp          on;
        brix_ocsp_soft_fail       off;
    }

    # --- armed under the fail-open flag: does soft_fail swallow the deny? -- #
    server {
        listen {SOFT_PORT};
        brix_root on;
        brix_storage_backend      posix:{DATA_ROOT};
        brix_auth                 gsi;
        brix_certificate          {CERT};
        brix_certificate_key      {KEY};
        brix_trusted_ca           {CA};
        brix_ocsp          on;
        brix_ocsp_soft_fail       on;
        brix_ocsp_require_nonce   on;
    }
}

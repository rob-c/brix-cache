# brix_backend_delegation at VALUE granularity (test_audit15x_backend_delegation.py)
# — the 15th tranche.  The directive has six tokens; the suite writes three of
# them (`select` by omission everywhere, `passthrough` on the credential-
# forwarding labs, `exchange` on test_audit15c_tpc_token_exchange.py).  The
# other three — `delegate`, `mint`, `auto` — appear in no config on any plane,
# so what they do to a backend leg had never been measured at all.
#
# THE OBSERVABLE.  The directive's whole job is choosing which credential
# authenticates the OUTBOUND leg, so the only honest witness is the outbound
# leg itself.  Every location below points at ONE capturing http:// origin the
# test runs in-process ({ORIGIN_PORT}, _test_audit15g_helpers.serve_paced),
# which records the Authorization header of every request it is asked for.
# "the caller's bearer was forwarded" is then a header at the origin rather
# than an inference from a log line.
#
# Twelve locations on ONE listener, because the mode is a location-level
# directive and the legs differ only in URI:
#
#   /select/      the directive ABSENT           — the merge default (SELECT)
#   /passthrough/ passthrough                    — forward the caller's bearer
#   /exchange/    exchange, NO endpoint          — documented verbatim fallback
#   /delegate/    delegate                       — never written anywhere
#   /mint/        mint, NO mint CA               — never written anywhere
#   /auto/        auto                           — never written anywhere
#     ... all six over {CRED_EMPTY}, an empty per-user credential directory, so
#     the directory-lookup path finds nothing and the mode is the only thing
#     that can put a credential on the wire.
#
#   /mintca/      mint + a mint CA + {CRED_MINT} — does `mint` mint?
#   /selmint/     select + the same CA + {CRED_SEL} — is `mint` what arms it?
#     ... two dirs, never one: a minted proxy is a file, and one shared
#     directory could not tell which leg wrote it.
#
#   /denyselect/  ABSENT      + {CRED_DENY} + fallback deny
#   /denydeleg/   delegate    + {CRED_DENY} + fallback deny
#   /denyauto/    auto        + {CRED_DENY} + fallback deny
#   /denypass/    passthrough + {CRED_DENY} + fallback deny
#     ... the fail-closed posture an operator hardens a delegated export with.
#     A mode that really carries the caller's credential satisfies it; a mode
#     that does not refuses every request exactly as a non-delegating export
#     would.  {CRED_DENY} is empty and stays empty.
#
# brix_storage_credential_dir is set EXPLICITLY on every location, including the
# ones whose directory is meant to be empty.  It is not optional: the merge
# default is BRIX_CREDENTIAL_DIR_DEFAULT = /dev/shm/brix-creds
# (core/config/shared_conf.h:24), so a location that omits it reads — and a
# minting location WRITES — a machine-wide path shared with every other nginx
# on the host.
#
# brix_backend_token_exchange_endpoint is deliberately absent from /exchange/.
# It is HTTPS-only and load-validated, so an http:// endpoint fails `nginx -t`
# outright, and the RFC-8693 exchange leg already has an owner
# (test_audit15c_tpc_token_exchange.py).  What is measured here instead is the
# documented degenerate case: EXCHANGE without an endpoint forwards verbatim
# (protocols/shared/deleg_wire.c:49-54).
#
# brix_backend_token_audience_ok is absent everywhere on purpose.  The backend
# audience gate is a fail-open today (DEFECT #34, test_audit15j_zero_coverage_
# stragglers.py: the directive parses into backend_token_aud and nothing reads
# it), so it cannot mask a forwarded bearer and does not confound the table.
#
# All twelve are `brix_webdav_auth required` against the same JWKS: the caller's
# credential has to EXIST before a mode can be judged for dropping it.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + ORIGIN_PORT.
# Test-provided: BIND_HOST JWKS ISSUER AUD CRED_EMPTY CRED_MINT CRED_SEL
#                CRED_DENY MINT_CERT MINT_KEY.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # --- the six tokens, over an empty credential directory --------------

        # The directive absent: the merge default, and the control every other
        # row is read against.
        location /select/ {
            brix_webdav                 on;
            brix_storage_backend        http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth            required;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "{ISSUER}";
            brix_token_audience  "{AUD}";
            brix_storage_credential_dir {CRED_EMPTY};
        }

        # The one mode the live-credential bag actually implements for a bearer
        # (fs/vfs/vfs_cred.c:119-132).
        location /passthrough/ {
            brix_webdav                 on;
            brix_storage_backend        http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth            required;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "{ISSUER}";
            brix_token_audience  "{AUD}";
            brix_storage_credential_dir {CRED_EMPTY};
            brix_backend_delegation     passthrough;
        }

        # EXCHANGE with no endpoint to exchange AT — the second half of the
        # live bag, which falls back to forwarding the bearer unmodified.
        location /exchange/ {
            brix_webdav                 on;
            brix_storage_backend        http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth            required;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "{ISSUER}";
            brix_token_audience  "{AUD}";
            brix_storage_credential_dir {CRED_EMPTY};
            brix_backend_delegation     exchange;
        }

        location /delegate/ {
            brix_webdav                 on;
            brix_storage_backend        http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth            required;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "{ISSUER}";
            brix_token_audience  "{AUD}";
            brix_storage_credential_dir {CRED_EMPTY};
            brix_backend_delegation     delegate;
        }

        # `mint` with nothing to mint WITH: the CA lives on /mintca/ below, so
        # this leg answers "is the mode enough on its own?".
        location /mint/ {
            brix_webdav                 on;
            brix_storage_backend        http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth            required;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "{ISSUER}";
            brix_token_audience  "{AUD}";
            brix_storage_credential_dir {CRED_EMPTY};
            brix_backend_delegation     mint;
        }

        location /auto/ {
            brix_webdav                 on;
            brix_storage_backend        http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth            required;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "{ISSUER}";
            brix_token_audience  "{AUD}";
            brix_storage_credential_dir {CRED_EMPTY};
            brix_backend_delegation     auto;
        }

        # --- minting: the mode, or the CA? -----------------------------------

        location /mintca/ {
            brix_webdav                      on;
            brix_storage_backend             http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth                 required;
            brix_token_jwks           {JWKS};
            brix_token_issuer         "{ISSUER}";
            brix_token_audience       "{AUD}";
            brix_storage_credential_dir      {CRED_MINT};
            brix_storage_credential_mint_ca  {MINT_CERT} {MINT_KEY};
            brix_storage_credential_mint_ttl 900;
            brix_backend_delegation          mint;
        }

        # Identical to /mintca/ except for the one line under test.  `select`
        # is written out rather than left implied, so the token itself is
        # exercised at run time and not merely inferred from /select/'s default.
        location /selmint/ {
            brix_webdav                      on;
            brix_storage_backend             http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth                 required;
            brix_token_jwks           {JWKS};
            brix_token_issuer         "{ISSUER}";
            brix_token_audience       "{AUD}";
            brix_storage_credential_dir      {CRED_SEL};
            brix_storage_credential_mint_ca  {MINT_CERT} {MINT_KEY};
            brix_storage_credential_mint_ttl 900;
            brix_backend_delegation          select;
        }

        # --- the fail-closed posture -----------------------------------------

        location /denyselect/ {
            brix_webdav                      on;
            brix_storage_backend             http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth                 required;
            brix_token_jwks           {JWKS};
            brix_token_issuer         "{ISSUER}";
            brix_token_audience       "{AUD}";
            brix_storage_credential_dir      {CRED_DENY};
            brix_storage_credential_fallback deny;
        }

        location /denydeleg/ {
            brix_webdav                      on;
            brix_storage_backend             http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth                 required;
            brix_token_jwks           {JWKS};
            brix_token_issuer         "{ISSUER}";
            brix_token_audience       "{AUD}";
            brix_storage_credential_dir      {CRED_DENY};
            brix_storage_credential_fallback deny;
            brix_backend_delegation          delegate;
        }

        location /denyauto/ {
            brix_webdav                      on;
            brix_storage_backend             http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth                 required;
            brix_token_jwks           {JWKS};
            brix_token_issuer         "{ISSUER}";
            brix_token_audience       "{AUD}";
            brix_storage_credential_dir      {CRED_DENY};
            brix_storage_credential_fallback deny;
            brix_backend_delegation          auto;
        }

        location /denypass/ {
            brix_webdav                      on;
            brix_storage_backend             http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth                 required;
            brix_token_jwks           {JWKS};
            brix_token_issuer         "{ISSUER}";
            brix_token_audience       "{AUD}";
            brix_storage_credential_dir      {CRED_DENY};
            brix_storage_credential_fallback deny;
            brix_backend_delegation          passthrough;
        }

        # The label vocabulary is declared for all six modes
        # (observability/metrics/unified.c:126-134) whether or not any of them
        # ever increments; §E reads that here rather than from the source.
        location = /metrics {
            brix_metrics on;
        }
    }
}

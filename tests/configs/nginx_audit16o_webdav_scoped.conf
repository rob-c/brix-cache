# The three MAIN|SRV|LOC WebDAV flags at VALUE granularity (audit tranche 16,
# file 15; test_audit16o_webdav_scoped_flag_arms.py).  ONE listener, SEVEN
# server_name vhosts, one posix export, one dig export outside it.
#
# THE THREE, AND WHY THEY ARE ONE FILE
#   brix_zip_access      module_commands.c:405   zip_access
#   brix_webdav_require_digest  module_commands.c:440   require_digest
#   brix_webdav_dig             module_commands.c:454   dig_enable
#
#   All three are declared
#       NGX_HTTP_MAIN_CONF | NGX_HTTP_SRV_CONF | NGX_HTTP_LOC_CONF | NGX_CONF_FLAG
#   with ngx_conf_set_flag_slot + NGX_HTTP_LOC_CONF_OFFSET, and all three merge to
#   0 (config_merge.c:99, :112, :111).  For all three the corpus had written only
#   `on` — which is why the interesting arm is not "off in a bare location" (that
#   is just the merge default under another name) but the OPT-OUT: `on` written at
#   server scope and `off` written in one location beneath it.  Absence in that
#   child inherits the server's `on`, so `off` is the ONLY spelling that can turn
#   the feature off for one location of an otherwise-enabled server.  Three legal
#   scopes is what makes this reading exist at all, and it is the whole point of
#   this file.
#
# WHY http{} MAIN SCOPE IS NOT HERE
#   The third legal scope is real and is exercised — but only by the parse tier
#   (nginx_audit16nparse.conf, reused).  A value written in http{} is the top of
#   the merge chain for EVERY server and location in the configuration, and this
#   file's bare arms (/zp-bare/, /rd-bare/, dig-bare.test) exist precisely to read
#   the merge default of 0.  One configuration cannot hold both readings, and the
#   merge default is the more valuable of the two to pin at runtime.
#
# WHY VHOSTS AND NOT LISTENERS
#   None of the three needs anything from the listener — no TLS, no client certs.
#   Server-scope arms need a server{} each, and `brix_webdav_dig` gates an
#   ABSOLUTE URI prefix (/.well-known/dig/, dig.c:158-166 via dispatch.c:158) so
#   its arms cannot be adjacent locations in one server: the URI space is the same
#   for all of them and holds exactly one value.  Seven server{} blocks on one
#   `listen` cost no ledger port and are selected with a Host: header.
#
# THE ARMS
#
#   default vhost (Host: localhost) — nothing at server scope, so these three
#   triples read the location arm against the merge default:
#     /zp-on|off|bare/    brix_zip_access      over a seeded a.zip
#     /rd-on|off|bare/    brix_webdav_require_digest  over PUT
#
#   Host: srv-on.test — BOTH flags written `on` at SERVER scope, with two
#   locations that differ only in whether they write anything:
#     /inherit/           writes neither -> inherits the server's `on`
#     /opt-out/           writes both `off` -> the reading absence cannot express
#
#   Host: srv-off.test — both flags written `off` at SERVER scope.  The corpus has
#   never written either directive in a server{} at all, in either arm; this vhost
#   is the only place in the tree where the server-scope setter runs with a 0.
#
#   Host: dig-on.test / dig-locoff.test / dig-srvoff.test / dig-bare.test — the
#   dig arms, one `location /` each (plus, for the opt-out, a second location on
#   the reserved prefix, which is the only place a per-location `off` can go):
#     dig-on.test         server-scope `on`                     -> dig answers
#     dig-locoff.test     server-scope `on`, prefix location `off`
#     dig-srvoff.test     server-scope `off`
#     dig-bare.test       exports and allow-file declared, flag never written
#   The last two are configured identically to dig-on.test in every other respect,
#   so a difference between them and dig-on.test is the flag and nothing else.
#
# THE SEEDED SHADOW FILE
#   The export deliberately contains a real object UNDER the reserved dig prefix
#   (.well-known/dig/conf/server.cfg) whose bytes differ from the dig export's
#   file of the same name.  With the flag on, the diagnostics handler answers and
#   the operator's object is unreachable; with it off the same URI serves the
#   object under the EXPORT's authorization policy instead of dig's fail-closed
#   allow-file.  Both bodies are distinct constants, so the test reads WHICH file
#   answered and not merely that something did.
#
# WHY THE DIG EXPORTS PERMIT WRITES
#   dig_precheck() refuses a non-GET/HEAD method itself (dig.c:170-172), but that
#   is in the CONTENT phase — a write-disabled export answers 403 in the ACCESS
#   phase first, so a read-only location cannot see dig's own gate at all.  With
#   `brix_allow_write on` the difference between the arms becomes the sharpest row
#   in the file: with the flag on, a PUT under the reserved prefix is refused by
#   dig; with it off, the same PUT is a plain WebDAV write into the export.
#
# The [warn] advisories at startup are earned.  The zip and digest vhosts are
# anonymous write-enabled WebDAV exports, which is exactly what
# brix_shared_security_gate advises about, and require_digest is measured on PUT.
# The dig vhosts use `brix_webdav_auth optional` with a JWKS verifier, because dig
# denies an anonymous principal by design and the allow-file keys on the token
# subject.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST DIG_EXPORT DIG_ALLOW JWKS_PATH ISSUER AUDIENCE.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    # ---- the default vhost: the location arms against the merge default ---- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location /zp-on/ {
            brix_webdav             on;
            brix_storage_backend    posix:{DATA_ROOT};
            brix_webdav_auth        none;
            brix_zip_access  on;
        }

        location /zp-off/ {
            brix_webdav             on;
            brix_storage_backend    posix:{DATA_ROOT};
            brix_webdav_auth        none;
            brix_zip_access  off;
        }

        location /zp-bare/ {
            brix_webdav             on;
            brix_storage_backend    posix:{DATA_ROOT};
            brix_webdav_auth        none;
        }

        location /rd-on/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_require_digest  on;
        }

        location /rd-off/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_require_digest  off;
        }

        location /rd-bare/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            none;
            brix_allow_write            on;
        }
    }

    # ---- server-scope `on` + a location that opts out --------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name srv-on.test;

        brix_zip_access      on;
        brix_webdav_require_digest  on;

        location /inherit/ {
            brix_webdav           on;
            brix_storage_backend  posix:{DATA_ROOT};
            brix_webdav_auth      none;
            brix_allow_write      on;
        }

        location /opt-out/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_zip_access      off;
            brix_webdav_require_digest  off;
        }
    }

    # ---- server-scope `off`: the arm the corpus never writes anywhere ----- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name srv-off.test;

        brix_zip_access      off;
        brix_webdav_require_digest  off;

        location / {
            brix_webdav           on;
            brix_storage_backend  posix:{DATA_ROOT};
            brix_webdav_auth      none;
            brix_allow_write      on;
        }
    }

    # ---- dig: server-scope `on` ------------------------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name dig-on.test;

        brix_webdav_dig         on;
        brix_webdav_dig_export  conf {DIG_EXPORT};
        brix_webdav_dig_auth    {DIG_ALLOW};

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            optional;
            brix_allow_write            on;
            brix_token_jwks      {JWKS_PATH};
            brix_token_issuer    {ISSUER};
            brix_token_audience  {AUDIENCE};
        }
    }

    # ---- dig: server-scope `on`, one location opts out -------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name dig-locoff.test;

        brix_webdav_dig         on;
        brix_webdav_dig_export  conf {DIG_EXPORT};
        brix_webdav_dig_auth    {DIG_ALLOW};

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            optional;
            brix_allow_write            on;
            brix_token_jwks      {JWKS_PATH};
            brix_token_issuer    {ISSUER};
            brix_token_audience  {AUDIENCE};
        }

        # The reserved prefix is absolute, so the only place a per-location `off`
        # can be written is a location ON that prefix.
        location /.well-known/dig/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            optional;
            brix_allow_write            on;
            brix_token_jwks      {JWKS_PATH};
            brix_token_issuer    {ISSUER};
            brix_token_audience  {AUDIENCE};
            brix_webdav_dig             off;
        }
    }

    # ---- dig: server-scope `off` ------------------------------------------ #
    server {
        listen {BIND_HOST}:{PORT};
        server_name dig-srvoff.test;

        brix_webdav_dig         off;
        brix_webdav_dig_export  conf {DIG_EXPORT};
        brix_webdav_dig_auth    {DIG_ALLOW};

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            optional;
            brix_allow_write            on;
            brix_token_jwks      {JWKS_PATH};
            brix_token_issuer    {ISSUER};
            brix_token_audience  {AUDIENCE};
        }
    }

    # ---- dig: fully provisioned, flag never written ----------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name dig-bare.test;

        brix_webdav_dig_export  conf {DIG_EXPORT};
        brix_webdav_dig_auth    {DIG_ALLOW};

        location / {
            brix_webdav                 on;
            brix_storage_backend        posix:{DATA_ROOT};
            brix_webdav_auth            optional;
            brix_allow_write            on;
            brix_token_jwks      {JWKS_PATH};
            brix_token_issuer    {ISSUER};
            brix_token_audience  {AUDIENCE};
        }
    }
}

# Macaroon-authenticated root:// (stream) server for test_macaroon_root_wire.py.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST SECRET_HEX SECRET_OLD_HEX JWKS ISSUER AUDIENCE.
#
# The WebDAV macaroon battery has its own template; this is the stream-plane
# twin of it, so the same validator is driven through the kXR `ztn` credential
# path.  SECRET_OLD_HEX is always set (to the same value as SECRET_HEX when the
# test does not care) because brix_macaroon_secret_old is what arms the
# grace-period retry during key rotation.
#
# The JWKS trio is NOT optional here even though this server only cares about
# macaroons: `brix_auth token` on the stream plane insists on
# brix_token_jwks/_issuer/_audience at nginx -t time (src/auth/token/config.c
# brix_token_require_single_issuer_fields), unlike brix_webdav_auth, which
# accepts a macaroon secret on its own.  So the realistic stream-plane shape is
# a mixed JWT+macaroon server, and that is what this template builds.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth token;
        brix_ztn_cleartext on;   # lab opt-in: raw cleartext ztn drivers
        brix_token_jwks     {JWKS};
        brix_token_issuer   "{ISSUER}";
        brix_token_audience "{AUDIENCE}";
        brix_macaroon_secret {SECRET_HEX};
        brix_macaroon_secret_old {SECRET_OLD_HEX};
    }
}

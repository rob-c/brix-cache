# Scoped-token WebDAV subject for resource-complete MOVE authorization.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log warn;
env BRIX_STAGE_JOURNAL_DIR={JOURNAL_DIR};
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_max_body_size 32m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT} ssl;
        server_name localhost;
        ssl_certificate     {SERVER_CERT};
        ssl_certificate_key {SERVER_KEY};

        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_allow_write {ALLOW_WRITE};
            brix_backend_async {ASYNC};
            brix_backend_async_batch {BATCH};
            brix_backend_async_wait {WAIT};
            brix_trusted_ca {CA_CERT};
            brix_webdav_auth required;
            brix_token_jwks {JWKS};
            brix_token_issuer "{ISSUER}";
            brix_token_audience "{AUDIENCE}";
        }
    }
}

# Cache eviction racing an active read (test_audit15g_evict_during_read.py,
# registry lifecycle) — audit §C, carried from the 2026-08-04 pass: "cache
# eviction during active read (no test)".  Nothing in the suite has ever made
# the reaper and a reader touch the same object at the same time.
#
# Two planes, one per reaper, because the two are wired completely differently:
#
#   {PORT}       the WATERMARK reaper (brix_cache_high_watermark /
#                _low_watermark / _reap_interval → reap_watermark.c).  High is
#                set to 1% of the filesystem, which any real disk is already
#                past, and low to the same, which it can never reach — so every
#                tick purges the whole store.  That is the deterministic
#                eviction trigger the mid-read tests need; the timer first fires
#                at BRIX_CACHE_REAP_FIRST_MS (5 s) and re-arms at
#                brix_cache_reap_interval thereafter.
#   {COLD_PORT}  the COLD/dirty reaper (brix_cache_cold_max_age →
#                cache_reap.c), armed with the same 1-second reap interval and
#                the watermark pushed out of reach, so the two planes cannot be
#                confused for one another.  This plane exists to pin its
#                cadence: the directive paces the watermark timer only, and this
#                reaper re-arms at the compiled-in BRIX_CACHE_REAP_INTERVAL_MS
#                instead.
#
# brix_cache_eviction_threshold is pinned out of reach on BOTH planes, because
# it is not only the on-fill safety net: it is also the DEFAULT for
# brix_cache_high_watermark (server_conf_merge_security.c:402).  Left alone it
# is 90%, so on any filesystem past 90% full — which a developer box routinely
# is — every plane silently acquires a live watermark reaper and each fill
# additionally evicts on the way in.  Both would purge these objects for
# reasons the tests are not about.  99.9% is the highest the parser accepts:
# the ratio must be strictly below 1.0 (fs/cache/directives.c).
#
# Each plane carries its own brix_export and its own store: the composed tier
# registers in the VFS backend table under the export's canonical root, so a
# shared root would make one registration answer both listeners.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + COLD_PORT.  Test-provided:
# BIND_HOST ORIGIN_PORT WM_EXPORT WM_STORE COLD_EXPORT COLD_STORE.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=2 max_queue=256;

stream {
    # --- watermark-driven LRU reaper ----------------------------------------
    server {
        listen                    {BIND_HOST}:{PORT};
        brix_root                 on;
        brix_auth                 none;
        brix_export               {WM_EXPORT};
        brix_storage_backend      root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store          posix:{WM_STORE};
        brix_cache_export         /;
        brix_cache_eviction_threshold 99.9%;
        brix_cache_high_watermark 1%;
        brix_cache_low_watermark  1%;
        brix_cache_reap_interval  1;
    }

    # --- cold-age purge of clean read-through fills -------------------------
    server {
        listen                    {BIND_HOST}:{COLD_PORT};
        brix_root                 on;
        brix_auth                 none;
        brix_export               {COLD_EXPORT};
        brix_storage_backend      root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store          posix:{COLD_STORE};
        brix_cache_export         /;
        brix_cache_eviction_threshold 99.9%;
        brix_cache_high_watermark 99.9%;
        brix_cache_cold_max_age   1;
        brix_cache_reap_interval  1;
    }
}

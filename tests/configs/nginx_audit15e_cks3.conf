# Checksum-on-write over an s3:// storage backend
# (test_audit15e_checksum_s3.py, registry lifecycle) — audit §B2.11 residual:
# `brix_webdav_checksum_on_write` was tested over posix and (tranche 4)
# through a stage tier, but never over the sd_remote s3:// driver, whose
# write session is driver-backed (no kernel fd) and whose xattr surface is
# the x-amz-meta-* mapping rather than real filesystem xattrs.
#
# One instance, four planes:
#   {ORIGIN_PORT} brix_s3 over posix — the object store (bucket "testbucket")
#   /ck/  WebDAV over s3:// + checksum_on_write adler32 — the subject
#   /px/  WebDAV over posix + the SAME directive — the control that makes
#         the /ck/ result a statement about the BACKEND rather than about
#         the directive (test_checksum_on_write.py proves posix persists it)
#   /ro/  the /ck/ shape with allow_write off — the fail-closed negative
#
# NO `thread_pool` is declared, deliberately.  With one configured, the PUT
# takes the aio thread path (webdav_put_aio_thread) and a WebDAV PUT over
# this driver-backed backend intermittently wedges: the object commits
# (op:"write" status:"ok" in the access log) but the response never returns,
# and a cold PUT can 500 on the lock-xattr probe (EIO from the driver — an
# errno webdav_lock_xattr_read does not tolerate, prop_xattr.c:250).  Four
# probe runs with the pool each wedged at least once; runs without it were
# clean.  Recorded as a defect candidate in the audit doc; keeping the pool
# out is what makes this test deterministic.
#
# worker_processes 4: the front's SigV4 legs land on the origin INSIDE this
# same nginx and the WebDAV lock/xattr probe walk adds two more inbound legs
# per PUT — each blocked leg holds its worker, so two workers are tight;
# four leaves slack for the whole chain.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + ORIGIN_PORT extra.
# Test-provided: BIND_HOST S3_DIR POSIX_ROOT S3_ACCESS_KEY S3_SECRET_KEY.
worker_processes 4;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    brix_credential s3cred {
        s3_access_key {S3_ACCESS_KEY};
        s3_secret_key {S3_SECRET_KEY};
        s3_region     us-east-1;
    }

    # The S3 origin. It IS the object store.
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{S3_DIR};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   {S3_ACCESS_KEY};
            brix_s3_secret_key   {S3_SECRET_KEY};
            brix_s3_region       us-east-1;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{PORT};

        location = / { return 204; }

        location /ck/ {
            brix_webdav                   on;
            brix_storage_backend          s3://{BIND_HOST}:{ORIGIN_PORT}/testbucket;
            brix_storage_credential       s3cred;
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_checksum_on_write adler32;
        }

        location /px/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{POSIX_ROOT};
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_checksum_on_write adler32;
        }

        location /ro/ {
            brix_webdav                   on;
            brix_storage_backend          s3://{BIND_HOST}:{ORIGIN_PORT}/testbucket;
            brix_storage_credential       s3cred;
            brix_webdav_auth              none;
            brix_allow_write              off;
            brix_webdav_checksum_on_write adler32;
        }
    }
}

# Cleartext FTP gateway with a VO-ACL rule for test_gridftp_vo_acl.py.
# Same single-worker cleartext brix_gridftp gateway as nginx_gridftp_plain.conf
# (no RFC 2228 GSI layer, so Python ftplib drives it), but with a
# brix_require_vo rule covering the "/vodata" prefix. A cleartext session
# carries no VOMS VO, so every path under /vodata must be refused (550) while
# paths outside it are unaffected (allow-all when no rule covers) — proving the
# gate enforces authorization without introducing a bypass. {PORT}/{LOG_DIR} come
# from the launcher, {DATA_ROOT} is the auto-created export tree, {BIND_HOST}
# from the spec.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 64; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_gridftp on;
        brix_export      {DATA_ROOT};
        brix_allow_write on;
        brix_require_vo  /vodata atlas;
    }
}

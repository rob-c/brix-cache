# brix_ztn_maxsz postures (test_ztn_maxsz.py, registry lifecycle): token-auth
# server accepting raw cleartext ztn credentials so the size gate is probed
# with junk tokens — the test distinguishes the size refusal from the ordinary
# validation refusal by the error text.
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR
# JWKS_FILE MAXSZ_LINE ("brix_ztn_maxsz 1k;" or empty for the uncapped
# default).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth token;
        brix_ztn_cleartext on;   # lab opt-in: raw cleartext ztn probes
        {MAXSZ_LINE}
        brix_token_jwks     {JWKS_FILE};
        brix_token_issuer   https://maxsz.test.example;
        brix_token_audience nginx-xrootd;
    }
}

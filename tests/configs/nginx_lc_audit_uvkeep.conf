# brix_cache_uvkeep (audit §4.3, upstream pfc.uvkeep) — test_cache_uvkeep.py.
#
# A root:// front whose cache decorator sits over a posix source. `uvkeep` bounds
# how long a NEVER-verified fill (verify is off here, so fills carry no origin
# digest and F_VERIFIED stays clear) is trusted: past {UVKEEP}s from its fill,
# the next open is a MISS so the cache revalidates against the source. The source
# is posix rather than a remote origin purely to keep this to ONE listener
# (lifecycle ladder slots are a packed, shared budget); the uvkeep gate sits in
# the cache decorator's open path above the source driver, so it behaves the same
# whatever source is composed under it.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.
# Session-provided: BIND_HOST.
# Test-provided: CACHE_ROOT EXPORT_ROOT UVKEEP
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_export          {EXPORT_ROOT}/uv;
        brix_cache_store     posix:{CACHE_ROOT}/uv;
        brix_cache_uvkeep    {UVKEEP};
        brix_access_log      {LOG_DIR}/brix_access.log;
    }
}

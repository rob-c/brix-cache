# Combined gsiftp:// + cleartext-ftp:// GridFTP gateway on a SINGLE export, for
# the local (no-cluster) container-tier interop runner
# (tests/cmdscripts/gridftp_interop_local.py). It mirrors the in-cluster
# topology-role gridftp_gateway.conf the `charts/gridftp-interop` release renders
# — the SAME posix export served on two listeners — so the containerised
# globus-url-copy / gfal2 / VOMS matrix
# (k8s-tests/remote-suite/tests/test_gridftp_interop.py) can be driven against a
# locally-booted gateway with rootless podman instead of a live k8s cluster.
#
# ONE worker: the posix/pblock/cleartext legs are all synchronous but never call
# back into this same nginx, so a single worker suffices — and pblock's block
# catalog is per-worker (not SHM-shared), so it MUST stay single-worker or a MKD
# on one worker is invisible to the STOR on another.  The s3 leg, which does need
# a second worker to service its co-hosted origin, lives in its own instance
# (nginx_gridftp_interop_s3.conf) precisely because of this worker-count conflict.
#
# Placeholders are substituted by the runner, NOT the LifecycleHarness (three
# listeners over shared export roots is outside the one-port-per-spec model):
#   {GSIFTP_PORT} GSI control channel (globus-url-copy / gfal2 / VOMS)
#   2810    cleartext control channel (ftplib active/passive)
#   {PBLOCK_GSIFTP_PORT} GSI control channel whose export is pblock-backed —
#                 the non-posix backend leg of the matrix (phase-82 P82.6).
#                 Cluster-free: pblock is a local SQLite catalog + block files
#                 under {PBLOCK_ROOT}, no external object store needed, so the
#                 reference client can prove a backend round-trip over gsiftp
#                 without a MinIO/pblock cluster origin.
#   {DATA_ROOT}   shared posix export    {PBLOCK_ROOT} pblock-backed export root
#   {LOG_DIR}     error log + pid        {BIND_HOST}   listen address
#   {SERVER_CERT}/{SERVER_KEY}/{CA_DIR}  PKI
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 64; }
stream {
    # GSI-secured control channel — the gsiftp:// leg of the matrix.
    server {
        listen {BIND_HOST}:{GSIFTP_PORT};
        brix_gridftp on;
        brix_gridftp_export          {DATA_ROOT};
        brix_gridftp_allow_write     on;
        brix_gridftp_gsi             on;
        brix_gridftp_certificate     {SERVER_CERT};
        brix_gridftp_certificate_key {SERVER_KEY};
        brix_gridftp_trusted_ca      {CA_DIR};
    }
    # Cleartext control channel — the ftp:// active/passive leg. Same export.
    server {
        listen {BIND_HOST}:2810;
        brix_gridftp on;
        brix_gridftp_export      {DATA_ROOT};
        brix_gridftp_allow_write on;
    }
    # Non-posix backend leg — a GSI control channel whose export routes through
    # the pblock block store (brix_gridftp_storage_backend). Proves the reference
    # client (globus-url-copy) drives a STOR/RETR THROUGH a non-posix VFS backend,
    # not just the posix export — the P82.6 backend-wiring guarantee, exercised
    # over gsiftp without a cluster.
    server {
        listen {BIND_HOST}:{PBLOCK_GSIFTP_PORT};
        brix_gridftp on;
        brix_gridftp_export          {PBLOCK_ROOT};
        
        brix_gridftp_allow_write     on;
        brix_gridftp_gsi             on;
        brix_gridftp_certificate     {SERVER_CERT};
        brix_gridftp_certificate_key {SERVER_KEY};
        brix_gridftp_trusted_ca      {CA_DIR};
    }
}

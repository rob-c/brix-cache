# brix_ocsp_stapling at VALUE granularity (test_audit16b_ocsp_stapling.py) —
# the 16th tranche's third flag.  Run per (directive, VALUE) over the 128
# `ngx_conf_set_flag_slot` directives, 106 pairs have never been written in any
# form; brix_ocsp_stapling is one of the seven directives whose BOTH arms are
# unwritten, and the only one of those seven that changes a TLS handshake.
#
# Unlike brix_ocsp_enable (a login verdict, nginx_audit16a_ocsp.conf) this flag
# is a property of the SSL_CTX: tls_config.c:118 installs
# brix_ocsp_stapling_cb via SSL_CTX_set_tlsext_status_cb when it is on.  So the
# arms are three root:// listeners that all carry `brix_tls on` and differ in
# nothing else:
#
#   {PORT}      brix_ocsp_stapling off      — no status callback installed
#   {ON_PORT}   brix_ocsp_stapling on       — callback installed
#   {DEF_PORT}  brix_ocsp_stapling ABSENT   — pins the merge default (off)
#
# Three contexts in ONE worker on purpose: SSL_CTX_set_tlsext_status_cb is
# per-SSL_CTX, and a per-server flag that quietly became process-global would
# show up here as the off planes answering like the on plane.
#
# brix_auth none: the subject is the TLS handshake, and a login that could fail
# for an authentication reason would give every "no staple arrived" a second
# possible cause.  The certificate is the suite's shared server cert, which
# carries no authorityInfoAccess — which is itself part of the finding this
# file records (see the test's DEFECT CANDIDATE #56): a staple could not be
# fetched for it even if anything tried to fetch one.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ON_PORT DEF_PORT.
# Test-provided: CERT KEY.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- stapling off: no status callback on this context --------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_tls on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_ocsp_stapling   off;
    }

    # --- stapling on: brix_ocsp_stapling_cb installed ------------------------
    server {
        listen {ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_tls on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_ocsp_stapling   on;
    }

    # --- stapling absent: whatever the merge default is ----------------------
    server {
        listen {DEF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_tls on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
    }
}

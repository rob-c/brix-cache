# A read-cache tier whose origin is an http:// endpoint that MISBEHAVES, for the
# sd_http deadline + origin-failure-mapping leg (test_audit15g_sd_http_deadline.py,
# registry lifecycle) — audit §C: "the sd_http deadline (hardcoded, untested)".
#
# Everything about the origin's failure mode is chosen by the test at runtime
# (404, refused, connected-then-silent, truncated body), so this file only has to
# be the plainest possible http:// tier — one endpoint, no failover, no retries
# above it, so an errcode arriving at the client can only have come from sd_http.
#
# NOTE what is NOT in here, because it cannot be: the origin request deadline.
# BRIX_SD_HTTP_DEFAULT_TIMEOUT_MS (fs/backend/http/sd_http.h:40) is 60 s and no
# directive reaches sd_http_inst_state.timeout_ms.  The transport's fast-fail
# bounds (CONNECTTIMEOUT / LOW_SPEED_TIME / the per-attempt cap) do have knobs —
# brix_cvmfs_origin_{connect,stall,attempt}_timeout — but cvmfs_module_merge.c:263
# applies them only `if (conf->cvmfs.enable)`, and they are process-global once
# applied.  A stream-only kXR plane like this one therefore has exactly one
# origin deadline: the compile-time constant.
#
# Reaper knobs are pinned out of reach for the same reason as the sibling files:
# brix_cache_high_watermark DEFAULTS to brix_cache_eviction_threshold
# (server_conf_merge_security.c:402, default 90%), so on a filesystem past 90%
# full this plane would silently purge the object under test.  99.9% is the
# highest the parser accepts — the ratio must be strictly below 1.0
# (fs/cache/directives.c).
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + MOCK_PORT.
# Test-provided: BIND_HOST EXPORT STORE.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=2 max_queue=256;

stream {
    server {
        listen                        {BIND_HOST}:{PORT};
        brix_root                     on;
        brix_auth                     none;
        brix_allow_write              off;
        brix_export                   {EXPORT};
        brix_storage_backend          http://{BIND_HOST}:{MOCK_PORT};
        brix_cache_store              posix:{STORE};
        brix_cache_export             /;
        brix_cache_eviction_threshold 99.9%;
        brix_cache_high_watermark     99.9%;
        brix_access_log               {LOG_DIR}/brix_access.log;
    }
}

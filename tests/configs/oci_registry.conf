# Local OCI registry (push) front — phase-104 D4.
#
# Drives test_oci_registry_push.py. There is no upstream here: this surface IS
# the source of truth, so the whole store lives under REGISTRY_ROOT and a miss
# is a 404, never a fill.
#
# Placeholders (rendered by render_config(strict=True) — every one must be
# supplied by the lane, so a forgotten value is a fatal render, not a server
# that silently comes up with the wrong policy):
#   LOG_DIR        error.log + nginx.pid live here; the registry's endpoint
#                  record names logs/nginx.pid — do not rename it.
#   BIND_HOST      PORT       this front's listener
#   REGISTRY_ROOT  the store root (blobs/ repos/ _uploads/ are created here)
#   ANON_LINES     "brix_oci_registry_allow_anonymous on;" for the open-lab
#                  leg, or "" for the leg that names an issuer instead
#   ISSUER_LINES   "brix_oci_token_issuers <scitokens.cfg>;" for the leg that
#                  authenticates, or "" — note that "" for BOTH this and
#                  ANON_LINES is refused at parse time by design (oci_merge.c),
#                  which is itself asserted by the lane
#   ALLOW_WRITE    "on" for a push registry, "off" for a read-only mirror leg
#   EXTRA_LINES    per-lane additions (blob cap, upload grace)
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;
thread_pool default threads=2;
events { worker_connections 256; }
http {
    access_log off;
    client_max_body_size 64m;
    server {
        listen {BIND_HOST}:{PORT};
        location /v2/ {
            brix_oci_registry      on;
            brix_oci_registry_root {REGISTRY_ROOT};
            brix_allow_write       {ALLOW_WRITE};
            {ANON_LINES}
            {ISSUER_LINES}
            {EXTRA_LINES}
        }
    }
}

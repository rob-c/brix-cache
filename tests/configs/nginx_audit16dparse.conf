# Parse-tier scaffold for brix_cvmfs_origin_reuse_conn (audit tranche 16,
# file 4; test_audit16d_origin_reuse.py §E).
#
# The running instances live in nginx_audit16d_reusesolo.conf and
# nginx_audit16d_reusepair.conf; this one is never started — it exists so
# `nginx -t` can be asked about a single line.  It writes the flag nowhere
# itself: a scaffold that already carried it would make every negative
# ambiguous, because a second occurrence is diagnosed as a duplicate and that
# error arrives before the one a value or arity negative is reaching for.
#
# Four slots, named here WITHOUT their braces — the renderer replaces every
# occurrence of a placeholder, comments included, and a multi-line value spliced
# into a comment turns the tail of that comment into configuration:
#
#   KNOBS      location-level lines — the value under test.
#   LOC_EXTRA  a SECOND cvmfs location, for the case that asks whether two
#              locations disagreeing about a process-global flag are diagnosed
#              at parse time (they are not).
#   HTTP_EXTRA http-level lines.  NGX_HTTP_MAIN_CONF within http is the one
#              placement whose meaning matches what the C actually does, so a
#              line here must parse.
#   OUTER      main-context lines, outside http {} entirely — the placement
#              negative.  "MAIN_CONF" reads like "the top of the file", and
#              nginx must refuse that rather than silently ignore it.
#
# `nginx -t` never binds and never fills, so PORT is a placeholder and BACKEND
# is never connected to; both only have to survive the parser.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

{HTTP_EXTRA}    server {
        listen {PORT};

        location /cvmfs/ {
            brix_cvmfs           on;
            brix_cache_store     posix:{CACHE};
            brix_storage_backend "{BACKEND}";
{KNOBS}        }
{LOC_EXTRA}    }
}

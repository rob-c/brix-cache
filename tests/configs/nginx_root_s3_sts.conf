# Native root:// gateway that mints its OUTBOUND origin credential per-request
# via S3 STS AssumeRole (phase-70 §5.5, MinIO dialect) — the end-to-end runtime
# "wire" of the STS origin leg (front-door capture -> VFS deleg gate -> sd_remote
# open), driven live in test_sts_runtime_e2e.py.
#
# Flow proven here:
#   1. brix_auth token — a WLCG bearer authenticates at the root:// front door
#      (ztn, single-round, cleartext).  tokenauth_map_identity() captures the raw
#      JWT into ctx->bearer_token (the "front-door capture").
#   2. On a read-open, brix_root_vfs_bind_deleg() sees a non-empty bearer, the
#      backend audience gate is unconfigured (passthrough-unrestricted), so it
#      binds the live bag and stamps the STS conf (brix_proto_deleg_stamp_conf ->
#      deleg_wire_stamp_sts) because brix_backend_delegation is `exchange`.
#   3. The VFS backend-cred gate materialises the live bag: brix_vfs_deleg_live_cred
#      takes the STS branch -> brix_s3_sts_assume(RoleSessionName = token sub)
#      against MinIO -> temporary (ak, sk, session).
#   4. sd_remote_open_cred signs the outbound S3 GET with those temporary creds
#      (x-amz-security-token folded), MinIO authorises, bytes flow back.
#
# THE DISCRIMINATOR: the static `brix_storage_credential` deliberately carries a
# WRONG secret.  A successful byte-exact read can ONLY be the STS-minted temporary
# credential authenticating the origin leg — never the static fallback.  The
# {DELEGATION}/{S3_STS_SK} placeholders let the test flip STS off (select) or
# corrupt the STS service secret to prove the two fail-closed negatives.
#
# Single worker: the backend (MinIO S3 + STS) is EXTERNAL (docker), so the
# synchronous outbound legs never contend with a co-hosted inbound plane — unlike
# nginx_root_s3_staged.conf there is no self-deadlock to avoid.
#
# Launcher-provided:            LOG_DIR TMP_DIR PORT (=root://) DATA_ROOT.
# Test-provided (template_values): BIND_HOST TOKEN_DIR MINIO_HOST MINIO_PORT
#   BUCKET S3_AK S3_STATIC_SK (wrong) S3_STS_SK (service secret) DELEGATION.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    # Static service credential with a DELIBERATELY WRONG secret: it is the
    # fallback sd_remote would sign with if STS never engaged.  Its wrongness is
    # what makes a successful read a proof of the STS exchange.
    brix_credential badstatic {
        s3_access_key {S3_AK};
        s3_secret_key {S3_STATIC_SK};
        s3_region     us-east-1;
    }

    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_export             {DATA_ROOT};
        brix_storage_backend    s3://{MINIO_HOST}:{MINIO_PORT}/{BUCKET};
        brix_storage_credential badstatic;

        brix_auth              token;
        brix_token_jwks        {TOKEN_DIR}/jwks.json;
        brix_token_issuer      "https://test.example.com";
        brix_token_audience    "nginx-xrootd";
        brix_token_clock_skew  5;

        # Per-request STS AssumeRole against MinIO for the outbound origin leg.
        brix_backend_delegation        {DELEGATION};
        brix_backend_s3_sts_endpoint   http://{MINIO_HOST}:{MINIO_PORT};
        brix_backend_s3_sts_access_key {S3_AK};
        brix_backend_s3_sts_secret_key {S3_STS_SK};
        brix_backend_s3_sts_region     us-east-1;
        brix_backend_s3_sts_ttl        3600;
        brix_backend_s3_sts_flavor     minio;
    }
}

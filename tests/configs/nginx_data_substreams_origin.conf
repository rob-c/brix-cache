daemon on;
error_log {LOG_DIR}/e.log info;
pid {PID_FILE};
load_module {STREAM_MODULE};
load_module {BRIX_MODULE};
worker_processes 2;
events {{ worker_connections 64; }}
stream {{
    server {{
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_export {DATA_DIR};
        brix_auth none;
        brix_allow_write on;
    }}
}}

# The STREAM plane's co-residency backlog in one nginx
# (test_audit15m_stream_coresidency.py, §Method step 3 continued).
#
# Tranches 11 and 12 closed the http-plane half of the block-granularity gap
# list.  What survives is entirely stream-plane, six pairs in two clusters:
#
#   proto:tap_proxy x sec:tls · proto:tap_proxy x sec:readonly
#   proto:gridftp x store:posix · proto:gridftp x xfer:cms
#   proto:gridftp x proto:root · store:httpbe x xfer:cms
#
# Each one asks the same question the S3 tranche asked and got three different
# answers to: an operator writes a directive from the OTHER namespace on this
# listener — is it enforced, ignored, or does it shadow the listener entirely?
#
# THE STREAM PLANE HAS NO PROTOCOL-EXCLUSIVITY CHECK.  brix_http_proto_
# exclusive_check() (proto_exclusive.c:265) rejects two brix protocols on one
# http listen port by name.  Nothing does that here: `brix_root on` and
# `brix_gridftp on` in one stream server pass `nginx -t` and the listener
# greets with "220 BriX GridFTP Gateway ready" — the root export is shadowed
# with no diagnostic.  That shape is block 4 below, on purpose, because a pair
# the matrix wants closed is only closed by a block that actually runs it.
#
# THE BLOCKS
#   {ORIGIN_PORT}      root origin, posix, brix_allow_write ON.  The tap proxy
#                      fronts it; being writable is what makes the read-only
#                      question below have two possible answers.
#   {PORT}             THE TAP PROXY: brix_tls (client leg) + brix_read_only,
#                      forwarding to {ORIGIN_PORT}.  brix_tls arms the
#                      in-protocol upgrade without demanding it, so the same
#                      port serves as its own cleartext control.
#   {GRIDFTP_PORT}     the gridftp door, carrying two directives from other
#                      namespaces: brix_storage_backend (root plane; gridftp
#                      has its own brix_gridftp_storage_backend) and the CMS
#                      client leg, plus `brix_root on` — the shadowing above.
#   {SHADOW_PORT}      the same two protocol directives in the other order,
#                      which is the whole difference: root wins there.  It
#                      doubles as the read-only control: brix_read_only on a
#                      listener that serves its own storage really does refuse
#                      the write the proxy above forwards.
#   {HTTPBE_PORT}      a root data server whose backend is the http origin and
#                      which is also a cluster member: store:httpbe x xfer:cms.
#                      It registers /httpspace and the door registers
#                      /doorspace, so placement is a function of the path; a
#                      member holding "/" would be a candidate for the door's
#                      subtree too (srv_path_matches, registry_select.c:28).
#   {MGR_PORT}         the manager's root face — kXR_locate lands here, and its
#                      answer is what proves (or disproves) that a door which
#                      registered is a door a client can be sent to.
#   {CMS_PORT}         the manager's CMS listener.  brix_cms_server replaces
#                      the stream handler for its whole server block, so it
#                      needs a port of its own (nginx_cms_locate_have.conf).
#   {HTTP_ORIGIN_PORT} the WebDAV origin {HTTPBE_PORT} reads through.
#
# worker_processes 2 for the same reason nginx_audit15l_httpcores.conf gives:
# one worker fetching from an http origin inside its own nginx deadlocks.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + ledger extras
# ORIGIN_PORT GRIDFTP_PORT HTTPBE_PORT MGR_PORT CMS_PORT HTTP_ORIGIN_PORT.
# Session-provided: BIND_HOST.
# Test-provided: CERT KEY CA EXPORT_ROOT (every path must exist at
#                config-parse time — lifecycle.start runs `nginx -t` first).
daemon on;
worker_processes 2;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # --- the upstream the proxy fronts: writable, cleartext ---------------- #
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        brix_listen_port     {ORIGIN_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{DATA_ROOT}/origin;
        brix_allow_write     on;
    }

    # --- the tap proxy: client-leg TLS and a read-only policy -------------- #
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port          {PORT};
        brix_root                 on;
        brix_auth                 none;
        brix_tap_proxy            on;
        brix_tap_proxy_upstream   {BIND_HOST}:{ORIGIN_PORT};
        brix_tap_proxy_auth       anonymous;
        # A third foreign namespace on this listener, and the pair the file
        # creates by existing: a REMOTE storage backend on a block that
        # forwards.  The proxy diversion (dispatch.c:94) precedes storage, so
        # this http origin is never read here — the same "declared, inert"
        # answer the door gives brix_storage_backend, on a different plane.
        brix_storage_backend      http://{BIND_HOST}:{HTTP_ORIGIN_PORT};
        # The two directives the matrix had never seen on a proxy listener.
        brix_read_only            on;
        brix_tls                  on;
        brix_certificate          {CERT};
        brix_certificate_key      {KEY};
        brix_trusted_ca           {CA};
    }

    # --- the gridftp door wearing three foreign directives ----------------- #
    # DIRECTIVE ORDER IS LOad-BEARING HERE, which is the finding: root is
    # declared FIRST so that brix_gridftp, declared last, wins the handler and
    # this block really is a door.  The mirrored block below writes the same
    # two directives the other way round and is a root server instead.
    server {
        listen {BIND_HOST}:{GRIDFTP_PORT};
        brix_listen_port         {GRIDFTP_PORT};
        # Root-plane storage namespace on a door that reads brix_gridftp_
        # storage_backend.  The decoy tree holds a file the ftp export does
        # not, so "which namespace won" is decidable by listing the door.
        brix_root                on;
        brix_auth                none;
        brix_storage_backend     posix:{DATA_ROOT}/decoy;
        brix_gridftp             on;
        brix_gridftp_export      {DATA_ROOT}/ftp;
        brix_gridftp_allow_write on;
        # The CMS client leg: a door that registers into the cluster and
        # advertises {GRIDFTP_PORT} as its data endpoint.  It claims a
        # namespace of its own rather than "/" so that a client asking the
        # manager for /doorspace/... can only be sent here — with both members
        # claiming "/" the manager's choice between them is not the subject,
        # and the question this pair asks is what happens when the door IS
        # chosen.
        brix_cms_manager         {BIND_HOST}:{CMS_PORT};
        brix_cms_paths           /doorspace;
        brix_cms_interval        1;
    }

    # --- the same two directives, written the other way round -------------- #
    # Nothing distinguishes this block from the one above except the order of
    # `brix_root on` and `brix_gridftp on`.  Three modules assign
    # cscf->handler from their own directive setter (server_conf.c:365,
    # ftp_module.c:54, cms/server_module.c:126) and nothing arbitrates, so the
    # last one written owns the port: this listener answers the ROOT protocol
    # and the door is silently gone.
    #
    # It also carries brix_read_only ON TOP OF brix_allow_write, which is the
    # control for the tap proxy above: the identical pair of directives on a
    # listener that serves its own storage refuses the write at the protocol
    # edge (brix_shared_apply_read_only, shared_conf.h:146), so the proxy
    # arm's acceptance is the proxy's doing and not the directive's.
    server {
        listen {BIND_HOST}:{SHADOW_PORT};
        brix_listen_port         {SHADOW_PORT};
        brix_gridftp             on;
        brix_gridftp_export      {DATA_ROOT}/ftp;
        brix_gridftp_allow_write on;
        brix_root                on;
        brix_auth                none;
        brix_storage_backend     posix:{DATA_ROOT}/decoy;
        brix_allow_write         on;
        brix_read_only           on;
    }

    # --- a cluster member whose storage is a remote http origin ------------ #
    server {
        listen {BIND_HOST}:{HTTPBE_PORT};
        brix_listen_port     {HTTPBE_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend http://{BIND_HOST}:{HTTP_ORIGIN_PORT};
        brix_export          {EXPORT_ROOT}/httpbe;
        brix_cms_manager     {BIND_HOST}:{CMS_PORT};
        # /httpspace, NOT "/": srv_path_matches() (registry_select.c:28)
        # short-circuits the "/" token to match every path, so a member holding
        # it is a candidate for the door's subtree too and the selection ladder
        # picks between the two by load.  Disjoint namespaces make placement a
        # function of the path, which is what turns "the manager sent an xrootd
        # client to an FTP banner" into evidence instead of a coin flip.
        brix_cms_paths       /httpspace;
        brix_cms_interval    1;
    }

    # --- the manager: root face (kXR_locate) ------------------------------- #
    server {
        listen {BIND_HOST}:{MGR_PORT};
        brix_listen_port     {MGR_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{DATA_ROOT}/mgr;
        brix_manager_mode    on;
        brix_cms_locate_window 500ms;
    }

    # --- the manager: CMS registration face -------------------------------- #
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server          on;
        brix_cms_server_interval 1;
    }
}

http {
    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    # The origin {HTTPBE_PORT} reads through.  Same nginx, second worker.
    server {
        listen {BIND_HOST}:{HTTP_ORIGIN_PORT};
        server_name localhost;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT}/httporigin;
            brix_webdav_auth     none;
        }
    }
}

# Parse-tier scaffold for the five disabling tokens
# (test_audit15z_disable_tokens.py).
#
# Never started; it exists so `nginx -t` can be asked about one line.  It writes
# none of the five directives itself, because four of them are diagnosed as
# duplicates on a second occurrence and that error would land before the value a
# negative case is trying to reach — the rejection would look identical to the
# one being proved.
#
# Four slots, named here WITHOUT their braces: the renderer replaces every
# occurrence of a placeholder including the ones inside comments, and a
# multi-line value spliced into a comment turns the tail of that comment into
# live configuration.
#
#   KNOBS      lines inside the stream server — the token under test, and for
#              the duplicate-guard cases the SAME directive written twice.
#   SECOND     lines inside a second stream server.  brix_seccomp's setter
#              writes a process-global, so "two servers disagreeing" is a real
#              configuration the parser has an opinion about (it does not).
#   HTTP_LINES lines inside an http{} server.  brix_seccomp is declared for the
#              http contexts too and must parse there; the other four are
#              stream-only and must not.
#   OUTER      main-context lines, outside stream{} and http{} entirely — the
#              placement negative.  A directive nginx does not know in that
#              context must be refused, not silently ignored.
#
# `nginx -t` never binds, so PORT/SECOND_PORT are placeholders.  The http server
# exists only when HTTP_LINES is non-empty, but it is always present: an empty
# http{} block costs nothing at parse time and keeps one template for both.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

    server {
        listen {HTTP_PORT};
{HTTP_LINES}    }
}

stream {
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
{KNOBS}    }

    server {
        listen {SECOND_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
{SECOND}    }
}

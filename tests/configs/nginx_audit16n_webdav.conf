# The five location-scoped WebDAV flags at VALUE granularity (audit tranche 16,
# file 14; test_audit16n_webdav_module_flag_arms.py).  ONE listener, FIVE
# server_name vhosts, twenty locations, one posix export.
#
# THE FIVE, AND WHY THEY ARE ONE FILE
#   brix_webdav                   module_commands.c:49    common.enable
#   brix_webdav_upload_resume     module_commands.c:270   upload_resume
#   brix_webdav_tape_rest         module_commands.c:294   tape_rest
#   brix_delegation_endpoint      module_commands.c:303   delegation_endpoint
#   brix_webdav_cors_credentials  module_commands.c:377   cors_credentials
#
#   Each is declared NGX_HTTP_LOC_CONF|NGX_CONF_FLAG and nothing else — one legal
#   context, one setter, one merge — and for each one the corpus had written only
#   `on`.  Four merge to 0 (config_merge.c:88, :95, :124-125 + shared_conf.h:339)
#   and upload_resume merges to 1 (config_merge.c:91), which is why they are worth
#   taking together: on the four, `off` and absent must agree, and on the fifth
#   `off` is the ONLY spelling that turns the feature off at all — the `on` arm
#   the corpus does write is the redundant one.
#
# WHY VHOSTS AND NOT LISTENERS
#   None of the five has a server-level arm to buy a listener for.  The vhosts are
#   here because two of the five gate an ABSOLUTE URI prefix rather than the
#   location they are written in — /api/v1/ (dispatch.c:231-245) and the gridsite
#   /.well-known/brix-delegation/ form (dispatch.c:199-228) — so their arms cannot
#   be adjacent locations in one server: the URI space is the same for all of them
#   and holds exactly one value.  Four `location /` blocks under four
#   `server_name`s cost no ledger port and are selected with a Host: header.
#
# WHY /wd-parent/ HAS CHILDREN
#   brix_webdav merges with ngx_conf_merge_value(...,0) against the PARENT
#   LOCATION's value, and a nested location is the only place that parent can be
#   anything but zero — brix_webdav may not be written in server{} or http{}.  So
#   inside a parent that wrote `on`, absent inherits `on` and only `off` disables
#   the child.  That is the one case where `off` is not interchangeable with saying
#   nothing, and it needs a nested location to exist at all.
#
# THE ARMS
#
#   default vhost (Host: localhost) — every location-scoped arm.  Each triple is
#   the SAME body as /ref/ with one token changed, so a verdict that differs
#   between two of them is the flag and nothing else:
#     /ref/               the control (brix_webdav on, writable, anonymous)
#     /wd-off/            brix_webdav off          /wd-bare/  unwritten
#     /wd-parent/         brix_webdav on, with two children:
#       .../child-bare/     unwritten  -> inherits the parent's `on`
#       .../child-off/      brix_webdav off -> the only way to disable a child
#     /ur-on|off|bare/    brix_webdav_upload_resume     (merge default 1)
#     /de-on|off|bare/    brix_delegation_endpoint      (suffix form, PUT)
#     /cc-on|off|bare/    brix_webdav_cors_credentials over a `*` allowlist
#     /cx-on|off/         the same over a CONCRETE allowlist, which separates the
#                         Allow-Credentials header from the wildcard rule: a `*`
#                         entry may not be echoed literally to a credentialed
#                         request (cors.c:68-71), so on the `*` pair the flag
#                         changes the Allow-Origin VALUE and not just a header.
#
#   Host: abs-on.test / abs-off.test / abs-bare.test — one `location /` each,
#   carrying BOTH absolute-prefix flags at the same arm, because a request is
#   answered by at most one of them and the prefixes do not overlap.
#
#   Host: abs-mixed.test — brix_webdav_tape_rest on + brix_delegation_endpoint off.
#   The attribution control: each flag gates its own prefix and nothing else, so a
#   404 on one prefix and a 200 on the other cannot be explained by the vhost.
#
# THE SEEDED SHADOW FILES
#   The export deliberately contains real files UNDER both reserved prefixes
#   (api/v1/plain.txt and .well-known/brix-delegation/request).  With the flags
#   off they are ordinary objects; with the flags on the router answers instead and
#   the files become unreachable.  That is measured, not assumed: the `off` arm is
#   the only way to see that the `on` arm captured a piece of the export namespace.
#
# The [warn] advisories at startup are earned: an anonymous WebDAV export that
# permits writes is exactly what brix_shared_security_gate advises about, and
# every arm here needs writes (three of the five are measured on PUT).  The parse
# scaffold nginx_audit16nparse.conf owns everything that must not start.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST CORS_ORIGIN.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    # ---- the default vhost: every location-scoped arm ---------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location /ref/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        location /wd-off/ {
            brix_webdav          off;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        location /wd-bare/ {
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        # The nested trio: the parent is the only writable parent value the flag
        # can ever have, because it is legal in no scope above a location.
        location /wd-parent/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;

            location /wd-parent/child-bare/ {
            }

            location /wd-parent/child-off/ {
                brix_webdav      off;
            }
        }

        location /ur-on/ {
            brix_webdav                on;
            brix_storage_backend       posix:{DATA_ROOT};
            brix_webdav_auth           none;
            brix_allow_write           on;
            brix_webdav_upload_resume  on;
        }

        location /ur-off/ {
            brix_webdav                on;
            brix_storage_backend       posix:{DATA_ROOT};
            brix_webdav_auth           none;
            brix_allow_write           on;
            brix_webdav_upload_resume  off;
        }

        location /ur-bare/ {
            brix_webdav                on;
            brix_storage_backend       posix:{DATA_ROOT};
            brix_webdav_auth           none;
            brix_allow_write           on;
        }

        location /de-on/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_delegation_endpoint  on;
        }

        location /de-off/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_delegation_endpoint  off;
        }

        location /de-bare/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
        }

        location /cc-on/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{DATA_ROOT};
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_cors_origin       *;
            brix_webdav_cors_credentials  on;
        }

        location /cc-off/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{DATA_ROOT};
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_cors_origin       *;
            brix_webdav_cors_credentials  off;
        }

        location /cc-bare/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{DATA_ROOT};
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_cors_origin       *;
        }

        # The same pair over a concrete allowlist: no wildcard, so the only thing
        # the flag can change here is the Allow-Credentials header itself.
        location /cx-on/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{DATA_ROOT};
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_cors_origin       {CORS_ORIGIN};
            brix_webdav_cors_credentials  on;
        }

        location /cx-off/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{DATA_ROOT};
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_cors_origin       {CORS_ORIGIN};
            brix_webdav_cors_credentials  off;
        }
    }

    # ---- the absolute-prefix arms: both flags on --------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name abs-on.test;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_webdav_tape_rest     on;
            brix_delegation_endpoint  on;
        }
    }

    # ---- both flags written off -------------------------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name abs-off.test;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_webdav_tape_rest     off;
            brix_delegation_endpoint  off;
        }
    }

    # ---- neither flag written: the merge default --------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name abs-bare.test;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
        }
    }

    # ---- one on, one off: the attribution control --------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name abs-mixed.test;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_webdav_tape_rest     on;
            brix_delegation_endpoint  off;
        }
    }
}

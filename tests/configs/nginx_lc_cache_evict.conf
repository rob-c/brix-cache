# Operator cache-evict command template (test_cache_evict_cmd.py, registry
# lifecycle): a posix export with a posix cache tier, so a read fills the
# cache and `xrdfs cache evict <path>` has a cached object to drop.
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR
# CACHE_LINE (the full "brix_cache_store posix:<dir>;" directive, or empty for
# the cacheless-refusal posture) and ALLOW_WRITE (on for the evict-capable
# posture, off for the read-only security-neg).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        {CACHE_LINE}
        brix_auth none;
        brix_allow_write {ALLOW_WRITE};
    }
}

# brix_signing_policy at VALUE granularity (test_audit15v_signing_policy.py) —
# the 15th tranche.  Two of the three tokens (`off`, `on`) are written nowhere
# in the suite on any plane; `require` appears once, and only inside an
# `nginx -t` (test_audit15_zero_directive_parse.py), never on a live login.
#
# The WebDAV twin `brix_webdav_signing_policy` IS driven live over davs://
# (test_wlcg_conformance_signing_policy.py) — with bare EEC credentials.  The
# GSI/ROOT plane presents a PROXY chain, and the enforcement walk
# (gsi_verify.c:81) SKIPS every EXFLAG_PROXY link, so the two planes exercise
# different halves of the same rule and neither substitutes for the other.
#
# The token is a `server {}`-level directive whose whole observable is a login
# verdict, so every arm is a listener on ONE instance over ONE hashed CA dir:
#
#   {PORT}     brix_signing_policy off      — the namespace rule is not applied
#   {ON_PORT}  brix_signing_policy on       — applied where a policy file exists
#   {REQ_PORT} brix_signing_policy require  — a CA with no policy file is fatal
#   {DEF_PORT} the directive ABSENT         — pins the merge default
#
# {CA} is a hashed directory holding THREE anchors, because the three tokens are
# only distinguishable across issuers that differ in what they publish:
#
#   * a CA WITH a signing_policy whose cond_subjects glob ends in `*` — the
#     in-namespace and out-of-namespace credentials both hang off this one, and
#     they are what separates `off` from `on`;
#   * a CA with NO signing_policy file at all — accepted under `on` (nothing to
#     enforce), refused under `require` (store_policy.c:284), which is the ONLY
#     input that separates those two tokens;
#   * a CA whose glob names one EXACT subject DN with no trailing wildcard — its
#     EEC matches, the proxy minted from that EEC does not, so an accepted login
#     there is direct evidence of the proxy exemption.
#
# No brix_crl anywhere: crl_mode then defaults to `try` over an empty CRL set,
# which arms nothing (see nginx_audit15u_crlmode.conf), so revocation cannot put
# a second reason in front of any refusal.  brix_allow_write is off for the same
# reason — every assertion here is a login verdict on a read.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ON_PORT REQ_PORT DEF_PORT.
# Test-provided: CERT KEY CA (every path must exist at config-parse time).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- off: the policy files are compiled and then not consulted -----------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_signing_policy  off;
    }

    # --- on: enforce where a policy file exists, tolerate a CA without one ---
    server {
        listen {ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_signing_policy  on;
    }

    # --- require: a CA with no policy file may not sign anything -------------
    server {
        listen {REQ_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_signing_policy  require;
    }

    # --- the directive absent: whatever the merge default is -----------------
    server {
        listen {DEF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
    }
}

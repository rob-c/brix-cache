# The phase-70 whole-object staged writer, WITHOUT io_uring
# (test_audit15i_staged_writev.py, registry lifecycle) — the isolation arm for
# the §B2.13 finding.
#
# §B2.13 (io_uring x tiers) was written in tranche 5 and could not run: the
# default test binary is built without liburing, so all five tests skipped.
# Rebuilt with BRIX_ENABLE_IO_URING=1 the row finally executes, and the staged
# arm fails — a kXR_writev on a handle the staged writer has just opened for
# WRITE is refused with kXR_FileNotOpen while a plain kXR_write on that same
# handle succeeds.  This conf is the control that says whether the ring is to
# blame: the SAME topology (http:// backend -> whole-object staging -> one
# committing PUT) with no `brix_io_uring` anywhere.
#
#   {ORIGIN_PORT} plain WebDAV posix origin — the source of truth, and the
#                 backend the staged front commits into.
#   {PORT}        root:// staged writer over that origin.  An http:// backend
#                 advertises no RANDOM_WRITE, so a WRITE open cannot hold a
#                 local descriptor: the bytes accumulate in brix_stage_dir and
#                 the close commits the whole object in one PUT.  That is
#                 exactly the handle shape kXR_writev's admission check does
#                 not recognise.
#   {POSIX_PORT}  root:// over a bare posix export, no staging and no backend.
#                 The universality control: the writev handle guard's
#                 fall-through is reproduced here with a handle that was never
#                 opened at all, so the finding is about the guard, not about
#                 staging.
#
# worker_processes 2: the stream front fetches from / commits to the http
# origin inside this same nginx, so a single worker would deadlock on itself
# (same reason as nginx_audit15e_uring_tiers.conf).
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + ORIGIN_PORT POSIX_PORT.
# Test-provided: BIND_HOST ORIGIN_ROOT EXPORT_ROOT POSIX_ROOT SPOOL_DIR.
daemon on;
worker_processes 2;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2 max_queue=1024;
events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{ORIGIN_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
        brix_export          {EXPORT_ROOT};
        brix_allow_write     on;
        brix_stage_dir       {SPOOL_DIR};
        brix_upload_resume   off;
    }

    # The universality control: no backend, no staging, no ring — just a posix
    # export whose handles DO carry a local descriptor.
    server {
        listen {BIND_HOST}:{POSIX_PORT};
        brix_root        on;
        brix_auth        none;
        brix_export      {POSIX_ROOT};
        brix_allow_write on;
    }
}

# phase-115 W8.2 (tests/test_phase115_tpc_cred_renew.py): one template for both
# roles of the mid-transfer credential-renewal lab.  ROLE_KNOBS carries EVERY
# role-specific line — the source's `brix_auth token` + JWKS + clock skew, or a
# destination's `brix_auth none` + outbound credential mode + renewal knobs —
# because the two roles differ in their auth plane, not merely in a directive or
# two, and one slot keeps the shape of the lab visible in the test file rather
# than split across a template.  Keep placeholders out of comments:
# substitution is textual, and a multi-line value expanded inside a comment
# leaks directives to main context.
# Launcher-provided: PORT LOG_DIR DATA_ROOT.  Test-provided: BIND_HOST ROLE_KNOBS.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_allow_write on;
        brix_tpc_allow_local on;
{ROLE_KNOBS}    }
}

# Native root:// TPC destination whose outbound credential mode is RFC 8693
# token exchange (registry lifecycle, test_audit15c_tpc_token_exchange.py).
# The token endpoint is a capturing Python mock; TOKEN_ENDPOINT selects the
# good / dead / junk-response variant and OUTBOUND_KNOBS carries the optional
# client-credential lines, so one template serves all four instances.  Keep
# placeholders out of comments — substitution is textual, and a multi-line
# value expanded inside a comment leaks directives to main context.
# Launcher-provided: PORT LOG_DIR DATA_ROOT.
# Test-provided: BIND_HOST BEARER_FILE TOKEN_ENDPOINT OUTBOUND_KNOBS.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_outbound_bearer_file {BEARER_FILE};
        brix_tpc_outbound_token_endpoint {TOKEN_ENDPOINT};
{OUTBOUND_KNOBS}    }
}

# Multi-manager parent-lookup node — registry-lifecycle template for
# test_cms_multi_manager.py.  A manager-mode node that logs into TWO stand-in
# CMS parents concurrently; registry misses rotate kYR_locate over the live
# links (redundancy + failover under test).
# Launcher-provided: LOG_DIR PORT.
# Test-provided: MANAGER_PORT_A MANAGER_PORT_B.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log debug;

events { worker_connections 128; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_auth none;
        brix_manager_mode on;
        brix_cms_manager 127.0.0.1:{MANAGER_PORT_A} 127.0.0.1:{MANAGER_PORT_B};
        brix_cms_paths /;
        brix_cms_interval 2;
        brix_cms_locate_timeout 1s;
        brix_listen_port {PORT};
    }
}

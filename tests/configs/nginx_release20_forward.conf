# 2.0 F5 forwarding proxy (client-named root:// origins, XrdPss forwarding
# mode) for test_release20_forward_proxy.py — one stream server whose storage
# line is under test.  Also rendered for `nginx -t` grammar checks.
# Launcher-provided: LOG_DIR PORT.
# Test-provided via template_values: BIND_HOST FWD_LINES (the
# brix_storage_backend forward:// line, or the store lines a grammar case
# probes, each indented 8 and newline-terminated).
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
{FWD_LINES}    }
}

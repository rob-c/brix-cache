events { worker_connections 16; }
http {
    access_log off;
    server {
        listen {BIND_HOST}:{PARSE_PORT};
        brix_allow_write on;
        brix_read_only on;
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA};
            brix_webdav_auth none;
        }
    }
}
{REFUSAL}

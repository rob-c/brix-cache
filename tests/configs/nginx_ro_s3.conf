# Phase-105 W4 read-only S3 endpoint (tests/test_audit15_read_only.py).
#
# Anonymous (no SigV4) so the tests exercise the read-only policy and nothing
# else: an auth failure would answer 403 too, and a suite that cannot tell the
# two apart proves nothing.  The knobs slot below carries the
# read_only/allow_write pair under test, so the same template renders both
# the subject and its writable control.  Rendered through the phase-81
# registry (LifecycleHarness).
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_bucket       robucket;
            brix_s3_max_keys     1000;
{S3_KNOBS}        }
    }
}

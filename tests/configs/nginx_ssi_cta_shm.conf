# Two-worker SSI/CTA stream template for tests/test_phase115_cta_shm_queue.py.
# The worker count is the point: the CTA request queue is ONE shared-memory
# zone for the whole worker set, and the defect it replaced (a per-worker
# static queue whose next_id restarted in every process) is only visible with
# more than one worker.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.  Test-provided: BIND_HOST JOURNAL.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_ssi on;
        brix_ssi_service cta;
        brix_ssi_cta_executor test;
        brix_ssi_cta_journal {JOURNAL};
    }
}

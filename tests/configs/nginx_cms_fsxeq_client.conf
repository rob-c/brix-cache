# CMS *client* (data node) whose forwarded namespace ops may be executed by an
# operator program — registry-lifecycle template for test_release20_cms_fsxeq.py
# (2.0 F17, stock cms.fsxeq).  The node dials a Python manager peer which then
# forwards kYR_chmod/mkdir/mkpath/mv/rm/rmdir/trunc; the brix_cms_fsxeq lines a
# test supplies decide which of those the program answers instead of the
# built-in POSIX leg.
#
# The program runs on a thread-pool task, so the THREAD_POOL slot normally
# carries a `thread_pool default …` line.  A plane that leaves it EMPTY is
# testing the fail-closed direction: with nowhere to post the run, every
# configured op must be refused rather than quietly fall through to the
# built-in filesystem leg.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: MANAGER_PORT, plus two whole-line slots — THREAD_POOL and
# EXTRA_DIRECTIVES (the brix_cms_fsxeq family, brix_allow_write,
# brix_sss_keytab).
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
{THREAD_POOL}
events { worker_connections 128; }
stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_manager 127.0.0.1:{MANAGER_PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
        brix_listen_port {PORT};
{EXTRA_DIRECTIVES}    }
}

# 2.0 F7 lab: native root:// TPC multi-stream pulls.
#
# Planes (all root://, anonymous, loopback pulls allowed):
#   PORT         destination that honours tpc.str up to four streams
#   ONE_PORT     destination capped at a single stream (brix_tpc_streams 1)
#   SRC_PORT     the posix source, kXR_bind on (the default)
#   NOBIND_PORT  the same data behind a source that refuses kXR_bind
#
# Every plane exports a distinct root: the backend registry is keyed by the
# canonical export path, so two planes on one root would share one backend.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=4 max_queue=256;

events {
    worker_connections 128;
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port {PORT};
        brix_root on;
        brix_storage_backend posix:{DST_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_require_source_size on;
        brix_tpc_streams 4;
        brix_access_log {LOG_DIR}/brix_access_dst.log;
    }

    server {
        listen {BIND_HOST}:{ONE_PORT};
        brix_listen_port {ONE_PORT};
        brix_root on;
        brix_storage_backend posix:{ONE_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_streams 1;
        brix_access_log {LOG_DIR}/brix_access_one.log;
    }

    server {
        listen {BIND_HOST}:{SRC_PORT};
        brix_listen_port {SRC_PORT};
        brix_root on;
        brix_storage_backend posix:{SRC_DIR};
        brix_auth none;
        brix_access_log {LOG_DIR}/brix_access_src.log;
    }

    server {
        listen {BIND_HOST}:{NOBIND_PORT};
        brix_listen_port {NOBIND_PORT};
        brix_root on;
        brix_storage_backend posix:{SRC2_DIR};
        brix_auth none;
        brix_data_substreams off;
        brix_access_log {LOG_DIR}/brix_access_nobind.log;
    }
}

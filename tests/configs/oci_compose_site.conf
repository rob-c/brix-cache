# The CONSUMING site of the D14 composition — phase-104 D14, second half.
# Drives the union legs of tests/test_oci_compose_secure.py.
#
# A cache front whose clients see ONE repo name: brix_cvmfs_virtual_repo
# unions the ingested-images repo behind the site's main software repo, and
# brix_cvmfs_repo_authz gates the image member alone. The two together are the
# security property under test — a 404 from the main member advances the walk,
# a 401 from the gated member ends it, and no credential-less read can fall
# through one member into another.
#
# TLS is not decoration here: a repo behind brix_cvmfs_repo_authz refuses a
# cleartext request before it examines any token, so the front has to be https
# for the gate to be reachable at all.
#
# Placeholders (render_config(strict=True) — a missing one is a fatal render):
#   LOG_DIR       error.log + nginx.pid; the endpoint record names
#                 logs/nginx.pid — do not rename it
#   BIND_HOST     PORT        this front's listener
#   SSL_CERT      SSL_KEY     throwaway server certificate
#   ORIGIN_HOST   ORIGIN_PORT the Stratum-0 this front replicates from
#   CACHE_DIR     the front's cache store (posix:)
#   VIRT          the client-visible repo name (exists nowhere upstream)
#   MEMBER_MAIN   MEMBER_IMG  members in precedence order
#   ISSUERS       scitokens.cfg gating MEMBER_IMG
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;
thread_pool default threads=2;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen {BIND_HOST}:{PORT} ssl;
        ssl_certificate     {SSL_CERT};
        ssl_certificate_key {SSL_KEY};
        location /cvmfs/ {
            brix_cvmfs              on;
            brix_storage_backend    http://{ORIGIN_HOST}:{ORIGIN_PORT};
            brix_cache_store        posix:{CACHE_DIR};
            brix_cvmfs_virtual_repo {VIRT} {MEMBER_MAIN} {MEMBER_IMG};
            brix_cvmfs_repo_authz   {MEMBER_IMG} {ISSUERS};
        }
    }
}

# Parse-tier scaffold for the krb5 stream-server flags (audit tranche 16):
# brix_krb5_ip_check (file 5; test_audit16e_krb5_ip_check.py §E) and
# brix_krb5_delegate (file 19; test_audit16s_krb5_delegate_arms.py §I).
#
# Shared rather than copied per subject.  What a parse tier for one of these
# needs is a stream server to put the line in, a second one to put a disagreeing
# line in, and the three placements where it must be refused — which is this
# file and nothing else, so a per-directive copy would differ only in the name
# in its header.  It stays reusable precisely because it writes no directive of
# its own (see below); each consumer hands in its own line through KNOBS.
#
# The running instances live in nginx_audit16e_ipcheck.conf and
# nginx_audit16s_krb5_delegate.conf; this one is never started — it exists so
# `nginx -t` can be asked about a single line.  It writes neither directive
# itself: a scaffold that already carried one would make that subject's
# negatives ambiguous, because a second occurrence is diagnosed as a duplicate
# and that error arrives before the one a value or arity negative is reaching
# for.
#
# It also configures no `brix_auth krb5`, on purpose.  The parse tier must not
# need a provisioned realm, a keytab or a KDC to run — those are what make the
# §B cases skippable, and the tier that costs nothing should not inherit them.
# The consequence is that the flag here lands on a server that can never read
# it, which is itself one of the cases (nothing diagnoses that, and nothing
# can: a flag slot has no view of the auth method).
#
# Five slots, named here WITHOUT their braces — the renderer replaces every
# occurrence of a placeholder, comments included, and a multi-line value spliced
# into a comment turns the tail of that comment into configuration:
#
#   KNOBS        stream server-level lines — the value under test.  This is the
#                only placement the C actually reads (NGX_STREAM_SRV_CONF).
#   SRV_EXTRA    a whole SECOND stream server, for the case that asks whether
#                two servers disagreeing about a per-server flag are diagnosed
#                (they are not, and must not be — unlike the process-global
#                flag one file earlier, disagreement here is meaningful).
#   STREAM_EXTRA inside stream {} but outside any server {} — the placement
#                negative that reads like a site-wide default.
#   HTTP_KNOBS   inside an http server — the placement negative for the WebDAV
#                face, which has its own auth and no use for this flag.
#   OUTER        main context, outside stream {} entirely.
#
# `nginx -t` never binds a listen, so all three ports are placeholders that only
# have to survive the parser.  The two stream servers still need DIFFERENT
# numbers — ngx_stream_core_listen refuses a repeated address/port pair before
# it ever gets to the directive under test — while the http server reuses the
# first one, which is legal and invisible precisely because nothing binds.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

stream {
{STREAM_EXTRA}    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA};
{KNOBS}    }
{SRV_EXTRA}}

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

    server {
        listen {HTTP_PORT};
{HTTP_KNOBS}    }
}

# Parse-tier scaffold for brix_backend_delegation
# (test_audit15x_backend_delegation.py).
#
# The running instance lives in nginx_audit15x_deleg.conf; this one is never
# started — it exists so `nginx -t` can be asked about a single line.  It writes
# no brix_backend_delegation of its own, so a case supplies whichever it needs:
# a duplicate-directive error would land before the value under test and would
# look exactly like the rejection a negative case is trying to prove.
#
# Three slots, named here without their braces because the renderer substitutes
# every occurrence of a placeholder, comments included, and a multi-line value
# spliced into a comment turns the tail of that comment into live config:
#
#   KNOBS       location-level lines — the token under test and anything that
#               has to sit beside it.
#   HTTP_EXTRA  http-level lines.  The directive is MAIN|SRV|LOC within http, so
#               a line here must PARSE; what the placement cases prove is that
#               the value written there reaches the location below.
#   OUTER       main-context lines, outside http {} entirely — the placement
#               negative.  An operator who reads "main conf" as "the top of the
#               file" writes a site-wide default that nginx must refuse rather
#               than silently ignore.
#
# `nginx -t` does not bind, so the listen port is a placeholder.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

{HTTP_EXTRA}    server {
        listen {PORT};

        location /x/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
{KNOBS}        }
    }
}

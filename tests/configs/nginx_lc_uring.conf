# Phase-44 io_uring runtime subject (tests/test_io_uring_runtime.py).
# One instance, two planes:
#   * stream — single-worker anon root:// export with the io_uring disk-I/O
#     backend forced ON (`brix_io_uring on` fail-fasts at boot if the probe
#     ladder rejects the kernel, so a green boot proves the ring is live) and
#     the cross-worker kill-switch SHM registered (`brix_io_uring_admin on`).
#     The thread pool stays configured: it is the fallback tier the quiesced
#     ring hands ops to, and the CRC32c hop of the hybrid uring-pgread.
#   * http — the dashboard admin API (bearer-secret only) that flips the kill
#     switch at runtime via POST /brix/api/v1/admin/io_uring.
# PORT (stream) and HTTP_PORT come from the lc-uring ledger entry
# (tests/fleet_lifecycle_ports.py); LOG_DIR/TMP_DIR from the harness prefix;
# BIND_HOST, DATA_DIR and SECRET_FILE ride in template_values.
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
worker_processes 1;
thread_pool lc_uring_pool threads=2 max_queue=1024;
events { worker_connections 64; }

stream {
  server {
    listen {BIND_HOST}:{PORT};
    brix_root on;
    brix_storage_backend posix:{DATA_DIR};
    brix_allow_write on;
    brix_auth none;
    brix_thread_pool lc_uring_pool;
    brix_io_uring on;
    brix_io_uring_queue_depth 64;
    brix_io_uring_admin on;
  }
}

http {
  client_body_temp_path {TMP_DIR}/cbt;
  proxy_temp_path {TMP_DIR}/pt;
  fastcgi_temp_path {TMP_DIR}/ft;
  uwsgi_temp_path {TMP_DIR}/ut;
  scgi_temp_path {TMP_DIR}/st;
  access_log off;

  server {
    listen {BIND_HOST}:{HTTP_PORT};
    location /brix/ {
      brix_dashboard on;
      brix_admin_rate_limit off;  # suite shares one client IP under xdist
      brix_dashboard_password "pw";
      brix_admin_secret {SECRET_FILE};
    }
  }
}

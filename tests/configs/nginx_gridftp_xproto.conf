# Cross-protocol translation: ONE VFS export served BOTH as a gsiftp:// GridFTP
# gateway (stream{}) and a WebDAV/HTTP endpoint (http{}) over the SAME posix
# tree. This is the "translation" guarantee behind gridftp being a first-class
# bidirectional protocol, not a bolt-on door: bytes written through one
# front-end are byte-identical when read through the other, because both
# terminate on the shared brix_vfs_* storage seam — there is no protocol-private
# storage silo. Direction A (gsiftp STOR -> WebDAV GET) exercises the door as an
# ingress front-end; direction B (WebDAV PUT -> gsiftp RETR) exercises the door
# serving bytes a foreign protocol persisted, i.e. gsiftp as a back-end/egress
# translation of the same namespace. (test_gridftp_translation.py)
#
# Launcher-provided: LOG_DIR TMP_DIR PORT (=gsiftp) DATA_ROOT.
# Ledger-provided (fleet_lifecycle_ports.gridftp-xproto extra): DAV_PORT.
# Test-provided template_values: BIND_HOST.
#
# Single worker is safe: the two planes are driven only by the external test
# client and never call each other (contrast nginx_gridftp_s3.conf, whose
# gateway makes a blocking outbound call to its co-hosted S3 plane).
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/sct;

    server {
        listen {BIND_HOST}:{DAV_PORT};
        client_max_body_size 128m;
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_allow_write on;
        }
    }
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_gridftp on;
        brix_export      {DATA_ROOT};
        brix_allow_write on;
    }
}

# §1.4 cross-worker kXR_bind secondary migration subject (registry lifecycle)
# for test_bind_migration.py.  A dedicated 2-worker `reuseport` root:// export
# (the shared fleet is 1-worker and cannot scatter binds across workers) with
# substreams on, plus a /metrics face for brix_io_offload_total.
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + METRICS_PORT.
# Test-provided via template_values: BIND_HOST.
worker_processes 2;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT} reuseport;
        brix_root on;
        brix_export {DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_data_substreams on;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

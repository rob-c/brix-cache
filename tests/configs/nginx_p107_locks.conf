# Phase-107 C7: the VFS lock gate, live across protocol planes
# (test_cross_protocol_locks.py, lifecycle registry).
#
# The gate (src/fs/vfs/vfs_lock_gate.c) hoists the WebDAV lock CHECK — not the
# lock state machine — into the VFS mutation path, so a lock taken over WebDAV
# refuses the same file over root://, S3 and GridFTP.  The refusal is per-plane
# idiomatic: kXR_FileLocked on the stream plane, 423 Locked on HTTP/WebDAV,
# 409 + OperationAborted on S3, 450 on GridFTP (§5.0 wire mapping).
#
# ONE export directory ({DATA_ROOT}) is shared by FOUR fronts — the whole point
# is that the lock xattr lives in the storage layer, visible to every plane:
#
#   {DAV_PORT}      WebDAV — where LOCK/UNLOCK happen, where the If: token
#                   defeats the owner's own lock, and where a foreign PUT
#                   answers 423.
#   {PORT}          root:// front, strict (the default: no directive written).
#   {S3_PORT}       brix_s3 face, anonymous (no access keys, the
#                   nginx_p107_bulk_delete.conf precedent) — objects map FLAT
#                   under the posix root, so S3 key "x" IS WebDAV /x.
#   {FTP_PORT}      cleartext GridFTP, so ftplib can drive the dialogue
#                   (nginx_audit16ai_gridftp_write_gate.conf precedent).
#
# brix_lock_enforcement registers per canonical export root (root_prepare.c),
# so the non-strict modes each carry their OWN export dir — a shared root would
# let one front's registration answer another's:
#
#   {ADV_PORT}      root front over {ADV_EXPORT}, `advisory` — the mutation
#                   proceeds, one warn names the path (never the token), and
#                   brix_vfs_lock_refused_total{proto="stream"} still books.
#   {OFF_PORT}      root front over {OFF_EXPORT}, `off` — zero xattr reads,
#                   today's behaviour exactly.
#   {RO_PORT}       root front over {RO_EXPORT}, writes disabled — EROFS
#                   precedes EBUSY (the lock's existence is not disclosed),
#                   and an expired lock xattr is NEVER reaped here.
#
#   {METRICS_PORT}  the process-wide metrics slab read over HTTP, so the test
#                   can assert the refused-mutation counter rows.
#
# worker_processes 1: no cross-front staged commits here (every front is
# posix-direct), and a GridFTP PASV listener opened by one command must be
# dialled on the same worker.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the extra ports.
# Test-provided: BIND_HOST ADV_EXPORT OFF_EXPORT RO_EXPORT.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log off;
    client_max_body_size 16m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # --- the WebDAV edge: LOCK/UNLOCK live here ---------------------------- #
    server {
        listen {BIND_HOST}:{DAV_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    # --- the S3 face over the SAME export ---------------------------------- #
    server {
        listen {BIND_HOST}:{S3_PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_bucket       testbucket;
            brix_allow_write     on;
        }
    }

    # --- the metrics face --------------------------------------------------- #
    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

stream {
    # --- root:// front, strict (default — no directive written) ------------ #
    server {
        listen           {BIND_HOST}:{PORT};
        brix_root        on;
        brix_auth        none;
        brix_export      {DATA_ROOT};
        brix_allow_write on;
    }

    # --- GridFTP front over the SAME export -------------------------------- #
    server {
        listen           {BIND_HOST}:{FTP_PORT};
        brix_gridftp     on;
        brix_export      {DATA_ROOT};
        brix_allow_write on;
    }

    # --- advisory: warn-and-admit, metric still books ----------------------- #
    server {
        listen                {BIND_HOST}:{ADV_PORT};
        brix_root             on;
        brix_auth             none;
        brix_export           {ADV_EXPORT};
        brix_allow_write      on;
        brix_lock_enforcement advisory;
    }

    # --- off: today's behaviour exactly, zero xattr reads ------------------- #
    server {
        listen                {BIND_HOST}:{OFF_PORT};
        brix_root             on;
        brix_auth             none;
        brix_export           {OFF_EXPORT};
        brix_allow_write      on;
        brix_lock_enforcement off;
    }

    # --- read-only: EROFS precedes EBUSY; expired locks never reaped -------- #
    server {
        listen      {BIND_HOST}:{RO_PORT};
        brix_root   on;
        brix_auth   none;
        brix_export {RO_EXPORT};
    }
}

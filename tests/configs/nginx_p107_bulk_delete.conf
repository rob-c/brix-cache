# Phase-107 C4: DeleteObjects as ONE VFS batch (test_s3_delete_objects_batch.py,
# registry lifecycle).
#
# A 1,000-key DeleteObjects used to be 1,000 signed upstream requests; C4 makes
# it one collect pass (validate + confine, nothing deleted yet) and ONE
# brix_vfs_delete_many() call. Five fronts pin the postures:
#
#   {PORT}          anonymous S3 front over s3://origin (sd_remote, the driver
#                   whose CAP_BULK_DELETE is the item's whole motivation): the
#                   batch becomes ONE upstream POST /testbucket?delete, counted
#                   in the origin's access log.
#   {POSIX_PORT}    anonymous S3 front over posix: the mixed-batch vocabulary
#                   (ENOENT = idempotent <Deleted>, confinement refusal =
#                   AccessDenied at the right key) with no driver in the way.
#   {RO_PORT}       anonymous S3 front over posix, writes disabled: the
#                   phase-105 gate answers EROFS -> whole-request 403 BEFORE
#                   any key is examined — no per-key existence disclosure.
#   {DEADFRONT_PORT} anonymous S3 front over s3://{DEAD_PORT} — a port the
#                   launcher allocated and nothing ever binds: the batch's
#                   transport failure arm (*done cut short, untried keys
#                   reported as untried, never as <Deleted>).
#   {METRICS_PORT}  brix_vfs_bulk_delete_{batches,keys}_total, per leaf driver.
#
# The origin's access log is the witness for the round-trip count: log_format
# p107del records method+uri+args per request.
#
# worker_processes 2 (nginx_lc_s3_nested.conf precedent): the front blocks on
# its synchronous outbound leg to the origin served by this same nginx.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT + ORIGIN_PORT POSIX_PORT RO_PORT
#                    DEADFRONT_PORT DEAD_PORT METRICS_PORT.
# Test-provided: BIND_HOST ORIGIN_DIR FRONT_EXPORT POSIX_ROOT RO_ROOT
#                DEADFRONT_EXPORT S3_ACCESS_KEY S3_SECRET_KEY (every path must
#                exist at config-parse time).
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 8m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/sct;

    log_format p107del '$request_method $uri$is_args$args $status';

    # The credential every s3:// front signs its outbound origin leg with.
    brix_credential s3cred {
        s3_access_key {S3_ACCESS_KEY};
        s3_secret_key {S3_SECRET_KEY};
        s3_region     us-east-1;
    }

    # Origin object store: posix-backed brix_s3 (bucket "testbucket"). Its
    # access log is the round-trip witness.
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        access_log {LOG_DIR}/origin_access.log p107del;
        location / {
            brix_s3              on;
            brix_storage_backend posix:{ORIGIN_DIR};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   {S3_ACCESS_KEY};
            brix_s3_secret_key   {S3_SECRET_KEY};
            brix_s3_region       us-east-1;
            brix_allow_write     on;
        }
    }

    # Front over sd_remote: the 1,000-key batch -> ONE upstream ?delete.
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_s3                 on;
            brix_export             {FRONT_EXPORT};
            brix_storage_backend    s3://{BIND_HOST}:{ORIGIN_PORT}/testbucket;
            brix_storage_credential s3cred;
            brix_s3_bucket          testbucket;
            brix_allow_write        on;
        }
    }

    # Front over posix: the mixed-batch per-key vocabulary.
    server {
        listen {BIND_HOST}:{POSIX_PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{POSIX_ROOT};
            brix_s3_bucket       testbucket;
            brix_allow_write     on;
        }
    }

    # Front over posix, read-only: EROFS before any key is examined.
    server {
        listen {BIND_HOST}:{RO_PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{RO_ROOT};
            brix_s3_bucket       testbucket;
            brix_allow_write     off;
        }
    }

    # Front over a dead origin: the transport-failure arm.
    server {
        listen {BIND_HOST}:{DEADFRONT_PORT};
        location / {
            brix_s3                 on;
            brix_export             {DEADFRONT_EXPORT};
            brix_storage_backend    s3://{BIND_HOST}:{DEAD_PORT}/testbucket;
            brix_storage_credential s3cred;
            brix_s3_bucket          testbucket;
            brix_allow_write        on;
        }
    }

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

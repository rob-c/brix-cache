# authdb x a delegated identity (test_audit15h_authdb_delegation.py) — audit
# §B1.7.  Every `u` rule the suite has ever written is `u *` (see the rule file
# in test_authdb.py), so no test has ever asked WHICH distinguished name a
# proxy login is authorized as.  A proxy chain carries two candidate answers:
# the leaf DN, which gains a fresh RFC 3820 `/CN=<serial>` every time the user
# re-mints, and the End-Entity subject underneath it, which does not.
#
#   {PORT}         authdb rules naming the EEC subject.  This is what an
#                  operator writes, because it is the DN printed by
#                  `openssl x509 -subject` on the user's certificate.
#   {LEAF_PORT}    the same rules with the proxy leaf DN substituted in.  A
#                  grant here would mean authorization drifts with the proxy
#                  serial; a denial is the property under test.
#   {OPEN_PORT}    the same gsi acceptor with no `brix_authdb` at all.  It
#                  makes every denial on the two planes above attributable to
#                  authorization: if a credential works here and not there,
#                  the handshake was fine and a rule declined it.
#   {METRICS_PORT} the Prometheus face.  brix_unique_users_total is the only
#                  external witness of which of the two DNs the server counts,
#                  and the SHM it reads is shared with the stream workers.
#
# brix_vomsdir/brix_voms_cert_dir are what let a `g <vo>` rule see an FQAN, so
# the group half of the row is testable on the same instance as the user half.
#
# brix_allow_write on is deliberate: invariant 3 puts the write gate BEFORE the
# authorization check, so a server without it would refuse writes for a reason
# that has nothing to do with the authdb and the `w` bit would be untestable.
#
# `listen {PORT};` with no address, matching the other audit15h templates: the
# test connects by name so the host cert's SAN carries meaning.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + LEAF_PORT OPEN_PORT
# METRICS_PORT.  Test-provided: CERT KEY CA CERTS VOMSDIR AUTHDB LEAF_AUTHDB
# (every path must exist at config-parse time).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- rules keyed on the EEC subject: the subject of the row -------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_allow_write on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_vomsdir         {VOMSDIR};
        brix_voms_cert_dir   {CERTS};
        brix_authdb          {AUTHDB};
    }

    # --- the same rules keyed on the proxy leaf DN ---------------------------
    server {
        listen {LEAF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_allow_write on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_vomsdir         {VOMSDIR};
        brix_voms_cert_dir   {CERTS};
        brix_authdb          {LEAF_AUTHDB};
    }

    # --- no authdb: proves the credential itself is good ---------------------
    server {
        listen {OPEN_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_allow_write on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_vomsdir         {VOMSDIR};
        brix_voms_cert_dir   {CERTS};
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

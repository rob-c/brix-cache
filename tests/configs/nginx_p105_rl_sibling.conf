# phase-105 W1 security-neg template for test_rate_limit_s3.py: the rate
# limit is configured ONLY inside the webdav location — the adjacent s3
# server must NOT be limited (adopt-at-merge respects location scoping; a
# sibling never inherits another location's limiter).  The webdav side still
# sheds with 429, proving the limiter is live in this instance.
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 64; }
http {
    client_body_temp_path {TMP_DIR};
    proxy_temp_path        {TMP_DIR};
    fastcgi_temp_path      {TMP_DIR};
    uwsgi_temp_path        {TMP_DIR};
    scgi_temp_path         {TMP_DIR};
    access_log off;

    brix_kv_zone zone=w_rl:2m key=256 val=16;

    server {
        listen 127.0.0.1:{PORT};
        location / {
            brix_webdav      on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_rate_limit  zone=w_rl rate=1r/s burst=2 key=ip;
        }
    }
    server {
        listen 127.0.0.1:{S3_PORT};
        location / {
            brix_s3          on;
            brix_storage_backend posix:{DATA_ROOT};
        }
    }
}

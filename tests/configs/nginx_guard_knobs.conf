# Self-contained guard knob-matrix template for test_audit15_guard_knobs.py
# (registry lifecycle).  Unlike nginx_guard_xrdhttp.conf this fronts a LOCAL
# static root instead of the guard-stub proxy, so passed-vs-bounced is
# observable (200/404 vs bounce status) without any shared mock state.
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.  Test-provided:
# BIND_HOST AUDIT_LOG GUARD_KNOBS.
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;
events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_guard on;
            brix_guard_profile xrdhttp;
            brix_guard_valid_prefix /store;
            brix_guard_audit_log {AUDIT_LOG};
{GUARD_KNOBS}
            root {DATA_ROOT};
        }
    }
}

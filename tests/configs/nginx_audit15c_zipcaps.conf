# ZIP central-directory bomb caps on the stream and WebDAV planes (registry
# lifecycle, test_audit15c_zip_cd_caps.py).  The capped listener/location set a
# 64-byte CD cap that any multi-member zip exceeds; the uncapped twins pin the
# refusal to the cap directive, not to zip-member access itself.
# Launcher-provided: LOG_DIR TMP_DIR PORT CTRL_PORT HTTP_PORT DATA_ROOT.
# Test-provided: BIND_HOST.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_zip_access on;
        brix_zip_cd_max_bytes 64;
    }
    server {
        listen {BIND_HOST}:{CTRL_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_zip_access on;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{HTTP_PORT};
        location /capped/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_zip_access on;
            brix_zip_cd_max_bytes 64;
        }
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_zip_access on;
        }
    }
}

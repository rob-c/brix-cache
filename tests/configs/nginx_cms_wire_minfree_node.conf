# CMS data node carrying an explicit ``brix_cms_min_free`` (§2.4) — same shape
# as nginx_cms_wire_node.conf but sets the mSpace policy floor advertised in the
# kYR_login payload, so test_cms_wire_pup_conformance.py can assert the
# configured value reaches the wire (vs the historical hardcoded 100 MB).
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: MANAGER_PORT MIN_FREE.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }
stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
        brix_allow_write on;
        brix_listen_port {PORT};
        brix_cms_manager 127.0.0.1:{MANAGER_PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
        brix_cms_min_free {MIN_FREE};
    }
}

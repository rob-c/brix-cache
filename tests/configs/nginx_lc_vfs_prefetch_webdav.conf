# WebDAV slice-cache front for test_vfs_prefetch.py (registry lifecycle): the
# HTTP-plane leg of the background block prefetch feature. Serves a slice
# partial cache (memory-backed, never sendfiled) over a SEPARATE http static
# origin instance, so the test can kill the origin and prove which blocks the
# background prefetch made durable.
# Launcher-provided: LOG_DIR PORT TMP_DIR + ledger extra METRICS_PORT.
# Test-provided via template_values: BIND_HOST ORIGIN_URL EXPORT_ROOT
# CACHE_STORE SLICE_SIZE, plus PREFETCH_LINES ("" = prefetch off).
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;
        location / {
            brix_webdav           on;
            brix_webdav_auth      none;
            brix_storage_backend  {ORIGIN_URL};
            brix_export           {EXPORT_ROOT};
            brix_cache_store      posix:{CACHE_STORE};
            brix_cache_slice_size {SLICE_SIZE};
{PREFETCH_LINES}        }
    }
}

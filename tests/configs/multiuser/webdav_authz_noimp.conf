# MU WebDAV native-authz verification — a no-root check of FIX 3 (WebDAV GET/HEAD/PROPFIND
# now enforce native authdb + VO ACL, at parity with root://). GSI client cert, no
# impersonation (the access-phase gate is a worker-level decision). authdb "g cms /" + VO ACL
# "require_vo /cms cms" admit only VO=cms; a VO=atlas reader is refused a GET with 403.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/webdav_authz_error.log info;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};
    server {
        listen {BIND_HOST}:{PORT} ssl;
        server_name localhost;
        ssl_certificate        {CERT};
        ssl_certificate_key    {KEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;   # REQUEST the client (proxy) cert
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;
        location / {
            brix_webdav              on;
            brix_storage_backend     posix:{DATA_DIR};
            brix_webdav_auth         required;
            brix_trusted_ca       {CA};
            brix_vomsdir      {VOMSDIR};
            brix_voms_cert_dir {CA_DIR};
            # The SECOND credential this plane accepts.  Every MU principal holds
            # a proxy AND a WLCG token, and the HTTP probes present the token by
            # preference (mu_authz_lib/adapters._webdav_options), so without a
            # verification key the whole cast authenticates as nobody: every
            # davs:// measurement was a 401.  That is invisible to a differential
            # oracle — the cache node and this one denied in lockstep, so every
            # cell agreed — and it silently disabled the one family that needs an
            # ALLOW to set up, F8's fill-then-revoke.  Issuer and audience are
            # utils.make_token's defaults, which is what creds.mint_token signs.
            brix_token_jwks     {JWKS};
            brix_token_issuer   "https://test.example.com";
            brix_token_audience "nginx-xrootd";
            # XrdAcc grants, `u <DN> <path> rl` (mu_authz_lib/policy.py).  On
            # the HTTP planes that engine is reachable ONLY through brix_acc_*:
            # a bare brix_authdb here is the native u/g/p engine, whose
            # field-1 alphabet and field-2 semantics are its own.
            brix_acc_format   xrdacc;
            brix_acc_authdb   {AUTHDB};
            brix_require_vo   /restricted cms;
            brix_allow_write on;
        }
    }
}

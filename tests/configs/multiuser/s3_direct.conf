# MU S3 DIRECT node — cache OFF; the authoritative oracle for the S3 REST plane.
#
# Path mapping: the suite addresses objects by their corpus path, "/cms/secret.dat".
# S3 is path-style (/<bucket>/<key>), so with bucket `cms` the key is "secret.dat"
# and the backend root has to be the /cms subtree for the key to name the same
# bytes the other protocols serve.  Getting this wrong is not a visible error —
# every object simply 404s, and a NoSuchKey denial has tier "none" where the
# root:// oracle says "authdb", so the parity cells fail for a reason that has
# nothing to do with authorization.
#
# Authorization: the XrdAcc grants, through the HTTP-plane directive pair — S3's
# access phase enforces the same shared authdb the root:// and WebDAV planes do.
#
# Identity: `brix_s3_token on`, NOT the SigV4 key pair, and that is what makes
# the F9 parity cells answerable.  brix_s3 carries a SINGLE access-key/secret
# pair, so a per-principal SigV4 identity is not expressible — each principal
# signing with its own key means only the service key verifies and everyone else
# is refused at the SIGNATURE (authn) where root:// refuses at the authdb
# (authz).  Those are both denials, but not the same denial, and the oracle
# compares the deciding TIER.  A verified bearer token puts the principal's `sub`
# in the identity field the authdb is keyed on, so this plane reaches root://'s
# verdict off root://'s record.  The key pair stays for the service account and
# for the cells that mean to exercise SigV4 itself.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/s3_direct_error.log info;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;
        location / {
            brix_s3              on;
            brix_storage_backend posix:{DATA_DIR}/cms;
            brix_s3_bucket       cms;
            brix_s3_access_key   {S3_SVC_KEY};
            brix_s3_secret_key   {S3_SVC_SECRET};
            brix_s3_region       us-east-1;
            brix_s3_token        on;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "https://test.example.com";
            brix_token_audience  "nginx-xrootd";
            brix_acc_format      xrdacc;
            brix_acc_authdb      {AUTHDB};
            brix_allow_write on;
        }
    }
}

# MU root:// DIRECT (non-cache) GSI+authdb node — a no-root check of the read-open existence
# oracle fix (open_request.c). No brix_cache_store, so reads take the direct open path where
# the auth gate now runs BEFORE the existence probe: a denied principal gets kXR_NotAuthorized
# whether or not the path exists (no NotFound-vs-NotAuthorized oracle). Impersonation off (the
# auth gate is a worker-level wire decision).
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/direct_authz_error.log info;
thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;

        brix_export           {DATA_DIR};
        brix_storage_backend  posix:{DATA_DIR};

        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_vomsdir         {VOMSDIR};
        brix_voms_cert_dir   {CA_DIR};

        # The grants in {AUTHDB} are XrdAcc records (`u <DN> <path> rl`,
        # mu_authz_lib/policy.py).  On the stream plane a bare `brix_authdb`
        # means the NATIVE u/g/p engine, whose field-1 alphabet and field-2
        # semantics are its own, so the engine has to be named.
        brix_authdb_engine   xrdacc;
        brix_authdb          {AUTHDB};

        # No gridmap is loaded here, so authorization sees the raw DN and that
        # is what the grants above name -- keep the two in step if this ever
        # gains a brix_gridmap.
        brix_idmap off;

        brix_allow_write on;
        brix_access_log {LOG_DIR}/direct_authz_access.log;
    }
}

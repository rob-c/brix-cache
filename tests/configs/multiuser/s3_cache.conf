# MU S3 CACHE node — the cache-ON twin of s3_direct.conf.  Identical to it apart
# from `brix_cache_store`, for the same reason the WebDAV pair is: a divergence
# between oracle and cache must be attributable to the cache tier and nothing
# else.  See s3_direct.conf for the bucket/backend-root mapping and for the
# single-key limitation that the S3 parity cells record.
#
# The store is the SHARED {CACHE_DIR} — the tree the root:// and WebDAV cache
# nodes also fill — because the read-cache key is path-only, and fill-via-one/
# serve-via-another is precisely what test_mu_cross_protocol.py measures.
#
# Unlike the root:// and WebDAV cache nodes this one keeps a LOCAL posix
# backend.  Those two need a remote origin so the fill stores a standalone
# cached file (the .cinfo sidecar cache_state.verify_hot() looks for); here the
# backend root has to be the /cms subtree for path-style keys to name the same
# objects the other planes serve, and the anonymous origin exports the whole
# tree with no way to root a remote backend at a subpath.  Nothing in the S3
# cells measures residency — they compare verdicts — so correct key resolution
# is the property worth keeping.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/s3_cache_error.log info;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;
        location / {
            brix_s3              on;
            brix_storage_backend posix:{DATA_DIR}/cms;
            brix_cache_store     posix:{CACHE_DIR};
            brix_s3_bucket       cms;
            brix_s3_access_key   {S3_SVC_KEY};
            brix_s3_secret_key   {S3_SVC_SECRET};
            brix_s3_region       us-east-1;
            # Per-principal identity, byte-identical to the oracle's (see the
            # note in s3_direct.conf): the pair has to accept the same
            # credentials or a divergence between them means nothing.
            brix_s3_token        on;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "https://test.example.com";
            brix_token_audience  "nginx-xrootd";
            brix_acc_format      xrdacc;
            brix_acc_authdb      {AUTHDB};
            brix_allow_write on;
        }
    }
}

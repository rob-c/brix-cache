# MU root:// WRITE node — the only member of the fleet that actually
# IMPERSONATES.  It exists for F6/F9's attribution property: a write by alice
# must land on disk owned by alice's real uid, which no amount of authorization
# can demonstrate — it needs a broker that setfsuid()s to the mapped account.
#
# The master runs as root so `brix_idmap map` can spawn the privileged broker;
# workers stay unprivileged.  The broker maps the authenticated GSI **DN** to a
# local account via {GRIDMAP} and is confined to {DATA_DIR}.
#
# Deliberately NO authdb.  The corpus grants are `rl` — read and lookup — so on
# any node that enforces them every write is refused before it can be
# attributed, and a test that means to ask "who owns these bytes?" would instead
# be asking "may alice write?", which the read-plane nodes already answer.  A
# GSI-authenticated principal is admitted here by brix_allow_write alone, the
# same posture webdav_stage_noimp.conf takes for the WebDAV write plane.
#
# This is also why it is a separate instance rather than a flag on the cache
# node: the cache node fills from a remote anonymous origin, so a write through
# it is performed by THAT server's worker and lands owned by nobody — the
# attribution under test would be destroyed by the topology, not by a bug.
user nobody;
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/write_imp_error.log info;
events { worker_connections 64; }

stream {
    brix_idmap          map;
    brix_idmap_socket   {LOG_DIR}/imp_root_write.sock;
    brix_idmap_export   {DATA_DIR};
    brix_idmap_gridmap  {GRIDMAP};
    brix_idmap_min_uid  1000;

    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;

        brix_export           {DATA_DIR};
        brix_storage_backend  posix:{DATA_DIR};

        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_vomsdir         {VOMSDIR};
        brix_voms_cert_dir   {CA_DIR};

        brix_allow_write on;
        brix_access_log {LOG_DIR}/write_imp_access.log;
    }
}

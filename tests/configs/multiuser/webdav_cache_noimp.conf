# MU WebDAV CACHE node — the cache-ON twin of webdav_authz_noimp.conf, which is
# the davs:// oracle.  The pair is the whole point: the oracle's verdict for
# (principal, path, op) is ground truth, and this node must reach the IDENTICAL
# verdict once the bytes are resident.  So the two configs are deliberately the
# same file plus `brix_cache_store` — any other difference would make a
# divergence ambiguous between "the cache leaks" and "the two servers were never
# asked the same question".
#
# The store is the SHARED {CACHE_DIR}, the same tree the root:// cache node
# fills, because the read-cache key is path-only (cache_key.c): filling via one
# protocol and serving via another is exactly what test_mu_cross_protocol.py
# exercises, and it needs one store, not a per-protocol one.  Separate nginx
# instances register their own tier for it, so the sharing is on disk only.
#
# The backend is the ANONYMOUS root:// origin, not posix:{DATA_DIR} — an HTTP
# plane over a remote root:// origin is an ordinary shape (see the DAV_ORIGIN
# face of configs/nginx_lc_cachemx.conf).  It has to be remote for the same
# reason root_cache_noimp.conf's does: only a fill from a REMOTE origin stores a
# standalone cached file with its .cinfo sidecar, which is what makes the object
# resident in the sense cache_state.verify_hot() measures.  Over a local posix
# backend there is nothing to cache and the fill is a silent no-op — a
# revocation test then fails on its "must be cached first" precondition and
# never reaches the property it exists to check.  Anonymous so the fill needs no
# credential; the authorization under test is on the SERVE side, here.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/webdav_cache_error.log info;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};
    server {
        listen {BIND_HOST}:{PORT} ssl;
        server_name localhost;
        ssl_certificate        {CERT};
        ssl_certificate_key    {KEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;   # REQUEST the client (proxy) cert
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;
        location / {
            brix_webdav              on;
            brix_storage_backend     root://{BIND_HOST}:{ORIGIN_NOIMP_PORT};
            brix_cache_store         posix:{CACHE_DIR};
            brix_webdav_auth         required;
            brix_trusted_ca       {CA};
            brix_vomsdir      {VOMSDIR};
            brix_voms_cert_dir {CA_DIR};
            # Token verification, byte-identical to the oracle's (see the note in
            # webdav_authz_noimp.conf): the pair has to accept the same
            # credentials or a divergence means nothing.
            brix_token_jwks     {JWKS};
            brix_token_issuer   "https://test.example.com";
            brix_token_audience "nginx-xrootd";
            # XrdAcc grants, `u <DN> <path> rl` (mu_authz_lib/policy.py).  On
            # the HTTP planes that engine is reachable ONLY through brix_acc_*:
            # a bare brix_authdb here is the native u/g/p engine, whose
            # field-1 alphabet and field-2 semantics are its own.
            brix_acc_format   xrdacc;
            brix_acc_authdb   {AUTHDB};
            brix_require_vo   /restricted cms;
            brix_allow_write on;
        }
    }
}

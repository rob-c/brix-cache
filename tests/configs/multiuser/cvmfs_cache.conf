# MU cvmfs:// CACHE node — a PUBLIC content cache, and deliberately not an
# enforcing plane (spec D3/§4).  test_mu_cvmfs_public.py does not assert
# authorization here; it locks the plane to public semantics, so that it can
# never quietly acquire an auth-derived privilege: an authenticated principal
# must get EXACTLY what anonymous gets, and a token scoped elsewhere must not
# widen anything.
#
# `brix_webdav_auth none` is therefore the property under test, not a shortcut —
# with no credential consulted, every principal and anonymous take the same path
# through handler.c (which hardcodes identity="anonymous").  TLS is still on
# because the probes address it as https:// like the rest of the HTTP fleet, and
# because presenting a client cert to a server that ignores it is the case worth
# covering.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/cvmfs_cache_error.log info;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};
    server {
        listen {BIND_HOST}:{PORT} ssl;
        server_name localhost;
        ssl_certificate        {CERT};
        ssl_certificate_key    {KEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_DIR};
            brix_cache_store     posix:{CACHE_DIR};
            brix_webdav_auth     none;
        }
    }
}

# Native root:// TPC × WLCG token auth (audit P1-7).
#
# Every native-TPC config in the tree was `brix_auth none` or `brix_auth gsi`, so
# the whole token column of the TPC matrix was empty: nothing proved that a
# bearer-authenticated client can drive a third-party copy, and nothing exercised
# the destination's OUTBOUND source-leg token paths at all
# (src/tpc/gsi/gsi_outbound_common.c: tpc_outbound_ztn, reached through
# gsi_outbound_finish.c once the source advertises &P=ztn).
#
# One nginx, four brix_root planes, all `brix_auth token` against the same JWKS —
# so the client's token authenticates it to every plane, and the SOURCE plane can
# also verify whatever credential the destination forwards on the pull leg:
#
#   :{PORT_SRC}      SOURCE. Read-only (no brix_allow_write): the pull leg only
#                    ever opens for read, and a read-only source proves the copy
#                    is not accidentally writing back through it.
#   :{PORT}          DEST, default outbound auth = passthrough-opt: the client's
#                    own inbound bearer is snapshotted at kXR_open and replayed
#                    to the source over ztn.
#   :{PORT_BFILE}    DEST, passthrough OFF + brix_tpc_outbound_bearer_file: the
#                    service-credential path, where the source authenticates the
#                    GATEWAY rather than the end user.
#   :{PORT_NOPASS}   DEST, passthrough OFF and NO bearer file: the destination has
#                    no ztn credential at all, so a source that demands one must
#                    refuse the pull. The security-negative control.
#
# EVERY plane requires in-protocol TLS, and each destination upgrades its pull
# leg with brix_tpc_outbound_tls: XrdCl refuses to hand a ztn credential to a
# cleartext connection ("security protocol 'ztn' disallowed for non-TLS
# connections"), so a token-authenticated TPC is necessarily a TLS topology —
# the client legs and the destination->source pull leg alike.
#
# A DISTINCT export root per plane: the storage-backend registry is keyed by the
# export's canonical root, so sharing one root would let the server blocks collide
# on a single entry (last registration wins) — see nginx_tpc_harden.conf.
#
# Launcher-provided: LOG_DIR PORT (=passthrough dest).
# Test-provided via extra_ports:     PORT_SRC PORT_BFILE PORT_NOPASS.
# Test-provided via template_values: BIND_HOST JWKS TOKEN_ISSUER TOKEN_AUDIENCE
#   BEARER_FILE CERT_FILE KEY_FILE CA_DIR and the four export roots (all must
#   exist at parse for posix).
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=4 max_queue=256;
events { worker_connections 64; }

stream {
    # ---- SOURCE ----------------------------------------------------------
    server {
        listen {BIND_HOST}:{PORT_SRC};
        brix_root on;
        brix_storage_backend posix:{SRC_ROOT};
        brix_auth token;
        brix_ztn_cleartext on;   # lab opt-in: raw cleartext ztn drivers
        brix_tls on;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_token_jwks     {JWKS};
        brix_token_issuer   "{TOKEN_ISSUER}";
        brix_token_audience "{TOKEN_AUDIENCE}";
        brix_access_log {LOG_DIR}/brix_access_src.log;
    }

    # ---- DEST: passthrough (server default) ------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DST_ROOT};
        brix_auth token;
        brix_ztn_cleartext on;   # lab opt-in: raw cleartext ztn drivers
        brix_tls on;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_token_jwks     {JWKS};
        brix_token_issuer   "{TOKEN_ISSUER}";
        brix_token_audience "{TOKEN_AUDIENCE}";
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_outbound_tls on;
        brix_access_log {LOG_DIR}/brix_access_dst.log;
    }

    # ---- DEST: static service credential ---------------------------------
    server {
        listen {BIND_HOST}:{PORT_BFILE};
        brix_root on;
        brix_storage_backend posix:{BFILE_ROOT};
        brix_auth token;
        brix_ztn_cleartext on;   # lab opt-in: raw cleartext ztn drivers
        brix_tls on;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_token_jwks     {JWKS};
        brix_token_issuer   "{TOKEN_ISSUER}";
        brix_token_audience "{TOKEN_AUDIENCE}";
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_outbound_tls on;
        # Passthrough off, so the inbound token is NOT replayed; the source leg
        # authenticates with this gateway-owned bearer instead.
        brix_tpc_outbound_passthrough off;
        brix_tpc_outbound_bearer_file {BEARER_FILE};
        brix_access_log {LOG_DIR}/brix_access_bfile.log;
    }

    # ---- DEST: no outbound credential at all (security-negative) ---------
    server {
        listen {BIND_HOST}:{PORT_NOPASS};
        brix_root on;
        brix_storage_backend posix:{NOPASS_ROOT};
        brix_auth token;
        brix_ztn_cleartext on;   # lab opt-in: raw cleartext ztn drivers
        brix_tls on;
        brix_certificate {CERT_FILE};
        brix_certificate_key {KEY_FILE};
        brix_trusted_ca {CA_DIR};
        brix_token_jwks     {JWKS};
        brix_token_issuer   "{TOKEN_ISSUER}";
        brix_token_audience "{TOKEN_AUDIENCE}";
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_outbound_tls on;
        brix_tpc_outbound_passthrough off;
        brix_access_log {LOG_DIR}/brix_access_nopass.log;
    }
}

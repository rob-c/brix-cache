# Generic matrix instance, HTTP plane — ONE template behind every
# (webdav|s3 × auth × tls × backend) cell.  Rendered by tests/matrix_layer.py.
#
# They are LISTEN_OPTS (" ssl" for a TLS cell, empty otherwise), SERVER_EXTRA
# (ssl_certificate and client-certificate verification, or empty) and
# LOCATION_BODY (brix_webdav or brix_s3, the storage line, and that cell's auth
# directives).  Their names are spelled without braces here on purpose: a
# comment that quotes its own placeholder gets substituted like any other
# occurrence, and a multi-line block then lands at main scope.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.  Session-provided: BIND_HOST.
# See docs/refactor/testsuite-combinatorial-coverage-audit-2026-08-04.md item 19.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT}{LISTEN_OPTS};
        server_name localhost;
{SERVER_EXTRA}
        location / {
{LOCATION_BODY}
        }
    }
}

# Parse-tier scaffold for brix_http_query_token (test_audit16c_query_token.py
# §F).  Never started; it exists so `nginx -t` can be asked about one line at a
# time.
#
# It writes the directive nowhere itself: a scaffold that already carried the
# flag would make every negative ambiguous, because a second occurrence is
# diagnosed as a duplicate and that error arrives before the one a value or
# arity negative is reaching for.
#
# Two slots, named here WITHOUT their braces — the renderer replaces every
# occurrence of a placeholder, comments included, and a multi-line value
# spliced into a comment turns the tail of that comment into configuration:
#
#   HTTP_KNOBS  lines directly inside http{}.  This is the context
#               NGX_HTTP_MAIN_CONF names, and the one a deployment uses to turn
#               the URL token transport off for every location at once.
#   LOC_KNOBS   lines inside the WebDAV location — the per-location arm.
#
# `nginx -t` never binds, so PORT is a placeholder.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;
{HTTP_KNOBS}
    server {
        listen {PORT};

        location /probe/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
{LOC_KNOBS}        }
    }
}

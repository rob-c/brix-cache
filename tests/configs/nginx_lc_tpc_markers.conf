# WebDAV HTTP-TPC 202-streaming perf-marker destination
# (test_tpc_marker_remoteconn.py, registry lifecycle) — the RemoteConnections
# line needs the marker tier (interval > 0 + a thread pool) and multi-stream
# pulls (max_streams > 1).  Cleartext listener + auth none so the marker body
# is the only thing under test; the SOURCE leg is https-only with full peer
# verification against the test CA that signed the in-test source's cert.
# Launcher-provided: LOG_DIR PORT.  Test-provided: DATA_DIR CA_PEM.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

thread_pool default threads=4 max_queue=65536;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {LOG_DIR}/cbt;
    proxy_temp_path       {LOG_DIR}/pt;
    fastcgi_temp_path     {LOG_DIR}/ft;
    uwsgi_temp_path       {LOG_DIR}/ut;
    scgi_temp_path        {LOG_DIR}/st;

    server {
        listen {PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
            brix_allow_write on;
            brix_thread_pool default;
            brix_webdav_tpc on;
            brix_tpc_allow_local on;
            brix_webdav_tpc_cafile {CA_PEM};
            brix_webdav_tpc_timeout 30;
            brix_webdav_tpc_max_streams 8;
            brix_webdav_tpc_marker_interval 1;
        }
    }
}

# macaroon x VOMS / macaroon x delegation (test_audit15h_macaroon_voms.py) —
# audit §B1.10.  Every macaroon suite in the tree authenticates its issuance
# request with ANOTHER macaroon, so the endpoint has only ever been driven by a
# caller that already held a bearer token.  This template gives it the other
# kind of caller: an identity established by a VOMS proxy chain over TLS.
#
#   {PORT}       the authdb-gated face.  brix_webdav_authdb names the minting
#                user's End-Entity subject and the VO its attribute certificate
#                asserts, so the proxy is authorized by DN on one tree, by VO on
#                a second, by the `u *` wildcard on a third, and by nothing at
#                all on a fourth.  Everything the row is about is visible here:
#                what the proxy may read, and what the macaroon it mints may.
#   {FREE_PORT}  the same face with no brix_webdav_authdb.  It is the
#                attribution control — a macaroon refused on {PORT} and served
#                here was a good token that a rule declined, not a token the
#                server could not read.
#
# ssl_verify_client optional_no_ca is the idiom the WebDAV GSI configs use: a
# proxy chain cannot satisfy nginx's own client verification (the RFC 3820
# leaf is not a CA-issued certificate), so nginx is told to REQUEST the cert and
# brix_webdav_cafile + brix_webdav_proxy_certs do the real verification.
#
# brix_allow_write on is deliberate: invariant 3 puts the global write gate
# BEFORE the token scope check, so without it an UPLOAD-caveated macaroon would
# be refused for a reason that has nothing to do with its caveats.
#
# brix_webdav_vomsdir/brix_webdav_voms_cert_dir are what let the identity carry
# its FQAN, which is the whole "x VOMS" half of the row: a `g <vo>` rule can
# only be shown NOT to survive minting if it matched the proxy in the first
# place.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + FREE_PORT.
# Test-provided: CERT KEY CA CERTS VOMSDIR AUTHDB SECRET_HEX (every path must
# exist at config-parse time — lifecycle.start runs `nginx -t` first).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    # --- the authdb-gated face: the subject of the row ----------------------
    server {
        listen {PORT} ssl;
        server_name localhost;
        ssl_certificate        {CERT};
        ssl_certificate_key    {KEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          required;
            brix_webdav_cafile        {CA};
            brix_webdav_vomsdir       {VOMSDIR};
            brix_webdav_voms_cert_dir {CERTS};
            brix_webdav_authdb        {AUTHDB};
            brix_webdav_macaroon_secret {SECRET_HEX};
            brix_allow_write on;
        }
    }

    # --- no authdb: proves a refusal above was a rule, not the token --------
    server {
        listen {FREE_PORT} ssl;
        server_name localhost;
        ssl_certificate        {CERT};
        ssl_certificate_key    {KEY};
        ssl_client_certificate {CA};
        ssl_verify_client      optional_no_ca;
        ssl_verify_depth       10;
        brix_webdav_proxy_certs on;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          required;
            brix_webdav_cafile        {CA};
            brix_webdav_vomsdir       {VOMSDIR};
            brix_webdav_voms_cert_dir {CERTS};
            brix_webdav_macaroon_secret {SECRET_HEX};
            brix_allow_write on;
        }
    }
}

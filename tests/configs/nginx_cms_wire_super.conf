# CMS *supervisor* (Phase-61 W7 multi-tier): registers UP to a Python parent
# manager peer (brix_cms_manager) while ALSO running the CMS server leg
# (brix_cms_server + brix_manager_mode) so Python child data-nodes can log in
# below it.  ``brix_cms_state_relay`` (test-provided on/off) gates the
# registry-miss kYR_state recursion under test in
# test_cms_wire_pup_conformance.py.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: MANAGER_PORT STATE_RELAY.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }
stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
        brix_allow_write on;
        brix_listen_port {PORT};
        brix_manager_mode on;
        brix_cms_server on;
        brix_cms_server_interval 60;
        brix_cms_manager 127.0.0.1:{MANAGER_PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
        brix_cms_role supervisor;
        brix_cms_state_relay {STATE_RELAY};
    }
}

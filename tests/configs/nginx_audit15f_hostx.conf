# `brix_auth host` under every role a real site gives a trusted node
# (test_audit15f_host_auth_crosses.py, registry lifecycle) — audit §B1.9: host
# auth paired with authdb and nothing else, so host auth x {tls, cache, stage,
# tpc, cms} were all zero.  Host trust is socket trust: the identity comes from
# the peer's reverse-DNS, never from anything the client asserts, so the
# interesting question in every cross is whether a DIFFERENT subsystem's
# plumbing can smuggle a session past that allowlist.
#
# One instance, one allowlist ({ALLOWLIST}, the loopback's real reverse-DNS
# name), so every plane below is gated by the SAME decision:
#
#   {PORT}          host auth x TLS — the in-protocol upgrade (kXR_protocol
#                   advertises kXR_ableTLS -> kXR_gotoTLS) happens first, then
#                   kXR_auth "host" runs inside the tunnel
#   {DENY_PORT}     the same TLS plane with {DENYLIST}: a valid TLS session
#                   whose peer is NOT in the allowlist must still be refused —
#                   a good cert confers no host trust
#   {ORIGIN_PORT}   plain WebDAV posix origin (auth none) — the backend the two
#                   tier planes sit over, and the source of truth for what the
#                   staged writer committed
#   {CACHE_PORT}    host auth x cache tier: read-through fills land in
#                   {CACHE_ROOT}; an unauthenticated peer must not be able to
#                   drive a fill
#   {STAGE_PORT}    host auth x whole-object staged writer: an http:// backend
#                   advertises no RANDOM_WRITE, so a WRITE open stages into
#                   {SPOOL_DIR} and the close commits one PUT to the origin
#   {SRC_PORT}      native-TPC source, auth none — the far end of the pull
#   {SRCHOST_PORT}  the same source demanding host auth.  The destination's
#                   outbound leg speaks only ztn/gsi
#                   (tpc/gsi/gsi_outbound_finish.c), so it cannot satisfy a
#                   "&P=host" source even though that source would trust its
#                   socket: the pull fails closed (defect-candidate pin)
#   {TPC_PORT}      host auth x native TPC destination: the CLIENT leg is
#                   host-authenticated, tpc.dst open + sync drive the pull
#   {CMS_PORT}      host auth x cms: a mesh member that registers with the
#                   out-of-process manager at {MANAGER_PORT} while gating its
#                   own data plane on the allowlist
#
# brix_listen_port per block: each stream server gets its own CMS node identity
# (same gate as nginx_cms_tier.conf), which also keeps the mesh member from
# being collapsed into a sibling.
#
# worker_processes 4: the cache and stage planes fetch from / commit to the
# http origin inside THIS nginx, and the TPC destination pulls from a source
# block inside it too, so one request can occupy two workers at once.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the extras above.
# Test-provided: BIND_HOST ALLOWLIST DENYLIST MANAGER_PORT CERT KEY
#                TLS_ROOT DENY_ROOT ORIGIN_ROOT EXPORT_ROOT CACHE_ROOT
#                SPOOL_DIR SRC_ROOT TPC_ROOT CMS_ROOT.
worker_processes 4;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

# The native TPC pull runs its transfer on a thread-pool task.
thread_pool default threads=2 max_queue=256;

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{ORIGIN_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }
}

stream {
    # --- host auth x TLS ---------------------------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port     {PORT};
        brix_root            on;
        brix_tls             on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_auth            host;
        brix_host_allow      {ALLOWLIST};
        brix_storage_backend posix:{TLS_ROOT};
    }

    # --- host auth x TLS, allowlist excluded (security-negative) -----------
    server {
        listen {BIND_HOST}:{DENY_PORT};
        brix_listen_port     {DENY_PORT};
        brix_root            on;
        brix_tls             on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_auth            host;
        brix_host_allow      {DENYLIST};
        brix_storage_backend posix:{DENY_ROOT};
    }

    # --- host auth x cache tier -------------------------------------------
    server {
        listen {BIND_HOST}:{CACHE_PORT};
        brix_listen_port      {CACHE_PORT};
        brix_root             on;
        brix_auth             host;
        brix_host_allow       {ALLOWLIST};
        brix_storage_backend  http://{BIND_HOST}:{ORIGIN_PORT};
        brix_export           {EXPORT_ROOT}/cf;
        brix_cache_store      posix:{CACHE_ROOT};
        brix_cache_state_root {CACHE_ROOT};
        brix_cache_max_object 1m;
    }

    # --- host auth x whole-object staged writer ---------------------------
    server {
        listen {BIND_HOST}:{STAGE_PORT};
        brix_listen_port     {STAGE_PORT};
        brix_root            on;
        brix_auth            host;
        brix_host_allow      {ALLOWLIST};
        brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
        brix_export          {EXPORT_ROOT}/st;
        brix_allow_write     on;
        brix_stage_dir       {SPOOL_DIR};
        brix_upload_resume   off;
    }

    # --- native-TPC source, anonymous -------------------------------------
    server {
        listen {BIND_HOST}:{SRC_PORT};
        brix_listen_port     {SRC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{SRC_ROOT};
        brix_tpc_allow_local on;
    }

    # --- native-TPC source that demands host auth -------------------------
    server {
        listen {BIND_HOST}:{SRCHOST_PORT};
        brix_listen_port     {SRCHOST_PORT};
        brix_root            on;
        brix_auth            host;
        brix_host_allow      {ALLOWLIST};
        brix_storage_backend posix:{SRC_ROOT};
        brix_tpc_allow_local on;
    }

    # --- host auth x native-TPC destination -------------------------------
    server {
        listen {BIND_HOST}:{TPC_PORT};
        brix_listen_port     {TPC_PORT};
        brix_root            on;
        brix_auth            host;
        brix_host_allow      {ALLOWLIST};
        brix_storage_backend posix:{TPC_ROOT};
        brix_allow_write     on;
        brix_tpc_allow_local on;
    }

    # --- host auth x cms mesh member --------------------------------------
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_listen_port     {CMS_PORT};
        brix_root            on;
        brix_auth            host;
        brix_host_allow      {ALLOWLIST};
        brix_storage_backend posix:{CMS_ROOT};
        brix_cms_manager     {BIND_HOST}:{MANAGER_PORT};
        brix_cms_paths       /;
    }
}

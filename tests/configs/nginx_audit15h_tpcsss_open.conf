# anonymous native TPC pull SOURCE (test_audit15h_tpc_sss.py) — audit §C.
#
# The attribution control for the SSS source next door.  Same export, same
# rendezvous, same destination, no authentication: a pull that succeeds here
# and fails against {the SSS source} failed because of sss, not because of the
# path, the key, the file size or the destination's write gate.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_access_log {LOG_DIR}/acc.log;
    }
}

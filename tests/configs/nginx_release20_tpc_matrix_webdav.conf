# 2.0 F18 lab, WebDAV plane: the TPC identity matrix on HTTP COPY.
#
# The native lab (nginx_release20_tpc_identity_matrix.conf) proves the gate at
# brix_open_handle_tpc().  The matrix has a SECOND gate site —
# webdav_tpc_matrix_gate() in src/protocols/webdav/tpc.c, reached from
# webdav_tpc_authorize(), which both tpc_pull.c and tpc_push.c call — and a
# policy that exists on one plane but not the other is worse than one that
# exists on neither: an operator who writes `brix_tpc_restrict` on an http{}
# location would believe a COPY was confined.
#
# All four directives are BRIX_HTTP_ALL_CONF|NGX_HTTP_LOC_CONF_OFFSET, so the
# arms are `location` blocks under one `listen` and differ in NOTHING but the
# matrix rule under test.  Each has its own export root, so a COPY landing on
# the wrong plane is a missing file rather than a coincidence.
#
#   /open/       no matrix at all — the control.  A COPY here must complete
#                byte-exact, which is what makes every refusal below
#                falsifiable and what proves an unconfigured matrix is a
#                no-op on this plane too.
#   /restrict/   `brix_tpc_restrict /restrict/allowed` — the path stage reads
#                r->uri, our LOCAL logical path, which INCLUDES the location
#                prefix.  Inside the prefix completes; outside is refused; and
#                `/restrict/allowedx` is OUTSIDE, the component-boundary rule
#                that makes this narrower than stock ofs.tpc.
#   /allow/      `brix_tpc_allow_identity vo cms` against `brix_webdav_auth
#                none`: the anonymous requester matches no rule, so the stage
#                DENIES rather than defaults.  (The permit branch of the allow
#                stage needs a credential the anonymous HTTP plane cannot
#                have; it is proven exhaustively by the unit suite and on the
#                wire by the native lab's credentialed legs.)
#   /require/    `brix_tpc_require client gsi` — on this plane the requester is
#                always the CLIENT party, and an anonymous requester carries no
#                auth label, so the rule cannot be satisfied.
#   /reqdest/    `brix_tpc_require dest gsi` — the SAME rule aimed at the other
#                party.  No rule names the client, so the client is
#                unconstrained and the COPY completes.  That is the party
#                mapping the native lab proves from the destination's side,
#                and this is the arm that catches it being inverted here.
#
# The pull source is an in-test TLS mock (Source: must be an https URL —
# tpc_copy.c:145).  TPC legs force CURLOPT_SSL_VERIFYPEER/VERIFYHOST, so
# {CA_PEM} — the mock's self-signed cert doubling as its CA — is what lets a
# permitted arm connect at all.  Every arm carries it, including the ones that
# must be refused, so no refusal here can be a trust failure wearing a policy
# failure's clothes.  `brix_tpc_allow_local on` likewise: the host-plane egress
# gate must be open on every arm so the matrix is the only thing that can
# refuse.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST EXPORT_ROOT CA_PEM.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

# The pull runs on a worker thread; without a pool there is no transfer to run.
thread_pool default threads=4 max_queue=256;

events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # ── the control: no matrix directive at all ───────────────────────
        location /open/ {
            brix_webdav             on;
            brix_storage_backend    posix:{EXPORT_ROOT}/open;
            brix_webdav_auth        none;
            brix_allow_write        on;
            brix_webdav_tpc         on;
            brix_webdav_tpc_cafile  {CA_PEM};
            brix_tpc_allow_local    on;
        }

        # ── the path stage ────────────────────────────────────────────────
        location /restrict/ {
            brix_webdav             on;
            brix_storage_backend    posix:{EXPORT_ROOT}/restrict;
            brix_webdav_auth        none;
            brix_allow_write        on;
            brix_webdav_tpc         on;
            brix_webdav_tpc_cafile  {CA_PEM};
            brix_tpc_allow_local    on;
            brix_tpc_restrict       /restrict/allowed;
        }

        # ── the identity stage ────────────────────────────────────────────
        location /allow/ {
            brix_webdav             on;
            brix_storage_backend    posix:{EXPORT_ROOT}/allow;
            brix_webdav_auth        none;
            brix_allow_write        on;
            brix_webdav_tpc         on;
            brix_webdav_tpc_cafile  {CA_PEM};
            brix_tpc_allow_local    on;
            brix_tpc_allow_identity vo cms;
        }

        # ── the auth stage, aimed at THIS party ───────────────────────────
        location /require/ {
            brix_webdav             on;
            brix_storage_backend    posix:{EXPORT_ROOT}/require;
            brix_webdav_auth        none;
            brix_allow_write        on;
            brix_webdav_tpc         on;
            brix_webdav_tpc_cafile  {CA_PEM};
            brix_tpc_allow_local    on;
            brix_tpc_require        client gsi;
        }

        # ── the auth stage, aimed at the OTHER party ──────────────────────
        location /reqdest/ {
            brix_webdav             on;
            brix_storage_backend    posix:{EXPORT_ROOT}/reqdest;
            brix_webdav_auth        none;
            brix_allow_write        on;
            brix_webdav_tpc         on;
            brix_webdav_tpc_cafile  {CA_PEM};
            brix_tpc_allow_local    on;
            brix_tpc_require        dest gsi;
        }
    }
}

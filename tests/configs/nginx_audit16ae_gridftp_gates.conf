# EIGHT GridFTP gateways in ONE process — the measuring half of the three
# `gridftp/ftp_module.c` gates whose DISARMING arm no config in this tree has
# ever written (test_audit16ae_gridftp_gate_off_arms.py, 16th tranche):
#
#   brix_gridftp_verify_write       `on` in nginx_gridftp_verify_{posix,pblock}.conf
#   brix_gridftp_require_allo_size  `on` rendered by test_gridftp_allo_truncation.py
#   brix_gridftp_gsi                `on` in the four gsiftp configs
#
# All three merge to 0 (ftp_module_merge.c:160,161,164), and both existing files
# name their control arm "off" while rendering ABSENCE — the ALLO one literally
# writes `extra = "…require_allo_size on;" if require else ""`.  The equality of
# the written token and the omission is therefore a claim the corpus leans on and
# has never measured, which is what the ABS planes below are for.
#
# Every directive here is NGX_STREAM_SRV_CONF, so a plane is a `listen` and not a
# location.  Eight is the cheapest this subject can be:
#
#   PORT        W_OFF   — `verify_write off; require_allo_size off;`  Both
#                         never-written tokens, together, because the two flags
#                         answer for the same STOR and a plane that wrote only
#                         one of them could not say the other was absent.
#   ABS_PORT    W_ABS   — neither directive.  The merge default twice, and the
#                         control every W_OFF cell is compared against.
#   ON_PORT     W_ON    — both armed.  The behaviour the existing files cover,
#                         repeated here so the comparison is within one process.
#   VONLY_PORT  W_VONLY — `verify_write on; require_allo_size off;`  The
#                         composition cell: an operator who armed the integrity
#                         check and not the length check.
#   AONLY_PORT  W_AONLY — the mirror, `verify_write off; require_allo_size on;`
#
#   GOFF_PORT   G_OFF   — `brix_gridftp_gsi off` BESIDE a configured certificate,
#                         key and CA.  The material is what makes this a
#                         measurement of the flag: without it, `off` and "no GSI
#                         configured" are the same server (ftp_module_merge.c:142
#                         only demands the certificate when `enable && gsi`).
#   GABS_PORT   G_ABS   — the same three PKI directives and no `brix_gridftp_gsi`.
#   GON_PORT    G_ON    — the same three and `brix_gridftp_gsi on`.
#
# ONE export under all eight: `brix_gridftp_export` is per-server, but the
# subject is what a server DOES with a STOR rather than where it puts it, and a
# shared tree makes a write that landed on the wrong plane visible as a file in
# the wrong place.  Every cell owns its own file name.
#
# worker_processes 1 so that a PASV listener opened by one plane and the STOR
# that follows it are always the same worker's.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the seven extra ports.
# Test-provided: BIND_HOST SERVER_CERT SERVER_KEY CA_DIR.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # --- both disarming tokens, written -----------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_gridftp                   on;
        brix_gridftp_export            {DATA_ROOT};
        brix_gridftp_allow_write       on;
        brix_gridftp_verify_write      off;
        brix_gridftp_require_allo_size off;
    }

    # --- the same server with neither directive ---------------------------
    server {
        listen {BIND_HOST}:{ABS_PORT};
        brix_gridftp             on;
        brix_gridftp_export      {DATA_ROOT};
        brix_gridftp_allow_write on;
    }

    # --- both armed -------------------------------------------------------
    server {
        listen {BIND_HOST}:{ON_PORT};
        brix_gridftp                   on;
        brix_gridftp_export            {DATA_ROOT};
        brix_gridftp_allow_write       on;
        brix_gridftp_verify_write      on;
        brix_gridftp_require_allo_size on;
    }

    # --- the integrity check without the length check ---------------------
    server {
        listen {BIND_HOST}:{VONLY_PORT};
        brix_gridftp                   on;
        brix_gridftp_export            {DATA_ROOT};
        brix_gridftp_allow_write       on;
        brix_gridftp_verify_write      on;
        brix_gridftp_require_allo_size off;
    }

    # --- the length check without the integrity check ---------------------
    server {
        listen {BIND_HOST}:{AONLY_PORT};
        brix_gridftp                   on;
        brix_gridftp_export            {DATA_ROOT};
        brix_gridftp_allow_write       on;
        brix_gridftp_verify_write      off;
        brix_gridftp_require_allo_size on;
    }

    # --- GSI disarmed beside the material it would have used --------------
    server {
        listen {BIND_HOST}:{GOFF_PORT};
        brix_gridftp                 on;
        brix_gridftp_export          {DATA_ROOT};
        brix_gridftp_allow_write     on;
        brix_gridftp_gsi             off;
        brix_gridftp_certificate     {SERVER_CERT};
        brix_gridftp_certificate_key {SERVER_KEY};
        brix_gridftp_trusted_ca      {CA_DIR};
    }

    # --- the same server with nothing written -----------------------------
    server {
        listen {BIND_HOST}:{GABS_PORT};
        brix_gridftp                 on;
        brix_gridftp_export          {DATA_ROOT};
        brix_gridftp_allow_write     on;
        brix_gridftp_certificate     {SERVER_CERT};
        brix_gridftp_certificate_key {SERVER_KEY};
        brix_gridftp_trusted_ca      {CA_DIR};
    }

    # --- GSI armed --------------------------------------------------------
    server {
        listen {BIND_HOST}:{GON_PORT};
        brix_gridftp                 on;
        brix_gridftp_export          {DATA_ROOT};
        brix_gridftp_allow_write     on;
        brix_gridftp_gsi             on;
        brix_gridftp_certificate     {SERVER_CERT};
        brix_gridftp_certificate_key {SERVER_KEY};
        brix_gridftp_trusted_ca      {CA_DIR};
    }
}

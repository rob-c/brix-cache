# One GSI GridFTP origin and three anonymous WebDAV fronts. Each front reaches
# the origin with a different static proxy, proving VOMS carry on the outbound
# AUTH GSSAPI/delegation hop.
worker_processes 2;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool gsiftp_io threads=4 max_queue=128;
events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/body;
    brix_credential atlas_proxy {
        x509_proxy {ATLAS_PROXY};
        ca_dir {CA_DIR};
    }
    brix_credential plain_proxy {
        x509_proxy {PLAIN_PROXY};
        ca_dir {CA_DIR};
    }
    brix_credential cms_proxy {
        x509_proxy {CMS_PROXY};
        ca_dir {CA_DIR};
    }

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {ATLAS_EXPORT};
            brix_storage_backend gsiftp://{BIND_HOST}:{ORIGIN_PORT}/;
            brix_storage_credential atlas_proxy;
            brix_allow_write off;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{PLAIN_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {PLAIN_EXPORT};
            brix_storage_backend gsiftp://{BIND_HOST}:{ORIGIN_PORT}/;
            brix_storage_credential plain_proxy;
            brix_allow_write off;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{CMS_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {CMS_EXPORT};
            brix_storage_backend gsiftp://{BIND_HOST}:{ORIGIN_PORT}/;
            brix_storage_credential cms_proxy;
            brix_allow_write off;
            brix_thread_pool gsiftp_io;
        }
    }
}

stream {
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        brix_gridftp on;
        brix_export {ORIGIN_ROOT};
        brix_allow_write on;
        brix_gridftp_gsi on;
        brix_certificate {SERVER_CERT};
        brix_certificate_key {SERVER_KEY};
        brix_trusted_ca {CA_DIR};
        brix_vomsdir {VOMSDIR};
        brix_voms_cert_dir {CA_DIR};
        brix_require_vo /vodata atlas;
    }
}

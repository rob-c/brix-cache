# phase-115 W5.4 — same-origin server copy on the outbound FTP/GridFTP driver.
#
# Three WebDAV fronts over ONE origin, differing only in what the export is
# allowed to do:
#
#   PORT     read/write export — the subject.  A COPY here is served by the
#            driver's server_copy slot: the gateway pulls the source and
#            publishes the destination on the SAME origin, and the client
#            never carries the bytes.
#   RO_PORT  the same origin under `brix_read_only on` — the security negative.
#            The typed VFS mutation policy must refuse the COPY before any FTP
#            command is written, which the origin's own command log proves.
#   SUB_PORT a second export rooted one directory DEEPER on the same origin.
#            It exists so "same origin" is tested as the driver sees it — one
#            instance, one control session — rather than as "same hostname".
#
# `mode=e` throughout: a copy that silently truncates is the failure mode worth
# engineering against, and stream mode cannot tell a completed transfer from a
# dropped connection.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool gsiftp_io threads=4 max_queue=128;
events { worker_connections 128; }

http {
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {COPY_EXPORT};
            brix_allow_write on;
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{RO_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {COPY_EXPORT};
            # `brix_allow_write on` DELIBERATELY, and `brix_read_only on` after
            # it: the hard read-only switch forces allow_write back off, so the
            # refusal below is attributable to the read-only posture.  Omitting
            # the write directive would refuse just as hard and prove nothing.
            brix_allow_write on;
            brix_read_only on;
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{SUB_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {SUB_EXPORT};
            brix_allow_write on;
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE}/sub mode=e;
            brix_thread_pool gsiftp_io;
        }
    }
}

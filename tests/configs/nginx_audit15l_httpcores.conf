# The HTTP plane's storage tiers and faces in ONE server block
# (test_audit15l_http_coresidency.py, §Method step 3 continued).
#
# Tranche 11 re-ran the pairwise matrix per SERVER BLOCK instead of per file and
# found 24 pairs the 08-15 pass had scored as covered that no single block runs;
# it closed the eight that make up the S3 security cluster.  Eight more are one
# http-plane cluster, and they are all here:
#
#   proto:srr x store:posix · proto:srr x store:cache · proto:cvmfs x store:posix
#   proto:cvmfs x proto:dashboard · proto:dashboard x store:cache
#   proto:dashboard x store:httpbe · store:passthru x store:posix
#   auth:authdb x store:httpbe
#
# Every one of those is the SAME deployment an operator actually builds — one
# listener that serves the data, reports on itself, and exposes an admin face —
# and the tree had it split across files that never share a listener.
#
# ONE BRIX PROTOCOL PER PORT.  `brix_http_proto_exclusive_check()`
# (proto_exclusive.c:265) aggregates the protocol mask of every server bound to
# a port and rejects the config at `nginx -t` if more than one bit is set:
# "brix_cvmfs and brix_webdav both enabled under listen port N - one brix
# protocol per port".  So the CVMFS face cannot join the WebDAV block no matter
# how much the matrix wants it to — it gets its own listener below, and the
# pair proto:cvmfs x proto:webdav is not a gap but a design rule (the test file
# pins it with a rejected config rather than leaving it as an omission).  The
# dashboard is not in the protocol registry, so it co-resides with either.
#
# THE BLOCK (all on {PORT}, all in one server):
#   /.well-known/wlcg-storage-resource-reporting  the SRR document, whose two
#            shares are the posix export and the cache store BELOW it, so the
#            report is about this server rather than about a fixture.
#   /posix/  plain WebDAV over posix — the local tier, and the source of truth
#            the SRR share sizes are measured against.
#   /cache/  WebDAV over the REMOTE origin with a cache store: the read-through
#            tier.  brix_cache_max_object is small, so a large object is
#            DECLINED admission here — the control for the arm below.
#   /pt/     the same, plus brix_cache_passthrough: the declined object is
#            served anyway under a separate spool cap and evicted when the last
#            fd closes.  Same size limits as /cache/, one directive apart.
#   /acl/    WebDAV over the remote origin behind the XrdAcc tier: the pair
#            asks whether authorization runs BEFORE the backend fetch, which is
#            only observable when the backend is remote and logs its own hits.
#   /brix    the dashboard face, co-resident with all four tiers above.
#
# THE SECOND SUBJECT BLOCK ({CVMFS_PORT}) is the CVMFS face over a LOCAL posix
# repo with its own cache store and its own dashboard — proto:cvmfs x
# store:posix and proto:cvmfs x proto:dashboard, which are legal and were still
# never co-resident anywhere in the tree.
#
# EVERY CACHE-BEARING LOCATION CARRIES ITS OWN brix_export.  The cache tier is
# registered in the VFS backend registry keyed by the canonical export root
# (vfs_backend_config.c::brix_vfs_backend_config_cache_store), so two locations
# sharing a root share ONE tier — /cache/ would silently inherit /pt/'s
# passthrough policy and the control would evaporate.
#
# TWO SERVER BLOCKS, ON PURPOSE.  The origin is a second block in this same
# nginx: four locations above fetch from it over http, which is what makes
# store:httpbe real rather than declared.  That is also why worker_processes is
# 2 — a single worker fetching from itself off-loop deadlocks (the same reason
# nginx_lc_cache_passthrough.conf gives).
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + ledger extra ORIGIN_PORT.
# Session-provided: BIND_HOST.
# Test-provided: CACHE_ROOT EXPORT_ROOT MAX_OBJECT PT_MAX AUTHDB SRR_HOST
#                (every path must exist at config-parse time — lifecycle.start
#                runs `nginx -t` first).
daemon on;
worker_processes 2;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log            off;
    client_max_body_size  200m;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    # The origin every remote tier below pulls from.  No cache of its own.
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        server_name localhost;
        location / {
            dav_methods          PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT}/origin;
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    # --- the block the matrix had never seen ------------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location = /.well-known/wlcg-storage-resource-reporting {
            brix_srr          on;
            brix_srr_name     "TEST-COERESIDENT-SE";
            brix_srr_quality  testing;
            brix_srr_version  "3.5";
            brix_srr_share    localdata {DATA_ROOT}/local atlas;
            brix_srr_share    cachedata {CACHE_ROOT}/cache atlas;
            brix_srr_endpoint dav https https://{SRR_HOST}:{PORT}/posix/;
        }

        location /posix/ {
            dav_methods          PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT}/local;
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        location /cache/ {
            brix_webdav               on;
            brix_storage_backend      http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth          none;
            brix_export               {EXPORT_ROOT}/cache;
            brix_cache_store          posix:{CACHE_ROOT}/cache;
            brix_cache_max_object     {MAX_OBJECT};
        }

        location /pt/ {
            brix_webdav                on;
            brix_storage_backend       http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth           none;
            brix_export                {EXPORT_ROOT}/pt;
            brix_cache_store           posix:{CACHE_ROOT}/pt;
            brix_cache_max_object      {MAX_OBJECT};
            brix_cache_passthrough     on;
            brix_cache_passthrough_max {PT_MAX};
        }

        location /acl/ {
            dav_methods          PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
            brix_authdb_audit    all;
        }

        location /brix {
            brix_dashboard           on;
            brix_dashboard_anonymous on;
            brix_admin_rate_limit    off;  # one client IP for the whole suite
        }
    }

    # --- the CVMFS face, on its own port because the rule says so ----------- #
    server {
        listen {BIND_HOST}:{CVMFS_PORT};
        server_name localhost;

        # The SRR document of a CVMFS site: its one share is the repo cache
        # below.  SRR is not in the protocol registry, so it joins whichever
        # face the site actually runs.
        location = /.well-known/wlcg-storage-resource-reporting {
            brix_srr          on;
            brix_srr_name     "TEST-CVMFS-SE";
            brix_srr_quality  testing;
            brix_srr_version  "3.5";
            brix_srr_share    cvmfsdata {CACHE_ROOT}/cvmfs atlas;
            brix_srr_endpoint dav https https://{SRR_HOST}:{CVMFS_PORT}/cvmfs/;
        }

        location /cvmfs/ {
            brix_cvmfs            on;
            brix_storage_backend  posix:{DATA_ROOT}/repo;
            brix_export           {EXPORT_ROOT}/cvmfs;
            brix_cache_store      posix:{CACHE_ROOT}/cvmfs;
            brix_cache_max_object {MAX_OBJECT};
            # The same authdb the WebDAV tier enforces, on a face that has no
            # call site for it: src/protocols/cvmfs/ never references the acc
            # tier at all.  No rule here covers /cvmfs/, so under XrdAcc
            # semantics every request below is uncovered — and therefore a
            # denial, if anything consulted these rules.
            brix_authdb_format    xrdacc;
            brix_authdb           {AUTHDB};
            brix_authdb_audit     all;
        }

        location /brix {
            brix_dashboard           on;
            brix_dashboard_anonymous on;
            brix_admin_rate_limit    off;
        }
    }
}

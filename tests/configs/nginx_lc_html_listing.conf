# WebDAV GET-on-directory listing postures (test_webdav_html_listing.py,
# registry lifecycle). LISTING_LINE carries the posture directive(s):
#   ""                                    -> listingdeny default (403)
#   "brix_webdav_html_listing on;"        -> HTML index
#   "brix_webdav_listing_redirect https://elsewhere.example/;" -> 301
# Launcher-provided: LOG_DIR PORT TMP_DIR.  Test-provided: BIND_HOST DATA_ROOT.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_allow_write on;
            {LISTING_LINE}
        }
    }
}

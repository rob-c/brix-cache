# brix_webdav_proxy_certs at VALUE granularity (audit tranche 16, file 16;
# test_audit16p_proxy_certs.py).  THREE TLS listeners in one process, each doing
# mandatory client-certificate verification against the same CA, differing only
# in where — and whether — the flag is written.
#
# THE SUBJECT
#   brix_webdav_proxy_certs   module_commands.c:228   proxy_certs
#     NGX_HTTP_SRV_CONF | NGX_HTTP_LOC_CONF | NGX_CONF_FLAG
#     ngx_conf_set_flag_slot, NGX_HTTP_LOC_CONF_OFFSET, merges to 0
#     (config_merge.c:85)
#   The corpus writes `on` in 88 places and, before this file, `off` nowhere.
#   The flag's only effect is one OpenSSL call in postconfig (postconfig.c:247):
#   X509_VERIFY_PARAM_set_flags(SSL_CTX_get0_param(...),
#   X509_V_FLAG_ALLOW_PROXY_CERTS), without which OpenSSL refuses an RFC 3820
#   proxy chain outright.  So the observable is a client-certificate
#   verification verdict and nothing else, and it needs a TLS listener that
#   demands one.
#
# WHY THREE LISTENERS AND NOT THREE VHOSTS
#   The flag is applied to an SSL_CTX, and an SSL_CTX belongs to a listening
#   server rather than to a request — the verify parameters are in place before
#   the first byte of the ClientHello and before any Host header exists.  Two
#   arms cannot share a socket, so each buys a port.  This is the same reason
#   the tranche's stapling file (16b) buys three.
#
# THE ARMS
#   {PORT}      server-scope `{SRV_ARM}` (the test writes `on` here)
#   {OFF_PORT}  server-scope `{OFF_ARM}` — `off`, and, after a reconfigure that
#               empties the slot, ABSENT.  One listener answers both, which is
#               the stricter comparison: nothing but the token differs.
#   {LOC_PORT}  NOTHING at server scope; the flag written `on` inside
#               `location /` instead.  The declaration permits that placement
#               (NGX_HTTP_LOC_CONF is in its scope mask) and the postconfig hook
#               reads `cscf->ctx->loc_conf[...]` — the SERVER's loc_conf — so the
#               location's value is never consulted.  This arm exists to measure
#               that, not to assume it.
#
# WHY THE LOCATIONS ARE PLAIN
#   Every arm's `location /` is a WebDAV export with `brix_webdav_auth none`: the
#   authorization under test is the TLS layer's, so the export must not have an
#   opinion of its own about the client's DN.  A 200 with the seeded bytes means
#   the chain verified; anything else means it did not, and the file measures
#   which "anything else" rather than predicting it.
#
# ssl_verify_depth is 10 because the chain under test is three certificates deep
# (proxy -> EEC -> CA) and nginx's default depth of 1 would refuse it for a
# reason that has nothing to do with the flag.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST OFF_PORT LOC_PORT HOST_CERT HOST_KEY CA_CERT
#                SRV_ARM OFF_ARM.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    # ---- server scope, the arm the corpus writes ------------------------- #
    server {
        listen {BIND_HOST}:{PORT} ssl;
        server_name pc-srv-on;

        ssl_certificate         {HOST_CERT};
        ssl_certificate_key     {HOST_KEY};
        ssl_client_certificate  {CA_CERT};
        ssl_verify_client       on;
        ssl_verify_depth        10;

        {SRV_ARM}

        location / {
            brix_webdav           on;
            brix_storage_backend  posix:{DATA_ROOT};
            brix_webdav_auth      none;
        }

        # The mirror of the location-scope question, and the only place in the
        # tree where this directive's `off` is written at all: a child of a server
        # that wrote `on`.  If the hook read locations, this subtree would refuse
        # a proxy chain while `/` beside it accepted one.
        location /noproxy/ {
            brix_webdav              on;
            brix_storage_backend     posix:{DATA_ROOT};
            brix_webdav_auth         none;
            brix_webdav_proxy_certs  off;
        }
    }

    # ---- server scope, the arm written nowhere in the tree --------------- #
    server {
        listen {BIND_HOST}:{OFF_PORT} ssl;
        server_name pc-srv-off;

        ssl_certificate         {HOST_CERT};
        ssl_certificate_key     {HOST_KEY};
        ssl_client_certificate  {CA_CERT};
        ssl_verify_client       on;
        ssl_verify_depth        10;

        {OFF_ARM}

        location / {
            brix_webdav           on;
            brix_storage_backend  posix:{DATA_ROOT};
            brix_webdav_auth      none;
        }
    }

    # ---- the placement the declaration allows and the hook cannot see ---- #
    server {
        listen {BIND_HOST}:{LOC_PORT} ssl;
        server_name pc-loc-on;

        ssl_certificate         {HOST_CERT};
        ssl_certificate_key     {HOST_KEY};
        ssl_client_certificate  {CA_CERT};
        ssl_verify_client       on;
        ssl_verify_depth        10;

        location / {
            brix_webdav              on;
            brix_storage_backend     posix:{DATA_ROOT};
            brix_webdav_auth         none;
            brix_webdav_proxy_certs  on;
        }
    }
}

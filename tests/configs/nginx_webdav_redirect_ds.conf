# §6.1 HTTP redirect-to-dataserver data-server — registry-lifecycle template
# for test_webdav_redirect_ds.py.  A WebDAV data server that shares the
# manager's brix_http_secretkey: a request carrying the signed brixrdr.* CGI
# is authenticated by the shared key and its identity adopted (fail-closed on
# a bad MAC), so a client's redirected request needs no second auth round.
# Serves real files so a valid signed GET returns bytes.
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided: HTTP_PORT SECRET.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
    }
}

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;
    access_log off;

    server {
        listen 127.0.0.1:{HTTP_PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth required;
            brix_http_secretkey {SECRET};
        }
    }
}

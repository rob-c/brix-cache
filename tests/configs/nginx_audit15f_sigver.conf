# Request signing across native TPC and bound substreams
# (test_audit15f_sigver_crosses.py, registry lifecycle) — audit §B1.1: "the TPC
# control ops (tpc.src/tpc.dst opens, sync/close) are exactly the mutating ops
# signing exists to protect; no test signs them", and §B1.2: "kXR_bind-attached
# data paths under brix_signing_required" were equally untested.
#
# Only a GSI session ever establishes a signing key (gsi_core.c), so what is
# drivable — and what an operator actually configures — is the POLICY around an
# unsignable session: brix_security_level says which opcodes must be signed
# (2/standard = kXR_open + the mutations; 3/intense = everything post-login;
# login/protocol/auth/endsess/ping/sigver/bind are always exempt) and
# brix_signing_required says whether a session that cannot sign is refused or
# merely logged (sigver.c brix_signing_unsignable_session).  Each cross is
# therefore run twice, on planes identical but for that one flag:
#
#   {PORT}         TPC destination, standard + signing_required ON  — the
#                  tpc.dst open is a kXR_open, so it must be refused while
#                  kXR_stat (not a level-2 opcode) still answers: the gate is
#                  the opcode policy, not a blanket deny
#   {LAX_PORT}     the same destination with the flag OFF — the pull completes
#                  UNSIGNED, which is precisely the bypass the audit named, and
#                  the session says so once in the log
#   {SRC_PORT}     the pull source for {LAX_PORT}: no signing policy at all
#   {SRCSIG_PORT}  a source that demands signing — the tpc.src arm open is
#                  refused, so the rendezvous never forms
#   {BIND_PORT}    substream plane, intense + signing_required ON — kXR_bind is
#                  exempt so the secondary still attaches, but every op it
#                  sends on the bound path is refused: the policy is not lost
#                  across the bind
#   {BINDLAX_PORT} the same plane with the flag OFF — the bound secondary reads
#                  the primary's handle, and BOTH connections log their own
#                  "no signing key" line (the state is per-connection even
#                  though the policy is per-server)
#
# All planes are auth none: an anonymous session is exactly the unsignable case
# the policy exists to describe, and it keeps every assertion about signing
# rather than about credentials.
#
# worker_processes 2: the TPC destination pulls from a source block inside THIS
# nginx, so one transfer occupies two connections at once.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + LAX_PORT SRC_PORT SRCSIG_PORT
# BIND_PORT BINDLAX_PORT.  Test-provided: BIND_HOST TPC_ROOT LAX_ROOT SRC_ROOT
# BIND_ROOT.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

# The native TPC pull runs its transfer on a thread-pool task.
thread_pool default threads=2 max_queue=256;

stream {
    # --- sigver x native TPC: destination, refusing ------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port      {PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{TPC_ROOT};
        brix_allow_write      on;
        brix_tpc_allow_local  on;
        brix_security_level   standard;
        brix_signing_required on;
    }

    # --- sigver x native TPC: destination, logging only --------------------
    server {
        listen {BIND_HOST}:{LAX_PORT};
        brix_listen_port      {LAX_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{LAX_ROOT};
        brix_allow_write      on;
        brix_tpc_allow_local  on;
        brix_security_level   standard;
        brix_signing_required off;
    }

    # --- pull source, no signing policy ------------------------------------
    server {
        listen {BIND_HOST}:{SRC_PORT};
        brix_listen_port     {SRC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{SRC_ROOT};
        brix_tpc_allow_local on;
    }

    # --- pull source that demands signing ----------------------------------
    server {
        listen {BIND_HOST}:{SRCSIG_PORT};
        brix_listen_port      {SRCSIG_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{SRC_ROOT};
        brix_tpc_allow_local  on;
        brix_security_level   standard;
        brix_signing_required on;
    }

    # --- sigver x substreams: refusing -------------------------------------
    server {
        listen {BIND_HOST}:{BIND_PORT};
        brix_listen_port      {BIND_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{BIND_ROOT};
        brix_security_level   intense;
        brix_signing_required on;
    }

    # --- sigver x substreams: logging only ---------------------------------
    server {
        listen {BIND_HOST}:{BINDLAX_PORT};
        brix_listen_port      {BINDLAX_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{BIND_ROOT};
        brix_security_level   intense;
        brix_signing_required off;
    }
}

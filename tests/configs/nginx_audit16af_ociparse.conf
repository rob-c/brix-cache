# nginx_audit16af_ociparse.conf — §D load-gate parse tier for the OCI registry
# (test_audit16af_oci_security_arms.py::TestTheLoadGateAcceptsThreeVerifyModesAsOne).
#
# Renders ONE disposable http plane whose server block is supplied by the
# test (the HTTP_KNOBS slot below — a TLS listener with the ssl_verify_client
# mode under measurement, carrying the registry location).  `nginx -t` only;
# never runs.
daemon off;
worker_processes 1;
error_log {LOG_DIR}/error.log;

events { worker_connections 32; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    {HTTP_KNOBS}
}

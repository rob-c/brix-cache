# Stratum-0 lab front (test_cvmfs_stratum0_quickstart.py,
# test_cvmfs_stratum0_scvmfs.py).  These modules follow the published runbook
# step by step — repotool mkfs → transaction → publish → serve — so the served
# tree, its port and its authz lines are decided per fixture and arrive as
# placeholders; the surrounding skeleton lives here rather than as a heredoc in
# the test (tests/test_server_registry_lint.py).
#
# Placeholders (named WITHOUT braces here on purpose — a comment that spells a
# placeholder out gets substituted like any other occurrence, and a multi-line
# value would then break out of the comment into top-level config):
#   SSL_LINES       empty for the cleartext quickstart front; the
#                   ssl_certificate/ssl_verify_client block for the x509/VOMS-
#                   gated scvmfs fronts (the `ssl` listen parameter rides along
#                   in LISTEN_SSL).
#   LOCATION_LINES  brix_cvmfs / brix_cvmfs_stratum0_root and, for scvmfs, the
#                   brix_scvmfs_* authz directives under test.
{USER_LINE}daemon on; error_log {LOG_FILE} info;
pid {PID_FILE};
worker_processes 1; thread_pool default threads=2;
events { worker_connections 256; }
http { access_log off; server { listen {BIND_HOST}:{PORT}{LISTEN_SSL}; {SSL_LINES}
    location /cvmfs/ {
        {LOCATION_LINES}
    }
} }

# CMS mesh members that also carry a DATA role (registry lifecycle) for
# test_audit15e_cms_active_member.py — audit §B3.16: every cms×* combination
# in the suite joined nodes whose data plane was either a plain posix export
# or nothing at all ("return \"\"").  A mesh member that PROXIES to a remote
# origin, and a mesh member that is the DESTINATION of a native TPC pull, had
# never been exercised — yet those are exactly the two roles a real site gives
# a cmsd-joined node.
#
# One instance, four stream planes:
#   {SRC_PORT}    posix TPC source (arms tpc.key), NOT a mesh member — it is
#                 the far end of the pull, so keeping it out of the mesh keeps
#                 "how many nodes registered" an exact assertion
#   {ORIGIN_PORT} posix origin, NOT a mesh member — the proxy member's backend
#   {PORT}        PROXY mesh member: root:// backend to the origin, read-only,
#                 registered with the manager at {MANAGER_PORT}
#   {TPC_PORT}    TPC-DESTINATION mesh member: posix + allow_write +
#                 tpc_allow_local, registered with the same manager
#
# brix_listen_port gives each server block its own CMS node identity, so the
# two members register as two nodes out of one master (same gate as
# nginx_cms_tier.conf).  The manager is an out-of-process instance
# (nginx_cms_state_server.conf as lc-audit15e-cmsmgr2), so the joins are real
# CMS logins rather than a loopback into this process.
#
# worker_processes 4: the proxy member's backend leg and the TPC pull leg both
# land on OTHER server blocks inside THIS nginx, so a request can occupy two
# workers at once; four leaves slack for a pull running under a read.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + SRC_PORT ORIGIN_PORT TPC_PORT
# extras.  Test-provided: BIND_HOST MANAGER_PORT SRC_ROOT ORIGIN_ROOT TPC_ROOT.
worker_processes 4;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

# The native TPC pull runs its transfer on a thread-pool task.
thread_pool default threads=2 max_queue=256;

stream {
    # --- TPC pull source: arms the rendezvous key, serves the bytes ---------
    server {
        listen {BIND_HOST}:{SRC_PORT};
        brix_listen_port     {SRC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{SRC_ROOT};
        brix_tpc_allow_local on;
    }

    # --- origin behind the proxy member ------------------------------------
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        brix_listen_port     {ORIGIN_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{ORIGIN_ROOT};
    }

    # --- mesh member #1: a PROXY, not a disk ------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port     {PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend root://{BIND_HOST}:{ORIGIN_PORT};
        brix_allow_write     off;
        brix_cms_manager     {BIND_HOST}:{MANAGER_PORT};
        brix_cms_paths       /;
    }

    # --- mesh member #2: a native-TPC DESTINATION --------------------------
    server {
        listen {BIND_HOST}:{TPC_PORT};
        brix_listen_port     {TPC_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{TPC_ROOT};
        brix_allow_write     on;
        brix_tpc_allow_local on;
        brix_cms_manager     {BIND_HOST}:{MANAGER_PORT};
        brix_cms_paths       /;
    }
}

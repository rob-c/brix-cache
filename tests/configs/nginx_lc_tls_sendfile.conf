# TLS x send-path behavioural matrix (test_tls_sendfile_matrix.py).
#
# INVARIANT 2 says the cleartext file-backed/sendfile response and the
# memory-backed one must never be mixed.  Until now that was asserted only as a
# source-marker grep (test_cross_protocol_shared_helpers_b.py) — nothing drove
# both send paths and compared the bytes on the wire.  This instance exists to
# make the fork reachable from a test, on both a cleartext and a TLS listener:
#
#   {PORT}        WebDAV, cleartext, posix backend   — always sendfile
#   {TLS_PORT}    WebDAV, TLS,       posix backend   — always sendfile
#   {PB_PORT}     WebDAV, cleartext, pblock backend  — forks on range geometry
#   {PB_TLS_PORT} WebDAV, TLS,       pblock backend  — forks on range geometry
#
# pblock is the vehicle because ONE backend takes both branches: its
# read_sendfile_fd slot (sd_pblock_io.c) returns the block-0 fd only for a range
# starting at offset 0 that fits inside one block, and NGX_INVALID_FILE for
# anything spanning blocks — which file_serve.c serves memory-backed instead.
# So {whole small object, range inside block 0} exercise the zero-copy path and
# {whole large object, range crossing a block boundary, range in a later block}
# exercise the memory-backed one, from the same export, with the same bytes to
# compare against.  BLOCK_SIZE is deliberately small (the test seeds objects
# either side of it); the posix pair is the control that must be byte-identical.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT + ledger extras.
# Session-provided: BIND_HOST SERVER_CERT SERVER_KEY.
# Test-provided: PB_ROOT BLOCK_SIZE.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR};
    client_max_body_size 200m;
    sendfile on;

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;
        location / {
            dav_methods PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{TLS_PORT} ssl;
        server_name localhost;
        ssl_certificate     {SERVER_CERT};
        ssl_certificate_key {SERVER_KEY};
        location / {
            dav_methods PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{PB_PORT};
        server_name localhost;
        location / {
            dav_methods PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend pblock://{PB_ROOT};
            brix_webdav_pblock_block_size {BLOCK_SIZE};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{PB_TLS_PORT} ssl;
        server_name localhost;
        ssl_certificate     {SERVER_CERT};
        ssl_certificate_key {SERVER_KEY};
        location / {
            dav_methods PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend pblock://{PB_ROOT};
            brix_webdav_pblock_block_size {BLOCK_SIZE};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }
}

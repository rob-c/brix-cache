# Phase-56 C-2 negative-stat cache subject (tests/test_neg_stat_cache.py).
# A single-worker anon root:// export with the per-worker negative-stat cache
# switched ON: the spec's env carries BRIX_NEG_STAT_CACHE=1 and the `env`
# directive below re-exports it into the worker environment (nginx builds each
# worker a fresh environ of TZ + `env`-listed names only, so without it the
# knob would vanish before the worker's getenv).  Exactly one worker keeps the
# per-worker cache deterministic for the create-after-negative-probe race
# assertions.  DATA_DIR and BIND_HOST ride in template_values; PORT and
# LOG_DIR come from the LifecycleHarness ledger/prefix.
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
env BRIX_NEG_STAT_CACHE;
worker_processes 1;
events { worker_connections 64; }
stream {
  server {
    listen {BIND_HOST}:{PORT};
    brix_root on;
    brix_storage_backend posix:{DATA_DIR};
    brix_allow_write on;
    brix_auth none;
  }
}

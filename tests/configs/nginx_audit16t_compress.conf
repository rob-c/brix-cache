# The inline-compression arm-gap of root/stream/directives_security.h at VALUE
# granularity (audit tranche 16, file 20; test_audit16t_compress_flag_arms.py).
# FOUR root:// acceptors over ONE export in ONE process, differing only in which
# arms of `brix_read_compress` / `brix_write_compress` each carries.
#
# THE SUBJECTS — both NGX_STREAM_SRV_CONF | NGX_CONF_FLAG, ngx_conf_set_flag_slot
# (directives_security.h:142 and :153), both merged to 0
# (server_conf_merge_security.c:310-311):
#
#   {PORT}          read on, write on   — the ONLY configuration the corpus has.
#                   Every existing test_compression_*.py runs against
#                   nginx_shared.conf, which writes both flags on, so this plane
#                   is the control that reproduces what was already covered.
#   {OFF_PORT}      read off, write off — the arm written in NO config anywhere.
#                   `on` reaches three; `off` reached none, so what these flags
#                   RESTORE when switched off had never been read at all.
#   {ABSENT_PORT}   neither directive written — the plane that MEASURES the merge
#                   default instead of reading it off server_conf_merge_security.c,
#                   and the only plane a deployment that never heard of inline
#                   compression actually has.
#   {MIXED_PORT}    read on, write off  — the plane that proves the two flags are
#                   INDEPENDENT.  Both are consulted through one expression,
#                   `enabled = is_write ? conf->write_compress : conf->read_compress`
#                   (read/open_request_opaque.c:71); a single shared bit, or the
#                   two slot offsets transposed, would still satisfy every
#                   both-on/both-off case above and is only visible here.
#
# Four servers rather than four instances: the direction gate is read per
# kXR_open out of the per-server conf, so four acceptors in one worker really are
# four independent arms.  ONE export is the point — the reading is what the SAME
# bytes on disk do through different acceptors, so a difference in the negotiated
# codec cannot be a difference in file.
#
# WHY brix_allow_write IS ON
#   Unlike file 19, half the subject here IS the write path: brix_write_compress
#   gates the decompression of kXR_write payloads on ingest, and an acceptor that
#   refuses writes could not be asked about it.  The export is shared, so the
#   fixture uploads its payload exactly once and every plane reads that one file.
#
# brix_access_log is wired per plane, to a DIFFERENT file each, because that is
# where the WRITE direction becomes visible: a decompressed-on-ingest write is
# recorded with a "z=<wirebytes>" marker on its WRITE line and a plaintext one is
# not, which is the same signal test_compression_write.py reads off the shared
# anon log.  Separate files are what let a case say a plane wrote NO marker
# without first parsing out which server a shared line came from.
#
# WHY THERE IS NO http BLOCK
#   This pair has no counter anywhere in src/observability — grep finds no
#   compression metric — so there is no brix_metrics face worth binding.  The
#   whole operator-visible surface is the kXR_open reply (cpsize/cptype) and
#   `query config cmpread|cmpwrite`, both of which are read on the stream port.
#
# The arms are written LITERALLY rather than handed in through placeholders, on
# purpose: the audit counts an arm as covered only when `<directive> <value>;`
# is spelled somewhere a reader can grep, and a placeholder that happens to
# render to `off` at runtime leaves the corpus still never saying so.  §A of the
# test reads this file back and asserts exactly that.  (Placeholder names are
# written here without their braces — the renderer replaces every occurrence,
# comments included, and then refuses to start on any brace pair it did not
# recognise, so a braced example in a comment is a parse-time failure.)
#
# Launcher-provided: LOG_DIR BIND_HOST PORT DATA_ROOT + OFF_PORT ABSENT_PORT
# MIXED_PORT.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 128; }

stream {
    # ---- both arms on: the corpus's only configuration -------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_read_compress   on;
        brix_write_compress  on;
        brix_access_log      {LOG_DIR}/access-on.log;
    }

    # ---- both arms off: the arm the corpus never wrote -------------------- #
    server {
        listen {BIND_HOST}:{OFF_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_read_compress   off;
        brix_write_compress  off;
        brix_access_log      {LOG_DIR}/access-off.log;
    }

    # ---- neither written: what every other root:// server looks like ------ #
    server {
        listen {BIND_HOST}:{ABSENT_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/access-absent.log;
    }

    # ---- mixed: the only plane where the two slots are distinguishable ---- #
    server {
        listen {BIND_HOST}:{MIXED_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_read_compress   on;
        brix_write_compress  off;
        brix_access_log      {LOG_DIR}/access-mixed.log;
    }
}

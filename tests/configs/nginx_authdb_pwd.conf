# pwd-authenticated root:// server WITH brix_authdb, for
# test_authdb_mechanism_scope.py.  Launcher-provided: LOG_DIR PORT.
# Test-provided: BIND_HOST DATA_DIR PWD_FILE AUTHDB.
#
# The plain pwd template (nginx_lc_pwd_auth.conf) stops at proving identity;
# this one adds the authorization layer, so the pwd-file user name (login.dn)
# and its 4th-field VO list are what the authdb u/g rules are matched against.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth pwd;
        brix_pwd_file {PWD_FILE};
        brix_allow_write on;
        brix_authdb {AUTHDB};
    }
}

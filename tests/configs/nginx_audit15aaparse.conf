# Parse-tier scaffold for the five default-restating tokens
# (test_audit15aa_default_tokens.py).
#
# Never started; it exists so `nginx -t` can be asked about one line at a time.
# It writes none of the five directives itself — a scaffold that already carried
# a token would make every negative case ambiguous, because a second occurrence
# of an enum directive is diagnosed as a duplicate and that error lands before
# the one a placement or value negative is trying to reach.
#
# Four slots, named here WITHOUT their braces: the renderer replaces every
# occurrence of a placeholder including the ones inside comments, and a
# multi-line value spliced into a comment turns the tail of that comment into
# live configuration.
#
#   OUTER     main-context lines, outside stream{} and http{} entirely.
#             brix_webdav_checksum_xattr_format is declared NGX_HTTP_MAIN_CONF,
#             so "main" here means the http{} main context, not this one — a
#             directive nginx does not know at the top level must be refused,
#             never silently ignored.
#   HTTP_MAIN lines directly inside http{}.  This is the context the MAIN_CONF
#             flag actually names.
#   LOC       lines inside an http location.  All five webdav-plane tokens must
#             parse here; the three stream-plane ones must not.
#   STREAM    lines inside a stream server.  brix_backend_s3_sts_flavor is
#             declared on BOTH planes off two separate enum tables, so it must
#             parse here and in LOC; brix_health_check_type and
#             brix_ssi_cta_executor are stream-only.
#
# `nginx -t` never binds, so PORT/HTTP_PORT are placeholders.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;
{HTTP_MAIN}
    server {
        listen {HTTP_PORT};

        location /probe/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
{LOC}        }
    }
}

stream {
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
{STREAM}    }
}

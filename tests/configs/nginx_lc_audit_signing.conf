# brix_signing_required over an UNSIGNABLE session (audit §5.2/§9.2) —
# test_audit_fixes_2026_08_09.py::TestSigningFailClosed.
#
# brix_security_level intense requires a kXR_sigver signature on essentially
# every post-login opcode. Only a GSI session ever establishes a signing key, so
# an anonymous (or sss/ztn/krb5) session CANNOT sign — and used to sail straight
# past the level with no signature and no log line. That silent bypass is the
# bug; brix_signing_required decides what happens instead:
#
#   {SIGNING_REQUIRED} on  — the request is REFUSED (kXR_NotAuthorized)
#   {SIGNING_REQUIRED} off — accepted unsigned (legacy behaviour), but LOGGED
#
# One template, both instances: the test starts it twice with the flag flipped,
# so the pair differ in exactly the directive under test and nothing else.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.
# Session-provided: BIND_HOST.
# Test-provided: SIGNING_REQUIRED
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root             on;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_auth             none;
        brix_security_level   intense;
        brix_signing_required {SIGNING_REQUIRED};
        brix_access_log       {LOG_DIR}/brix_access.log;
    }
}

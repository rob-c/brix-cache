# native TPC pull DESTINATION whose CLIENT face is guarded by SSS
# (test_audit15h_tpc_sss.py) — audit §C.
#
# The destination holds the SAME keytab as the SSS source: brix_sss_keytab is
# what lets it authenticate the initiating client, and the file's central
# question is whether it also does anything for the pull leg.  It does not —
# there is no sss anywhere under src/tpc/, and the outbound protocol selection
# in src/tpc/gsi/gsi_outbound_finish.c knows only "ztn" and "gsi".  Configuring
# the secret on both ends and still being refused is the assertion.
#
# No brix_certificate / brix_tpc_outbound_bearer_file here on purpose: adding
# either would change what the refusal means.
#
# thread_pool is not optional — the pull runs on a thread-pool worker.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: KEYTAB.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth sss;
        brix_sss_keytab {KEYTAB};
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_allow_private on;
        brix_access_log {LOG_DIR}/acc.log;
    }
}

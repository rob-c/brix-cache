# The dashboard's transfer-state bands — §Method step 2 sharpened
# (test_audit15q_dashboard_thresholds.py).
#
# The last two survivors of the sharpened step 2 are the pair that decides what
# colour a row is on the operator's screen:
#
#   brix_dashboard_idle_threshold · brix_dashboard_stalled_threshold
#
# Half of that pair turns out to be covered in effect — test_dashboard.py's
# throttled/stalled tests run against a face configured 1s/3s and would never
# see either state on the 60s default, so brix_dashboard_stalled_threshold
# already has a verdict that moves with it.  Nothing anywhere observes the
# "idle" band between the two numbers, nothing reads the limits echo, and
# nothing exercises the cross-field invariant at module.c:203.
#
# HOW A THRESHOLD BECOMES VISIBLE, WITHOUT A STOPWATCH
#
# dashboard_state_name() (api.c:38) is a pure function of one slot's idle_ms
# and ONE location's two thresholds.  The transfer table is SHM and
# process-wide, so every dashboard face in this file reads the SAME slot —
# which means the four faces can be asked at one instant and disagree.  The
# disagreement is the measurement: no elapsed time is asserted anywhere, only
# that one row is simultaneously "stalled" here, "idle" there and "active"
# there, because the three faces were handed three different pairs of numbers.
#
#              brix_dashboard_idle_threshold  _stalled_threshold
#   {PORT}                200ms                    700ms
#   {MID_PORT}            1500ms                   30s
#   {SLOW_PORT}           20s                      40s
#   {DEF_PORT}            (absent)                 (absent)     -> 5s / 60s
#
# {DEF_PORT} writes neither and exists to read the frozen merge defaults
# (module.c:137-140) off the limits object, which is the only place they are
# observable at all.
#
# The dashboard's route table is URI-ABSOLUTE (module_dispatch.c:76-85), so a
# face must be mounted at /brix/ and nowhere else — hence four server blocks on
# four ports rather than four locations on one.
#
# {ROOT_PORT} is the transfer under observation: an xrootd handle opened and
# then left alone.  brix_open_register_monitor()
# (open_resolved_file_finalize.c:293) allocates the dashboard slot at open, and
# only a read or write refreshes its last_ms, so a held-open handle's idle_ms
# climbs on its own and its avg_bps stays 0 — which is also what puts it in the
# "stalled" rather than the "throttled" leg of api.c:53.
#
# Every face is anonymous AND carries a password: without the password the E-1
# security gate treats an anonymous dashboard as a warning-level misconfig, and
# without brix_dashboard_anonymous every poll below would need a login round
# trip.  The anonymous tier redacts paths and identities but not `id`, `state`,
# `idle_ms` or `avg_bps` (api_transfers.c:114-124), which is everything these
# tests read.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ledger extras MID_PORT SLOW_PORT
# DEF_PORT ROOT_PORT, and TMP_DIR.  Session-provided: BIND_HOST.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # The transfer under observation.  No dashboard directives here: the slot
    # is allocated because the http block below declares the dashboard SHM
    # zone, which is process-wide.
    server {
        listen {BIND_HOST}:{ROOT_PORT};
        brix_listen_port     {ROOT_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_storage_backend posix:{DATA_ROOT};
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/client_body;
    proxy_temp_path       {TMP_DIR}/proxy;
    fastcgi_temp_path     {TMP_DIR}/fastcgi;
    uwsgi_temp_path       {TMP_DIR}/uwsgi;
    scgi_temp_path        {TMP_DIR}/scgi;

    # --- the impatient face ------------------------------------------------ #
    server {
        listen {BIND_HOST}:{PORT};
        location /brix/ {
            brix_dashboard                   on;
            brix_admin_rate_limit            off;
            brix_dashboard_anonymous         on;
            brix_dashboard_password          "audit15q";
            brix_dashboard_idle_threshold    200ms;
            brix_dashboard_stalled_threshold 700ms;
        }
    }

    # --- the middle face: the same slot is merely "idle" here --------------- #
    server {
        listen {BIND_HOST}:{MID_PORT};
        location /brix/ {
            brix_dashboard                   on;
            brix_admin_rate_limit            off;
            brix_dashboard_anonymous         on;
            brix_dashboard_password          "audit15q";
            brix_dashboard_idle_threshold    1500ms;
            brix_dashboard_stalled_threshold 30s;
        }
    }

    # --- the patient face: the same slot is still "active" ------------------ #
    server {
        listen {BIND_HOST}:{SLOW_PORT};
        location /brix/ {
            brix_dashboard                   on;
            brix_admin_rate_limit            off;
            brix_dashboard_anonymous         on;
            brix_dashboard_password          "audit15q";
            brix_dashboard_idle_threshold    20s;
            brix_dashboard_stalled_threshold 40s;
        }
    }

    # --- neither directive written: the frozen defaults --------------------- #
    server {
        listen {BIND_HOST}:{DEF_PORT};
        location /brix/ {
            brix_dashboard           on;
            brix_admin_rate_limit    off;
            brix_dashboard_anonymous on;
            brix_dashboard_password  "audit15q";
        }
    }
}

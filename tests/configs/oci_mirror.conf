# OCI pull-through mirror front (phase-104 D0–D3; Appendix G.2).
#
# Drives test_oci_mirror_{classify,authdance,cachepolicy}.py and the podman
# oracle lane. The mock registry speaks plain http, so the template carries
# brix_oci_mirror_insecure on — the ONE place in the tree that does, and the
# reason the merge refuses a cleartext base without it.
#
# Placeholders (rendered by render_config(strict=True) — every one must be
# supplied by the lane, so a forgotten value is a fatal render, not a server
# that silently comes up with the wrong policy):
#   LOG_DIR       error.log + nginx.pid live here; the registry's endpoint
#                 record names logs/nginx.pid — do not rename it.
#   BIND_HOST     PORT        this front's listener
#   MOCK_HOST     MOCK_PORT   the upstream mock registry — its REGISTRY ROOT,
#                 not its /v2/ endpoint: the canonical cache key already spells
#                 the "/v2/" the base is joined to.
#   CACHE_DIR     the mirror's cache store (posix:)
#   MANIFEST_TTL  tag-manifest freshness window, seconds
#   VERIFY_MODE   oci-digest for the real policy; off for the leg that has to
#                 observe an unverified fill
#   AUTH_LINES    "" or one brix_oci_mirror_auth line (Basic to the realm)
#   EXTRA_LINES   per-lane additions (namespace prefix, token zone override)
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;
thread_pool default threads=2;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen {BIND_HOST}:{PORT};
        location /v2/ {
            brix_oci_mirror          http://{MOCK_HOST}:{MOCK_PORT};
            brix_oci_mirror_insecure on;
            brix_oci_manifest_ttl    {MANIFEST_TTL};
            brix_cache_store         posix:{CACHE_DIR};
            brix_cache_verify        {VERIFY_MODE};
            {AUTH_LINES}
            {EXTRA_LINES}
        }
    }
}

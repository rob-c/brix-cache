# CMS client-leg tuning (test_audit15f_cms_node_legs.py, registry lifecycle) —
# audit §B1: brix_cms_perf_interval, brix_cms_send_timeout,
# brix_cms_tcp_keepalive and brix_cms_tcp_user_timeout are configured nowhere
# in the suite, so the freshness window of the external load feed, the bound on
# a connect that never completes, and the dead-peer options on the upward
# socket have never been driven.
#
# A data node that registers UP into an in-test Python peer — either a stub
# manager that records every frame, or a SYN black hole (a listener whose
# accept queue is already full) that never completes the handshake.  Per-test
# client-leg directives arrive as a substituted directive block on the stream
# server.  Keep this header free of loose placeholder tokens: a substituted
# multi-line block would break out of the comment.
#
# Two faces: the node's own root:// face (registered as its data port), and a
# Prometheus face — brix_cms_connect_failures_total is the only external
# witness that a dial was torn down before LOGIN, which is exactly what
# brix_cms_send_timeout bounds.
#
# brix_cms_interval 1 keeps the LOAD heartbeat at one second so a feed that
# goes stale is visible within a couple of frames.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + METRICS_PORT.
# Test-provided: BIND_HOST MANAGER_PORT CMS_EXTRA (may be empty).
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_manager {BIND_HOST}:{MANAGER_PORT};
        brix_cms_paths /;
        brix_cms_interval 1;
        brix_listen_port {PORT};
        {CMS_EXTRA}
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

stream {
    # Shadow origin the primary replays mirrored DATA writes to.  MUST be a
    # separate, writable namespace (posix:{SHADOW_DATA}) — the whole point of the
    # brix_mirror_writes opt-in is that replayed writes never touch the primary's
    # backing store.
    server {
        listen {BIND_HOST}:{SHADOW_PORT};
        brix_root on;
        brix_storage_backend posix:{SHADOW_DATA};
        brix_auth none;
        brix_allow_write on;
    }
    # Primary origin with data-write mirroring.  brix_mirror_writes is the
    # explicit production-safety opt-in; the OP_WRITE bit must ALSO be selected
    # via brix_mirror_opcodes (write) — both gates, independently.
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_mirror_url {HOST}:{SHADOW_PORT};
        brix_mirror_writes {MIRROR_WRITES};
        brix_mirror_opcodes write;
        brix_mirror_sample 100;
        brix_mirror_log_diverge on;
        brix_mirror_timeout 3s;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

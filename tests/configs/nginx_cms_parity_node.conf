# CMS parity-wave node — registry-lifecycle template for
# test_cms_parity_wave.py.  A data node that registers UP into an in-test
# Python stub manager; per-test client-leg directives arrive via {CMS_EXTRA}
# (cms.altds advertisement/monitor, cms.perf pgm feed, peer/proxy roles).
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided: MANAGER_PORT CMS_EXTRA (may be empty).
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_manager 127.0.0.1:{MANAGER_PORT};
        brix_cms_paths /;
        brix_cms_interval 1;
        brix_listen_port {PORT};
        {CMS_EXTRA}
    }
}

# Audit 16z — the WebDAV mirror's auth policy and its divergence NOTICE, live.
# Seven locations on one listen, because brix_mirror_strip_auth,
# brix_mirror_token and brix_mirror_log_diverge are all NGX_HTTP_LOC_CONF: the
# arms differ by one directive and share a worker, a shadow and a data root.
#
# Two shadows, and they must be two.  {SHADOW_OK_PORT} answers 200 to everything
# (agreeing with the primary), {SHADOW_MISS_PORT} answers 404 to everything, so
# a divergence — a mismatch of status CLASS between primary and shadow — is
# produced by choosing a port rather than by timing anything.
#
# error_log is at `notice` on purpose: the divergence line this file measures is
# NGX_LOG_NOTICE (net/mirror/http_mirror_request.c), and at `info` or `warn` it
# would be invisible for opposite reasons.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR SHADOW_OK_PORT
# SHADOW_MISS_PORT.  Test-provided: BIND_HOST SHADOW_HOST TOKEN.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log notice;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};

        # brix_mirror_total / brix_mirror_divergence_total, surface="http": the
        # detector's own account of itself, independent of what it logs.
        location /metrics { brix_metrics on; }

        # The control: WebDAV with no mirror at all.  Anything the shadows see
        # for a /plain/ URI was not sent by configuration.
        location /plain/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
        }

        # brix_mirror_strip_auth unwritten — the merge default.
        location /strip-default/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_mirror_url     http://{SHADOW_HOST}:{SHADOW_OK_PORT};
            brix_mirror_methods GET HEAD;
            brix_mirror_sample  100;
        }

        # The same thing written out.  The pair is the point: the corpus asserts
        # this equality everywhere and has never measured it.
        location /strip-on/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_mirror_url      http://{SHADOW_HOST}:{SHADOW_OK_PORT};
            brix_mirror_methods  GET HEAD;
            brix_mirror_sample   100;
            brix_mirror_strip_auth on;
        }

        # The arm no test has ever written: the client's Authorization header is
        # forwarded verbatim to a second host.
        location /strip-off/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_mirror_url      http://{SHADOW_HOST}:{SHADOW_OK_PORT};
            brix_mirror_methods  GET HEAD;
            brix_mirror_sample   100;
            brix_mirror_strip_auth off;
        }

        # strip_auth off AND a mirror token: the C says the token wins.
        location /token-off/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_mirror_url      http://{SHADOW_HOST}:{SHADOW_OK_PORT};
            brix_mirror_methods  GET HEAD;
            brix_mirror_sample   100;
            brix_mirror_strip_auth off;
            brix_mirror_token    {TOKEN};
        }

        # A shadow that never agrees, with the NOTICE unwritten (the default)...
        location /diverge-default/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_mirror_url     http://{SHADOW_HOST}:{SHADOW_MISS_PORT};
            brix_mirror_methods GET HEAD;
            brix_mirror_sample  100;
        }

        # ...and the same shadow with the NOTICE armed.
        location /diverge-on/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_mirror_url        http://{SHADOW_HOST}:{SHADOW_MISS_PORT};
            brix_mirror_methods    GET HEAD;
            brix_mirror_sample     100;
            brix_mirror_log_diverge on;
        }

        # Armed, but pointed at the shadow that agrees: the flag decides whether
        # a divergence is logged, not whether one is declared.
        location /agree-on/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_mirror_url        http://{SHADOW_HOST}:{SHADOW_OK_PORT};
            brix_mirror_methods    GET HEAD;
            brix_mirror_sample     100;
            brix_mirror_log_diverge on;
        }
    }
}

# phase-115 W5.2 — ERET P, the partial-retrieve extension, on the outbound
# FTP driver.
#
# Two WebDAV fronts with an IDENTICAL store line (`mode=e`), pointed at two
# origins that differ only in whether they advertise ERET in FEAT:
#
#   PORT        the ERET-advertising origin (the subject)
#   PLAIN_PORT  an origin that advertises nothing — RFC 959 REST+RETR (control)
#   DECOY_PORT  an origin whose FEAT rows CONTAIN "ERET"/"SPAS" without
#               advertising either (ERETSTAT, SITE ERET, ...) and that answers
#               502 to both commands — the substring negative
#
# The store line is identical on purpose.  ERET is not a knob an operator sets;
# it is a capability the driver discovers and uses, so the ONLY honest way to
# assert it changed nothing observable is to hold the configuration fixed and
# vary the origin.
#
# Read-only: ERET is a retrieve extension and its write counterpart (ESTO) has
# no caller on this driver — see the phase-115 register, W5.2.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool gsiftp_io threads=4 max_queue=128;
events { worker_connections 128; }

http {
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {ERET_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{PLAIN_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {PLAIN_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{PLAIN_ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{DECOY_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {DECOY_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{DECOY_ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_thread_pool gsiftp_io;
        }
    }
}

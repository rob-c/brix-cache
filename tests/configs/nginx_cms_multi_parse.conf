# Parse-only template for brix_cms_manager multi-endpoint validation
# (test_cms_multi_manager.py config-negative tests, via config_parse.nginx_t —
# never booted).  MANAGER_DIRECTIVES is the directive block under test.
worker_processes 1;
daemon off;
pid logs/nginx.pid;
error_log logs/error.log notice;

events { worker_connections 64; }

stream {
    server {
        listen 127.0.0.1:30999;
        brix_root on;
        brix_auth none;
        brix_manager_mode on;
{MANAGER_DIRECTIVES}
        brix_cms_paths /;
    }
}

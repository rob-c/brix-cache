# EIGHT stream fronts in ONE process — the registryless half of the three
# NGX_STREAM_SRV_CONF flags whose CONTROL arm no config in this tree has ever
# written (test_audit16ah_frm_hc_arms.py, 16th tranche):
#
#   brix_health_check       `on` in configs/nginx_hc_parse.conf,
#                           nginx_hc_cluster.conf, nginx_hc_tls_cluster.conf and
#                           test_phase22_health_check.py's HC_KNOBS; `off` in no
#                           file anywhere.  The disabled arm has only ever been
#                           rendered as an EMPTY knob slot.
#   brix_frm                `on` in fourteen configs; `off` in none.
#   brix_frm_async_recall   `on` in nginx_frm_async.conf, nginx_lc_frm_async.conf
#                           and _test_evil_actor_v3_helpers_b.py; `off` in none.
#
# All three merge to 0 (tape_stage_conf.c:47,56 and server_conf_merge_cluster.c:154)
# and all three are declared NGX_STREAM_SRV_CONF with no NGX_STREAM_MAIN_CONF bit,
# so `prev` in those three merges is always NGX_CONF_UNSET and the inheritance the merge
# spells out cannot be reached from any configuration — measured, not assumed, in
# the file's parse tier.
#
# WHAT THIS PROCESS DELIBERATELY LACKS
#   No server here writes brix_frm_control_dir with brix_frm ON, so
#   brix_stage_registry_init() is never called and brix_stage_registry_singleton()
#   stays NULL for the whole process.  Every runtime consumer of brix_frm is
#   gated on `frm.enable && singleton() != NULL` (open_request_resolve.c:148,
#   prepare.c:419+463, prepare_qprep.c:78+152), so this is the process in which
#   an ENABLED brix_frm has to answer for itself with no registry behind it.
#   The companion template nginx_audit16ah_frm_registry.conf is the same three
#   FRM fronts with the one line added.
#
# Every face gets its own export subtree under DATA_ROOT.  The durable journal
# records the LFN, so two faces sharing an export would write byte-identical
# records and no measurement could say which face enqueued one.
#
# worker_processes 1: the health-check manager is started once per worker per
# enabled server block, and the "health check manager started" notice is the
# observable — a second worker would double every line in the error log and turn
# a count into a guess.  Each health-check face carries a DISTINCT interval and
# timeout because that notice prints both and prints no server address, so the
# numbers are the only thing that says which block logged it.
#
#   PORT          HC_OFF    — the literal `brix_health_check off;` together with
#                             all five companion knobs.  The arm nobody writes.
#   HCABS_PORT    HC_ABSENT — the same five companions and NO brix_health_check
#                             line: byte for byte what test_phase22's empty
#                             HC_KNOBS renders, and the control HC_OFF is
#                             compared against.
#   HCON_PORT     HC_ON     — `on` with interval 2s / timeout 1s.  The enabled
#                             control; its notice names 2000/1000.
#   HCZERO_PORT   HC_ZERO   — `on` with `brix_health_check_interval 0`.  The flag
#                             says enabled and brix_hc_manager_start returns at
#                             its first line (health_check.c:416); nothing warns.
#   FRMOFF_PORT   FRM_OFF   — the literal `brix_frm off;` carrying a queue path, a
#                             control dir and a stage TTL.  Under `off` none of
#                             the three is validated, opened or read.
#   FRMABS_PORT   FRM_ABSENT— no brix_frm* line at all.  The control.
#   FRMNOC_PORT   FRM_NOCTRL— `brix_frm on;` with the queue path the load-time
#                             check demands and no control dir.  This is the
#                             configuration `nginx -t` blesses and the runtime
#                             cannot use: the error the check emits names
#                             brix_frm_queue_path, which is not the field the
#                             registry is built from.
#   ASYNC_PORT    ASYNC_NOFRM `brix_frm_async_recall on;` with no brix_frm.  A
#                             flag with no owner: accepted, merged, read nowhere.
#
# brix_auth none everywhere — every subject here is a config-plane gate and an
# authentication step in front of it would only add a second reason for a probe
# to be refused.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + the seven extra ports.
# Test-provided: BIND_HOST QUEUE_DIR OFF_CTRL_DIR.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    # --- the health-check arm nobody writes -------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/hcoff;
        brix_auth none;
        brix_health_check off;
        brix_health_check_interval 7s;
        brix_health_check_timeout 3s;
        brix_health_check_threshold 2;
        brix_health_check_blacklist 11s;
        brix_health_check_type stat;
    }

    # --- the same server with the line left out ---------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{HCABS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/hcabs;
        brix_auth none;
        brix_health_check_interval 7s;
        brix_health_check_timeout 3s;
        brix_health_check_threshold 2;
        brix_health_check_blacklist 11s;
        brix_health_check_type stat;
    }

    # --- the enabled control ----------------------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{HCON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/hcon;
        brix_auth none;
        brix_health_check on;
        brix_health_check_interval 2s;
        brix_health_check_timeout 1s;
    }

    # --- enabled and inert -------------------------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{HCZERO_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/hczero;
        brix_auth none;
        brix_health_check on;
        brix_health_check_interval 0;
        brix_health_check_timeout 3s;
    }

    # --- the FRM arm nobody writes ----------------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{FRMOFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/frmoff;
        brix_auth none;
        brix_frm off;
        brix_frm_queue_path {QUEUE_DIR}/off.q;
        brix_frm_control_dir {OFF_CTRL_DIR};
        brix_frm_stage_ttl 30s;
    }

    # --- no brix_frm* line at all ------------------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{FRMABS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/frmabs;
        brix_auth none;
    }

    # --- enabled, validated, and registryless ------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{FRMNOC_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/frmnoc;
        brix_auth none;
        brix_frm on;
        brix_frm_queue_path {QUEUE_DIR}/noctrl.q;
        brix_frm_stage_ttl 30s;
    }

    # --- a flag with no owner ----------------------------------------------
    server {
        brix_allow_write on;   # W6: stage is a typed mutation — admit prepare
        listen {BIND_HOST}:{ASYNC_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT}/asyncnofrm;
        brix_auth none;
        brix_frm_async_recall on;
    }
}

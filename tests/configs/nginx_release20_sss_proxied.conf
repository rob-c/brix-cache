# 2.0 F9 lab: SSS identity forwarding through the tap proxy
# (brix_tap_proxy_sss_identity, release-2.0-readiness F9).
#
# Four faces in one instance, all sharing one secret:
#
#   PORT           SSS front, brix_tap_proxy_sss_identity client — the upstream
#                  credential carries the authenticated client's entity
#   KEYTAB_PORT    SSS front, brix_tap_proxy_sss_identity keytab — the 1.x wire,
#                  the upstream credential carries the keytab key's user
#   ANON_PORT      anonymous front, brix_tap_proxy_sss_identity client — there
#                  is no authenticated client to forward, so the upstream leg
#                  must be refused rather than downgraded to the keytab user
#   ORIGIN_PORT    the SSS origin.  Its keytab pins g:origingrp (no anygroup),
#                  so `group="origingrp"` marks its own accept lines in the
#                  shared error log and the fronts' cannot be mistaken for them.
#
# Launcher-provided: LOG_DIR PORT KEYTAB_PORT ANON_PORT ORIGIN_PORT.
# Test-provided: BIND_HOST SRC_DIR ANY_KEYTAB ORIGIN_KEYTAB.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events {
    worker_connections 128;
}

stream {
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        brix_root on;
        brix_storage_backend posix:{SRC_DIR};
        brix_auth sss;
        brix_sss_keytab {ORIGIN_KEYTAB};
        brix_sss_getcreds on;
    }

    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth sss;
        brix_sss_keytab {ANY_KEYTAB};
        brix_sss_getcreds on;
        brix_tap_proxy on;
        brix_tap_proxy_auth sss;
        brix_tap_proxy_sss_identity client;
        brix_tap_proxy_upstream {BIND_HOST}:{ORIGIN_PORT} sss;
    }

    server {
        listen {BIND_HOST}:{KEYTAB_PORT};
        brix_root on;
        brix_auth sss;
        brix_sss_keytab {ANY_KEYTAB};
        brix_sss_getcreds on;
        brix_tap_proxy on;
        brix_tap_proxy_auth sss;
        brix_tap_proxy_sss_identity keytab;
        brix_tap_proxy_upstream {BIND_HOST}:{ORIGIN_PORT} sss;
    }

    server {
        listen {BIND_HOST}:{ANON_PORT};
        brix_root on;
        brix_auth none;
        brix_sss_keytab {ANY_KEYTAB};
        brix_tap_proxy on;
        brix_tap_proxy_auth sss;
        brix_tap_proxy_sss_identity client;
        brix_tap_proxy_upstream {BIND_HOST}:{ORIGIN_PORT} sss;
    }
}

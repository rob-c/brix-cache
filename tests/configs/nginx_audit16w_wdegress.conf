# The WebDAV HTTP-TPC egress policy read from its OFF side
# (test_audit16w_webdav_tpc_egress_off_arms.py, audit
# docs/refactor/testsuite-combinatorial-coverage-audit-2026-08-15.md).
#
# A COPY makes this server dial an authority the CLIENT named, so three
# independent controls sit in front of that socket, and the corpus had only
# ever written the arm that OPENS each one:
#
#   brix_webdav_tpc_allow_local        (default off) — the loopback/link-local
#                                       range gate; every TPC config in the tree
#                                       turns it ON to reach a test source, so
#                                       the DEFAULT was never once asserted
#   brix_webdav_tpc_allow_private      (default on)  — the RFC-1918/ULA range
#                                       gate; the `off` arm was written nowhere
#   brix_webdav_tpc_source_guard       (default off) — the NAMING allowlist; the
#                                       `off` arm was written nowhere, so what an
#                                       allowlist does when the guard is off — a
#                                       plausible operator mistake — was untested
#   brix_webdav_tpc_credential_forward (default on)  — whose identity the pull
#                                       leg carries; only the `off` arm was ever
#                                       spelled out
#
# Every directive here is NGX_HTTP_LOC_CONF, so the whole cross fits under one
# `listen` and the planes cannot drift apart on anything but the knob under
# test.  Each plane has its own export root: a COPY landing on the wrong one is
# a missing file, not a coincidence.
#
# The two range gates are enforced twice — once in the transfer thread's
# preflight (tpc_thread.c tpc_thread_ssrf_preflight / tpc_marker_start.c) and
# again when the curl handle is built (tpc_curl_setup.c tpc_curl_secure, which
# also pins CURLOPT_RESOLVE against DNS rebinding).  The naming guard runs
# earlier still, on the request thread, before any transfer is started
# (tpc.c:357/372) — an ordering the /guardorder/ plane exists to measure.
#
# The pull source is an in-test TLS mock: TPC legs always verify peer and host
# (CURLOPT_SSL_VERIFYPEER/VERIFYHOST forced on), so {CA_PEM} — the mock's own
# self-signed cert, doubling as its CA — is what lets a permitted plane connect
# at all.  Planes that must NOT connect carry it too, so their refusal can never
# be a trust failure wearing a policy failure's clothes.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST EXPORT_ROOT CA_PEM CADIR TOKEN_CFG.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

# Both TPC paths (plain and 202-marker-streaming) run the transfer on a worker
# thread; without a pool there is no preflight to observe.
thread_pool default threads=4 max_queue=256;
events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # ── the loopback range gate ───────────────────────────────────────
        # /deny/ omits the directive; /localoff/ writes the same verdict out
        # loud.  The pair is what proves the written `off` and the omission are
        # one value, so nothing below can be attributed to the token alone.
        location /deny/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/deny;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_cafile      {CA_PEM};
        }

        location /localoff/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/localoff;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_cafile      {CA_PEM};
            brix_webdav_tpc_allow_local off;
        }

        # The non-vacuity control: the same COPY, the same source, the gate
        # opened.  Without this plane a refusal proves nothing — a broken mock
        # or an untrusted cert would refuse just as loudly.
        location /local/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/local;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_cafile      {CA_PEM};
            brix_webdav_tpc_allow_local on;
        }

        # ── the same gate on the 202-marker-streaming path ────────────────
        # A marker transfer has already answered 202 by the time the preflight
        # runs, so its refusal cannot be a status code — it is a "failure"
        # trailer at the end of a chunked body (tpc_marker.c:239).  Same knob,
        # same source, a completely different shape of refusal.
        location /denymark/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/denymark;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_marker_interval 1;
        }

        location /markok/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/markok;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_allow_local    on;
            brix_webdav_tpc_marker_interval 1;
        }

        # ── the private-range gate ────────────────────────────────────────
        # allow_local stays ON in both planes so the loopback mock is still
        # reachable and allow_private is the ONLY difference between them.
        # brix_webdav_tpc_timeout bounds the /privok/ plane, whose whole point
        # is that the policy lets an unreachable RFC-1918 target through to a
        # connect that must then fail on its own.
        location /noprivate/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{EXPORT_ROOT}/noprivate;
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_tpc               on;
            brix_webdav_tpc_cafile        {CA_PEM};
            brix_webdav_tpc_allow_local   on;
            brix_webdav_tpc_allow_private off;
            brix_webdav_tpc_timeout       3;
        }

        location /privok/ {
            brix_webdav                   on;
            brix_storage_backend          posix:{EXPORT_ROOT}/privok;
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_webdav_tpc               on;
            brix_webdav_tpc_cafile        {CA_PEM};
            brix_webdav_tpc_allow_local   on;
            brix_webdav_tpc_allow_private on;
            brix_webdav_tpc_timeout       3;
        }

        # ── the naming allowlist ──────────────────────────────────────────
        # All three planes carry the SAME allowlist, which names a host no test
        # ever dials.  /guardoff/ writes the disarming arm, /guardabsent/ omits
        # the directive entirely, and /guardon/ arms it: the allowlist is dead
        # config in the first two and the whole policy in the third.
        location /guardoff/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/guardoff;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_allow_local    on;
            brix_webdav_tpc_source_guard   off;
            brix_webdav_tpc_source_allow   storage.example.com;
        }

        location /guardabsent/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/guardabsent;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_allow_local    on;
            brix_webdav_tpc_source_allow   storage.example.com;
        }

        location /guardon/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/guardon;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_allow_local    on;
            brix_webdav_tpc_source_guard   on;
            brix_webdav_tpc_source_allow   storage.example.com;
        }

        # Both controls armed and the source on neither: which one answers is
        # the ordering fact.  The naming guard runs on the request thread ahead
        # of the transfer, so a refusal here must never spawn one.
        location /guardorder/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/guardorder;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_source_guard   on;
            brix_webdav_tpc_source_allow   storage.example.com;
        }

        # ── whose credential the outbound leg carries ─────────────────────
        # Forwarding only has anything to forward when the request really
        # authenticated with a bearer (webdav_tpc_forward_user_bearer reads
        # rctx->bearer_token, which only webdav_verify_bearer_token sets), so
        # both planes run against a real issuer registry.  /fwdon/ writes the
        # arm the corpus never spelled out; /fwdguard/ adds the naming guard,
        # making it the control that decides whether the user's token is
        # allowed to leave this host at all.
        location /fwdon/ {
            brix_webdav                       on;
            brix_storage_backend              posix:{EXPORT_ROOT}/fwdon;
            brix_webdav_auth                  required;
            brix_webdav_cadir                 {CADIR};
            brix_webdav_token_config          {TOKEN_CFG};
            brix_allow_write                  on;
            brix_webdav_tpc                   on;
            brix_webdav_tpc_cafile            {CA_PEM};
            brix_webdav_tpc_allow_local       on;
            brix_webdav_tpc_credential_forward on;
        }

        location /fwdguard/ {
            brix_webdav                       on;
            brix_storage_backend              posix:{EXPORT_ROOT}/fwdguard;
            brix_webdav_auth                  required;
            brix_webdav_cadir                 {CADIR};
            brix_webdav_token_config          {TOKEN_CFG};
            brix_allow_write                  on;
            brix_webdav_tpc                   on;
            brix_webdav_tpc_cafile            {CA_PEM};
            brix_webdav_tpc_allow_local       on;
            brix_webdav_tpc_credential_forward on;
            brix_webdav_tpc_source_guard      on;
            brix_webdav_tpc_source_allow      storage.example.com;
        }
    }
}

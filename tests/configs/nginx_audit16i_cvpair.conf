# TWO cvmfs cache locations on ONE listener — the sibling-reach half of
# test_audit16i_cvmfs_resilience_flags.py (16th tranche).
#
# Two repositories exported side by side is the ordinary shape of a Stratum-1
# cache, and it is the only shape in which "this location said off" can be told
# apart from "nothing is on".  A cvmfs cache location declares no root, so
# cvmfs_module_build.c:215-217 anchors it at "/" — BOTH locations here
# canonicalise to the same export root, and every per-export registration (the
# VFS backend entry, the cache tier, the scrub/learn/swarm services) is keyed on
# that root.  The two locations are therefore one export wearing two prefixes,
# which is what the section measures rather than assumes.
#
# The locations differ in repository, in cache store AND in backend.  Separate
# stores because a shared store would let one location's fill answer the other's
# request and hide the reading; separate backends because the collapse is only
# visible when the two locations name DIFFERENT origins and one of them wins for
# both.  BACKEND_B may legitimately name the ledger's DEAD_PORT: a location
# pointed at an origin that does not answer is exactly the edit an operator makes
# when they add an export before the Stratum-1 behind it exists.
#
# Both slots may be EMPTY: "the sibling says nothing" is one of the arms under
# test, not the absence of a case.  Neither location writes any of the nine flags
# itself, for the same reason as the solo template.
#
# worker_processes 1: see nginx_audit16i_cvsolo.conf — the per-export services
# and the trace latch are per-worker, so a second worker would split every
# reading in half.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + MOCK_PORT DEAD_PORT.
# Test-provided: BIND_HOST REPO_A REPO_B CACHE_A CACHE_B BACKEND_A BACKEND_B
#                + the LOC_ARM_A and LOC_ARM_B slots.
daemon on;
worker_processes 1;
thread_pool default threads=2;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # Merged FIRST.
        location /cvmfs/{REPO_A}/ {
            brix_cvmfs           on;
            brix_cache_store     posix:{CACHE_A};
            brix_storage_backend "{BACKEND_A}";
{LOC_ARM_A}        }

        # Merged SECOND — and therefore, for the export both locations share,
        # the one whose store and backend the export ends up holding.
        location /cvmfs/{REPO_B}/ {
            brix_cvmfs           on;
            brix_cache_store     posix:{CACHE_B};
            brix_storage_backend "{BACKEND_B}";
{LOC_ARM_B}        }
    }
}

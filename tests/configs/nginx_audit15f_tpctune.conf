# The WebDAV HTTP-TPC tuning surface, driven against a capturing TLS mock
# source (test_audit15f_webdav_tpc_tuning.py, registry lifecycle) — audit §A2:
# `brix_webdav_tpc_marker_interval`, `_max_streams`, `_low_speed_bytes`,
# `_low_speed_secs`, `_token_client_id`, `_token_client_secret` and `_curl`
# had zero coverage anywhere in the tree while their siblings (allow_local,
# source_guard, cert/key/cafile, timeout, verify_checksum, token_endpoint,
# token_scope) were all exercised.
#
# One instance, one location per knob-set, each with its OWN export root so a
# COPY landing in the wrong plane is visible as a missing file rather than a
# shared-directory coincidence:
#
#   /nomark/  baseline: every default (marker off, single stream, no stall
#             bound, no delegation) — the control every other case is read
#             against
#   /markcold/ brix_webdav_tpc_marker_interval 1, never written to: the
#             marker path stays disarmed (defect pin)
#   /mark/    the same interval, warmed by a PUT first -> 202 + Perf Marker
#             stream
#   /multi/   brix_webdav_tpc_max_streams 4      -> HEAD + 4 ranged GETs
#   /slow/    low_speed_bytes/secs               -> stalled pull is aborted
#   /tokx/    token_endpoint + client_id/secret + a POISONED brix_webdav_tpc_curl
#   /tokstd/  the same exchange with the DEFAULT curl path (attribution
#             control for the poisoned-binary case)
#
# The pull leg is offloaded to the thread pool, so one worker cannot deadlock
# on itself here — the source is a Python process, not a co-hosted location.
#
# brix_tpc_allow_local: the mock source is on loopback, which the TPC
# egress guard refuses by default.
#
# TWO MARKER PLANES, identical but for their traffic.  webdav_tpc_marker_start()
# bare-NULL-checks conf->common.thread_pool (tpc_marker_start.c:308), which
# postconfig leaves unset for a per-location brix_webdav (postconfig.c:299-317);
# every other offload site resolves it lazily through brix_shared_thread_pool()
# and CACHES it back onto the loc-conf (shared_conf.h:534).  So the marker path
# arms only after some other threaded request has warmed the same location:
# /markcold/ only ever sees COPY (disarmed), /mark/ gets a PUT first (armed).
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST EXPORT_ROOT CA_PEM TOKEN_ENDPOINT FAKE_CURL.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

thread_pool default threads=4 max_queue=256;
events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        location = / { return 204; }

        location /nomark/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/nomark;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_tpc_allow_local on;
            brix_webdav_tpc_cafile      {CA_PEM};
        }

        location /mark/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/mark;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_tpc_allow_local    on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_marker_interval 1;
        }

        location /markcold/ {
            brix_webdav                    on;
            brix_storage_backend           posix:{EXPORT_ROOT}/markcold;
            brix_webdav_auth               none;
            brix_allow_write               on;
            brix_webdav_tpc                on;
            brix_tpc_allow_local    on;
            brix_webdav_tpc_cafile         {CA_PEM};
            brix_webdav_tpc_marker_interval 1;
        }

        location /multi/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/multi;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_tpc_allow_local on;
            brix_webdav_tpc_cafile      {CA_PEM};
            brix_webdav_tpc_max_streams 4;
        }

        # 1 MB/s floor sustained for 1 s: a source that dribbles a few bytes
        # and then goes quiet is aborted, while a slow-but-progressing one is
        # not (the /nomark/ control pulls the same object to completion).
        location /slow/ {
            brix_webdav                     on;
            brix_storage_backend            posix:{EXPORT_ROOT}/slow;
            brix_webdav_auth                none;
            brix_allow_write                on;
            brix_webdav_tpc                 on;
            brix_tpc_allow_local     on;
            brix_webdav_tpc_cafile          {CA_PEM};
            brix_webdav_tpc_low_speed_bytes 1000000;
            brix_webdav_tpc_low_speed_secs  1;
        }

        # RFC 8693 delegation with client credentials.  brix_webdav_tpc_curl
        # points at a recording wrapper that always fails: if the exchange
        # subprocess honoured the directive the COPY could not succeed and the
        # wrapper's log would carry its argv.
        location /tokx/ {
            brix_webdav                        on;
            brix_storage_backend               posix:{EXPORT_ROOT}/tokx;
            brix_webdav_auth                   none;
            brix_allow_write                   on;
            brix_webdav_tpc                    on;
            brix_tpc_allow_local        on;
            brix_webdav_tpc_cafile             {CA_PEM};
            brix_webdav_tpc_curl               {FAKE_CURL};
            brix_tpc_outbound_token_endpoint     {TOKEN_ENDPOINT};
            brix_tpc_outbound_scope        storage.read:/;
            brix_tpc_outbound_client_id    audit15f-client;
            brix_tpc_outbound_client_secret s3cret-audit15f;
        }

        location /tokstd/ {
            brix_webdav                        on;
            brix_storage_backend               posix:{EXPORT_ROOT}/tokstd;
            brix_webdav_auth                   none;
            brix_allow_write                   on;
            brix_webdav_tpc                    on;
            brix_tpc_allow_local        on;
            brix_webdav_tpc_cafile             {CA_PEM};
            brix_tpc_outbound_token_endpoint     {TOKEN_ENDPOINT};
            brix_tpc_outbound_scope        storage.read:/;
            brix_tpc_outbound_client_id    audit15f-client;
            brix_tpc_outbound_client_secret s3cret-audit15f;
        }
    }
}

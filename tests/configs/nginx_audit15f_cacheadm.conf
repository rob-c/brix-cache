# Read-cache admission and the per-worker cinfo L1
# (test_audit15f_cache_admission_and_staging.py, registry lifecycle) — audit
# §B3.17: brix_cache_allow_prefix and brix_cache_index_cache are configured
# nowhere in the suite, so neither the whitelist form of admission nor the
# bounded index cache has ever been driven.
#
# Both planes are tiers (brix_storage_backend root:// + brix_cache_store) over
# ONE origin, which is a separate registry instance (nginx_lc_cache_partial_
# origin.conf) so a test can stop it and prove what the cache still answers
# from its own store.
#
#   {PORT}     brix_cache_allow_prefix /admitted — a non-empty allow list is a
#              whitelist: sd_cache_admit() declines everything that does not
#              carry the prefix, and a declined open is served straight from
#              the source (sd_cache.c), so the client's bytes are unchanged and
#              the ONLY observable is what does or does not land in the store.
#   {L1_PORT}  brix_cache_index_cache 1 — a one-entry cinfo L1, so every second
#              lookup evicts the previous object's header.  Alternating two
#              differently-sized objects makes an eviction that returned the
#              neighbour's header (size, complete flag) visible as a wrong-length
#              read rather than as a silent metric.
#
# Each plane carries its OWN brix_export: the composed tier is registered in the
# VFS backend table under the export's canonical root, so two cache planes that
# shared one export root would collide there and the second registration would
# answer both listeners (the first plane's store would simply stay empty).
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + L1_PORT.  Test-provided:
# BIND_HOST ORIGIN_PORT ADMIT_EXPORT ADMIT_STORE L1_EXPORT L1_STORE.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

# Cache fills run on a thread-pool task.
thread_pool default threads=2 max_queue=256;

stream {
    # --- admission whitelist ------------------------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_root                on;
        brix_auth                none;
        brix_export              {ADMIT_EXPORT};
        brix_storage_backend     root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store         posix:{ADMIT_STORE};
        brix_cache_export        /;
        brix_cache_allow_prefix  /admitted;
    }

    # --- one-entry cinfo L1 -------------------------------------------------
    server {
        listen {BIND_HOST}:{L1_PORT};
        brix_root                on;
        brix_auth                none;
        brix_export              {L1_EXPORT};
        brix_storage_backend     root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store         posix:{L1_STORE};
        brix_cache_export        /;
        brix_cache_index_cache   1;
    }
}

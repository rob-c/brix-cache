# A read-cache tier over a PACED http:// origin, for the reload-during-fill leg
# (test_audit15g_reload_during_fill.py, registry lifecycle) — audit §C, carried
# from the 2026-08-04 pass: "reload during cache-fill (no test)".
#
# The origin is a Python `PacedSource`, not an nginx instance, because the point
# of the file is to inject `nginx -s reload` WHILE a fill is in flight: the fill
# has to advance at a rate the test chooses and be freezable mid-body.  A real
# origin can only be stopped, which is a different fault (and is already covered
# by the unlink and eviction files).
#
# worker_processes 1 keeps the generation turnover unambiguous — exactly one
# worker before the reload, exactly one after it, and the old one lingering in
# between for precisely as long as it still owes somebody bytes.
#
# ALLOW_WRITE is the reload witness.  It starts `off` and the test re-renders it
# to `on` mid-fill, so "the reload actually took" is observable on the wire
# (a write-open that was refused before is granted after) rather than inferred
# from the absence of an error.
#
# The reaper knobs are pinned out of reach: brix_cache_high_watermark DEFAULTS
# to brix_cache_eviction_threshold (server_conf_merge_security.c:402), whose own
# default is 90%, so on a filesystem past 90% full this plane would silently run
# a purge sweep against the very object under test.  99.9% is the highest the
# parser accepts — the ratio must be strictly below 1.0 (fs/cache/directives.c).
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + MOCK_PORT.
# Test-provided: BIND_HOST EXPORT STORE ALLOW_WRITE.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=2 max_queue=256;

stream {
    server {
        listen                        {BIND_HOST}:{PORT};
        brix_root                     on;
        brix_auth                     none;
        brix_allow_write              {ALLOW_WRITE};
        brix_export                   {EXPORT};
        brix_storage_backend          http://{BIND_HOST}:{MOCK_PORT};
        brix_cache_store              posix:{STORE};
        brix_cache_export             /;
        brix_cache_eviction_threshold 99.9%;
        brix_cache_high_watermark     99.9%;
        brix_access_log               {LOG_DIR}/brix_access.log;
    }
}

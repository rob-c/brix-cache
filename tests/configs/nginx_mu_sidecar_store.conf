# MU root:// TRUSTED CACHE-STORE node — registry-lifecycle template for
# test_mu_sidecar_hidden.py.  Identical to nginx_mu_sidecar_root.conf except for
# brix_cache_store_endpoint: this server is declared a remote cache-STORE
# surface, so internal sidecar names (<key>.cinfo/.meta) are legitimate
# open/stat targets — a cache node running `brix_cache_store root://...` with
# `brix_cache_meta sidecar` cannot persist or re-read its metadata otherwise.
# The switch lifts the reserved-name guard on open/stat ONLY; enumeration still
# skips internal names, and the export confinement is untouched.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/sidecar_store_error.log info;
daemon on;
events { worker_connections 64; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_export           {DATA_ROOT};
        brix_storage_backend  posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_cache_store_endpoint on;
        brix_access_log {LOG_DIR}/sidecar_store_access.log;
    }
}

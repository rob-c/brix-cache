# Phase-107 C5: the declared-final-size reserve, live (test_vfs_reserve.py,
# registry lifecycle).
#
# A create-open that carries the client's declared final size (`oss.asize` on
# root://) reserves it once, before the first byte: posix preallocates via
# fallocate(KEEP_SIZE), remote (s3://) derives a legal multipart part size,
# and an unsatisfiable declaration refuses the OPEN with ENOSPC
# (kXR_NoSpace), never the 5 000th write.  Four fronts pin the postures:
#
#   {PORT}         posix front, writable.  Success plane: a declared size is
#                  preallocated (st_blocks) and the object lands byte-exact;
#                  no declaration reserves nothing; an oversized declaration
#                  fails the open AND releases its partial allocation.
#   {QUOTA_PORT}   posix front, brix_oss_maxsize 64k: the declaration is
#                  advisory — it must never move the enforced quota boundary.
#   {RO_PORT}      posix front, writes disabled: the phase-105 gate refuses
#                  with EROFS BEFORE the reserve is reachable.
#   {REMOTE_PORT}  root front over the s3:// (sd_remote) backend: a 200 GB
#                  declaration selects a legal part size (the pre-C5 code
#                  pinned 16 MiB parts and silently could not finish anything
#                  past 160 GB) and the upload completes byte-exact.
#   {S3_PORT}      brix_s3 posix origin (bucket "testbucket") the remote
#                  front commits to.
#
# The remote front carries its own brix_export and brix_upload_resume off
# (nginx_p107_spill.conf precedent: with resume staging on, the root protocol
# parks writes in its own partial and the VFS staged plane never runs).
#
# worker_processes 2 (nginx_p107_spill.conf precedent): the remote front's
# staged commit blocks on its outbound PUT to the co-hosted origin plane.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + QUOTA_PORT RO_PORT
#                    REMOTE_PORT S3_PORT.
# Test-provided: BIND_HOST QUOTA_ROOT RO_ROOT REMOTE_EXPORT S3_DIR
#                S3_ACCESS_KEY S3_SECRET_KEY (every path must exist at
#                config-parse time).
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=2 max_queue=256;

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # The S3 origin the remote (s3://) front commits to.
    server {
        listen {BIND_HOST}:{S3_PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{S3_DIR};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   {S3_ACCESS_KEY};
            brix_s3_secret_key   {S3_SECRET_KEY};
            brix_s3_region       us-east-1;
            brix_allow_write     on;
        }
    }
}

stream {
    brix_credential s3cred {
        s3_access_key {S3_ACCESS_KEY};
        s3_secret_key {S3_SECRET_KEY};
        s3_region     us-east-1;
    }

    # --- posix front, writable ---------------------------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
    }

    # --- posix front, quota-capped: the declaration must not move the cap ---- #
    server {
        listen {BIND_HOST}:{QUOTA_PORT};
        brix_root on;
        brix_storage_backend posix:{QUOTA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_oss_maxsize 64k;
    }

    # --- posix front, read-only: EROFS before any reserve -------------------- #
    server {
        listen {BIND_HOST}:{RO_PORT};
        brix_root on;
        brix_storage_backend posix:{RO_ROOT};
        brix_auth none;
        brix_allow_write off;
    }

    # --- remote (s3://) front: the declaration sizes the multipart parts ----- #
    server {
        listen                  {BIND_HOST}:{REMOTE_PORT};
        brix_root               on;
        brix_auth               none;
        brix_export             {REMOTE_EXPORT};
        brix_storage_backend    s3://{BIND_HOST}:{S3_PORT}/testbucket;
        brix_storage_credential s3cred;
        brix_allow_write        on;
        brix_upload_resume      off;
        # No write-stage tier: the default composition would spool the WHOLE
        # object locally, so its reserve relay would honestly refuse a 200 GB
        # declaration the spool disk cannot hold. The subject here is the
        # DIRECT sd_remote staged plane (strictly sequential writes), where
        # the declaration sizes the multipart parts instead.
        brix_stage              off;
    }
}

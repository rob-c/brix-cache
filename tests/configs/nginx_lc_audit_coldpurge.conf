# brix_cache_cold_max_age (audit §4.2, upstream pfc.purgecoldfiles) —
# test_audit_fixes_2026_08_09.py::TestColdFilePurge.
#
# A root:// front with a cache store whose CLEAN read-through fills are purged
# by AGE, independent of occupancy. The watermark reaper only runs when the
# filesystem crosses its high watermark, so on a roomy cache a cold object was
# previously kept forever; this horizon releases it.
#
# {COLD_MAX_AGE} is set to the smallest value the test can drive (the reaper
# compares whole seconds), and the test back-dates the cached file's atime+mtime
# rather than sleeping, so the suite stays fast and deterministic.
#
# brix_cache_dirty_max_age is left at its 7-day default: the cold purge must run
# off its own horizon, and this instance proves the reaper walks for EITHER
# policy (the walk used to be gated on the dirty horizon alone).
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.
# Session-provided: BIND_HOST.
# Test-provided: CACHE_ROOT EXPORT_ROOT COLD_MAX_AGE
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root                 on;
        brix_storage_backend      posix:{DATA_ROOT};
        brix_auth                 none;
        brix_export               {EXPORT_ROOT}/cold;
        brix_cache_store          posix:{CACHE_ROOT}/cold;
        brix_cache_cold_max_age   {COLD_MAX_AGE};
        brix_access_log           {LOG_DIR}/brix_access.log;
    }
}

# CMS data node with an EXPLICIT cluster role (Phase-61 W7) — same shape as
# nginx_cms_wire_node.conf but carrying ``brix_cms_role`` so the upward leg's
# login Mode word and inbound valid-ops table (manVOps/supVOps) can be
# asserted byte-level by test_cms_wire_pup_conformance.py.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: MANAGER_PORT ROLE.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }
stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
        brix_allow_write on;
        brix_listen_port {PORT};
        brix_cms_manager 127.0.0.1:{MANAGER_PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
        brix_cms_role {ROLE};
    }
}

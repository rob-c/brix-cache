# phase-105 W1 functional template for test_rate_limit_s3.py: ONE
# http{}-scope brix_rate_limit line covers BOTH the webdav server (primary
# port) and the s3 server (S3_PORT extra) — the headline capability the W1
# move delivers.  Before phase-105 the directive was webdav-owned: it parsed
# cleanly at any scope but only ever wrote webdav's conf, so S3 traffic was
# silently un-limited.
# Rendered through the phase-81 registry (LifecycleHarness): primary port,
# log dir, temp dir and the posix export come from the launcher; S3_PORT
# rides the spec's extra_ports.
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 64; }
http {
    client_body_temp_path {TMP_DIR};
    proxy_temp_path        {TMP_DIR};
    fastcgi_temp_path      {TMP_DIR};
    uwsgi_temp_path        {TMP_DIR};
    scgi_temp_path         {TMP_DIR};
    access_log off;

    brix_kv_zone zone=h_rl:2m key=256 val=16;

    # One line, every HTTP protocol below (shared token bucket = shared budget).
    brix_rate_limit  zone=h_rl rate=1r/s burst=2 key=ip;

    server {
        listen 127.0.0.1:{PORT};
        location / {
            brix_webdav      on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
        }
    }
    server {
        listen 127.0.0.1:{S3_PORT};
        location / {
            brix_s3          on;
            brix_storage_backend posix:{DATA_ROOT};
        }
    }
}

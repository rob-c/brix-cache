worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR};

    server {
        listen {BIND_HOST}:{PORT};

        location / {
            brix_s3 on;
            brix_s3_bucket b;
            brix_storage_backend posix:{DATA_DIR};
            brix_acc_format xrdacc;
            brix_acc_authdb {AUTHDB};
            brix_acc_audit all;
            brix_allow_write on;
        }
    }
}

# cvmfs × gridftp co-residence (test_audit15h_cvmfs_gridftp.py) — audit §B3.17,
# the one protocol×protocol pair that had never shared a process.
#
# The two modules sit on opposite sides of the nginx core: brix_cvmfs is an
# http{} content handler bound to a location, brix_gridftp is a stream{} server
# with no location concept at all.  Every other protocol pair in the tree is
# co-tested somewhere (the multiproto configs cover the http side, the xrootd
# fronts the stream side); nothing had ever put an http plane and a stream
# plane in ONE worker and asked whether both still answer.
#
# The overlap is deliberate and is the whole point of the file: the GridFTP
# export root and the CVMFS Stratum-0 root are the SAME directory, {DATA_ROOT}.
# That is the realistic deployment — a release manager publishes into the repo
# over GridFTP while clients read it over http — and it is the only arrangement
# in which the two planes can disagree about anything.  They do:
#
#   * the http plane classifies before it opens.  A URI that is not a CVMFS
#     traffic shape (data/xx/<38 hex>, .cvmfspublished, .cvmfswhitelist,
#     .cvmfsreflog, the geo/bundle/dict endpoints) is rejected 403 by
#     brix_cvmfs_gate before any path resolution runs — so keys/, .brixtxn/
#     and every other repo-internal file are structurally unreachable.
#   * the stream plane has no such notion.  brix_gridftp_export confines the
#     tree and nothing more: every byte under the root is a RETR away.
#
# Two FTP faces, differing in exactly one directive, keep the write half
# attributable:
#   {FTPRW_PORT}   brix_gridftp_allow_write on   — the publishing face
#   {FTPRO_PORT}   (no allow_write)              — the mitigation face
#
# thread_pool is required: the cvmfs serve path offloads its cache fill, and
# the two planes are co-hosted in this single worker on purpose — one master,
# one worker, both protocols.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + FTPRW_PORT FTPRO_PORT.
# Test-provided: BIND_HOST.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2;
events { worker_connections 64; }

http {
    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location /cvmfs/ {
            brix_cvmfs               on;
            brix_cvmfs_stratum0_root {DATA_ROOT};
        }
    }
}

stream {
    # the publishing face — a release manager's credential reaches this one
    server {
        listen {BIND_HOST}:{FTPRW_PORT};
        brix_gridftp             on;
        brix_gridftp_export      {DATA_ROOT};
        brix_gridftp_allow_write on;
    }

    # the mitigation face — same export, read-only
    server {
        listen {BIND_HOST}:{FTPRO_PORT};
        brix_gridftp        on;
        brix_gridftp_export {DATA_ROOT};
    }
}

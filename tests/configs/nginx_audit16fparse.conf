# Parse-tier scaffold for the five S3 location flags (audit tranche 16, file 6;
# test_audit16f_s3_location_flags.py §G).
#
# The running instance lives in nginx_audit16f_s3flags.conf; this one is never
# started — it exists so `nginx -t` can be asked about a single line.  It writes
# none of the five directives itself: a scaffold that already carried one would
# make every negative about that directive ambiguous, because a second
# occurrence is diagnosed as a duplicate and that error arrives before the one a
# value or arity negative is reaching for.
#
# The location IS a complete S3 export, and that is not decoration either.
# `brix_s3_token on` is refused at merge time when brix_token_jwks is unset
# (s3_merge_token, module_merge.c:134-138), so a scaffold without the JWKS would
# report a companion-directive failure for one of the five positives and read
# like the flag itself was rejected.  Every arm of the positive tier has to see
# the same complete export.
#
# Five slots, named here WITHOUT their braces — the renderer replaces every
# occurrence of a placeholder, comments included, and a multi-line value spliced
# into a comment turns the tail of that comment into configuration:
#
#   KNOBS         inside the S3 location — the only placement the five accept
#                 (NGX_HTTP_LOC_CONF).
#   SRV_KNOBS     inside the http server, outside any location.
#   HTTP_KNOBS    inside http {}, outside any server.
#   OUTER         main context, outside http {} entirely.
#   STREAM_EXTRA  inside a stream server — the root:// plane, where an http-only
#                 directive is not "not allowed here" but wholly unknown.
#
# The stream block exists ONLY for that last slot and is otherwise empty; its
# listen has to differ from the http one because a repeated address/port pair is
# refused by ngx_stream_core_listen before the directive under test is reached.
# `nginx -t` never binds either.
#
# Test-provided: PORT STREAM_PORT LOG_DIR DATA JWKS ISSUER AUDIENCE.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

{HTTP_KNOBS}    server {
        listen {PORT};
{SRV_KNOBS}
        location /probe/ {
            brix_s3                on;
            brix_storage_backend   posix:{DATA};
            brix_s3_bucket         probe;
            brix_s3_access_key     AKIAAUDIT16FPARSE;
            brix_s3_secret_key     audit16f-parse-secret;
            brix_s3_region         us-east-1;
            brix_allow_write       on;
            brix_token_jwks     {JWKS};
            brix_token_issuer   "{ISSUER}";
            brix_token_audience "{AUDIENCE}";
{KNOBS}        }
    }
}

stream {
    server {
        listen {STREAM_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA};
{STREAM_EXTRA}    }
}

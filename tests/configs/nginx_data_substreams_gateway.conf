daemon on;
error_log {LOG_DIR}/e.log info;
pid {PID_FILE};
load_module {STREAM_MODULE};
load_module {BRIX_MODULE};
worker_processes 2;
thread_pool gwpool threads=4 max_queue=4096;
events {{ worker_connections 64; }}
stream {{
    server {{
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_export {DATA_DIR};
        brix_allow_write on;
        brix_thread_pool gwpool;
        brix_storage_backend root://{HOST}:{ORIGIN_PORT};
        brix_stage on;
        brix_stage_store posix:{STAGE_DIR};
        brix_stage_flush sync;
        brix_access_log {LOG_DIR}/access.log;
    }}
}}

# 2.0 F19 — the `xrd.tlsca` residuals at VALUE granularity
# (test_release20_tlsca_residuals.py).
#
# Two directives ship in this row, and neither has an observable that is
# anything but a login verdict plus what the error log says about it, so every
# arm is a stream listener on ONE instance over ONE hashed CA directory:
#
#   {PORT}        brix_crl_scope all      — every issuer in the chain must be
#                                           covered by a CRL (the default)
#   {LAST_PORT}   brix_crl_scope last     — only the credential's own
#                                           end-entity certificate is
#   {DEF_PORT}    the scope directive ABSENT — pins the merge default
#   {VLOG_PORT}   brix_tls_verify_log all     — accepted chains are logged too
#   {VFAIL_PORT}  brix_tls_verify_log failure — rejections only
#   {BADCRL_PORT} brix_crl {BADCRLDIR}, require — the CRL directory holds a
#                                           MALFORMED CRL: nothing loads, and
#                                           `require` arms the flags anyway, so
#                                           the handshake fails closed
#   {TRY_PORT}    brix_crl {CRLDIR}, try  — the same readable CRL directory as
#                                           {PORT}, under the permissive mode.
#                                           It is the F22 control: a directory
#                                           load still yields crl_count > 0, so
#                                           `try` still arms the flags and still
#                                           refuses a revoked user, while a CRL
#                                           it cannot reach is downgraded.
#                                           (The unreadable-CRL directory that
#                                           used to be a seventh listener is a
#                                           parse-tier case now: since F22 it
#                                           refuses to start, so it cannot be an
#                                           arm of a running instance.)
#
# {CA} is a hashed directory holding FOUR anchors — two roots and two
# intermediates.  The intermediate is the whole reason this file exists: on a
# two-level chain the end entity and its (self-signed) root need the SAME CRL,
# so no scope value can be told from any other.  With root -> intermediate ->
# EEC -> proxy the EEC's CRL comes from the intermediate and the intermediate's
# comes from the root, and withholding only the ROOT's CRL produces a chain that
# `all` refuses and `last` admits.
#
# The `full` hierarchy publishes both CRLs; the `gap` hierarchy publishes only
# the intermediate's.  {CRLDIR} therefore holds three CRLs and is missing
# exactly one, deliberately.
#
# brix_crl_mode is `require` on every arm that is about scope: `try` downgrades
# UNABLE_TO_GET_CRL to success on its own, which would mask the scope decision
# entirely and make `all` and `last` agree everywhere.
#
# brix_allow_write is off everywhere — every assertion is a login verdict on a
# read, and a write gate would put a second reason in front of each refusal.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + LAST_PORT DEF_PORT VLOG_PORT
# VFAIL_PORT BADCRL_PORT TRY_PORT.  Test-provided: CERT KEY CA CRLDIR
# BADCRLDIR (every path must exist at config-parse time).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- scope all: every issuer in the chain needs a CRL -------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        require;
        brix_crl_scope       all;
    }

    # --- scope last: only the end-entity certificate ------------------------
    server {
        listen {LAST_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        require;
        brix_crl_scope       last;
    }

    # --- the scope directive absent: whatever the merge default is ----------
    server {
        listen {DEF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        require;
    }

    # --- verify log: every chain, accepted or not ---------------------------
    # Scope is left at the default here on purpose: mixing the two knobs on one
    # listener would make every log assertion also a scope assertion.
    server {
        listen {VLOG_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        require;
        brix_tls_verify_log  all;
    }

    # --- verify log: rejections only ----------------------------------------
    server {
        listen {VFAIL_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        require;
        brix_tls_verify_log  failure;
    }

    # --- a malformed CRL under require: fails closed ------------------------
    # `last` is written here, not `all`: the point is that narrowing the scope
    # does not turn a broken CRL feed into an accepted login.
    server {
        listen {BADCRL_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {BADCRLDIR};
        brix_crl_mode        require;
        brix_crl_scope       last;
    }

    # --- the permissive mode over a READABLE directory (2.0 F22 control) ----
    # Same CRL directory as {PORT}, same default scope; only the mode differs.
    # Since F22 an unreadable entry in a CRL directory is a hard load failure,
    # so `try` can no longer be talked into an empty store by a chmod: what it
    # still does is downgrade a CRL that is genuinely absent.
    server {
        listen {TRY_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_crl             {CRLDIR};
        brix_crl_mode        try;
    }
}

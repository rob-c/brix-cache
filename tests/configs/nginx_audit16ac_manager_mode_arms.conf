# SEVEN stream servers and one HTTP dashboard in ONE process — the measuring
# half of `brix_manager_mode`, the last flag of the root/stream command table
# (src/protocols/root/stream/module.c:445) whose `off` arm no config in this
# tree has ever written (test_audit16ac_manager_mode_arms.py, 16th tranche).
#
# The flag decides what a node IS: with it on the open path enters
# `brix_open_manager_dynamic` and answers kXR_redirect out of the registry
# (root/read/open_manager.c:196-203), and `brix_server_has_runtime_export()`
# (core/config/runtime_server.c:25-29) returns false, so the server's
# `brix_storage_backend` is never turned into an export at all.  Both readings
# need a control that differs by the directive and nothing else, which is why
# MGR, OFF and ABS below are byte-identical apart from one line.
#
# `brix_manager_mode` is NGX_STREAM_SRV_CONF, so a plane here is a `listen` and
# not a location — eight ports is the cheapest this subject can be:
#
#   PORT       MGR   — `brix_manager_mode on` over a writable export.  The armed
#                      arm: opens redirect and the export is deleted.
#   OFF_PORT   OFF   — the same server plus `brix_manager_mode off`.
#   ABS_PORT   ABS   — the same server with the directive omitted.  OFF and ABS
#                      must answer identically; the merge default is 0
#                      (server_conf_merge_cluster.c:118) and this is the
#                      measurement of it rather than the reading.
#   CMS_PORT         — `brix_cms_server on`, the registration listener.
#   DS_PORT          — the data node that registers into it, so the registry the
#                      manager selects out of is not empty.  Without it the
#                      dynamic path declines and MGR would answer kXR_noserver,
#                      which is a different sentence about a different thing.
#   AUTO_PORT  AUTO  — `brix_cms_server on` beside an export and NO
#                      `brix_manager_mode`: the auto-derivation at
#                      net/cms/server_module.c:140-145 turns manager mode on for
#                      the block, which deletes the export the block asked for.
#   OVER_PORT  OVER  — the same two directives plus `brix_manager_mode off`
#                      FIRST, which is the documented override ("An explicit
#                      brix_manager_mode off in the same block still wins") and
#                      the only arm that keeps the export.  The order is
#                      load-bearing and the test says why.
#   HTTP_PORT        — a dashboard with `brix_dashboard_vfs_browse on`.  The VFS
#                      export registry is process-global and its census names
#                      each export by its canonical ROOT, so five distinct data
#                      roots make "this server registered an export" readable
#                      from outside the process — which is the only way to see
#                      brix_server_has_runtime_export()'s verdict on AUTO and
#                      OVER, whose own ports speak CMS and not root.
#
# worker_processes 1 is load-bearing for the same reason it is in
# nginx_audit16j_caps.conf: the manager registry is process-global, so a second
# worker could answer an open out of a registry the data node had not reached.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the seven extra ports.
# Test-provided: BIND_HOST MGR_DATA OFF_DATA ABS_DATA DS_DATA AUTO_DATA
#                OVER_DATA PASSWORD.
daemon on;
worker_processes 1;
thread_pool default threads=2;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # --- the armed arm ----------------------------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{MGR_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/mgr-access.log;
        brix_manager_mode    on;
    }

    # --- the arm nothing had written --------------------------------------
    server {
        listen {BIND_HOST}:{OFF_PORT};
        brix_root            on;
        brix_storage_backend posix:{OFF_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/off-access.log;
        brix_manager_mode    off;
    }

    # --- the same server with nothing written -----------------------------
    server {
        listen {BIND_HOST}:{ABS_PORT};
        brix_root            on;
        brix_storage_backend posix:{ABS_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/abs-access.log;
    }

    # --- the registration listener ----------------------------------------
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server      on;
    }

    # --- the data node that makes the registry non-empty ------------------
    server {
        listen {BIND_HOST}:{DS_PORT};
        brix_root            on;
        brix_storage_backend posix:{DS_DATA};
        brix_auth            none;
        brix_allow_write     on;
        brix_access_log      {LOG_DIR}/ds-access.log;
        brix_cms_manager     {BIND_HOST}:{CMS_PORT};
        brix_cms_paths       /;
        brix_cms_interval    2;
        brix_listen_port     {DS_PORT};
    }

    # --- the auto-derived manager: an export asked for and never made -----
    server {
        listen {BIND_HOST}:{AUTO_PORT};
        brix_root            on;
        brix_storage_backend posix:{AUTO_DATA};
        brix_auth            none;
        brix_cms_server      on;
    }

    # --- the override, which is only an override written FIRST ------------
    server {
        listen {BIND_HOST}:{OVER_PORT};
        brix_root            on;
        brix_storage_backend posix:{OVER_DATA};
        brix_auth            none;
        brix_manager_mode    off;
        brix_cms_server      on;
    }
}

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{HTTP_PORT};

        # The census, and nothing else: this location exists so the test can
        # read brix_vfs_backend_export_info() for every export the process
        # registered.  brix_admin_rate_limit off for the reason
        # nginx_admin_api.conf gives — the whole suite shares one client IP.
        location /brix/ {
            brix_dashboard            on;
            brix_admin_rate_limit     off;
            brix_dashboard_password   "{PASSWORD}";
            brix_dashboard_vfs_browse on;
        }
    }
}

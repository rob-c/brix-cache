# A root:// front whose STORAGE BACKEND is a remote http:// origin, for the
# resilience tests that inject faults on the server's own upstream leg
# (tests/resilience/servers.py, NginxHttpOriginFront).
#
# Every other module in tests/resilience/ damages the CLIENT->SERVER leg.  This
# one exists so the damage lands on the SERVER->ORIGIN leg instead: the fault
# proxy is spliced in front of the origin and {ORIGIN_PORT} points at the proxy,
# so the client's connection is pristine and only the backend fetch is broken.
# That is the leg where a failure is most likely to be mistaken for a healthy
# short read, because the client has no way to see it.
#
# `brix_stage off` puts sd_http in as the TOP driver: a staged tier would satisfy
# the second read from the local stage copy and the fault would only be reachable
# on the very first fetch.  With staging off every read crosses the wire.
#
# Launcher-provided: {PORT} {LOG_DIR} {DATA_ROOT}.
# Test-provided via template_values: {ORIGIN_PORT} (the fault proxy's listen).
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 1024; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_export {DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_stage off;
        brix_storage_backend http://127.0.0.1:{ORIGIN_PORT};
        brix_access_log {LOG_DIR}/brix_access_http_origin.log;
    }
}

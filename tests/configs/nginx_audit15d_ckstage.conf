# Checksum-on-write through a write-through stage tier
# (test_audit15d_checksum_stage.py, registry lifecycle).
#
# One instance, two servers: a plain WebDAV posix ORIGIN, and a WebDAV front
# whose storage backend is that origin with `brix_stage on` + a local
# `brix_stage_store` + `brix_stage_flush sync` (close blocks until the origin
# has the object).  The front's ck location adds checksum-on-write; the plain
# location is the no-checksum control.  Each location carries its OWN
# brix_export — the stage tier is registered in the VFS backend registry keyed
# by the canonical export root, so two locations sharing a root would share
# ONE tier and the control would silently inherit the checksum plane's tier.
#
# worker_processes 2: the front's flush fetches/pushes against the origin
# inside this same nginx, and a single worker would deadlock on itself.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + ORIGIN_PORT extra.
# Test-provided: BIND_HOST ORIGIN_ROOT EXPORT_ROOT STAGE_ROOT.
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

thread_pool default threads=2 max_queue=256;
events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # The origin. No tier of its own — it IS the source of truth.
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{ORIGIN_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{PORT};

        location = / { return 204; }

        location /ck/ {
            brix_webdav                   on;
            brix_storage_backend          http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth              none;
            brix_allow_write              on;
            brix_export                   {EXPORT_ROOT}/ck;
            brix_stage                    on;
            brix_stage_store              posix:{STAGE_ROOT}/ck;
            brix_stage_flush              sync;
            brix_webdav_checksum_on_write adler32;
        }

        location /plain/ {
            brix_webdav          on;
            brix_storage_backend http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_export          {EXPORT_ROOT}/plain;
            brix_stage           on;
            brix_stage_store     posix:{STAGE_ROOT}/plain;
            brix_stage_flush     sync;
        }
    }
}

# SSS-authenticated root:// server WITH brix_authdb, for
# test_authdb_mechanism_scope.py.  Launcher-provided: LOG_DIR PORT.
# Test-provided: BIND_HOST DATA_DIR KEYTAB AUTHDB.
#
# The keytab entry's --user becomes login.dn and its --group becomes the VO
# list, so one keytab exercises both the u-rule and the g-rule axis.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth sss;
        brix_sss_keytab {KEYTAB};
        brix_allow_write on;
        brix_authdb {AUTHDB};
    }
}

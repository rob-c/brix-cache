# brix_oss_maxsize create-size cap postures (test_oss_maxsize.py, registry
# lifecycle): a writable anon posix root:// export whose write plane refuses a
# data write past the configured cap.
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR
# MAXSIZE_LINE ("brix_oss_maxsize 64k;" or empty for the uncapped default).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
        brix_allow_write on;
        {MAXSIZE_LINE}
    }
}

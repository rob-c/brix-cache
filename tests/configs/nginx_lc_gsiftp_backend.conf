# Outbound ftp:// storage-driver conformance through two WebDAV fronts.
# PORT is writable; RO_PORT proves the typed VFS read-only gate wins before the
# backend mutation. ORIGIN_PORT is a registry-owned Python FTP origin.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool gsiftp_io threads=4 max_queue=128;
events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/body;
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {RW_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE};
            brix_allow_write on;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{RO_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {RO_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE};
            brix_allow_write off;
            brix_thread_pool gsiftp_io;
        }
    }
}

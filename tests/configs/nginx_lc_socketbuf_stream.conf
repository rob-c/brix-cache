# Socket-buffer stream template for test_socket_buffers.py (registry lifecycle).
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR SNDBUF
# RCVBUF.  Exercises the Phase-33 P3-B3 SO_SNDBUF/SO_RCVBUF accept-path
# setsockopt (brix_socket_sndbuf / brix_socket_rcvbuf).  DATA_DIR must exist at
# config-parse time (the test seeds it under tmp_path).
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_socket_sndbuf {SNDBUF};
        brix_socket_rcvbuf {RCVBUF};
    }
}

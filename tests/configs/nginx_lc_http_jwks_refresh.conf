# Phase-105 W4.3: one worker, two HTTP protocols, one rotating JWKS file.
# Launcher: LOG_DIR, TMP_DIR, PORT, S3_PORT.  Test: BIND_HOST, DATA_DIR,
# CADIR, JWKS, ISSUER, AUDIENCE.
daemon on;
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/client_body;
    proxy_temp_path       {TMP_DIR}/proxy;
    fastcgi_temp_path     {TMP_DIR}/fastcgi;
    uwsgi_temp_path       {TMP_DIR}/uwsgi;
    scgi_temp_path        {TMP_DIR}/scgi;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR}/dav;
            brix_webdav_auth required;
            brix_trusted_ca_dir {CADIR};
            brix_token_jwks {JWKS};
            brix_token_issuer "{ISSUER}";
            brix_token_audience "{AUDIENCE}";
            brix_token_jwks_refresh_interval 100ms;
        }
    }

    server {
        listen {BIND_HOST}:{S3_PORT};
        location / {
            brix_s3 on;
            brix_storage_backend posix:{DATA_DIR}/s3;
            brix_s3_bucket testbucket;
            brix_s3_token on;
            brix_token_jwks {JWKS};
            brix_token_issuer "{ISSUER}";
            brix_token_audience "{AUDIENCE}";
            brix_token_jwks_refresh_interval 100ms;
        }
    }
}

# Store-then-evict cache passthrough beyond the WebDAV plane
# (test_cache_passthrough_planes.py).
#
# `brix_cache_passthrough` lets a caller be served a remote object the ADMISSION
# policy declined: the fill runs under a separate spool cap, every coalesced
# waiter is served through the normal cache-hit reenter, and the key is evicted
# once the last fd is open (sd_cache_fill.c::cache_fill_admit_src). The opt-in
# (`allow_pt=1`) is set in ONE place — the shared HTTP cache-fill worker — which
# webdav/get.c, s3/object.c and cvmfs/handler.c all route through, so all three
# HTTP-family protocols inherit it. Only WebDAV was ever tested.
#
#   {PORT}       plain WebDAV over posix — the remote source for everything below
#   {S3_PORT}     S3   + cache store, passthrough ON
#   {S3_OFF_PORT} S3   + cache store, passthrough OFF   (the control)
#   {CV_PORT}     CVMFS + cache store, passthrough ON
#   {CV_OFF_PORT} CVMFS + cache store, passthrough OFF  (the control)
#   {ROOT_PORT}   root:// stream + cache store, passthrough ON — which must have
#                 NO effect: the stream plane's fill passes allow_pt=0
#                 (sd_cache_maint.c:134), so its decline is unchanged. That is
#                 the negative this instance exists to pin.
#
# brix_cache_max_object is deliberately tiny and brix_cache_passthrough_max
# generous, so a mid-sized object is declined by admission and eligible for
# passthrough — the only window in which the two differ. An object above BOTH
# caps must still be refused on every plane.
#
# worker_processes 2: the fronts fetch from the origin inside this same nginx,
# and the fill is off-loop, so a single worker would deadlock on itself.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT + ledger extras.
# Session-provided: BIND_HOST.
# Test-provided: CACHE_ROOT EXPORT_ROOT MAX_OBJECT PT_MAX.
#
# Every front carries its OWN brix_export: the cache tier is registered in
# the VFS backend registry keyed by the canonical EXPORT root
# (vfs_backend_config.c::brix_vfs_backend_config_cache_store), so two
# locations sharing a root share ONE tier — the passthrough-off control
# would silently inherit the passthrough-on plane's policy.
daemon on;
worker_processes 2;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    client_body_temp_path {TMP_DIR};
    client_max_body_size 200m;

    # The origin. No cache of its own — it IS the source of truth.
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;
        location / {
            dav_methods PUT DELETE MKCOL MOVE COPY;
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name localhost;
        location / {
            brix_s3                   on;
            brix_storage_backend      http://{BIND_HOST}:{PORT};
            brix_s3_bucket            ptbucket;
            brix_s3_region            us-east-1;
            brix_export               {EXPORT_ROOT}/s3on;
            brix_cache_store          posix:{CACHE_ROOT}/s3on;
            brix_cache_max_object     {MAX_OBJECT};
            brix_cache_passthrough    on;
            brix_cache_passthrough_max {PT_MAX};
        }
    }

    server {
        listen {BIND_HOST}:{S3_OFF_PORT};
        server_name localhost;
        location / {
            brix_s3                   on;
            brix_storage_backend      http://{BIND_HOST}:{PORT};
            brix_s3_bucket            ptbucket;
            brix_s3_region            us-east-1;
            brix_export               {EXPORT_ROOT}/s3off;
            brix_cache_store          posix:{CACHE_ROOT}/s3off;
            brix_cache_max_object     {MAX_OBJECT};
            brix_cache_passthrough    off;
        }
    }

    server {
        listen {BIND_HOST}:{CV_PORT};
        server_name localhost;
        location /cvmfs/ {
            brix_cvmfs                on;
            brix_storage_backend      http://{BIND_HOST}:{PORT};
            brix_export               {EXPORT_ROOT}/cvon;
            brix_cache_store          posix:{CACHE_ROOT}/cvon;
            brix_cache_max_object     {MAX_OBJECT};
            brix_cache_passthrough    on;
            brix_cache_passthrough_max {PT_MAX};
        }
    }

    server {
        listen {BIND_HOST}:{CV_OFF_PORT};
        server_name localhost;
        location /cvmfs/ {
            brix_cvmfs                on;
            brix_storage_backend      http://{BIND_HOST}:{PORT};
            brix_export               {EXPORT_ROOT}/cvoff;
            brix_cache_store          posix:{CACHE_ROOT}/cvoff;
            brix_cache_max_object     {MAX_OBJECT};
            brix_cache_passthrough    off;
        }
    }
}

stream {
    # Passthrough is CONFIGURED here and must still not happen: the stream
    # plane's cache fill is the one caller that passes allow_pt=0.
    server {
        listen {BIND_HOST}:{ROOT_PORT};
        brix_root                 on;
        brix_auth                 none;
        brix_storage_backend      http://{BIND_HOST}:{PORT};
        brix_cache_store          posix:{CACHE_ROOT}/rootpt;
        brix_export               {EXPORT_ROOT}/rootpt;
        brix_cache_state_root     {CACHE_ROOT}/rootpt;
        brix_cache_max_object     {MAX_OBJECT};
        brix_cache_passthrough    on;
        brix_cache_passthrough_max {PT_MAX};
    }
}

# Phase-115 W4.3: a WebDAV read node whose PRIMARY storage is a root:// origin,
# with the store line's per-page verification policy under test in the BACKEND
# slot (e.g. "root://127.0.0.1:9999 verify_pages=require").
#
# The local export is deliberately EMPTY: every byte a GET returns had to come
# over the wire from the origin, so a passing read is proof the pgread path
# delivered and not proof that a local copy existed.
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.
# Test-provided via template_values: BIND_HOST BACKEND.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_export {DATA_ROOT};
            brix_storage_backend {BACKEND};
            brix_webdav_auth none;
        }
    }
}

# Exact-value probes for the Phase-110 HTTP variable vocabulary.
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_DIR LOG_NAME LOG_FORMAT.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    log_format v '{LOG_FORMAT}';
    access_log {LOG_DIR}/{LOG_NAME} v;
    client_body_temp_path {TMP_DIR};

    server {
        listen 127.0.0.1:{PORT};

        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
        }
    }
}

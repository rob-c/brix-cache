# EIGHT locations on ONE listener over ONE export — the measuring half of the
# configuration surface that parses, merges, allocates and is then never read
# (test_audit16ad_inert_config_surface.py, 16th tranche).
#
# Two subjects, chosen because they are the same defect twice:
#
#   brix_webdav_open_file_cache{,_valid,_min_uses,_errors,_events}
#       Five directives.  The setter (module_directives.c:262-311) validates its
#       tokens, refuses a missing `max`, and calls ngx_open_file_cache_init() —
#       a real ngx_open_file_cache_t is built and hung on the location conf
#       (webdav_loc_conf.h:200-204).  Nothing then reads it: no translation unit
#       in src/, shared/ or client/ calls ngx_open_cached_file(), and inside
#       webdav/ the five fields appear only in the command table, config.c's
#       NGX_CONF_UNSET init and config_merge.c:147-156's merge.  `_errors` and
#       `_events` are the two whose second arm no config in this tree had ever
#       written; the audit found them, and what it found underneath is that
#       neither arm can matter.
#
#   brix_backend_passthrough_persist
#       One directive, and NEITHER arm had ever been written.  Same shape:
#       command table (http_common.c:239), init (shared_conf.h:100), merge
#       (:428) and the adopt macro (http_common.c:441) — and no consumer.
#
# WHY THE CACHE ARMS NEED FOUR LOCATIONS AND NOT TWO
#   The claim is not "the two flags agree with each other"; two locations could
#   say that while both quietly did the same wrong thing.  The claim is that a
#   location which asked for a cache is indistinguishable from one that asked
#   for nothing, so CACHE_NONE is the control every cache arm is compared
#   against, and the two flag arms are compared against CACHE_ON as well.  The
#   cache parameters are deliberately generous — max=1024, inactive=1h, valid
#   1h, min_uses 1 — so that a working cache would be impossible to miss: every
#   probe below re-reads a file within a second of the first read.
#
# WHY THE PASSTHROUGH ARMS NEED THREE
#   `on`, `off` and absent.  The merge default is 0 (shared_conf.h:428-429), so
#   `off` and absent must be the same location twice; the third is what makes
#   that a measurement rather than an assumption.
#
# WHY ONE EXPORT AND NOT EIGHT
#   The WebDAV path resolver maps the FULL request URI under the export root, so
#   /cache-on/f.txt is {DATA_ROOT}/cache-on/f.txt — the locations are already
#   disjoint on disk, and giving each its own root would only make the arms
#   differ by something other than the directive under test.
#
# CACHE_RO is the security plane: the same five cache directives as CACHE_ON
# beside `brix_allow_write off`.  An open-file cache that were live would be the
# classic way for a revoked file to keep being served; this location exists so
# the test can say the write gate and the permission check are reached on every
# request, cache configured or not.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.  Test-provided: BIND_HOST.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};

        # ---- the cache arms ------------------------------------------------ #

        # Everything the family can be asked for, both flags on.
        location /cache-on/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_webdav_open_file_cache          max=1024 inactive=1h;
            brix_webdav_open_file_cache_valid    1h;
            brix_webdav_open_file_cache_min_uses 1;
            brix_webdav_open_file_cache_errors   on;
            brix_webdav_open_file_cache_events   on;
        }

        # The arm no config had written: errors off.
        location /cache-eoff/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_webdav_open_file_cache          max=1024 inactive=1h;
            brix_webdav_open_file_cache_valid    1h;
            brix_webdav_open_file_cache_min_uses 1;
            brix_webdav_open_file_cache_errors   off;
            brix_webdav_open_file_cache_events   on;
        }

        # The other arm no config had written: events on was written once and
        # events off is the corpus's only spelling, so this location is the one
        # that had never existed anywhere.
        location /cache-voff/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_webdav_open_file_cache          max=1024 inactive=1h;
            brix_webdav_open_file_cache_valid    1h;
            brix_webdav_open_file_cache_min_uses 1;
            brix_webdav_open_file_cache_errors   on;
            brix_webdav_open_file_cache_events   off;
        }

        # The control: not one directive of the family.
        location /cache-none/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        # ---- the passthrough arms ------------------------------------------ #

        location /pp-on/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_backend_passthrough_persist on;
        }

        location /pp-off/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_backend_passthrough_persist off;
        }

        location /pp-abs/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        # ---- the security plane -------------------------------------------- #

        location /cache-ro/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     off;
            brix_webdav_open_file_cache          max=1024 inactive=1h;
            brix_webdav_open_file_cache_valid    1h;
            brix_webdav_open_file_cache_min_uses 1;
            brix_webdav_open_file_cache_errors   on;
            brix_webdav_open_file_cache_events   on;
        }
    }
}

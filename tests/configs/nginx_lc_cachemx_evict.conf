# cachemx eviction/watermark subject (test_cachemx_trim_evict.py).  A single
# anonymous root:// listener with a posix backend and a cache tier whose
# watermarks are COMPUTED BY THE TEST from the live statvfs occupancy of the
# filesystem holding {CACHE_DIR} (high = used-2%, low = used-5%), so the
# 1-second reaper genuinely trims as an unprivileged user — the technique from
# tests/cmdscripts/cache_watermark.py.  {EVICT_THRESHOLD} is the on-fill
# eviction trigger (fraction, e.g. 0.01) for brix_cache_evict_if_needed.
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT + METRICS_PORT.
# Session-provided: BIND_HOST.  Test-provided: CACHE_DIR HIGH_WM LOW_WM
# EVICT_THRESHOLD.
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_cache_store      posix:{CACHE_DIR};
        brix_cache_export     /;
        brix_cache_eviction_threshold {EVICT_THRESHOLD};
        brix_cache_high_watermark {HIGH_WM}%;
        brix_cache_low_watermark  {LOW_WM}%;
        brix_cache_reap_interval  1;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

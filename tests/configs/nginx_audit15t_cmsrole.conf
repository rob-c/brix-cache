# `brix_cms_role` at VALUE granularity (test_audit15t_cms_role.py).
#
# Same shape as nginx_cms_wire_role_node.conf, but the role line and the
# manager-mode line are BOTH slots rather than one fixed directive.  Two of the
# six tokens in brix_cms_roles[] (module_enums.c:78-86) have never been written
# anywhere in the corpus — `auto` and `proxy` — and `auto` cannot be pinned by a
# template that always writes a role, because what it derives depends on
# brix_manager_mode and because the interesting control is the directive being
# ABSENT (the merge default at server_conf_merge_cluster.c:243-244 is AUTO, so
# an absent line and an explicit `auto` must produce the same wire).
#
# ROLE_LINE is empty for the absent arm; MGR_LINES carries brix_manager_mode for
# the arm that makes `auto` derive the manager bit.
#
# brix_allow_write is on so the inbound kYR_mkdir probe can actually land: the
# discriminator between the permissive roles and the restricted ones is whether
# one identical frame CREATES A DIRECTORY or is dropped, and a read-only export
# would refuse both and prove nothing.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: MANAGER_PORT ROLE_LINE MGR_LINES.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }
stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
        brix_allow_write on;
        brix_listen_port {PORT};
        brix_cms_manager 127.0.0.1:{MANAGER_PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
{MGR_LINES}{ROLE_LINE}    }
}

# Live pin for the PATH SCOPE of a policy rule on a REMOTE-backed export.
#
# An export whose bytes live off-box has no local directory to anchor to, so its
# root_canon defaults to "/" (see the note on brix_storage_backend_is_remote,
# src/core/config/runtime_server_backend.c).  Every policy rule — brix_require_vo
# here, brix_authdb and the group rules elsewhere — is canonicalised against that
# root once at startup by brix_finalize_path_rules(), and the result is the
# prefix the request-time gate matches on.  This server exists to prove that the
# canonicalisation keeps the rule's PATH: two rules naming two different
# subtrees must stay two different rules, and neither may reach a third.
#
# Deliberately unauthenticated.  With `brix_webdav_auth none` a request carries
# no VO at all, so "the rule applies" and "the request is refused" are the same
# observable — which is what makes the scope legible from the status code alone,
# with no PKI, no VOMS and no token authority in the way.  The backend is a
# closed port for the same reason: a path NO rule covers must get past the ACCESS
# phase, and the fastest proof of that is the 502 it takes when the gate lets it
# through to an origin that refuses the connection.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location / {
            brix_webdav          on;
            brix_webdav_auth     none;
            brix_storage_backend root://{BIND_HOST}:{ORIGIN_PORT};

            # The rules under test, supplied per cell.  The VO cells declare two
            # subtrees at different depths — so a collapse is visible as a rule
            # firing where it was never asked to — and the authdb cells declare
            # one `a * <path> rl`, whose grant is the observable instead.  They
            # share this server (and therefore its port) because the condition
            # under test is the same for both: a policy rule canonicalised
            # against a root_canon of "/".
{POLICY_BLOCK}
        }
    }
}

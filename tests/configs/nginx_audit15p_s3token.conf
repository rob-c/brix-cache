# The S3 bearer gate's time window — §Method step 2 sharpened
# (test_audit15p_s3_token.py).
#
# Two of the thirteen parse-only survivors were re-measured before this file
# was written and turned out to be covered IN EFFECT rather than in name:
#
#   brix_s3_token_audience  test_wlcg_token_conformance_s3.py::test_s3_04 and
#                           test_audit15k_s3_coresidency.py both mint a token
#                           whose aud differs from the configured value and
#                           read the 403 — which cannot pass unless the
#                           directive is what the verifier compares against.
#   brix_s3_token_jwks      the same two suites serve a valid token, which
#                           cannot happen unless the file was loaded.
#
# What is left genuinely untested on this plane is the third knob and the two
# config-time refusals:
#
#   brix_s3_token_clock_skew   appears in exactly one place in the tree
#                              (test_audit15_zero_directive_parse.py, which
#                              only proves the line parses)
#   brix_s3_token_jwks         its two NGX_LOG_EMERG refusals
#                              (module_merge.c:134-152) are asserted nowhere
#
# HOW THE SKEW BECOMES VISIBLE
#
# A skew is a duration, and the trap from the CMS timing plane applies again
# in reverse: here nothing is measured against a wall clock at all.  The token
# carries its own `exp`, so the arms below differ in NOTHING but the skew and
# one minted token gets a different verdict from each.  The value is read off
# the disagreement between two locations, never off elapsed time.
#
#   /skew0/     brix_s3_token_clock_skew 0      exact expiry, no grace
#   /skewdef/   (directive absent)              the frozen merge default, 60
#   /skewwide/  brix_s3_token_clock_skew 1800   30 minutes of grace
#   /keyb/      like /skewdef/ but a SECOND JWKS
#
# 1800 is not arbitrary: brix_token_clock_skew (server_conf_merge_security.c:154)
# and brix_webdav_token_clock_skew (config_merge.c:164) both refuse anything
# over 300, and the S3 twin has no such check — see DEFECT CANDIDATE #50 in the
# test module.  This file is where that asymmetry is demonstrated live rather
# than argued from the source.
#
# /keyb/ exists for the one brix_s3_token_jwks claim the existing suites do not
# make: that the PATH is what selects the trust anchor.  Both JWKS files carry
# the same kid (test-key-1) over different key material, so an arm that refuses
# the other arm's token refused it on the key, not on the label.
#
# CLEARTEXT ON PURPOSE.  A bearer token in the clear is not what is under test;
# the exp/nbf window is, and TLS would add a variable without adding a claim.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + template values JWKS_A JWKS_B
# ISSUER AUDIENCE TMP_DIR.  Session-provided: BIND_HOST.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/client_body;
    proxy_temp_path       {TMP_DIR}/proxy;
    fastcgi_temp_path     {TMP_DIR}/fastcgi;
    uwsgi_temp_path       {TMP_DIR}/uwsgi;
    scgi_temp_path        {TMP_DIR}/scgi;

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        # --- no grace at all ---------------------------------------------- #
        location /skew0/ {
            brix_s3                  on;
            brix_storage_backend     posix:{DATA_ROOT}/skew0;
            brix_s3_bucket           skew0;
            brix_allow_write         on;
            brix_s3_token            on;
            brix_s3_token_jwks       {JWKS_A};
            brix_s3_token_issuer     "{ISSUER}";
            brix_s3_token_audience   "{AUDIENCE}";
            brix_s3_token_clock_skew 0;
        }

        # --- the frozen default, written by omission ----------------------- #
        # module_merge.c:132 merges 60 here.  Leaving the directive out is the
        # point: a test that set it to 60 would prove only that 60 equals 60.
        location /skewdef/ {
            brix_s3                on;
            brix_storage_backend   posix:{DATA_ROOT}/skewdef;
            brix_s3_bucket         skewdef;
            brix_allow_write       on;
            brix_s3_token          on;
            brix_s3_token_jwks     {JWKS_A};
            brix_s3_token_issuer   "{ISSUER}";
            brix_s3_token_audience "{AUDIENCE}";
        }

        # --- a grace period the other two token planes would refuse -------- #
        location /skewwide/ {
            brix_s3                  on;
            brix_storage_backend     posix:{DATA_ROOT}/skewwide;
            brix_s3_bucket           skewwide;
            brix_allow_write         on;
            brix_s3_token            on;
            brix_s3_token_jwks       {JWKS_A};
            brix_s3_token_issuer     "{ISSUER}";
            brix_s3_token_audience   "{AUDIENCE}";
            brix_s3_token_clock_skew 1800;
        }

        # --- a different trust anchor, same everything else ---------------- #
        location /keyb/ {
            brix_s3                on;
            brix_storage_backend   posix:{DATA_ROOT}/keyb;
            brix_s3_bucket         keyb;
            brix_allow_write       on;
            brix_s3_token          on;
            brix_s3_token_jwks     {JWKS_B};
            brix_s3_token_issuer   "{ISSUER}";
            brix_s3_token_audience "{AUDIENCE}";
        }
    }
}

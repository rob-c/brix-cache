# WebDAV-plane TPC source-host egress allowlist guard
# (brix_tpc_source_guard / brix_tpc_source_allow), the HTTP-COPY
# twin of the native stream guard in nginx_tpc_source_guard.conf. A COPY pull
# may only name a SOURCE authority on the allowlist; a non-allowlisted host is
# refused with 403 before curl dials out (test_webdav_tpc_source_egress_guard.py).
# Cleartext + brix_webdav_auth none so the guard, which fires on the Source
# URL parse ahead of any outbound leg, is exercised without a PKI dependency.
worker_processes 1;
error_log {LOG_DIR}/error.log info;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

http {
    access_log {LOG_DIR}/access.log;

    server {
        listen {PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
            brix_allow_write on;
            brix_webdav_tpc on;
            # Range gate wide open so the naming guard is the only egress
            # control under test: an allowlisted RFC-1918 host must fall
            # through both gates, never refused by address range.
            brix_tpc_allow_local on;
            brix_tpc_allow_private on;
            brix_tpc_source_guard on;
            brix_tpc_source_allow 10.255.255.1 .example.com;
            # Bound the outbound leg so an allowlisted-but-unreachable host
            # (which the naming guard correctly lets through) fails fast at the
            # curl stage instead of parking the test on a connect timeout.
            brix_webdav_tpc_timeout 3;
        }
    }
}

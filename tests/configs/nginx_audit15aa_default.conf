# The five never-written tokens that restate a default
# (test_audit15aa_default_tokens.py).
#
# ONE process, because two of the five are not what they are declared to be.
# `brix_webdav_checksum_xattr_format` is a main|srv|loc directive with a real
# ngx_conf_merge_uint_value behind it, and `brix_ssi_cta_executor` is a
# per-server directive — and both are pushed into a process-global that nothing
# ever pushes back.  A directive like that cannot be measured from a config that
# writes it once; it can only be measured from a config that writes it twice,
# differently, in one worker.  So every face below is co-resident on purpose.
#
# THE HTTP LOCATIONS ({PORT})
#   /txt/       brix_webdav_checksum_xattr_format text — the token under test,
#               written exactly as an operator would write it to keep the
#               default.  It shares a process with /bin/.
#   /bin/       the same directive set to xrdcks.  config_merge.c:107 pushes the
#               value to brix_integrity_set_xattr_format() only when it is NOT
#               text, so this location writes the process-global and /txt/ has
#               no way to write it back.  Which of the two merges first does not
#               matter: `text` never calls the setter in either order.
#   /rdr-none/  redirect-to-dataserver with no brix_webdav_redirect_scheme at
#               all — the merge default (BRIX_WEBDAV_RDR_HTTP).
#   /rdr-http/  the same with `http` written out: the token under test.
#   /rdr-https/ the same with `https`.  This is the control that makes the two
#               above a measurement: redirect_scheme is read from conf-> at
#               request time (redirect.c:251), so three locations in ONE process
#               must give three independent verdicts — which is exactly what the
#               checksum format three lines away in the same merge does not do.
#   Every redirect location points brix_webdav_redirect_port back at {PORT}, the
#   same listener.  The tests read the Location header and never follow it; the
#   loop guard (rdr_eligible(), redirect.c:206) would serve a followed one
#   locally anyway.
#
# THE STREAM BLOCKS
#   {MEMBER_PORT}  a root data server registering with the manager face below.
#                  webdav_redirect_dataserver() DECLINES to a local serve while
#                  brix_srv_select() finds nothing (redirect.c:299), so without
#                  a registered member there is no Location header at all and
#                  the scheme has nowhere to appear.
#   {CMS_PORT}     the registration face.  brix_cms_server replaces the stream
#                  handler for its whole server block, so it needs its own port.
#   {SSI_PORT}     an SSI cta face with `brix_ssi_cta_executor test` — the
#                  simulated executor, which completes an archive.
#   {SSI2_PORT}    the same with `prod`.  cta_exec.c's prod_archive() fails
#                  cleanly with "no nearline backend configured" in a build with
#                  no nearline backend, so the two faces are distinguishable by
#                  the response type alone.  ssi_open_cta_gate() (ssi.c:97) calls
#                  brix_ssi_cta_configure() on EVERY open, and that writes the
#                  per-worker g_cta_use_prod, so an open here decides which
#                  executor completes a request already submitted over there.
#
# `worker_processes 1` is load-bearing: every global named above is per-worker,
# and a second worker would answer some connections from an uncontaminated copy.
#
# error_log at `info` keeps the CMS registration chatter readable when a
# redirect arm fails for want of a member.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + ledger extras MEMBER_PORT
# CMS_PORT SSI_PORT SSI2_PORT.  Test-provided: BIND_HOST and JOURNAL.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # --- a cluster member, so the redirect has a target -------------------- #
    server {
        listen {BIND_HOST}:{MEMBER_PORT};
        brix_listen_port     {MEMBER_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{DATA_ROOT};
        brix_cms_manager     {BIND_HOST}:{CMS_PORT};
        brix_cms_paths       /;
        brix_cms_interval    1;
    }

    # --- the manager's CMS registration face ------------------------------- #
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server          on;
        brix_cms_server_interval 1;
    }

    # --- the simulated CTA executor ---------------------------------------- #
    server {
        listen {BIND_HOST}:{SSI_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_ssi             on;
        brix_ssi_service     cta;
        brix_ssi_cta_executor test;
        brix_ssi_cta_journal {JOURNAL};
    }

    # --- the production CTA executor: the token under test ------------------ #
    server {
        listen {BIND_HOST}:{SSI2_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_ssi             on;
        brix_ssi_service     cta;
        brix_ssi_cta_executor prod;
    }
}

http {
    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        # The token under test: the default format, spelled out.
        location /txt/ {
            brix_webdav                        on;
            brix_storage_backend               posix:{DATA_ROOT};
            brix_webdav_auth                   none;
            brix_allow_write                   on;
            brix_webdav_checksum_on_write      adler32;
            brix_webdav_checksum_xattr_format  text;
        }

        # The sibling that writes the process-global.
        location /bin/ {
            brix_webdav                        on;
            brix_storage_backend               posix:{DATA_ROOT};
            brix_webdav_auth                   none;
            brix_allow_write                   on;
            brix_webdav_checksum_on_write      adler32;
            brix_webdav_checksum_xattr_format  xrdcks;
        }

        # No brix_webdav_redirect_scheme: the merge default.
        location /rdr-none/ {
            brix_webdav                     on;
            brix_storage_backend            posix:{DATA_ROOT};
            brix_webdav_auth                none;
            brix_webdav_redirect_dataserver on;
            brix_webdav_redirect_port       {PORT};
        }

        # The token under test: the default scheme, spelled out.
        location /rdr-http/ {
            brix_webdav                     on;
            brix_storage_backend            posix:{DATA_ROOT};
            brix_webdav_auth                none;
            brix_webdav_redirect_dataserver on;
            brix_webdav_redirect_port       {PORT};
            brix_webdav_redirect_scheme     http;
        }

        # The control: the other token, in the same process.
        location /rdr-https/ {
            brix_webdav                     on;
            brix_storage_backend            posix:{DATA_ROOT};
            brix_webdav_auth                none;
            brix_webdav_redirect_dataserver on;
            brix_webdav_redirect_port       {PORT};
            brix_webdav_redirect_scheme     https;
        }
    }
}

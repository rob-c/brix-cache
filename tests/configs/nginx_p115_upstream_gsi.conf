# nginx_p115_upstream_gsi.conf — transparent-upstream front for the phase-115
# W2.4 GSI/ztn outbound-credential suite (tests/test_phase115_upstream_gsi.py).
# The front's own storage is empty, so every kXR_locate misses locally and is
# relayed to `brix_upstream`; the credential the front presents is whatever the
# CRED_LINES slot carries (brix_upstream_x509_proxy / brix_upstream_x509_key /
# brix_upstream_token_file / brix_trusted_ca, or nothing at all).
#
# Launcher-provided : LOG_DIR PORT DATA_ROOT
# Test-provided     : UP_PORT (the upstream's listen port), CRED_LINES
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 64; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_upstream 127.0.0.1:{UP_PORT};
{CRED_LINES}
    }
}

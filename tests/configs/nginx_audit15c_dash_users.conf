# Dashboard multi-user auth (brix_dashboard_users) — registry lifecycle,
# test_audit15c_dashboard_users.py.  The users file (htpasswd-style
# "name:crypt-or-plaintext" lines) and a non-default cookie path are
# test-provided so both the crypt(3) and legacy-plaintext hash branches and the
# cookie_path setter get live coverage.
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST USERS_FILE COOKIE_PATH.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{PORT};
        location /brix {
            brix_dashboard on;
            brix_admin_rate_limit off;  # whole suite shares one client IP: default per-IP cap trips under xdist
            brix_dashboard_users {USERS_FILE};
            brix_dashboard_cookie_path {COOKIE_PATH};
            brix_dashboard_session_ttl 3600;
            brix_dashboard_browse_root {DATA_ROOT};
        }
    }
}

# $brix_cache_status / $brix_tls — template for test_brix_http_variables.py
# (phase-106 W1).
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_DIR.
#
# A plain cleartext webdav location plus a log_format built from the phase-106
# variable surface.  The point of the test is that ONE log_format works
# without the location knowing anything about it: the variables are registered
# by the COMMON module, not by whichever protocol happens to serve the request.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    log_format brixvars 'status=$status cache=$brix_cache_status '
                        'tls=$brix_tls proto=$brix_protocol '
                        'dn=$brix_dn vo=$brix_vo fqan=$brix_fqan '
                        'sub=$brix_sub iss=$brix_issuer am=$brix_auth_method '
                        'tier=$brix_tier origin=$brix_origin';
    access_log {LOG_DIR}/brixvars.log brixvars;
    client_body_temp_path {TMP_DIR};

    server {
        listen 127.0.0.1:{PORT};

        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
        }
    }
}

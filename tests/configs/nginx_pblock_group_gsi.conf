# nginx_pblock_group_gsi.conf — pblock per-group multi-user (phase-80, P80.24).
#
# One pblock-backed root://-over-GSI server for test_pblock_group_multiuser.py.
# The authenticated GSI **DN** is mapped worker-side to a local username via
# {GRIDMAP} (P80.21 — no impersonation broker involved); that user's unix group
# membership feeds the {AUTHDB} `g`-rule gate, and the pblock catalog stamps the
# resolved {uid,gid} as attribution ground truth (P80.22).  The gate decides,
# the catalog attests — see docs/05-operations/pblock-multiuser.md.
#
# Launcher-provided : LOG_DIR PORT DATA_ROOT
# Test-provided     : GRIDMAP (DN -> local user), AUTHDB (xrdacc g-rules),
#                     CERT KEY CA (host cert / key / trusted-CA for GSI).
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;

events { worker_connections 64; }

stream {
    # DN -> local username, resolved at login independent of any broker (P80.21).
    brix_idmap_gridmap        {GRIDMAP};
    brix_idmap_min_uid  1000;

    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};

        brix_export           {DATA_ROOT};
        brix_storage_backend  pblock://{DATA_ROOT};
        brix_allow_write      on;
        brix_upload_resume    off;

        brix_authdb_engine xrdacc;
        brix_authdb        {AUTHDB};
        brix_acc_audit  all;
        brix_access_log    {LOG_DIR}/access.log;
    }
}

# Phase-115 W2.1 gateway: a CMS manager whose answer to "which data server has
# this path" is brix_cms_response — `redirect` (stock kXR_redirect) or `proxy`
# (the session is pinned to the selected node and its requests relayed).  The
# root listener's own export is an EMPTY directory, so any byte a client reads
# through it can only have come from the data server.  The CMS listener needs
# its own port: brix_cms_server replaces the stream handler for its whole
# server block.  Template for tests/test_phase115_cms_select_proxy.py.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: CMS_PORT RESPONSE AUTH WINDOW_MS.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth {AUTH};
        brix_manager_mode on;
        brix_cms_response {RESPONSE};
        brix_cms_locate_window {WINDOW_MS}ms;
        brix_cms_state_fanout 4;
    }
    server {
        listen 127.0.0.1:{CMS_PORT};
        brix_cms_server on;
        brix_cms_server_interval 1;
    }
}

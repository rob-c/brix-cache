# ONE cvmfs location — the control half of the CVMFS origin-policy value table
# (test_audit15y_cvmfs_origin_policy.py, the 15th tranche).
#
# Three brix_cvmfs_* enums are declared NGX_HTTP_MAIN_CONF|SRV_CONF|LOC_CONF
# (src/protocols/cvmfs/directives_resilience.h:100,107,116), so an operator
# reads all three as per-location.  Two of them are not: the merge writes a
# PROCESS-wide global and the last cvmfs location merged decides for the whole
# worker.  Proving that needs a second location, which is what the companion
# nginx_audit15y_cvpair.conf carries; this file is what each single-location
# reading is taken against first, so "the token does X" and "the token does X
# only when it is the last one written" stay separable.
#
# The policy lines are NOT written here.  A case supplies whichever it needs
# through the POLICY_A slot (named without braces because the renderer
# substitutes placeholders inside comments too, and a multi-line value spliced
# into a comment turns the tail of that comment into live config).  Writing the
# directive here instead would make every case carry a value it did not choose
# — and for these two directives an unchosen value is not inert.
#
# worker_processes 1 is load-bearing, not hygiene: the globals under test are
# per-worker, so a second worker would answer half the requests from a
# different latch and the measurement would be a coin toss.
#
# BACKEND is a quoted brix_storage_backend list because the retry-policy
# section needs a DEAD|LIVE pair, and the '|' separator must survive the config
# parser as one argument.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + MOCK_PORT DEAD_PORT.
# Test-provided: BIND_HOST REPO_A CACHE_A BACKEND + the POLICY_A slot.
daemon on;
worker_processes 1;
thread_pool default threads=2;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # brix_cvmfs_trace is what makes the negotiated origin HTTP version
        # observable at all: every upstream line carries proto=<v>, so a
        # silent downgrade (or a fill that never got a connection) is a fact in
        # the log rather than an inference from a status code.
        location /cvmfs/{REPO_A}/ {
            brix_cvmfs           on;
            brix_cvmfs_trace     on;
            brix_cache_store     posix:{CACHE_A};
            brix_storage_backend "{BACKEND}";
{POLICY_A}        }
    }
}

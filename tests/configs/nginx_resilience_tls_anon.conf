# Dedicated anonymous roots:// (TLS) stream server for the resilience sweeps
# (tests/resilience/servers.py, NginxTlsAnon).  Rendered through the phase-81
# registry (LifecycleHarness): {PORT}, {LOG_DIR} and {DATA_ROOT} come from the
# launcher; {SERVER_CERT}/{SERVER_KEY} from the resilience PKI.
#
# The TLS analogue of nginx_resilience_anon.conf.  Every fault sweep in this
# folder was cleartext, so the TLS record layer had never been driven under
# loss/truncation/corruption — the one transport that is supposed to turn a
# length-preserving in-flight bit flip into a hard failure instead of silently
# corrupt data.  Auth stays `none` on purpose: this leg is about the record
# layer, not about who the caller is.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log error;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 1024; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tls on;
        brix_certificate {SERVER_CERT};
        brix_certificate_key {SERVER_KEY};
    }
}

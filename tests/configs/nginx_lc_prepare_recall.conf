# W6 (phase-107 C2) template for tests/test_prepare_recall.py and
# tests/test_vfs_evict.py: an frm:// nearline export (exec MSS adapter, posix
# cache store as the recall target) WITH the durable stage-request registry
# (brix_frm_control_dir), so kXR_prepare(kXR_stage) exercises the full W6
# lifecycle — record-before-driver-call, driver recall through brix_vfs_recall,
# JOIN on a second prepare, delete-on-synchronous-failure — and
# kXR_prepare(optionX=kXR_evict) reaches brix_vfs_evict through the cache
# decorator's relay.  No brix_prepare_command: the driver slot is the stager.
# ALLOW_WRITE is a template value so the same file stands up the read-only
# instance for the kXR_fsReadOnly security negative (stage and evict are typed
# export mutations; a read-only endpoint refuses BEFORE anything is recorded).
# The exec adapter's stage command comes from BRIX_FRM_STAGECMD (spec env).
# The driver's master-environ snapshot (sd_frm_adapter.c frm_env) survives the
# worker-environ wipe on the cycle-keyed chain rebuild; the `env` directive is
# kept as the operator-facing belt (nginx_lc_tape_rest.conf pattern) so this
# template also pins that the two mechanisms coexist.
env BRIX_FRM_STAGECMD;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
events { worker_connections 64; }
stream {
  server {
    listen 127.0.0.1:{PORT};
    brix_root on;
    brix_auth none;
    brix_storage_backend {STORAGE_BACKEND};
    brix_cache_store posix:{CACHE_DIR};
    brix_cache_export /;
    brix_allow_write {ALLOW_WRITE};
    brix_frm on;
    brix_frm_queue_path {QUEUE_PATH};
    brix_frm_control_dir {CONTROL_DIR};
    brix_frm_max_inflight 128;
  }
}

# brix_cache_max_bytes (audit §4.7, upstream pfc.diskusage files) —
# test_cache_max_bytes.py.
#
# A root:// front whose cache decorator sits over a posix source, with a cap on
# the cache's OWN bytes (distinct from filesystem occupancy) and a fast (1s)
# reaper so the test observes the cap enforced within a few ticks. The source is
# posix rather than a remote origin purely to keep this to ONE listener; the
# owned-bytes reaper sits in the cache decorator above the source driver, so it
# behaves the same whatever source is composed under it.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.
# Session-provided: BIND_HOST.
# Test-provided: CACHE_ROOT EXPORT_ROOT MAXBYTES
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_export          {EXPORT_ROOT}/mb;
        brix_cache_store     posix:{CACHE_ROOT}/mb;
        brix_cache_max_bytes {MAXBYTES};
        brix_cache_reap_interval 1;
        brix_access_log      {LOG_DIR}/brix_access.log;
    }
}

# The TPC leg's trust anchor — §Method step 2 sharpened
# (test_audit15r_webdav_tpc_cadir.py).
#
# `brix_webdav_tpc_cadir` is the last of the thirteen directives that survived
# the sharpened step 2: it appears in no template anywhere, nothing selects a
# trust anchor with it, and its config-time validation is never provoked.  Its
# sibling `brix_webdav_tpc_cafile` is exercised everywhere (every audit-15f TPC
# template hands the mock source's PEM to it) — the DIRECTORY form, the one
# that has to be OpenSSL-hashed to work at all, is not.
#
# WHAT MAKES A TRUST ANCHOR OBSERVABLE
#
# The pull leg always verifies peer and host (CURLOPT_SSL_VERIFYPEER/VERIFYHOST,
# tpc_curl_setup.c:42-43) and the source's certificate is self-signed, so it is
# in no system bundle.  That makes the COPY's return code a direct read of one
# question: did THIS location's configured anchor set contain the CA that signed
# the source?  Two hashed directories are prepared — one holding the CA the mock
# actually presents, one holding an unrelated CA minted the same way — and every
# location below differs only in which of them it is pointed at, through which
# directive.
#
#   location            brix_webdav_cadir   brix_webdav_tpc_cadir   pull
#   /nocadir/           -                   -                       REFUSED
#   /capath/            -                   good                    served
#   /capathwrong/       -                   wrong                   REFUSED
#   /capathempty/       -                   empty dir               REFUSED
#   /inherit/           good                -                       served
#   /inheritwrong/      wrong               -                       REFUSED
#   /override/          wrong               good                    served
#   /both/              -                   wrong  (+ tpc_cafile)   served
#
# /nocadir/ is the attribution control: with no anchor configured at all the
# pull is refused, so each success above is caused by the directive under test
# and not by some ambient store.
#
# /inherit/ and /inheritwrong/ are the two halves of the cross-field fallback at
# tpc_config.c:130 — `if (conf->tpc_cadir.len == 0 && conf->cadir.len > 0)`.
# Serving in one and refusing in the other proves the fallback carries the
# CONFIGURED value rather than merely leaving the leg on some default; /override/
# proves the fallback is skipped, not merged, when the TPC-specific directive is
# written.
#
# /both/ answers whether the directory REPLACES the trust store or ADDS to it:
# it is handed the wrong directory AND the right cafile, and it serves — CAPATH
# and CAINFO are two anchor sources OR-ed by OpenSSL, not an override pair.
#
# Every location carries `brix_webdav_auth none`, which is also what keeps
# `brix_webdav_cadir` a pure TPC input here: webdav_build_ca_store_once()
# returns early for anything but the x509 auth tiers (config_merge.c:424-428),
# so the directive's only remaining effect on these locations is the fallback.
#
# brix_webdav_tpc_allow_local: the mock source is on loopback, which the TPC
# egress guard refuses by default.
#
# Each location gets its OWN export root, so a COPY landing in the wrong plane
# shows up as a missing file rather than as a shared-directory coincidence.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST EXPORT_ROOT CAPATH_GOOD CAPATH_WRONG CAPATH_EMPTY
# CA_PEM.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

thread_pool default threads=4 max_queue=256;
events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 16m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        location = / { return 204; }

        # --- no anchor at all: the attribution control -------------------- #
        location /nocadir/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/nocadir;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
        }

        # --- the directive under test, pointed at the right CA ------------ #
        location /capath/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/capath;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cadir       {CAPATH_GOOD};
        }

        # --- a well-formed hashed directory holding the WRONG CA ---------- #
        location /capathwrong/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/capathwrong;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cadir       {CAPATH_WRONG};
        }

        # --- a directory that passes validation and anchors nothing ------- #
        location /capathempty/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/capathempty;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cadir       {CAPATH_EMPTY};
        }

        # --- the cross-field fallback, both halves ------------------------ #
        location /inherit/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/inherit;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_cadir           {CAPATH_GOOD};
        }

        location /inheritwrong/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/inheritwrong;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_cadir           {CAPATH_WRONG};
        }

        # --- explicit beats inherited ------------------------------------- #
        location /override/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/override;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_cadir           {CAPATH_WRONG};
            brix_webdav_tpc_cadir       {CAPATH_GOOD};
        }

        # --- CAPATH and CAINFO are OR-ed, not exclusive -------------------- #
        location /both/ {
            brix_webdav                 on;
            brix_storage_backend        posix:{EXPORT_ROOT}/both;
            brix_webdav_auth            none;
            brix_allow_write            on;
            brix_webdav_tpc             on;
            brix_webdav_tpc_allow_local on;
            brix_webdav_tpc_cadir       {CAPATH_WRONG};
            brix_webdav_tpc_cafile      {CA_PEM};
        }
    }
}

# Phase-115 W2.1 data server behind a select-then-proxy gateway: anonymous,
# read-only (no brix_allow_write), posix export.  It knows nothing about the
# gateway — the test registers it with the gateway's CMS listener through a
# scripted CMS node, so the gateway's selection and the proxied bytes are the
# only link.  Template for tests/test_phase115_cms_select_proxy.py.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
    }
}

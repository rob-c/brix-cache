# The full-stack single box — phase-104 D14. Drives
# tests/test_oci_compose_secure.py, and is the runnable twin of
# deploy/oci-mirror/full-stack.conf.example: mirror + local registry +
# Stratum-0 in ONE server block, with the private-image gate arriving as
# placeholder lines so the SAME template serves both the public front and the
# scvmfs-gated one. That is the D14 claim in template form — gating a
# published image tree is configuration, not a different server.
#
# Placeholders (render_config(strict=True) — a missing one is a fatal render,
# never a server that quietly comes up ungated):
#   LOG_DIR        error.log + nginx.pid; the endpoint record names
#                  logs/nginx.pid — do not rename it
#   BIND_HOST      PORT        this front's listener
#   LISTEN_SSL     "" for the public front, " ssl" for the gated one
#   SSL_LINES      "" or the ssl_certificate/ssl_verify_client block
#   MOCK_HOST      MOCK_PORT   the upstream registry ROOT the mirror pulls from
#   CACHE_DIR      the mirror's cache store (posix:)
#   REGISTRY_ROOT  storage root for the site's own /local/v2/ registry
#   WEB_ROOT       Stratum-0 web root — holds cvmfs/<fqrn>/ per repo
#   S0_LINES       "" for the public repos, or the brix_scvmfs_* gate lines
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;
thread_pool default threads=2;
events { worker_connections 256; }
http {
    access_log off;
    client_max_body_size 16m;
    server {
        listen {BIND_HOST}:{PORT}{LISTEN_SSL};
        {SSL_LINES}
        location /v2/ {
            brix_oci_mirror          http://{MOCK_HOST}:{MOCK_PORT};
            brix_oci_mirror_insecure on;
            brix_oci_manifest_ttl    60s;
            brix_cache_store         posix:{CACHE_DIR};
            brix_cache_verify        oci-digest;
        }
        location /local/v2/ {
            brix_oci_registry                 on;
            brix_oci_registry_root            {REGISTRY_ROOT};
            brix_allow_write                  on;
            brix_oci_registry_allow_anonymous on;
        }
        location /cvmfs/ {
            brix_cvmfs               on;
            brix_cvmfs_stratum0_root {WEB_ROOT};
            {S0_LINES}
        }
    }
}

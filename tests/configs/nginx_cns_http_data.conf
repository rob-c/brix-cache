# Composite name-space data server exporting ONE root over four planes —
# registry-lifecycle template for test_cns_http.py (phase-97 §5).
#
# The CMS manager link and `brix_cns emit` live on the stream{} brix_root server,
# because that is where the directive is defined.  The WebDAV, S3 and gridftp
# planes carry no link of their own: they resolve the emitting server block from
# the cycle at emit time (src/net/cms/cns_emit.c), which is exactly what this
# template exercises — four protocols mutating one namespace, one inventory at
# the manager.
#
# All four planes share {DATA_ROOT} so a mutation made over any of them must
# converge to the same logical path in the manager's inventory.
#
# Anonymous + writable throughout: this fixture is about namespace propagation,
# not authorization (which has its own suites).
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided via extra_ports: HTTP_PORT S3_PORT FTP_PORT.
# Test-provided via template_values: CMS_PORT (the manager's, read from its
# started endpoint — never a stale local free_port).
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log {LOG_DIR}/access.log;
    client_body_temp_path {TMP_DIR};

    # WebDAV plane — PUT/DELETE/MKCOL/MOVE/COPY over the shared export.
    server {
        listen 127.0.0.1:{HTTP_PORT};

        location / {
            brix_webdav on;
            brix_export {DATA_ROOT};
            brix_webdav_auth none;
            brix_allow_write on;
        }
    }

    # S3 plane — anonymous PutObject/DeleteObject/CopyObject over the same root.
    # s3_resolve_key() strips the bucket component, so /testbucket/k lands at
    # {DATA_ROOT}/k and reports as the logical path "/k", identical to a
    # root:// or WebDAV write of "/k".
    server {
        listen 127.0.0.1:{S3_PORT};

        location / {
            brix_s3 on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_bucket testbucket;
            brix_s3_region us-east-1;
            brix_allow_write on;
        }
    }
}

stream {
    # The CNS emitter: the only block carrying the manager link.  The HTTP and
    # gridftp planes above report over THIS server's link.
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_cns emit;
        brix_cms_manager 127.0.0.1:{CMS_PORT};
        brix_cms_paths /;
        brix_cms_interval 1;
        brix_listen_port {PORT};
    }

    # gridftp plane — STOR/DELE/MKD/RMD/RNFR+RNTO over the same export.
    server {
        listen 127.0.0.1:{FTP_PORT};
        brix_gridftp on;
        brix_gridftp_export      {DATA_ROOT};
        brix_gridftp_allow_write on;
    }
}

# Dedicated SSS-authenticated root:// stream server for the resilience fault
# sweep (tests/resilience/servers.py, NginxSssRoot).  Rendered through the
# phase-81 registry (LifecycleHarness): {PORT}, {LOG_DIR} and {DATA_ROOT} come
# from the launcher; {KEYTAB} is minted by the test with xrdsssadmin-brix and
# must exist at config-parse time.
#
# The sweep harness covered GSI, then TLS and token; sss was the last login
# mechanism with no fault coverage.  It is the interesting one to damage because
# its handshake carries a SHARED SECRET rather than a public credential: a login
# severed or bit-flipped in flight must fail closed and leave no readable
# session, or the secret's whole value is gone.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 1024; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth sss;
        brix_sss_keytab {KEYTAB};
        brix_allow_write on;
        brix_access_log {LOG_DIR}/brix_access_sss.log;
    }
}

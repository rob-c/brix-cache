# The S3 plane's security options, all in ONE server block
# (test_audit15k_s3_coresidency.py, §Method step 3 re-run at server-block
# granularity).
#
# §E's third method note says the pairwise matrix counts a pair as co-tested
# "even if the two features sit in different server blocks of one conf", and
# that this makes the ZERO counts conservative.  The corollary it does not draw
# is that the NON-zero counts are not: eleven files in the tree carry both
# `brix_s3 on` and a token-auth directive, and not one server block runs both
# at once.  Step 3's declared semantics are "one server instance runs both
# features at once", so those pairs were scored covered without ever being
# exercised.  This file is that server block.
#
# ONE BUCKET PER LOCATION, AND THE NAMES MUST MATCH.  s3_parse_uri()
# (handler_dispatch.c:71) takes the bucket from the FIRST URI segment and
# compares it against `brix_s3_bucket`; the key is what follows, resolved
# against root_canon by s3_resolve_key() (util.c:136).  So a location prefix
# that is not the bucket name can never be addressed — every arm below is
# mounted at /<its own bucket>/ and given its own export root.
#
# WHY EACH ARM EXISTS
#   /plain/  the control.  Signed reads and writes succeed here, so every
#            refusal elsewhere is attributable to that arm's one extra line.
#   /ro/     brix_read_only after brix_allow_write.
#   /ro2/    the same two directives in the OPPOSITE order — read-only must not
#            depend on where the operator wrote it (brix_shared_apply_read_only
#            runs at the end of the merge, shared_conf.h:145).
#   /wrong/  four WebDAV-plane directives that parse here and do nothing: the
#            token gate, the macaroon secret, checksum-on-write, and TPC.  They
#            write into ngx_http_brix_webdav_loc_conf_t, which no S3 translation
#            unit can reach.
#   /stok/   the gate that DOES work on this plane: brix_s3_token (+ jwks,
#            issuer, audience), verified by auth_bearer.c.  Same server block as
#            the SigV4 keys, which is the INVARIANT 6 boundary under test.
#   /acc/    the XrdAcc tier (brix_authdb_format xrdacc), whose rule file
#            carries BOTH a per-access-key `u` rule and a `u *` rule so the two
#            can be told apart.
#   /brix    the dashboard face, co-resident with all of the above.  Its route
#            table is URI-ABSOLUTE (module_dispatch.c:76-85, "/brix/api/v1/...")
#            so this prefix is not decorative — mounted anywhere else the
#            dashboard 404s.
#
# CLEARTEXT ON PURPOSE.  SigV4 is a request-signing scheme; nothing here is
# about transport confidentiality, and TLS would add a variable without adding
# a claim.  The keys below are test material and never leave this file.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR.
# Test-provided: ACCESS_KEY SECRET_KEY REGION JWKS ISSUER AUDIENCE AUTHDB
#                (the JWKS, the authdb and every export root must exist at
#                config-parse time — lifecycle.start runs `nginx -t` first).
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {PORT};

        # --- control -------------------------------------------------------
        location /plain/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/plain;
            brix_s3_bucket       plain;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_allow_write     on;
        }

        # --- read-only, written after the write grant ----------------------
        location /ro/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/ro;
            brix_s3_bucket       ro;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_allow_write     on;
            brix_read_only       on;
        }

        # --- read-only, written BEFORE the write grant ---------------------
        location /ro2/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/ro2;
            brix_s3_bucket       ro2;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_read_only       on;
            brix_allow_write     on;
        }

        # --- four WebDAV directives that parse here and enforce nothing ----
        location /wrong/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/wrong;
            brix_s3_bucket       wrong;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_allow_write     on;
            brix_webdav_auth              required;
            brix_webdav_token_jwks        {JWKS};
            brix_webdav_token_issuer      "{ISSUER}";
            brix_webdav_token_audience    "{AUDIENCE}";
            brix_webdav_macaroon_secret   "0123456789abcdef0123456789abcdef";
            brix_webdav_checksum_on_write adler32;
            brix_webdav_tpc               on;
            brix_webdav_tpc_allow_local   on;
            brix_webdav_tpc_allow_private on;
        }

        # --- the token gate this plane actually has ------------------------
        location /stok/ {
            brix_s3                on;
            brix_storage_backend   posix:{DATA_ROOT}/stok;
            brix_s3_bucket         stok;
            brix_s3_access_key     {ACCESS_KEY};
            brix_s3_secret_key     {SECRET_KEY};
            brix_s3_region         {REGION};
            brix_allow_write       on;
            brix_s3_token          on;
            brix_s3_token_jwks     {JWKS};
            brix_s3_token_issuer   "{ISSUER}";
            brix_s3_token_audience "{AUDIENCE}";
        }

        # --- XrdAcc authorization over a SigV4 principal -------------------
        location /acc/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/acc;
            brix_s3_bucket       acc;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
            brix_authdb_audit    all;
        }

        # --- dashboard, beside the S3 exports ------------------------------
        location /brix {
            brix_dashboard           on;
            brix_dashboard_anonymous on;
            brix_admin_rate_limit    off;  # one client IP for the whole suite
        }
    }
}

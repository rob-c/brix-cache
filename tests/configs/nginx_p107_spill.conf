# Phase-107 C1: the writer's reorder spill, live (test_vfs_writer_spill.py,
# registry lifecycle).
#
# The spill exists for exactly the two drivers whose staged sessions are
# strictly sequential — `http` (sd_http, whole-object PUT) and `remote`
# (sd_remote, s3:// single-PUT/multipart) — so this instance carries a root
# front over each, plus the two postures the C1 contract distinguishes.
# Every front sets `brix_upload_resume off`: with resume staging on, the root
# protocol parks writes in its own identity-keyed partial and the VFS staged
# writer (the subject here) never runs (nginx_root_s3_staged.conf precedent).
#
#   {PORT}             root front, backend http:// — spill armed via
#                      brix_vfs_spill_path.  The success plane: reverse-order
#                      kXR_write lands byte-exact; in-order never spills.
#   {REMOTE_PORT}      the same posture over the s3:// (sd_remote) backend.
#   {CAPPED_PORT}      http front with brix_vfs_spill_max 1m: a 4 MiB
#                      reordered upload must refuse ENOSPC (kXR_NoSpace) and
#                      publish NOTHING — T4 unlinks the scratch and aborts the
#                      staged session.
#   {RO_PORT}          http front with writes disabled: the phase-105 gate
#                      refuses BEFORE the writer exists, so its spill root
#                      must stay empty no matter what a client attempts.
#   {HTTP_ORIGIN_PORT} WebDAV posix origin the http fronts commit to.
#   {S3_PORT}          brix_s3 posix origin (bucket "testbucket") the remote
#                      front commits to.
#
# Every front carries its OWN brix_export and its OWN spill root: both the
# backend registry and the spill registration key on the export's canonical
# root, so a shared root would make one registration answer several listeners.
#
# worker_processes 2 (nginx_root_s3_staged.conf precedent): a front's staged
# commit blocks on its outbound PUT to a co-hosted origin plane; with one
# worker there would be no worker left to accept that inbound connection.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + REMOTE_PORT CAPPED_PORT
#                    RO_PORT HTTP_ORIGIN_PORT S3_PORT.
# Test-provided: BIND_HOST S3_DIR S3_ACCESS_KEY S3_SECRET_KEY
#                HTTP_ORIGIN_ROOT REMOTE_EXPORT HTTP_EXPORT CAPPED_EXPORT
#                RO_EXPORT SPILL_REMOTE SPILL_HTTP SPILL_CAPPED SPILL_RO
#                (every path must exist at config-parse time).
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

thread_pool default threads=2 max_queue=256;

http {
    access_log off;
    client_max_body_size 128m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # The WebDAV origin the http fronts commit to.  No ordering constraint of
    # its own — the fronts' staged sessions are the sequential-only subject.
    server {
        listen {BIND_HOST}:{HTTP_ORIGIN_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{HTTP_ORIGIN_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    # The S3 origin the remote (s3://) front commits to.
    server {
        listen {BIND_HOST}:{S3_PORT};
        location / {
            brix_s3              on;
            brix_storage_backend posix:{S3_DIR};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   {S3_ACCESS_KEY};
            brix_s3_secret_key   {S3_SECRET_KEY};
            brix_s3_region       us-east-1;
            brix_allow_write     on;
        }
    }
}

stream {
    brix_credential s3cred {
        s3_access_key {S3_ACCESS_KEY};
        s3_secret_key {S3_SECRET_KEY};
        s3_region     us-east-1;
    }

    # --- http front, spill armed -------------------------------------------- #
    server {
        listen               {BIND_HOST}:{PORT};
        brix_root            on;
        brix_auth            none;
        brix_export          {HTTP_EXPORT};
        brix_storage_backend http://{BIND_HOST}:{HTTP_ORIGIN_PORT};
        brix_allow_write     on;
        brix_upload_resume   off;
        brix_vfs_spill_path  {SPILL_HTTP};
    }

    # --- remote (s3://) front, spill armed ----------------------------------- #
    server {
        listen                  {BIND_HOST}:{REMOTE_PORT};
        brix_root               on;
        brix_auth               none;
        brix_export             {REMOTE_EXPORT};
        brix_storage_backend    s3://{BIND_HOST}:{S3_PORT}/testbucket;
        brix_storage_credential s3cred;
        brix_allow_write        on;
        brix_upload_resume      off;
        brix_vfs_spill_path     {SPILL_REMOTE};
    }

    # --- http front, spill capped at the directive minimum ------------------- #
    server {
        listen               {BIND_HOST}:{CAPPED_PORT};
        brix_root            on;
        brix_auth            none;
        brix_export          {CAPPED_EXPORT};
        brix_storage_backend http://{BIND_HOST}:{HTTP_ORIGIN_PORT};
        brix_allow_write     on;
        brix_upload_resume   off;
        brix_vfs_spill_path  {SPILL_CAPPED};
        brix_vfs_spill_max   1m;
    }

    # --- http front, read-only: the gate refuses before any spill ------------ #
    server {
        listen               {BIND_HOST}:{RO_PORT};
        brix_root            on;
        brix_auth            none;
        brix_export          {RO_EXPORT};
        brix_storage_backend http://{BIND_HOST}:{HTTP_ORIGIN_PORT};
        brix_allow_write     off;
        brix_upload_resume   off;
        brix_vfs_spill_path  {SPILL_RO};
    }
}

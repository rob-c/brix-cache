# A single cvmfs location with a settable write-grammar block — the parse-tier
# fixture for the audit's "cvmfs x auth/write features" dismissal
# (test_audit15i_plane_pins.py, §D of
# testsuite-combinatorial-coverage-audit-2026-08-15).
#
# The dismissal rests on TWO independent guards, and separating them needs a
# config whose ONLY variable is the write grammar:
#
#   brix_cvmfs_reject_unsupported()  src/protocols/cvmfs/cvmfs_module_build.c:97
#       `brix_allow_write on` inside a cvmfs location is an EMERG at nginx -t.
#   brix_shared_apply_read_only()    src/core/config/shared_conf.h:145
#       `brix_read_only on` force-clears allow_write and logs a NOTICE.
#
# cvmfs may not share a listen port with another brix protocol
# (src/protocols/shared/proto_exclusive.c:300 "one brix protocol per port"), so
# this cannot be an extra location bolted onto the WebDAV parse template — it
# needs its own server.  The backend is a dead port on purpose: nothing ever
# boots here, `nginx -t` only parses and merges.
#
# Launcher-provided by the parse helper: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST CVMFS_KNOBS.
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};
        location /cvmfs/ {
            brix_cvmfs on;
            brix_storage_backend "http://127.0.0.1:1";
{CVMFS_KNOBS}        }
    }
}

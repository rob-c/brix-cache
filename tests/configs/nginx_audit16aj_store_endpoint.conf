# ONE listener and three stream servers for `brix_cache_store_endpoint` — the
# 16th tranche's file 36, and the first subject in the tree that is declared on
# BOTH planes under one name (test_audit16aj_cache_store_endpoint_arms.py).
#
# THE DIRECTIVE, TWICE
#   webdav/module_commands.c:74   NGX_HTTP_MAIN_CONF | NGX_HTTP_SRV_CONF
#                                 | NGX_HTTP_LOC_CONF | NGX_CONF_FLAG
#                                 -> brix_http_set_cache_store_endpoint, a CUSTOM
#                                    setter that writes common.cache_store_endpoint
#                                    on the WebDAV loc-conf AND on the S3 one
#   root/stream/module.c:239      NGX_STREAM_SRV_CONF | NGX_CONF_FLAG
#                                 -> ngx_conf_set_flag_slot, the stock one
#   Both merge with ngx_conf_merge_value(..., 0) out of an NGX_CONF_UNSET init
#   (core/config/shared_conf.h:56, :380-381), so a written `off` is a value that
#   BLOCKS inheritance where a deleted line is a hole that lets it through.
#
# WHAT THE FLAG DOES
#   It is the sole `allow_internal` argument of the reserved-name guard —
#   core/compat/path.c:61 for the HTTP planes, and the three open/stat/statx
#   checks of the root plane (read/open_request.c:205, read/stat.c:316,
#   read/statx.c:232).  With it off, a request that NAMES an internal artifact
#   (fs/path/reserved_names.h: *.cinfo *.xrdcinfo *.meta *.xrdt *.commit,
#   *.xrd-tmp.* *.xrdresume.*) is answered as if the path did not exist.  With it
#   on, the same name is an ordinary object — which is what a cache node writing
#   `brix_cache_meta sidecar` over root:// or https:// needs of its own origin.
#
# WHAT THE CORPUS HAD WRITTEN
#   `on`, once, in one stream server (configs/nginx_mu_sidecar_store.conf:25) and
#   once programmatically (cmdscripts/tier_remote.py:42).  The token `off` appears
#   in no configuration in the tree, on either plane, and the HTTP declaration —
#   three legal scopes, a custom setter, and eleven runtime call sites across
#   WebDAV and S3 — had never been written at all.  This file is the first
#   configuration that renders the custom setter.
#
# WHY VHOSTS AND NOT LISTENERS
#   The HTTP arms need to be compared over THE SAME BYTES: "visible here, absent
#   there" is a claim about one file seen through two configurations, and a
#   WebDAV location maps its URI straight under the storage backend, so two
#   location prefixes are two different files.  Nine `server{}` blocks on one
#   `listen`, selected with a Host: header, put every HTTP arm on `location /`
#   (or on the same `/cas/` bucket) over one export directory.  They cost no
#   ledger port.
#
# THE HTTP ARMS — Host: header selects
#   dav-on.test      location /      brix_cache_store_endpoint on
#   dav-off.test     location /      the literal `off`, written nowhere else
#   dav-abs.test     location /      the line deleted — the control
#   dav-srvon.test   SERVER scope `on`, and three children:
#                      /            writes nothing  -> inherits the server's 1
#                      /optout/     writes `off`    -> the reading an absence
#                                                      cannot express, and the
#                                                      only reason the merge's
#                                                      UNSET/0 distinction exists
#                      /reassert/   writes `on`     -> the redundant restatement
#   dav-srvoff.test  SERVER scope `off` with a bare child.  The custom setter has
#                    never been run with a 0 at server scope anywhere.
#   dav-dup.test     once carried the SAME directive twice in one location,
#                    `off` then `on`: the custom setter wrote the slot itself and
#                    so never ran ngx_conf_set_flag_slot's duplicate check, while
#                    the identical pair in a stream server was refused with "is
#                    duplicate".  The setter now refuses it too, which makes the
#                    pair a hard emerg and this whole file unloadable, so the
#                    measurement moved to the parse tier (§G, §J) against
#                    nginx_audit16nparse.conf.  The vhost keeps the single line
#                    the operator meant, as the ordinary armed arm §G compares to.
#
# THE S3 ARMS — a SECOND listener, and not by choice.  config_merge refuses
#   "brix_webdav and brix_s3 both enabled under listen port N - one brix
#   protocol per port" at load time, so the two planes cannot be vhosts of one
#   `listen` even when no location is shared between them.  All four address
#   bucket `cas` over the same export, so the URI maps to the same path here as
#   on the WebDAV listener.
#   s3-on.test  / s3-off.test / s3-abs.test
#                    the same three arms on the S3 plane.  The setter writes
#                    both loc-confs from one directive; these say whether the
#                    half nothing has ever exercised works.
#   s3-srvon.test    SERVER scope `on`, bucket `cas`, writing nothing in the
#                    location — the dual write has to survive the merge chain,
#                    not just the setter, for this arm to see anything.
#   metrics.test     `location /metrics { brix_metrics on; }` and nothing else.
#                    The S3 plane books its refusal as a diagnostic EVENT and the
#                    counters are process-wide, so one scrape reads every vhost.
#
# THE root:// ARMS — one listener each, because the stream declaration is
# NGX_STREAM_SRV_CONF and a stream server has no locations to fold onto.
#   PORT      `on`   — what nginx_mu_sidecar_store.conf already writes, kept here
#                      so the comparison is inside one process and one export
#   OFF_PORT  `off`  — the never-written token
#   ABS_PORT  the line deleted — the control
#
# ONE EXPORT FOR ALL THIRTEEN FACES (the fourteenth, metrics.test, has no
# export at all).  Every arm addresses {DATA_ROOT}, so a row
# that differs between two faces differs because of the directive: same inode,
# same bytes, same mtime.  The genuine sibling (keep.dat) is the control that
# keeps every "absent" reading from being a claim about the export as a whole.
#
# WRITES ARE ENABLED ON EVERY FACE.  The feature exists so a cache node can
# PERSIST a sidecar and read it back; a read-only export would measure only half
# of it, and the ACCESS-phase write refusal would arrive before the reserved-name
# guard on every mutating verb.
#
# The [warn] advisories at startup are earned: these are anonymous,
# write-enabled exports, which is exactly what brix_shared_security_gate advises
# about.
#
# worker_processes 1 so a PUT on one request and the GET that reads it back are
# always the same worker's.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT OFF_PORT ABS_PORT HTTP_PORT
#                    S3_PORT.
# Test-provided: BIND_HOST ACCESS_KEY SECRET_KEY REGION.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    # ---- WebDAV: the location arm against the merge default --------------- #
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name dav-on.test;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_cache_store_endpoint on;
        }
    }

    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name dav-off.test;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_cache_store_endpoint off;
        }
    }

    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name dav-abs.test;

        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    # ---- WebDAV: server scope `on`, and the three children ---------------- #
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name dav-srvon.test;

        brix_cache_store_endpoint on;

        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        location /optout/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_cache_store_endpoint off;
        }

        location /reassert/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_cache_store_endpoint on;
        }
    }

    # ---- WebDAV: server scope `off` — the setter's 0 at that scope -------- #
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name dav-srvoff.test;

        brix_cache_store_endpoint off;

        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    # ---- WebDAV: where the duplicate USED to live -------------------------- #
    # This location carried `brix_cache_store_endpoint off;` followed by
    # `... on;` — a pair the stream declaration refuses via
    # ngx_conf_set_flag_slot's `if (*fp != NGX_CONF_UNSET) return "is
    # duplicate";` and the http setter accepted, landing on the permissive
    # second line (defect #142).  The http setter now performs the same test, so
    # the pair no longer LOADS and cannot be measured on the wire at all; the
    # refusal is measured at the parse tier instead (§G, §J), against the
    # nginx_audit16nparse.conf scaffold.
    #
    # The face is kept, with the single line the operator meant, so §G still has
    # somewhere to show that a location which once carried the duplicate is an
    # ordinary armed arm once the duplicate is gone.
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        server_name dav-dup.test;

        location / {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_cache_store_endpoint on;
        }
    }

    # ---- S3: the same three arms, one bucket, one export ------------------ #
    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name s3-on.test;

        location /cas/ {
            brix_s3                   on;
            brix_s3_bucket            cas;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_s3_access_key        {ACCESS_KEY};
            brix_s3_secret_key        {SECRET_KEY};
            brix_s3_region            {REGION};
            brix_allow_write          on;
            brix_cache_store_endpoint on;
        }
    }

    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name s3-off.test;

        location /cas/ {
            brix_s3                   on;
            brix_s3_bucket            cas;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_s3_access_key        {ACCESS_KEY};
            brix_s3_secret_key        {SECRET_KEY};
            brix_s3_region            {REGION};
            brix_allow_write          on;
            brix_cache_store_endpoint off;
        }
    }

    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name s3-abs.test;

        location /cas/ {
            brix_s3              on;
            brix_s3_bucket       cas;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_allow_write     on;
        }
    }

    # ---- the exposition face: same listener, no bucket, no credentials ---- #
    # The S3 plane books its reserved-name refusal as a DIAGNOSTIC EVENT, and
    # which event it books is the whole of section E.  The counters live in the
    # process-wide zone, so one scrape sees every vhost above.
    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name metrics.test;

        location /metrics {
            brix_metrics on;
        }
    }

    # ---- S3: the dual write through the merge chain, not the setter ------- #
    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name s3-srvon.test;

        brix_cache_store_endpoint on;

        location /cas/ {
            brix_s3              on;
            brix_s3_bucket       cas;
            brix_storage_backend posix:{DATA_ROOT};
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_allow_write     on;
        }
    }
}

stream {
    # ---- root://: `on` ---------------------------------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        brix_root                 on;
        brix_export               {DATA_ROOT};
        brix_storage_backend      posix:{DATA_ROOT};
        brix_auth                 none;
        brix_allow_write          on;
        brix_cache_store_endpoint on;
    }

    # ---- root://: the never-written token ---------------------------------- #
    server {
        listen {BIND_HOST}:{OFF_PORT};
        brix_root                 on;
        brix_export               {DATA_ROOT};
        brix_storage_backend      posix:{DATA_ROOT};
        brix_auth                 none;
        brix_allow_write          on;
        brix_cache_store_endpoint off;
    }

    # ---- root://: the line deleted ----------------------------------------- #
    server {
        listen {BIND_HOST}:{ABS_PORT};
        brix_root            on;
        brix_export          {DATA_ROOT};
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
    }
}

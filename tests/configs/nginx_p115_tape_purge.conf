# Phase-115 W3.2 tape-buffer purge engine template (test_phase115_tape_purge.py,
# registry lifecycle harness).  Launcher-provided: LOG_DIR PORT DATA_DIR.
# Test-provided: BIND_HOST BACKEND CACHE_DIR QUEUE_PATH CONTROL_DIR PURGE_LINES
# ALLOW_WRITE.  BRIX_FRM_STUB_RECALL_DELAY_MS turns the stub adapter's recall
# asynchronous so the open gate has to park the client (kXR_wait).
# Env-provided: BRIX_CACHE_REAP_FIRST_MS (first purge tick; the engine honours
# the cache reapers' knob so a test never waits the production 5 s).
#
# brix_frm on + brix_frm_control_dir stand up the durable stage-request
# registry: the engine asks it which online copies a live kXR_prepare(stage)
# has pinned before releasing anything.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
env BRIX_CACHE_REAP_FIRST_MS;
env BRIX_FRM_STUB_RECALL_DELAY_MS;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_export {DATA_DIR};
        brix_auth none;
        brix_allow_write {ALLOW_WRITE};
        brix_storage_backend {BACKEND};
        brix_cache_store posix:{CACHE_DIR};
        brix_cache_export /;
        brix_frm on;
        brix_frm_queue_path {QUEUE_PATH};
        brix_frm_control_dir {CONTROL_DIR};
        brix_frm_stage_wait 1;
        {PURGE_LINES}
    }
}

# brix_gsi_legacy_proxy at VALUE granularity (test_gsi_legacy_proxy.py).
#
# A legacy (GT2, pre-RFC 3820) proxy is a certificate whose subject is its
# issuer's subject plus exactly one CN of `proxy`, `limited proxy` or an
# all-digit value, with NO proxyCertInfo extension.  The directive decides what
# the GSI chain verifier does with one:
#
#   off        RFC 3820 only — every GT2 proxy fails the chain walk
#   on         (default) full AND limited GT2 proxies are accepted
#   full-only  full GT2 proxies are accepted; a chain holding a GT2
#              "limited proxy" is refused after the walk
#
# The token is a `server {}`-level switch on the stream plane and a merged
# location value on the http plane, and its whole observable is a login
# verdict — so every arm is a listener on ONE instance over ONE trust anchor,
# four on root:// and four on davs://:
#
#   {PORT}           stream  brix_gsi_legacy_proxy off
#   {ON_PORT}        stream  brix_gsi_legacy_proxy on
#   {FULL_PORT}      stream  brix_gsi_legacy_proxy full-only
#   {DEF_PORT}       stream  the directive ABSENT (pins the merge default)
#   {HTTP_PORT}      http    brix_gsi_legacy_proxy off
#   {HTTP_ON_PORT}   http    brix_gsi_legacy_proxy on
#   {HTTP_FULL_PORT} http    brix_gsi_legacy_proxy full-only
#   {HTTP_DEF_PORT}  http    the directive ABSENT
#
# The http arms carry the token at `server` level so the location inherits it
# through the shared-conf merge; the parse-tier file covers the other levels.
# No brix_crl and no signing policy file anywhere, so no second reason can sit
# in front of a refusal; brix_allow_write is off because every assertion is a
# login verdict on a read.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + the seven extra ports above.
# Test-provided: CERT KEY (host credential), CA (hashed directory, the stream
# anchor), BUNDLE (the same anchor as one file: the http plane's brix_trusted_ca
# and ssl_client_certificate take a regular file), TMP_DIR.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- off: RFC 3820 proxies only ------------------------------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate      {CERT};
        brix_certificate_key  {KEY};
        brix_trusted_ca       {CA};
        brix_gsi_legacy_proxy off;
    }

    # --- on: full and limited GT2 proxies are accepted -----------------------
    server {
        listen {ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate      {CERT};
        brix_certificate_key  {KEY};
        brix_trusted_ca       {CA};
        brix_gsi_legacy_proxy on;
    }

    # --- full-only: a GT2 "limited proxy" anywhere in the chain is refused ---
    server {
        listen {FULL_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate      {CERT};
        brix_certificate_key  {KEY};
        brix_trusted_ca       {CA};
        brix_gsi_legacy_proxy full-only;
    }

    # --- the directive absent: whatever the merge default is -----------------
    server {
        listen {DEF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate      {CERT};
        brix_certificate_key  {KEY};
        brix_trusted_ca       {CA};
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    # --- off -----------------------------------------------------------------
    server {
        listen {HTTP_PORT} ssl;
        server_name gt2-off.localhost;
        ssl_certificate         {CERT};
        ssl_certificate_key     {KEY};
        ssl_client_certificate  {BUNDLE};
        ssl_verify_client       optional_no_ca;
        ssl_verify_depth        10;
        brix_webdav_proxy_certs on;
        brix_gsi_legacy_proxy   off;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     required;
            brix_trusted_ca      {BUNDLE};
        }
    }

    # --- on ------------------------------------------------------------------
    server {
        listen {HTTP_ON_PORT} ssl;
        server_name gt2-on.localhost;
        ssl_certificate         {CERT};
        ssl_certificate_key     {KEY};
        ssl_client_certificate  {BUNDLE};
        ssl_verify_client       optional_no_ca;
        ssl_verify_depth        10;
        brix_webdav_proxy_certs on;
        brix_gsi_legacy_proxy   on;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     required;
            brix_trusted_ca      {BUNDLE};
        }
    }

    # --- full-only -----------------------------------------------------------
    server {
        listen {HTTP_FULL_PORT} ssl;
        server_name gt2-full.localhost;
        ssl_certificate         {CERT};
        ssl_certificate_key     {KEY};
        ssl_client_certificate  {BUNDLE};
        ssl_verify_client       optional_no_ca;
        ssl_verify_depth        10;
        brix_webdav_proxy_certs on;
        brix_gsi_legacy_proxy   full-only;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     required;
            brix_trusted_ca      {BUNDLE};
        }
    }

    # --- the directive absent ------------------------------------------------
    server {
        listen {HTTP_DEF_PORT} ssl;
        server_name gt2-def.localhost;
        ssl_certificate         {CERT};
        ssl_certificate_key     {KEY};
        ssl_client_certificate  {BUNDLE};
        ssl_verify_client       optional_no_ca;
        ssl_verify_depth        10;
        brix_webdav_proxy_certs on;
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     required;
            brix_trusted_ca      {BUNDLE};
        }
    }
}

# The CMS timing plane — §Method step 2 sharpened
# (test_audit15o_cms_windows.py).
#
# Four more of the thirteen parse-only survivors.  Three of them are windows
# whose ONLY observable is elapsed time, and the fourth is a role flag:
#
#   brix_cms_locate_timeout · brix_cms_state_fanout
#   brix_cms_fanout_window  · brix_metadata_only
#
# A window cannot be read off one server: "the locate answered after 800ms"
# could be the directive or could be the host.  So the file ships TWO managers
# that differ in nothing but these three values, and every timing claim is a
# claim about the DIFFERENCE between them.  {PORT} is the fast manager,
# {SLOW_PORT} the slow one:
#
#                          {PORT}      {SLOW_PORT}    merge default
#   brix_cms_locate_timeout   800ms        3s            5s
#   brix_cms_fanout_window    300ms        2500ms        500ms
#   brix_cms_state_fanout     2            6             8
#
# brix_cms_locate_window is held IDENTICAL (600ms) on both: it is already
# covered elsewhere, and holding it constant is what makes the state-fanout
# count the only variable in the fan-out probe test.
#
# HOW EACH DIRECTIVE BECOMES VISIBLE
#   locate_timeout   A locate for a path no registered node exports walks the
#                    whole leg chain (locate_manager.c:433) down to
#                    locate_try_cms_parent(), which parks the client and arms
#                    ngx_add_timer(c->read, cms.locate_timeout).  The parent
#                    here is this same nginx's CMS face, which never answers a
#                    kYR_locate at all (DEFECT CANDIDATE #49 in the test
#                    module), so the park always runs to term: the latency to
#                    the kXR_wait 5 (recv.c:60) IS the directive.
#   state_fanout     A locate for a path the Python data nodes DO export takes
#                    the earlier W3 leg, which sends kYR_state to at most
#                    caps.cms_state_fanout eligible nodes (locate_manager.c:158).
#                    The nodes are Python and count their own frames, so the
#                    cap is directly countable — 2 of 4 here, 4 of 4 there.
#   fanout_window    A kXR_rm on a path with >=2 registered holders is
#                    forwarded to every holder and the client parked for
#                    cms.fanout_window (fanout.c:304).  The node executor is
#                    silent on success, so "no kYR_error before the deadline"
#                    IS the success signal — with silent nodes the kXR_ok
#                    arrives exactly one window later.
#   metadata_only    {META_PORT}: kXR_attrMeta in the kXR_protocol reply flags
#                    (protocol.c:84) and kXR_Unsupported on kXR_open
#                    (open_request.c:69) while the namespace still answers.
#
# The two managers register with the CMS face under brix_cms_paths /elsewhere
# so their own registry rows can never be mistaken for a data holder of /fan
# or of /lost — brix_cms_fanout_mutation() refuses unless the eligible node
# count equals brix_srv_count_matching(), and a self-registered manager under
# "/" would break that equality on every test.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ledger extras SLOW_PORT CMS_PORT
# META_PORT.  Session-provided: BIND_HOST.  There is no http block, so no
# temp-path directives are needed.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # --- the registration face -------------------------------------------- #
    # Both managers and every Python data node log in here.  brix_cms_server
    # replaces the stream handler for its whole server block, so it needs a
    # port of its own; one worker means one shared node table, which is what
    # lets a single set of nodes serve both managers.
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server          on;
        brix_cms_server_interval 1;
    }

    # --- the fast manager -------------------------------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port     {PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_storage_backend posix:{DATA_ROOT};

        brix_manager_mode    on;
        brix_cms_manager     {BIND_HOST}:{CMS_PORT};
        brix_cms_paths       /elsewhere;
        brix_cms_interval    1;

        brix_cms_locate_window  600ms;    # held constant across both managers
        brix_cms_locate_timeout 800ms;
        brix_cms_state_fanout   2;
        brix_cms_fanout         on;
        brix_cms_fanout_window  300ms;
    }

    # --- the slow manager: the same block with three values multiplied ----- #
    server {
        listen {BIND_HOST}:{SLOW_PORT};
        brix_listen_port     {SLOW_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_storage_backend posix:{DATA_ROOT};

        brix_manager_mode    on;
        brix_cms_manager     {BIND_HOST}:{CMS_PORT};
        brix_cms_paths       /elsewhere;
        brix_cms_interval    1;

        brix_cms_locate_window  600ms;
        brix_cms_locate_timeout 3s;
        # 6 is deliberately larger than the number of nodes that will ever be
        # registered: a node filtered out of the probe here was filtered by
        # brix_srv_paths_cover(), never by the cap running out.
        brix_cms_state_fanout   6;
        brix_cms_fanout         on;
        brix_cms_fanout_window  2500ms;
    }

    # --- the metadata-only server ------------------------------------------ #
    # No manager_map and no manager_mode, so caps.metadata_only reaches the
    # open_request.c:69 refusal instead of being routed away by a redirect.
    server {
        listen {BIND_HOST}:{META_PORT};
        brix_listen_port     {META_PORT};
        brix_root            on;
        brix_auth            none;
        brix_allow_write     on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_metadata_only   on;
    }
}

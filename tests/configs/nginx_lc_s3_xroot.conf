# S3 front over a native root:// origin — the WRITE half of the S3 x xroot cell
# (test_s3_xroot_mutations.py).
#
# The pairing was read-only everywhere it appeared: an S3 GET proved sd_xroot
# could fetch, while PUT and DELETE — the sd_xroot create-open/write/close and
# unlink slots reached from the S3 handler — were configured and never driven.
#
#   {PORT}     native root:// origin (stream), anonymous, read-write. This is
#              the "xrootd" in "S3 x xroot"; it owns {DATA_ROOT} so a test can
#              read the truth off disk instead of back through the front.
#   {S3_PORT}  S3 REST front whose brix_storage_backend is that origin. Its own
#              brix_export is a SEPARATE empty tree, so any object that shows up
#              in it is a write that never left the front.
#
# Anonymous on both legs on purpose: a remote-backend write needs backend-leg
# auth (a delegated proxy or a service credential) and that is a different cell
# — this one is about the mutation path itself.
#
# worker_processes 2: the front's backend leg dials the origin inside this same
# nginx, and a single worker would wait on itself.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT + ledger extras.
# Session-provided: BIND_HOST.  Test-provided: EXPORT_ROOT.
daemon on;
worker_processes 2;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    client_body_temp_path {TMP_DIR};
    client_max_body_size 64m;

    server {
        listen {BIND_HOST}:{S3_PORT};
        server_name localhost;
        location / {
            brix_s3              on;
            brix_export          {EXPORT_ROOT};
            brix_storage_backend root://{BIND_HOST}:{PORT};
            brix_s3_bucket       xrdbucket;
            brix_s3_region       us-east-1;
            brix_allow_write     on;
            brix_s3_max_keys     1000;
        }
    }
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root        on;
        brix_auth        none;
        brix_export      {DATA_ROOT};
        brix_allow_write on;
    }
}

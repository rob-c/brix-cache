# Object-store backend leg of the local GridFTP interop matrix, booted as its OWN
# nginx instance by the runner (tests/cmdscripts/gridftp_interop_local.py)
# alongside the main gateway (nginx_gridftp_interop.conf).  It is separate because
# the s3 leg needs TWO workers (see below) while pblock in the main config needs
# exactly ONE (its block catalog is per-worker) — an irreconcilable worker count.
#
# One nginx, two planes (mirrors nginx_gridftp_s3.conf, cluster-free):
#   http{}   — an embedded brix_s3 endpoint over a posix root, the object store
#              the gateway's s3:// backend talks to (bucket testbucket).
#   stream{} — a gsiftp control channel whose storage backend IS that origin.
#              STOR/RETR/verify travel VFS -> sd_remote -> SigV4 PUT/GET against
#              the http plane above, so the reference client (globus-url-copy)
#              proves the object-store write/read path over gsiftp with no
#              external MinIO/radosgw cluster.
#
# TWO workers, deliberately (as in nginx_gridftp_s3.conf): the GridFTP gateway
# handler is synchronous and the s3 leg's outbound SigV4 PUT/GET to the co-hosted
# brix_s3 origin is a blocking request; a single worker parked in the gateway
# would have nobody left to accept that inbound S3 connection — a self-deadlock.
#
# Placeholders substituted by the runner:
#   {S3_GSIFTP_PORT} GSI control channel   {S3_ORIGIN_PORT} embedded brix_s3 listener
#   {S3_EXPORT}   gateway staging export   {S3_DIR}      embedded brix_s3 object root
#   {TMP_DIR}     http body/proxy temp     {S3_ACCESS_KEY}/{S3_SECRET_KEY} SigV4 keys
#   {LOG_DIR}     error log + pid          {BIND_HOST}   listen address
#   {SERVER_CERT}/{SERVER_KEY}/{CA_DIR}    PKI
worker_processes 2;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/sct;
    server {
        listen {BIND_HOST}:{S3_ORIGIN_PORT};
        client_max_body_size 128m;
        location / {
            brix_s3 on;
            brix_storage_backend posix:{S3_DIR};
            brix_s3_bucket testbucket;
            brix_s3_access_key {S3_ACCESS_KEY};
            brix_s3_secret_key {S3_SECRET_KEY};
            brix_s3_region us-east-1;
            brix_allow_write on;
        }
    }
}
stream {
    brix_credential s3cred {
        s3_access_key {S3_ACCESS_KEY};
        s3_secret_key {S3_SECRET_KEY};
        s3_region     us-east-1;
    }
    # Object-store backend leg — export routes through the embedded brix_s3 origin.
    server {
        listen {BIND_HOST}:{S3_GSIFTP_PORT};
        brix_gridftp on;
        brix_export             {S3_EXPORT};
        brix_storage_backend    s3://{BIND_HOST}:{S3_ORIGIN_PORT}/testbucket;
        brix_storage_credential s3cred;
        brix_allow_write        on;
        brix_verify_write       on;
        brix_gridftp_gsi                on;
        brix_certificate        {SERVER_CERT};
        brix_certificate_key    {SERVER_KEY};
        brix_trusted_ca         {CA_DIR};
    }
}

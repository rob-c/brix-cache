worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log debug;
pid       {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

stream {
    # Deliberately no CMS listener: this redirector is a private empty
    # registry used by test_redirector_no_server.py and must have nowhere to
    # receive registrations from the session fleet.
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_manager_mode on;
    }
}

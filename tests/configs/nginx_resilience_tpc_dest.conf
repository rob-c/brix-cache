# A native root:// TPC DESTINATION for the resilience fault sweep
# (tests/resilience/servers.py, NginxTpcDest).
#
# The whole point is where the fault proxy sits: in a native third-party copy the
# destination dials the source, so pointing the client's `--tpc only` source URL
# at a proxy puts the damage on the DESTINATION->SOURCE pull leg — a leg with no
# client on it at all.  Nothing else in tests/resilience/ can reach it, and it is
# the leg where a truncated pull would otherwise be committed as a complete file.
#
# `brix_tpc_allow_local on` is required: the proxy listens on 127.0.0.1 and the
# Layer-1 SSRF preflight refuses loopback origination by default.  The Layer-2
# host allowlist (brix_tpc_source_allow) is left unconfigured, which is a no-op
# by design — this module tests transport damage, not naming policy.
#
# Launcher-provided: {PORT} {LOG_DIR} {DATA_ROOT}.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2 max_queue=256;
events { worker_connections 1024; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_access_log {LOG_DIR}/brix_access_tpc_dest.log;
    }
}

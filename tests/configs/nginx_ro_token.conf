# phase-105 W5 / §9.3 — endpoint read-only versus a genuine write-scoped bearer.
#
# The point of a separate template is `brix_webdav_auth required`: the shared
# rate-limit template pins it to `none`, and against an endpoint that never
# validates a token, "the write-scoped token was refused" is not evidence of
# anything.  Here the bearer is really parsed, really trusted, and really
# carries `storage.modify:/` — and the write is still refused, because the
# endpoint policy is decided before scope is ever consulted (INVARIANT 3).
#
# The knobs slot below carries the read_only/allow_write pair under test, so the
# same template renders both the refusing endpoint and its writable control.
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     required;
            brix_token_jwks      {JWKS};
            brix_token_issuer    "{ISSUER}";
            brix_token_audience  "{AUD}";
{RO_KNOBS}        }
    }
}

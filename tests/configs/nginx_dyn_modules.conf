# Dynamic-module (load_module) conformance — template for
# test_brix_dynamic_modules.py (phase-106 W7).
#
# Test-provided: STREAM_SO FILTER_SO PREFIX HTTP_PORT STREAM_PORT DATA_DIR
#                HTTP_LOG_FORMAT.
#
# Parse-only (nginx -t): proves the dlopen'd objects provide their directives
# AND the $brix_* variable surface on both planes — i.e. that variable
# registration in `preconfiguration` survives the dynamic-build call order.
load_module {STREAM_SO};
load_module {FILTER_SO};
worker_processes 1;
pid {PREFIX}/logs/nginx.pid;
error_log {PREFIX}/logs/error.log info;
events { worker_connections 64; }
http {
    {HTTP_LOG_FORMAT}
    access_log {PREFIX}/logs/dyn.log dyn;
    client_body_temp_path {PREFIX}/logs;
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        location / {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth none;
        }
    }
}
stream {
    log_format dynstream 'proto=$brix_protocol auth=$brix_session_auth '
                         'out=$brix_session_bytes_out';
    access_log {PREFIX}/logs/dynstream.log dynstream;
    server {
        listen {BIND_HOST}:{STREAM_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
    }
}

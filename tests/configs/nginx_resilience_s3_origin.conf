# A root:// front whose STORAGE BACKEND is a remote s3:// origin, for the
# resilience tests that inject faults on the server's own upstream leg
# (tests/resilience/servers.py, NginxS3OriginFront).
#
# The s3:// sibling of nginx_resilience_http_origin.conf, and it exists because
# the two drivers do not share a fetch path: sd_http issues a plain ranged GET,
# sd_s3 signs a request, parses an S3 error document and has its own idea of
# what a short body means.  A contract measured on one says nothing about the
# other, which is why the coverage audit listed the s3:// origin separately.
#
# The fault proxy is spliced in front of the origin and {ORIGIN_PORT} points at
# the proxy, so the client's own connection stays pristine and only the backend
# fetch is damaged — the leg the client has no way to observe.
#
# `brix_stage off` puts sd_s3 in as the TOP driver: a staged tier would satisfy
# the second read from the local stage copy and the fault would only ever be
# reachable on the first fetch.  With staging off every read crosses the wire.
#
# The origin runs anonymous (no SigV4), so no `brix_storage_credential` is
# configured here and the outbound leg is unsigned — deliberate, because the
# subject under test is what the driver does with damaged BYTES, and a signing
# failure would fail the fetch before a single one arrived.
#
# Launcher-provided: {PORT} {LOG_DIR} {DATA_ROOT}.
# Test-provided via template_values: {ORIGIN_PORT} (the fault proxy's listen),
#                                    {BUCKET} (the origin's bucket name).
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 1024; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_export {DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_stage off;
        brix_storage_backend s3://127.0.0.1:{ORIGIN_PORT}/{BUCKET};
        brix_access_log {LOG_DIR}/brix_access_s3_origin.log;
    }
}

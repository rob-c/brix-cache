# The two CSI integrity flag arms of root/stream/directives_auth.h at VALUE
# granularity (audit tranche 16, file 18; test_audit16r_csi_flag_arms.py).
# FOUR root:// servers over ONE export in ONE process, differing only in which
# CSI block each carries.
#
# THE SUBJECTS — both NGX_STREAM_SRV_CONF | NGX_CONF_FLAG, both
# ngx_conf_set_flag_slot at NGX_STREAM_SRV_CONF_OFFSET:
#
#   brix_csi_require    directives_auth.h:331   csi.require
#   brix_csi_trust_fs   directives_auth.h:338   csi.trust_fs
#
# The corpus writes `on` for each of them and `off` for neither, which is the
# gap this file closes.  Both are read out of the per-server conf on every
# kXR_open (read/open_resolved_file_finalize.c:70-88), so four acceptors in one
# worker really are four arms — the file does not have to presuppose that, it
# measures it.
#
# WHY ONE EXPORT AND FOUR SERVERS
#   The subject is not "does the engine run"; it is what a given acceptor does
#   with a file whose at-rest integrity record is in a KNOWN state — tagged and
#   intact, tagged and stale, or absent altogether.  That state lives on disk,
#   so the four arms must look at the SAME bytes: one acceptor tags a file, the
#   test damages the record or the data underneath, and the other three are
#   asked to read it.  Four exports would make every difference a difference of
#   files.
#
# WHY brix_auth none
#   Authorization is not the subject here (that was file 17) and an identity
#   would only add a way for a read to fail that has nothing to do with CSI.
#   brix_allow_write is on so the tagging acceptor can create the record the
#   other three are asked about — writes are what fold the CRCs
#   (fs/backend/csi_tagstore.h, brix_csi_flush at close).
#
# WHY brix_csi_block IS PINNED IN EVERY BLOCK RATHER THAN LEFT TO THE MERGE
#   The granule sizes new records and existing records keep their own; a file
#   tagged at one granule and read at another is a different measurement from
#   the one the flags decide.  Pinning it makes the granule a constant of the
#   file instead of a second variable.
#
# SLOTS, named here WITHOUT their braces because the renderer replaces every
# occurrence, comments included, and a multi-line CSI block spliced into a
# comment turns the tail of that comment into configuration:
#
#   A_CSI  the whole CSI block of the first  server
#   B_CSI  the whole CSI block of the second server
#   C_CSI  the whole CSI block of the third  server
#   D_CSI  the whole CSI block of the fourth server
#
#   A test writes whichever arms its reading needs into whichever slots, and
#   leaves the rest as a bare `brix_csi on;` (or empty, for an acceptor whose
#   engine must not run at all).  The blocks are whole rather than a single
#   CSI_EXTRA line because `brix_csi off` — the master switch these two flags
#   hang off — is itself one of the states being varied.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST B_PORT C_PORT D_PORT A_CSI B_CSI C_CSI D_CSI.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 128; }

stream {
    # ---- A: the writer, and the arm under test --------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_upload_resume   off;
        {A_CSI}
    }

    # ---- B: the second arm ----------------------------------------------- #
    server {
        listen {BIND_HOST}:{B_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_upload_resume   off;
        {B_CSI}
    }

    # ---- C: the third arm ------------------------------------------------- #
    server {
        listen {BIND_HOST}:{C_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_upload_resume   off;
        {C_CSI}
    }

    # ---- D: the control that writes no arm at all ------------------------- #
    server {
        listen {BIND_HOST}:{D_PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_allow_write     on;
        brix_upload_resume   off;
        {D_CSI}
    }
}

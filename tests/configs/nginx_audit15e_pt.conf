# Cache passthrough co-resident with the stage tier and with read_only
# (test_audit15e_passthrough_crosses.py, registry lifecycle) — audit §B2.14:
# `brix_cache_passthrough` was only ever paired with a lone cache tier
# (test_cache_passthrough_planes.py); never with a write-through stage tier
# in the same location, and never on a read-only export — though passthrough
# is a pure read path and must compose with both.
#
#   /ptstage/ cache tier + passthrough + write-through sync-flush stage —
#             the full hybrid: small reads are admitted+cached, mid reads
#             are passthrough-served without a spool copy, huge reads are
#             refused, and writes stage through to the origin.
#   /ptro/    cache tier + passthrough with allow_write OFF — the read path
#             must be unimpaired; every mutation must 403.
#
# brix_cache_max_object is deliberately tiny and brix_cache_passthrough_max
# generous (same geometry as nginx_lc_cache_passthrough.conf), so a mid-sized
# object is declined by admission yet eligible for passthrough.
#
# Every location carries its OWN brix_export: tiers are registered in the VFS
# backend registry keyed by the canonical export root.
#
# worker_processes 2: the front's fills/flushes target the origin inside this
# same nginx; a single worker would deadlock on itself.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + ORIGIN_PORT extra.
# Test-provided: BIND_HOST ORIGIN_ROOT EXPORT_ROOT CACHE_ROOT STAGE_ROOT
#                MAX_OBJECT PT_MAX.
daemon on;
worker_processes 2;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # The origin. No tier of its own — it IS the source of truth.
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{ORIGIN_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }

    server {
        listen {BIND_HOST}:{PORT};

        location = / { return 204; }

        location /ptstage/ {
            brix_webdav                on;
            brix_storage_backend       http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth           none;
            brix_allow_write           on;
            brix_export                {EXPORT_ROOT}/ptstage;
            brix_cache_store           posix:{CACHE_ROOT}/ptstage;
            brix_cache_max_object      {MAX_OBJECT};
            brix_cache_passthrough     on;
            brix_cache_passthrough_max {PT_MAX};
            brix_stage                 on;
            brix_stage_store           posix:{STAGE_ROOT}/ptstage;
            brix_stage_flush           sync;
        }

        location /ptro/ {
            brix_webdav                on;
            brix_storage_backend       http://{BIND_HOST}:{ORIGIN_PORT};
            brix_webdav_auth           none;
            brix_allow_write           off;
            brix_export                {EXPORT_ROOT}/ptro;
            brix_cache_store           posix:{CACHE_ROOT}/ptro;
            brix_cache_max_object      {MAX_OBJECT};
            brix_cache_passthrough     on;
            brix_cache_passthrough_max {PT_MAX};
        }
    }
}

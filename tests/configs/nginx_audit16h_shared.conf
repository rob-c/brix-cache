# The six shared-http flags at VALUE granularity (audit tranche 16, file 8;
# test_audit16h_shared_http_flags.py).  ONE listener, FIVE server_name vhosts,
# twenty-two locations, one shared brix access log, and one http:// origin that
# lies on read-back.
#
# WHY VHOSTS AND NOT LISTENERS
#   All six are BRIX_HTTP_ALL_CONF (http_common.c:61, entries at :230-317), i.e.
#   legal in http{}, server{} and location{} alike, so half of what this file
#   measures is INHERITANCE: what a child location can and cannot take back from
#   a value its server wrote.  A server-level arm therefore needs a whole
#   server{}, and the cheapest server{} is another `server_name` on the same
#   listen — selected with a Host: header, costing no extra ledger port.  Every
#   vhost carries the same backend and the same seeded tree, so a verdict that
#   differs between two of them is the flag and nothing else.
#
# WHY THE ACCESS LOG IS AT http{} LEVEL
#   §E needs one file every arm writes into, so that a record can be attributed
#   by the path it names rather than by which log it landed in — and writing it
#   once at http{} level is also the live proof that the str-slot reaches a
#   location three scopes down (shared_conf.h:363 + BRIX_ADOPT_STR(access_log)).
#   /al-off/ then writes the never-configured `off` sentinel over it.
#
# THE ARMS
#
#   default vhost (Host: localhost) — no server-level flag; every arm here is a
#   location-level value, and the arms that write nothing are the merge default:
#     /rw/          brix_allow_write on                      (writable control)
#     /ro-on/       + brix_read_only on
#     /ro-off/      + brix_read_only off
#     /ro-bare/     brix_read_only off and NO brix_allow_write — `off` is not a
#                   write grant, which is the security-negative of §A
#     /vw-on/       http:// origin + brix_verify_write on
#     /vw-off/      http:// origin + brix_verify_write off
#     /vw-absent/   http:// origin, flag unwritten
#     /cz-on/       brix_compress on     /cz-off/  off     /cz-absent/  unwritten
#     /sl-on/       brix_session_log on  /sl-off/  off     /sl-absent/  unwritten
#     /al-off/      brix_access_log off + brix_session_log on
#
#   Host: writable.test — server-level brix_allow_write on, nothing else:
#     /wi-inherit/  the control that says a server-level write grant DOES reach a
#                   child location, which is what makes the next vhost's verdict
#                   a finding rather than a mundane missing grant.
#
#   Host: readonly.test — server-level brix_read_only on AND brix_allow_write on:
#     /ri-inherit/  nothing written        -> the inherited lock holds, 403
#     /ri-off/      brix_read_only off     -> writes SUCCEED (201/204), because the
#                   server's allow_write is adopted into the child before
#                   brix_shared_apply_read_only runs for that child and finds
#                   read_only 0.  DEFECT #78 is what nobody is told about it: the
#                   config-time NOTICE still says the export rejects every write.
#     /ri-offaw/    brix_read_only off + brix_allow_write on -> the same 201/204,
#                   restated explicitly, which is what an operator would have to
#                   write if the inheritance above were the documented behaviour
#
#   Host: zip.test — server-level brix_compress on:
#     /zi-inherit/  nothing written        /zi-off/  brix_compress off
#
#   Host: quiet.test — server-level brix_session_log off:
#     /qi-inherit/  nothing written        /qi-on/   brix_session_log on
#
# WHY /vw-*/ CARRY brix_stage off
#   A writable whole-object http:// backend with no stage tier is given a
#   brix-managed store under /tmp by runtime_server_backend.c:256-267, and the
#   read-back then comes off local disk — which hides the origin's lie, the whole
#   subject of §C.  `brix_stage off` makes the gateway ask the origin.
#
# The [warn] advisories at startup are earned by /rw/ and the ro-*/ri-*/vw-* and
# wi-* arms: an anonymous WebDAV export that permits writes is exactly the
# insecure configuration brix_strict_security refuses, and §B pins that refusal
# at parse time in a scaffold of its own rather than here — this instance has to
# START.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST ORIGIN.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    # The instrument of §E, written once at the outermost of the three legal
    # scopes.  Every vhost below inherits it; /al-off/ overrides it with the
    # `off` sentinel.
    brix_access_log {LOG_DIR}/brix_access.log;

    # ---- the default vhost: every location-level arm ---------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location /rw/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }

        location /ro-on/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_read_only       on;
        }

        location /ro-off/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_read_only       off;
        }

        # `off` written where no write was ever granted: the value must not be
        # read as permission.
        location /ro-bare/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_read_only       off;
        }

        location /vw-on/ {
            brix_webdav          on;
            brix_storage_backend http://{ORIGIN};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_stage           off;
            brix_verify_write    on;
        }

        location /vw-off/ {
            brix_webdav          on;
            brix_storage_backend http://{ORIGIN};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_stage           off;
            brix_verify_write    off;
        }

        location /vw-absent/ {
            brix_webdav          on;
            brix_storage_backend http://{ORIGIN};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_stage           off;
        }

        location /cz-on/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_compress        on;
        }

        location /cz-off/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_compress        off;
        }

        location /cz-absent/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
        }

        location /sl-on/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_session_log     on;
        }

        location /sl-off/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_session_log     off;
        }

        location /sl-absent/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
        }

        # The str-slot sentinel: session logging asked for, and no file to put it
        # in.  `off` here is a path that is never opened, not a file named "off".
        location /al-off/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_access_log      off;
            brix_session_log     on;
        }
    }

    # ---- server-level write grant, no read_only: the inheritance control --- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name writable.test;
        brix_allow_write on;

        location /wi-inherit/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
        }
    }

    # ---- server-level read_only ON over a server-level write grant --------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name readonly.test;
        brix_allow_write on;
        brix_read_only   on;

        location /ri-inherit/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
        }

        location /ri-off/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_read_only       off;
        }

        location /ri-offaw/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_read_only       off;
            brix_allow_write     on;
        }
    }

    # ---- server-level compress ON ------------------------------------------ #
    server {
        listen {BIND_HOST}:{PORT};
        server_name zip.test;
        brix_compress on;

        location /zi-inherit/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
        }

        location /zi-off/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_compress        off;
        }
    }

    # ---- server-level session_log OFF -------------------------------------- #
    server {
        listen {BIND_HOST}:{PORT};
        server_name quiet.test;
        brix_session_log off;

        location /qi-inherit/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
        }

        location /qi-on/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
            brix_session_log     on;
        }
    }
}

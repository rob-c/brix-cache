# host-authenticated root:// server WITH brix_authdb, for
# test_authdb_mechanism_scope.py.  Launcher-provided: LOG_DIR PORT.
# Test-provided: BIND_HOST DATA_DIR ALLOWLIST AUTHDB.
#
# brix_host_allow is the authentication gate (peer reverse-DNS name); the
# authdb is the authorization gate on top of it.  The resolved peer name is
# login.dn, so u-rules match the hostname while p-rules match the peer address.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth host;
        brix_host_allow {ALLOWLIST};
        brix_allow_write on;
        brix_authdb {AUTHDB};
    }
}

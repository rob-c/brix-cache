# The io_uring disk-I/O backend under storage tiers
# (test_audit15e_uring_tiers.py, registry lifecycle) — audit §B2.13:
# `brix_io_uring on` only ever appeared over a bare posix export
# (nginx_lc_uring.conf); never under a cache spool serve or the phase-70
# whole-object staged writer, though both route their disk I/O through the
# same ring.  io_uring is stream-plane only, so both crosses are stream
# servers:
#
#   {PORT}       root:// cache front over the http origin — read-through
#                fills land in the posix spool and repeat reads are served
#                FROM that spool through the ring.  Objects larger than
#                brix_cache_max_object take the store-then-serve
#                passthrough path (still ring I/O, no durable spool copy),
#                which is the io_uring x passthrough half of §B2.13.  No
#                allow_write: the front doubles as the fail-closed write
#                negative.
#   {STAGE_PORT} root:// staged writer over the same origin — an http://
#                backend advertises no RANDOM_WRITE, so a WRITE open stages
#                whole-object into brix_stage_dir and the close commits one
#                PUT.  The staged appends and the commit read-back are ring
#                I/O.
#   {ORIGIN_PORT} plain WebDAV posix origin — the source of truth.
#
# `brix_io_uring on` fail-fasts at boot if the kernel probe ladder rejects
# the ring, so a green boot proves the ring is live; the thread pool stays
# configured (fallback tier + the CRC32c hop of the hybrid uring-pgread).
#
# worker_processes 2: both stream fronts fetch from / commit to the origin
# inside this same nginx; a single worker would deadlock on itself.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + STAGE_PORT ORIGIN_PORT.
# Test-provided: BIND_HOST ORIGIN_ROOT EXPORT_ROOT CACHE_ROOT SPOOL_DIR.
daemon on;
worker_processes 2;
thread_pool audit15e_uring_pool threads=2 max_queue=1024;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    # The origin. No tier or ring of its own — it IS the source of truth.
    server {
        listen {BIND_HOST}:{ORIGIN_PORT};
        location / {
            brix_webdav          on;
            brix_storage_backend posix:{ORIGIN_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
        }
    }
}

stream {
    # io_uring x cache spool serve (read-only front).
    server {
        listen {BIND_HOST}:{PORT};
        brix_root                 on;
        brix_auth                 none;
        brix_storage_backend      http://{BIND_HOST}:{ORIGIN_PORT};
        brix_export               {EXPORT_ROOT}/cf;
        brix_cache_store          posix:{CACHE_ROOT};
        brix_cache_state_root     {CACHE_ROOT};
        brix_cache_max_object     16384;    # 9000-byte fills still cache
        brix_cache_passthrough    on;
        brix_cache_passthrough_max 1m;
        brix_thread_pool          audit15e_uring_pool;
        brix_io_uring             on;
        brix_io_uring_queue_depth 64;
    }

    # io_uring x whole-object staged writer.
    server {
        listen {BIND_HOST}:{STAGE_PORT};
        brix_root                 on;
        brix_auth                 none;
        brix_storage_backend      http://{BIND_HOST}:{ORIGIN_PORT};
        brix_export               {EXPORT_ROOT}/st;
        brix_allow_write          on;
        brix_stage_dir            {SPOOL_DIR};
        brix_upload_resume        off;
        brix_thread_pool          audit15e_uring_pool;
        brix_io_uring             on;
        brix_io_uring_queue_depth 64;
    }
}

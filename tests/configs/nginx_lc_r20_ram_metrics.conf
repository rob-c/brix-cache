# 2.0 readiness F6 — a root:// export cached through the RAM store with the
# 2.0 tier grammar (brix_cache_store, no `brix_cache on`, no filesystem root).
# The cache families must appear for this slot (handler.c counts a composed
# tier as a cache), and brix_cache_occupancy_ratio / brix_cache_bytes must come
# from the store's own capacity report (stream_cache.c asks the store first).
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 128; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend root://{BIND_HOST}:{ORIGIN_PORT};
        brix_cache_store     ram:{RAM_SIZE};
    }
}
http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

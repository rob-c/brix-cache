# Native krb5 stream root:// server template WITH inbound TGT delegation-capture
# (brix_krb5_delegate on).  For test_krb5_delegation_e2e.py.  Launcher-provided:
# LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR PRINCIPAL KEYTAB.
#
# `brix_krb5_delegate on` arms the two-round kXR_authmore/"fwdtgt" exchange: after
# validating the client AP-REQ the acceptor answers "fwdtgt", the client forwards
# its (forwardable) TGT as a KRB_CRED, and src/auth/krb5/deleg_capture.c imports it
# into a per-connection 0600 ccache — logging "krb5 delegation captured forwarded
# TGT" at info on success.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab {KEYTAB};
        brix_krb5_delegate on;
        brix_allow_write on;
    }
}

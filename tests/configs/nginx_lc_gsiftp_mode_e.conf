# phase-115 W5.1 — the GridFTP MODE E data channel on the outbound FTP driver.
#
# Three WebDAV fronts, differing ONLY in the store line, so any difference in
# what comes out of the door is attributable to `mode=e` and nothing else:
#
#   PORT        `mode=e` over the extended-block-capable origin (the subject)
#   STREAM_PORT no params over the SAME origin — MODE S (the control)
#   REFUSE_PORT `mode=e` over an origin that answers MODE E 504 (must fail,
#               and must NOT quietly move the bytes in stream mode instead)
#
# All three are writable: MODE E is offset-addressed in both directions, and a
# PUT that framed only one of them would look correct from a GET.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool gsiftp_io threads=4 max_queue=128;
events { worker_connections 128; }

http {
    client_body_temp_path {TMP_DIR}/body;
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {E_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_allow_write on;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{STREAM_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {S_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE};
            brix_allow_write on;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{REFUSE_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {REFUSE_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{PLAIN_ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_allow_write on;
            brix_thread_pool gsiftp_io;
        }
    }
}

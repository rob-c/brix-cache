# brix_cache_only_if_cached (audit §4.4, upstream pfc.onlyifcached) —
# test_audit_fixes_2026_08_09.py::TestOnlyIfCached.
#
# A root:// front whose cache decorator sits over a posix source, with
# only-if-cached ON. A read the cache does not already hold must be refused
# rather than filled — the mode exists so such a node contributes only what it
# holds and never becomes an origin puller, letting a client fail over to
# another replica instead.
#
# The source is posix rather than a remote origin purely to keep this to ONE
# listener (lifecycle ladder slots are a packed, shared budget). What is under
# test is the gate in the cache decorator's open path, which sits above the
# source driver and so behaves identically whichever source is composed under
# it: with the gate armed, a miss never reaches the source at all.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.
# Session-provided: BIND_HOST.
# Test-provided: CACHE_ROOT EXPORT_ROOT
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root                  on;
        brix_storage_backend       posix:{DATA_ROOT};
        brix_auth                  none;
        brix_export                {EXPORT_ROOT}/oic;
        brix_cache_store           posix:{CACHE_ROOT}/oic;
        brix_cache_only_if_cached  on;
        brix_access_log            {LOG_DIR}/brix_access.log;
    }
}

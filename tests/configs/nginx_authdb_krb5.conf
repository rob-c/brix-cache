# krb5-authenticated root:// server WITH brix_authdb, for
# test_authdb_mechanism_scope.py.  Launcher-provided: LOG_DIR PORT.
# Test-provided: BIND_HOST DATA_DIR PRINCIPAL KEYTAB AUTHDB.
#
# The acceptor maps the client principal through auth_to_local and stores the
# result in login.dn, so the authdb u-rules are matched against the mapped
# local name rather than the full principal.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab {KEYTAB};
        brix_allow_write on;
        brix_authdb {AUTHDB};
    }
}

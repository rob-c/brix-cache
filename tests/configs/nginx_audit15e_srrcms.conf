# The SRR endpoint on a live CMS mesh MEMBER (registry lifecycle) for
# test_audit15e_srr_cms.py — audit §B3.15 residual: SRR was reported from
# standalone units and (tranche 2) from a cache-tier member, but never from a
# node that is joined to a cms mesh, though a real WLCG site's reporting
# endpoint sits on exactly such a node.  One nginx process:
#   stream {PORT}     root:// data node joined to the manager at {MANAGER_PORT}
#   http   {SRR_PORT} the SRR document whose single share IS that node's export
#
# The node registers with an out-of-process manager instance
# (nginx_cms_state_server.conf as lc-audit15e-cmsmgr), so the join is a real
# CMS login, not a loopback into this same process.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT + SRR_PORT extra.
# Test-provided: BIND_HOST HOST MANAGER_PORT.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{DATA_ROOT};
        brix_allow_write     on;
        brix_cms_manager     127.0.0.1:{MANAGER_PORT};
        brix_cms_paths       /;
    }
}

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{SRR_PORT};
        location = /.well-known/wlcg-storage-resource-reporting {
            brix_srr          on;
            brix_srr_name     "TEST-MESH-MEMBER-SE";
            brix_srr_quality  testing;
            brix_srr_version  "3.5";
            brix_srr_share    meshdata {DATA_ROOT} atlas;
            brix_srr_endpoint root xroot root://{HOST}:{PORT}/;
        }
    }
}

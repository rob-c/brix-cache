# TWO cvmfs locations on ONE listener — the measuring half of the origin
# connection-reuse pair (audit tranche 16, file 4;
# test_audit16d_origin_reuse.py).
#
# brix_cvmfs_origin_reuse_conn is declared NGX_HTTP_MAIN_CONF|NGX_HTTP_SRV_CONF|
# NGX_HTTP_LOC_CONF|NGX_CONF_FLAG (src/protocols/cvmfs/directives_resilience.h:
# 93-99), so an operator reads it as per-location.  It is not: the merge calls
# brix_s3_origin_reuse_set() (cvmfs_module_merge.c:270) into a process-wide
# `static int g_origin_no_reuse` (s3_transport_setup.c:73), so the last
# cvmfs-enabled location merged decides for the whole worker.  One location
# cannot show that; nginx_audit16d_reusesolo.conf is this config with the second
# one removed, and the pair of readings is the finding.
#
# The two locations differ ONLY in repository, cache store and policy slot.
# They share one listener, one origin and one worker, so any difference between
# them is the directive under test and nothing else.  The caches are separate
# because a shared store would let the first location's fill serve the second
# location's request, and a request that never reaches the origin cannot say
# anything about how the origin was connected to.
#
# worker_processes 1 and thread_pool default threads=1 are load-bearing for the
# same reason as in the solo template: the connection pool the flag turns off is
# per fill thread, so a second thread would add a first connection of its own
# and blur the count that is the whole measurement.
#
# Either policy slot may be EMPTY.  "The second location says nothing" is not
# the absence of a case — it is the sharpest case in the file, because an unset
# flag merges to 1 and is written to the global exactly like a chosen value.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + MOCK_PORT.
# Test-provided: BIND_HOST REPO_A REPO_B CACHE_A CACHE_B BACKEND
#                + the POLICY_A and POLICY_B slots (named here without their
#                braces — the renderer substitutes placeholders in comments too).
daemon on;
worker_processes 1;
thread_pool default threads=1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # Merged FIRST.
        location /cvmfs/{REPO_A}/ {
            brix_cvmfs           on;
            brix_cvmfs_trace     on;
            brix_cache_store     posix:{CACHE_A};
            brix_storage_backend "{BACKEND}";
{POLICY_A}        }

        # Merged SECOND — and therefore the one that decides for both.
        location /cvmfs/{REPO_B}/ {
            brix_cvmfs           on;
            brix_cvmfs_trace     on;
            brix_cache_store     posix:{CACHE_B};
            brix_storage_backend "{BACKEND}";
{POLICY_B}        }
    }
}

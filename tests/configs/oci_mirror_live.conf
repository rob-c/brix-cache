# OCI pull-through mirror pointed at a REAL upstream registry (phase-104 D3.3,
# weekly tier). Drives the opt-in DockerHub leg of
# tests/test_oci_mirror_podman_pull.py.
#
# The one thing that makes this a separate template from oci_mirror.conf: no
# brix_oci_mirror_insecure. A live registry is reached over TLS, the token
# dance carries a bearer credential, and the merge's refusal to accept a
# cleartext base without the opt-in is exactly the policy under test here —
# rendering the mock template with an https base would leave that opt-in on
# and prove nothing about the shape an operator actually deploys.
#
# Placeholders (render_config(strict=True) — a missing one is a fatal render):
#   LOG_DIR       error.log + nginx.pid; the endpoint record names logs/nginx.pid
#   BIND_HOST     PORT        this front's listener
#   UPSTREAM      the registry ROOT (scheme://host), not its /v2/ endpoint
#   CACHE_DIR     the mirror's cache store (posix:)
#   MANIFEST_TTL  tag-manifest freshness window
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;
thread_pool default threads=2;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen {BIND_HOST}:{PORT};
        location /v2/ {
            brix_oci_mirror       {UPSTREAM};
            brix_oci_manifest_ttl {MANIFEST_TTL};
            brix_cache_store      posix:{CACHE_DIR};
            brix_cache_verify     oci-digest;
        }
    }
}

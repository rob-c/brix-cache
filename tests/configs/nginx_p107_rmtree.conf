# Phase-107 C4: the windowed rmtree walk, live (test_vfs_rmtree.py, registry
# lifecycle).
#
# A recursive collection DELETE may only batch WITHIN one directory level —
# a prefix cannot be removed before its children (the trap in §4/C4 of
# docs/refactor/phase-107-vfs-mutation-surface-completion.md). Two WebDAV
# fronts pin both sides of the dispatch:
#
#   {PORT}          WebDAV front over http:// (sd_http, np — no batch verb in
#                   RFC 4918): the classic per-key walk, whose child-before-
#                   parent order the DAV origin's access log witnesses.
#   {REMOTE_PORT}   WebDAV front over s3:// (sd_remote, CAP_BULK_DELETE): the
#                   windowed walk — files leave in ?delete batches, never in
#                   per-key upstream DELETEs, and every batch flushes BEFORE
#                   its directory's own removal.
#   {METRICS_PORT}  brix_vfs_bulk_delete_{batches,keys}_total.
#
# Both fronts run brix_stage off so the LEAF the rmtree dispatch gates on is
# the subject driver itself, not the write-stage decorator
# (nginx_lc_caps_http.conf precedent for the same reason).
#
# worker_processes 2: both fronts connect back to origins served by this same
# nginx (nginx_lc_caps_http.conf precedent).
#
# Launcher-provided: LOG_DIR TMP_DIR PORT + DAV_ORIGIN_PORT S3ORIGIN_PORT
#                    REMOTE_PORT METRICS_PORT.
# Test-provided: BIND_HOST ORIGIN_DATA HTTP_EXPORT S3_DIR REMOTE_EXPORT
#                S3_ACCESS_KEY S3_SECRET_KEY (paths must exist at parse time).
worker_processes 2;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 16m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/sct;

    log_format p107rm '$request_method $uri$is_args$args $status';

    brix_credential s3cred {
        s3_access_key {S3_ACCESS_KEY};
        s3_secret_key {S3_SECRET_KEY};
        s3_region     us-east-1;
    }

    # WebDAV origin of record for the sd_http front. Its access log is the
    # child-before-parent witness.
    server {
        listen {BIND_HOST}:{DAV_ORIGIN_PORT};
        access_log {LOG_DIR}/dav_origin_access.log p107rm;
        location / {
            brix_webdav      on;
            brix_export      {ORIGIN_DATA};
            brix_webdav_auth none;
            brix_allow_write on;
        }
    }

    # S3 origin for the sd_remote front. Its access log separates ?delete
    # batches from per-key DELETEs.
    server {
        listen {BIND_HOST}:{S3ORIGIN_PORT};
        access_log {LOG_DIR}/s3_origin_access.log p107rm;
        location / {
            brix_s3              on;
            brix_storage_backend posix:{S3_DIR};
            brix_s3_bucket       testbucket;
            brix_s3_access_key   {S3_ACCESS_KEY};
            brix_s3_secret_key   {S3_SECRET_KEY};
            brix_s3_region       us-east-1;
            brix_allow_write     on;
        }
    }

    # sd_http front: no batch verb — the classic per-key walk.
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav          on;
            brix_export          {HTTP_EXPORT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_stage           off;
            brix_storage_backend http://{BIND_HOST}:{DAV_ORIGIN_PORT};
        }
    }

    # sd_remote front: CAP_BULK_DELETE — the windowed walk.
    server {
        listen {BIND_HOST}:{REMOTE_PORT};
        location / {
            brix_webdav             on;
            brix_export             {REMOTE_EXPORT};
            brix_webdav_auth        none;
            brix_allow_write        on;
            brix_stage              off;
            brix_storage_backend    s3://{BIND_HOST}:{S3ORIGIN_PORT}/testbucket;
            brix_storage_credential s3cred;
        }
    }

    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics { brix_metrics on; }
    }
}

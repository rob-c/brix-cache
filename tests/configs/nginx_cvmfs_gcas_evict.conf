# CVMFS G13 gcas evict-GC stream template — registry lifecycle.
#
# For test_cvmfs_global_cas.py::test_evict_gc_reaps_canonical_stream: a posix
# brix_cache_store with brix_cache_global_cas under tight high/low watermarks,
# so the reaper evicts the planted hardlinked CAS keys and the gcas GC unlinks
# the canonical /.gcas name once the last data link is gone.  The launcher
# injects {PORT} {LOG_DIR}; the test supplies {BIND_HOST} {CACHE_DIR}
# {HIGH_WM} {LOW_WM} — the cache dir lives in the test's tmp_path because it
# plants the linked victims and asserts the tree drains.  {LOG_DIR}/nginx.pid
# is the registry's stop pidfile — do not rename.
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
thread_pool default threads=2;
events { worker_connections 64; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_auth none;
        brix_storage_backend root://127.0.0.1:1;
        brix_cache_store posix:{CACHE_DIR};
        brix_cache_global_cas on;
        brix_cache_export /;
        brix_cache_high_watermark {HIGH_WM}%;
        brix_cache_low_watermark {LOW_WM}%;
        brix_cache_reap_interval 1;
    }
}

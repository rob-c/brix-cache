# Ultra-parallel breaking-point storm subject (registry lifecycle) for
# test_ultra_parallel_breaking_point.py AND test_ultra_parallel_mixed_storm.py.
# A throwaway anonymous root:// export hammered by FTS-shaped
# connect+login+stat+open+read+close job storms — including 16k-wide mixed
# metadata+transfer storms — at ladder concurrency until breaking point.
# worker_connections/worker_rlimit_nofile/backlog are sized so the SUBJECT can
# hold the widest rung (2 workers x 16384) and the test measures the server,
# not the config; the kernel silently caps backlog at net.core.somaxconn.
# Launcher-provided: LOG_DIR PORT.
# Test-provided via template_values: BIND_HOST DATA_DIR (must exist at parse
#   time), RL_ZONE (optional `brix_rate_limit_zone ...;`, "" when unused)
#   RL_RULE (optional per-server shed rule, "" when unused).
worker_processes 2;
worker_rlimit_nofile 65536;
error_log {LOG_DIR}/error.log error;
pid {LOG_DIR}/nginx.pid;
events { worker_connections 16384; multi_accept on; }
stream {
    {RL_ZONE}
    server {
        listen {BIND_HOST}:{PORT} reuseport backlog=16384;
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
        {RL_RULE}
    }
}

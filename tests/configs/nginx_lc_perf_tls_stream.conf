# roots:// (userspace-TLS) stream template for test_perf_ab_gate.py's P5 leg.
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR CERT_FILE
# KEY_FILE.  Boots a TLS root:// server so the A/B measurer can drive the P5
# userspace-TLS read path (measure_read_throughput(..., tls=True)); the kTLS
# HW-offload A/B on a perf host swaps in brix_ktls on with no test change.
# DATA_DIR must exist at config-parse time (the test seeds it under tmp_path).
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_tls on;
        brix_certificate     {CERT_FILE};
        brix_certificate_key {KEY_FILE};
    }
}

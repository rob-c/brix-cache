# brix_security_level at VALUE granularity (test_audit15w_security_level.py) —
# the 15th tranche.  The directive has five tokens; the suite writes three.
# `standard` and `pedantic` are driven live (test_security_level.py reads the
# kXR_protocol secreq trailer on each) and `intense` appears on the signing
# crosses (test_audit15f_sigver_crosses.py, nginx_lc_audit_signing.conf), but
# `none` and `compatible` — the two tokens that turn enforcement OFF — are
# written nowhere, on any plane.  Their behaviour was therefore assumed rather
# than measured, which is the wrong way round for a security knob: the tokens an
# operator reaches for to relax a policy are exactly the ones whose effect has to
# be on record.
#
# Every arm is a listener on ONE instance because the whole observable is a
# per-request verdict on a session the server already refuses to sign for:
#
#   {PORT}     brix_security_level none        — advertise 0, enforce nothing
#   {CMP_PORT} brix_security_level compatible  — advertise 1, enforce nothing
#   {STD_PORT} brix_security_level standard    — kXR_open is covered, kXR_stat is not
#   {INT_PORT} brix_security_level intense     — everything post-login is covered
#   {PED_PORT} brix_security_level pedantic    — as intense, plus kXR_secOData
#   {DEF_PORT} the directive ABSENT            — pins the merge default
#
# All six are `brix_auth none`.  Only a GSI session ever establishes a signing
# key (gsi_core.c), so an anonymous session is the UNSIGNABLE case — the case the
# level policy is written against — and it keeps every assertion about the level
# rather than about credentials.
#
# All six also carry `brix_signing_required on`, which is what makes the policy
# observable: with it off, an unsignable session is served at every level and the
# only difference between the tokens is a log line.  With it on, the level
# decides the verdict, so the token under test is the only thing that can move a
# request from served to refused (sigver.c brix_signing_enforce_level ->
# brix_signing_unsignable_session).  That combination is also what exposes the
# two flat planes: at `none` and `compatible` the flag can never fire, and
# nothing anywhere says so.
#
# brix_allow_write is off throughout: every covered opcode asserted here
# (kXR_open for read, kXR_stat) is refused BEFORE any storage work, so a write
# permission would only add a second possible reason for a refusal.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + CMP_PORT STD_PORT INT_PORT PED_PORT
# DEF_PORT.  Test-provided: none.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- none: the enforcement path returns before any opcode is examined ----
    server {
        listen {PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_security_level   none;
        brix_signing_required on;
    }

    # --- compatible: advertised, but the policy table requires no opcode -----
    server {
        listen {CMP_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_security_level   compatible;
        brix_signing_required on;
    }

    # --- standard: kXR_open and the mutations are covered --------------------
    server {
        listen {STD_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_security_level   standard;
        brix_signing_required on;
    }

    # --- intense: everything outside the session state machine is covered ----
    server {
        listen {INT_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_security_level   intense;
        brix_signing_required on;
    }

    # --- pedantic: as intense on the wire, plus the payload-signing bit ------
    server {
        listen {PED_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_security_level   pedantic;
        brix_signing_required on;
    }

    # --- the directive absent: whatever the merge default is -----------------
    server {
        listen {DEF_PORT};
        brix_root             on;
        brix_auth             none;
        brix_storage_backend  posix:{DATA_ROOT};
        brix_signing_required on;
    }
}

# `brix_authdb_audit` at VALUE granularity (test_audit15s_authdb_audit.py).
#
# §Method steps 1 and 2 count directive NAMES.  An enum-valued directive is
# scored covered the moment ANY ONE of its tokens is written somewhere, and the
# rest of the table is invisible to the instrument.  `brix_authdb_audit` is the
# archetype: it appears in eleven templates and in the k8s remote suite, and
# every single one of them writes `all`.  Three of its four values — `none`,
# `deny`, `grant` — have never been written anywhere in the corpus.
#
# WHAT THE VALUE ACTUALLY SELECTS
#
# brix_acc_audit() (auth/authz/acc/audit.c:44-68) treats the merged value as a
# two-bit mask — 1 = log denials, 2 = log grants — and returns early when the
# decision's bit is clear.  So the four tokens are the four subsets of a
# two-element set, and each one is observable as the PRESENCE or ABSENCE of a
# NOTICE line of the form
#
#     xrootd authz: <id>@<host> grant|deny <op> "<path>"
#
# Every location below is identical apart from that one token, and each is
# driven with the same pair of requests: one path the authdb grants and one it
# does not.  The eight cells are the whole truth table:
#
#   location     token     grant line   deny line
#   /none/       none         -            -
#   /deny/       deny         -           YES
#   /grant/      grant       YES           -
#   /all/        all         YES          YES
#   /default/    (absent)     -            -      <- merge default is NONE
#
# /default/ is the fifth face and it is not redundant with /none/: it reads the
# merge default at config.c:181-182, which no test has ever provoked because
# every template in the tree writes the directive explicitly.
#
# THE NESTED PAIR
#
# On the HTTP plane the directive is NGX_HTTP_LOC_CONF only (module_commands.c
# :91-93) — it cannot be written in `server {}` at all — so the merge from
# `prev` runs between NESTED locations and nowhere else.  /outer/ writes `all`;
# /outer/loud/ writes nothing and must INHERIT it (not fall to the NONE
# default), and /outer/quiet/ writes `none` and must override it.  That is the
# only inheritance path this directive has on this plane.
#
# WHY ONE SERVER AND ONE LOG
#
# The audit sink is the shared error log, so a single worker writing a single
# file is the observation surface: all eight locations are read out of ONE log
# in ONE pass, and each line is attributed by the path it quotes.  A second
# listener would buy nothing and would make interleaving a variable.
#
# The authdb grants `rl` and never `w`, so a PUT is denied EVERYWHERE — which is
# what lets the op-name field be probed (GET -> read, PUT -> create, PROPFIND ->
# readdir) without any location's state changing.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST EXPORT_ROOT AUTHDB.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 128; }

http {
    access_log off;
    client_max_body_size 4m;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        location = / { return 204; }

        # --- level 0: neither bit ---------------------------------------- #
        location /none/ {
            brix_webdav          on;
            brix_storage_backend posix:{EXPORT_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
            brix_authdb_audit    none;
        }

        # --- level 1: the deny bit only ----------------------------------- #
        location /deny/ {
            brix_webdav          on;
            brix_storage_backend posix:{EXPORT_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
            brix_authdb_audit    deny;
        }

        # --- level 2: the grant bit only ---------------------------------- #
        location /grant/ {
            brix_webdav          on;
            brix_storage_backend posix:{EXPORT_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
            brix_authdb_audit    grant;
        }

        # --- level 3: both bits — the only token the corpus ever wrote ----- #
        location /all/ {
            brix_webdav          on;
            brix_storage_backend posix:{EXPORT_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
            brix_authdb_audit    all;
        }

        # --- the directive absent: the merge default ---------------------- #
        location /default/ {
            brix_webdav          on;
            brix_storage_backend posix:{EXPORT_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
        }

        # --- the only inheritance path the directive has on this plane ---- #
        location /outer/ {
            brix_webdav          on;
            brix_storage_backend posix:{EXPORT_ROOT};
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_authdb_format   xrdacc;
            brix_authdb          {AUTHDB};
            brix_authdb_audit    all;

            # writes nothing: must inherit `all` from the parent location
            location /outer/loud/ {
                brix_webdav          on;
                brix_storage_backend posix:{EXPORT_ROOT};
                brix_webdav_auth     none;
                brix_allow_write     on;
                brix_authdb_format   xrdacc;
                brix_authdb          {AUTHDB};
            }

            # writes `none`: must override the parent, not merge with it
            location /outer/quiet/ {
                brix_webdav          on;
                brix_storage_backend posix:{EXPORT_ROOT};
                brix_webdav_auth     none;
                brix_allow_write     on;
                brix_authdb_format   xrdacc;
                brix_authdb          {AUTHDB};
                brix_authdb_audit    none;
            }
        }
    }
}

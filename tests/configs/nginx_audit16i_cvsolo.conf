# ONE cvmfs location carrying every CVMFS face — the instance behind the
# per-flag arms of test_audit16i_cvmfs_resilience_flags.py (16th tranche).
#
# Nine brix_cvmfs_* / brix_scvmfs flags have an `off` arm that no config in the
# suite writes.  Eight of them merge to 0, so "off" and "absent" produce the
# same merged value and the reading cannot be a value comparison — it has to be
# the observable each flag owns (a POST that is answered or refused, a header
# that is present or absent, a scrub pass that happens or does not).  Every one
# of those observables lives on the SAME location, which is why this file is one
# location and not nine.
#
# The location is mounted at /cvmfs/ rather than at /cvmfs/<repo>/ because three
# of the faces are not under a repository at all: the swarm roster is
# /cvmfs/.swarm/roster, and the bundle and dict endpoints are reserved names the
# gate routes before classification.  A per-repo prefix answers 404 for the
# roster and the arm would read as "the flag did nothing".
#
# worker_processes 1 is load-bearing, not hygiene: brix_cvmfs_trace's merge
# writes a PROCESS-wide latch (cvmfs_module_merge.c:167-172) and the scrub,
# learn and swarm services are registered once per EXPORT, so a second worker
# would answer half the requests from a different latch and half the scrub
# passes from a different cursor.
#
# THREE arm slots, one per context the flags are declared in
# (NGX_HTTP_MAIN_CONF|SRV_CONF|LOC_CONF, directives_resilience.h):
#
#   HTTP_ARM  http-level lines — the site-wide default.
#   SRV_ARM   server-level lines — the half of the inheritance section that
#             says `on` so the location can try to say `off`.
#   LOC_ARM   location-level lines — the arm under test.
#
# None of the nine is written here.  A case that wants a value writes it into a
# slot; "the flag is absent" is one of the three arms every section measures, and
# a value written here would take that arm away from every case in the file.
#
# BACKEND is quoted because §J aims a location at a "|"-separated origin set and
# the separator must survive the parser as one argument.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + MOCK_PORT DEAD_PORT.
# Test-provided: BIND_HOST CACHE_A BACKEND + the HTTP_ARM SRV_ARM LOC_ARM slots.
daemon on;
worker_processes 1;
thread_pool default threads=2;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
{HTTP_ARM}
    server {
        listen {BIND_HOST}:{PORT};
{SRV_ARM}
        location /cvmfs/ {
            brix_cvmfs           on;
            brix_cache_store     posix:{CACHE_A};
            brix_storage_backend "{BACKEND}";
{LOC_ARM}        }
    }
}

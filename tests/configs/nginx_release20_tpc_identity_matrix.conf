# 2.0 F18 lab: the TPC identity matrix (BriX's `ofs.tpc allow|require|restrict|
# oids`, spelled brix_tpc_allow_identity / brix_tpc_require / brix_tpc_restrict
# / brix_tpc_oids).
#
# The matrix is an INNER gate.  The host plane (brix_tpc_source_guard /
# _source_allow, brix_tpc_allow_local / _private) stays the OUTER one, so a
# matrix rule can only ever narrow what the host plane already permits.  Every
# plane below is anonymous (`brix_auth none`) on purpose: an unauthenticated
# subject is precisely the one a configured stage must refuse rather than
# default, and it needs no CA, keytab or IdP to drive.
#
# Planes (all root://, loopback egress allowed):
#   PORT          SOURCE, matrix unconfigured — the source every pull reads
#   DST_PORT      DESTINATION, matrix unconfigured — the control: a pull that
#                 must still complete byte-exact, proving the feature is a
#                 no-op for an operator who never adopts it
#   ALLOW_PORT    DESTINATION with one `allow vo cms` rule — the anonymous
#                 client matches no rule, so the stage must DENY, not default
#   REQ_PORT      DESTINATION with `require all gsi` — an anonymous credential
#                 cannot satisfy it
#   PATH_PORT     DESTINATION with `restrict /allowed` — inside the prefix is
#                 admitted, outside is refused, and `/allowedx` is NOT inside
#                 (the component-boundary rule); also carries the default
#                 `oids off`, so a '*'-prefixed path is refused there
#   DESTREQ_PORT  SOURCE with `require dest gsi`.  The client's own rendezvous
#                 registration carries no tpc.org and is therefore the CLIENT
#                 party — unconstrained.  The destination's leg carries
#                 tpc.org, is the DEST party, and is refused.  That asymmetry
#                 is the whole point of the party mapping.
#   GUARD_PORT    DESTINATION whose egress allowlist names an unrelated host
#                 while its matrix permits every path (`restrict /`).  The pull
#                 must still be refused — an identity rule cannot widen a host
#                 denial.
#
# Every plane exports a distinct root: the backend registry is keyed by the
# canonical export path, so two planes on one root would share one backend.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=4 max_queue=256;

events {
    worker_connections 128;
}

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_listen_port {PORT};
        brix_root on;
        brix_storage_backend posix:{SRC_DIR};
        brix_auth none;
        brix_tpc_allow_local on;
        brix_access_log {LOG_DIR}/brix_access_src.log;
    }

    server {
        listen {BIND_HOST}:{DST_PORT};
        brix_listen_port {DST_PORT};
        brix_root on;
        brix_storage_backend posix:{DST_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_access_log {LOG_DIR}/brix_access_dst.log;
    }

    server {
        listen {BIND_HOST}:{ALLOW_PORT};
        brix_listen_port {ALLOW_PORT};
        brix_root on;
        brix_storage_backend posix:{ALLOW_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_allow_identity vo cms;
        brix_access_log {LOG_DIR}/brix_access_allow.log;
    }

    server {
        listen {BIND_HOST}:{REQ_PORT};
        brix_listen_port {REQ_PORT};
        brix_root on;
        brix_storage_backend posix:{REQ_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_require all gsi;
        brix_access_log {LOG_DIR}/brix_access_req.log;
    }

    server {
        listen {BIND_HOST}:{PATH_PORT};
        brix_listen_port {PATH_PORT};
        brix_root on;
        brix_storage_backend posix:{PATH_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_restrict /allowed;
        brix_access_log {LOG_DIR}/brix_access_path.log;
    }

    server {
        listen {BIND_HOST}:{DESTREQ_PORT};
        brix_listen_port {DESTREQ_PORT};
        brix_root on;
        brix_storage_backend posix:{DESTREQ_DIR};
        brix_auth none;
        brix_tpc_allow_local on;
        brix_tpc_require dest gsi;
        brix_access_log {LOG_DIR}/brix_access_destreq.log;
    }

    server {
        listen {BIND_HOST}:{GUARD_PORT};
        brix_listen_port {GUARD_PORT};
        brix_root on;
        brix_storage_backend posix:{GUARD_DIR};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_source_guard on;
        brix_tpc_source_allow storage.example.invalid;
        brix_tpc_restrict /;
        brix_access_log {LOG_DIR}/brix_access_guard.log;
    }
}

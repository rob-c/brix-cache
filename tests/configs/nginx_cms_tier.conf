# CMS 4-tier cluster — registry-lifecycle template for test_cms_tier_topology.py.
#
#   mgr (manager)                          :{PORT}
#     └─ sub1 (sub-manager)   -> mgr       :{PORT_SUB1}
#          ├─ leafA (client)  -> sub1      :{PORT_LEAFA}
#          ├─ leafB (client)  -> sub1      :{PORT_LEAFB}
#          └─ sub2 (sub-mgr)  -> sub1      :{PORT_SUB2}
#               └─ leafC (client) -> sub2  :{PORT_LEAFC}
#
# One nginx master hosts all six cmsd node identities as separate stream server
# blocks (each a distinct identity via brix_listen_port); they wire up to each
# other purely over the CMS wire protocol on loopback, so no PKI and no data
# backend are needed.  Managers/sub-managers carry the brix_cms_server handler;
# a leaf needs *some* stream handler and only registers upward, so it gets a
# trivial `return ""`.  Roles are NOT declared: the test's whole point is that
# each node DERIVES its role from the shape of the tree.
#
# worker_processes >1 is load-bearing: the test asserts the single-connection
# gate holds, i.e. every control-plane action still comes from worker 0.
# The 2s heartbeat is a test-only acceleration so the tree settles inside the
# fixture's poll window.
#
# Launcher-provided: LOG_DIR PORT PORT_SUB1 PORT_LEAFA PORT_LEAFB PORT_SUB2
# PORT_LEAFC (the five non-primary listens come from the lc-cms-tier ledger
# entry's `extra` ports in fleet_lifecycle_ports.py).
worker_processes 3;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log notice;
daemon on;
events { worker_connections 256; }

stream {
    server {  # mgr (manager)
        listen 127.0.0.1:{PORT};
        brix_listen_port {PORT};
        brix_cms_server on;
        brix_cms_paths /;
        brix_cms_interval 2;
    }

    server {  # sub1 (sub-manager) -> mgr
        listen 127.0.0.1:{PORT_SUB1};
        brix_listen_port {PORT_SUB1};
        brix_cms_server on;
        brix_cms_manager 127.0.0.1:{PORT};
        brix_cms_paths /;
        brix_cms_interval 2;
    }

    server {  # leafA (client) -> sub1
        listen 127.0.0.1:{PORT_LEAFA};
        brix_listen_port {PORT_LEAFA};
        return "";
        brix_cms_manager 127.0.0.1:{PORT_SUB1};
        brix_cms_paths /;
        brix_cms_interval 2;
    }

    server {  # leafB (client) -> sub1
        listen 127.0.0.1:{PORT_LEAFB};
        brix_listen_port {PORT_LEAFB};
        return "";
        brix_cms_manager 127.0.0.1:{PORT_SUB1};
        brix_cms_paths /;
        brix_cms_interval 2;
    }

    server {  # sub2 (sub-manager) -> sub1
        listen 127.0.0.1:{PORT_SUB2};
        brix_listen_port {PORT_SUB2};
        brix_cms_server on;
        brix_cms_manager 127.0.0.1:{PORT_SUB1};
        brix_cms_paths /;
        brix_cms_interval 2;
    }

    server {  # leafC (client) -> sub2
        listen 127.0.0.1:{PORT_LEAFC};
        brix_listen_port {PORT_LEAFC};
        return "";
        brix_cms_manager 127.0.0.1:{PORT_SUB2};
        brix_cms_paths /;
        brix_cms_interval 2;
    }
}

# Phase-115 W4.2: a read-through cache whose store is RAM, not a filesystem.
#
#   brix_cache_store ram:1m
#
# The store is a per-worker heap object table reached through the `ram` storage
# driver (src/fs/backend/ram/).  worker_processes is pinned to 1 for exactly
# that reason: with two workers a fill lands in whichever worker served the
# miss, and a later read arriving on the other worker would see a cold store —
# the test would be measuring the accept queue, not the cache.
#
# The cap is 1m so a few hundred-KiB objects fill it.  Once full, the driver's
# own LRU makes room; when it cannot (every resident object is open), the fill
# is refused ENOSPC and the cache decorator degrades to a plain source read
# rather than failing the request.  Both are behaviours under test.
#
# Export root {DATA_DIR}/origin and the cache store are not siblings on disk at
# all here — the store has no path.  That is itself worth pinning: the check
# that rejects a cache root beneath the export root has nothing to reject.
#
# Launcher-provided: LOG_DIR DATA_DIR TMP_DIR PORT BIND_HOST.
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;

events { worker_connections 64; }

http {
    access_log off;
    client_max_body_size 16m;
    client_body_buffer_size 4k;
    client_body_in_file_only clean;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        location / {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_DIR}/origin;
            brix_webdav_auth     none;
            brix_allow_write     on;
            brix_export          {DATA_DIR}/origin;
            brix_cache_store     ram:1m;
        }
    }
}

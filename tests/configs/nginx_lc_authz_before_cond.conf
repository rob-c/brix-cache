# authz-before-conditionals ordering — template for
# test_authz_before_conditionals.py (phase-106 W6).
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_DIR.
# Test-provided: SECRET_HEX ACCESS_KEY SECRET_KEY.
#
# Two protected HTTP planes. A conditional request from an UNAUTHORIZED caller
# must be refused by the ACCESS phase (401/403) — never answered 304/412 by the
# conditional evaluator, which would confirm the resource exists (and, via
# If-Modified-Since, leak its mtime) to someone with no right to know.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;
events { worker_connections 64; }
http {
    access_log {LOG_DIR}/access.log;
    client_body_temp_path {TMP_DIR};
    # One brix protocol per listen port, so the two planes get two servers.
    server {
        listen {BIND_HOST}:{PORT};
        location /dav/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth required;
            brix_macaroon_secret {SECRET_HEX};
        }
    }
    server {
        listen {BIND_HOST}:{S3_PORT};
        location /s3/ {
            brix_s3 on;
            brix_storage_backend posix:{DATA_DIR};
            brix_s3_access_key {ACCESS_KEY};
            brix_s3_secret_key {SECRET_KEY};
        }
    }
}

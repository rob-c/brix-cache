# The five S3 location flags whose `off` arm was never written (audit tranche
# 16, file 6; test_audit16f_s3_location_flags.py).
#
# The tranche re-runs the audit's Method per (directive, VALUE).  These five all
# share one shape: the `on` arm is configured somewhere in the corpus, the merge
# default is 0, and the WORD `off` had never been written for any of them — so
# every "off" claim in the suite was really a claim about the default, and no
# test could tell an explicit refusal from an absent directive.
#
#   brix_s3_verify_chunk_signatures   /vc{on,off,def}/    module_merge.c:89
#   brix_s3_allow_unsigned_session_token /ust{on,off,def}/ module_merge.c:87
#   brix_s3_token                     /tok{on,off,def}/   module_merge.c:128
#   brix_s3_list_cache                /lc{on,off,def}/    module_merge.c:91
#   brix_zip_access                /zip{on,off,def}/   module_merge.c:96
#
# ONE listener, sixteen locations.  That is forced, not chosen: s3_parse_uri()
# takes the bucket out of the first URI segment, so an arm needs its own bucket
# AND a location prefix that spells it — the arm is a location, and a location
# costs nothing while a listener costs a ledger slot.  Every arm carries the
# same access key, the same secret and the same region, so a verdict that
# differs between two of them cannot be explained by anything but the flag.
#
# THE TWO NESTED LOCATIONS UNDER /vcon/ ARE NOT DECORATION.  `brix_s3` is the
# one directive here whose setter does more than fill a slot: ngx_http_s3_set()
# (module.c:189-203) installs clcf->handler after parsing the flag, and a
# handler is not inherited by a nested location the way the merged loc conf is.
#
#   /vcon/sub/    the flag alone            — inherits every S3 setting and is
#                                             NOT served by S3 at all
#   /vcon/deep/   `brix_s3 on` + the flag   — the same override, served
#
# Both are addressed to the SAME bucket as their parent (URI /vcon/deep/k reads
# bucket "vcon", key "deep/k"), so the pair isolates the handler and nothing
# else.  See DEFECT CANDIDATE #71.
#
# ONE WORKER, and the list cache is why: s3_list_cache_get/put (list_cache.c)
# keeps its entries per worker, so a second worker would answer a repeat listing
# from a cold cache and the ON arm would read exactly like the OFF arm about
# half the time.  `brix_s3_list_cache_ttl 60` is written on all three lc arms so
# the TTL is identical and cannot be the difference either — and 60s is long
# enough that no case here can age out of the window.
#
# CLEARTEXT ON PURPOSE.  SigV4 over TLS is the same SigV4; adding TLS would add
# a second thing that can refuse a request.
#
# /metrics rides this listener too — brix_s3_auth_total{result=...} is where an
# auth refusal is counted, and the file asserts which bucket a refusal lands in.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST ACCESS_KEY SECRET_KEY REGION JWKS ISSUER AUDIENCE.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;

    server {
        listen {BIND_HOST}:{PORT};

        # ------------------------------------------------------------------ #
        # brix_s3_verify_chunk_signatures — the per-chunk SigV4 chain          #
        # ------------------------------------------------------------------ #
        # Writable, because the flag is only reachable through an aws-chunked
        # PUT body: it decides whether s3_sigv4_finish() retains the signing
        # material the streaming decoder needs (auth_sigv4_verify.c:327).
        location /vcon/ {
            brix_s3                         on;
            brix_storage_backend            posix:{DATA_ROOT}/vcon;
            brix_s3_bucket                  vcon;
            brix_s3_access_key              {ACCESS_KEY};
            brix_s3_secret_key              {SECRET_KEY};
            brix_s3_region                  {REGION};
            brix_allow_write                on;
            brix_s3_verify_chunk_signatures on;

            # The override alone: merged S3 conf, no S3 handler.
            location /vcon/sub/ {
                brix_s3_verify_chunk_signatures off;
            }

            # The same override with the handler re-installed.
            location /vcon/deep/ {
                brix_s3                         on;
                brix_s3_verify_chunk_signatures off;
            }
        }

        location /vcoff/ {
            brix_s3                         on;
            brix_storage_backend            posix:{DATA_ROOT}/vcoff;
            brix_s3_bucket                  vcoff;
            brix_s3_access_key              {ACCESS_KEY};
            brix_s3_secret_key              {SECRET_KEY};
            brix_s3_region                  {REGION};
            brix_allow_write                on;
            brix_s3_verify_chunk_signatures off;
        }

        location /vcdef/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/vcdef;
            brix_s3_bucket       vcdef;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_allow_write     on;
        }

        # ------------------------------------------------------------------ #
        # brix_s3_allow_unsigned_session_token — the STS session-token gate    #
        # ------------------------------------------------------------------ #
        # Read-only: the gate runs inside SigV4 verification, before the method
        # is looked at, so a writable arm would only widen what can go wrong.
        location /uston/ {
            brix_s3                              on;
            brix_storage_backend                 posix:{DATA_ROOT}/uston;
            brix_s3_bucket                       uston;
            brix_s3_access_key                   {ACCESS_KEY};
            brix_s3_secret_key                   {SECRET_KEY};
            brix_s3_region                       {REGION};
            brix_s3_allow_unsigned_session_token on;
        }

        location /ustoff/ {
            brix_s3                              on;
            brix_storage_backend                 posix:{DATA_ROOT}/ustoff;
            brix_s3_bucket                       ustoff;
            brix_s3_access_key                   {ACCESS_KEY};
            brix_s3_secret_key                   {SECRET_KEY};
            brix_s3_region                       {REGION};
            brix_s3_allow_unsigned_session_token off;
        }

        location /ustdef/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/ustdef;
            brix_s3_bucket       ustdef;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
        }

        # ------------------------------------------------------------------ #
        # brix_s3_token — the WLCG bearer gate                                 #
        # ------------------------------------------------------------------ #
        # All three arms carry the JWKS, the issuer and the audience.  The two
        # that do not enable the gate have no use for them, and that is the
        # point: the trust anchor is identical, so a bearer that one arm honours
        # and another refuses was refused by the FLAG.  (s3_merge_token() only
        # requires the JWKS when the flag is on, so the unused arms parse.)
        location /tokon/ {
            brix_s3                on;
            brix_storage_backend   posix:{DATA_ROOT}/tokon;
            brix_s3_bucket         tokon;
            brix_s3_access_key     {ACCESS_KEY};
            brix_s3_secret_key     {SECRET_KEY};
            brix_s3_region         {REGION};
            brix_s3_token          on;
            brix_token_jwks     {JWKS};
            brix_token_issuer   "{ISSUER}";
            brix_token_audience "{AUDIENCE}";
        }

        location /tokoff/ {
            brix_s3                on;
            brix_storage_backend   posix:{DATA_ROOT}/tokoff;
            brix_s3_bucket         tokoff;
            brix_s3_access_key     {ACCESS_KEY};
            brix_s3_secret_key     {SECRET_KEY};
            brix_s3_region         {REGION};
            brix_s3_token          off;
            brix_token_jwks     {JWKS};
            brix_token_issuer   "{ISSUER}";
            brix_token_audience "{AUDIENCE}";
        }

        location /tokdef/ {
            brix_s3                on;
            brix_storage_backend   posix:{DATA_ROOT}/tokdef;
            brix_s3_bucket         tokdef;
            brix_s3_access_key     {ACCESS_KEY};
            brix_s3_secret_key     {SECRET_KEY};
            brix_s3_region         {REGION};
            brix_token_jwks     {JWKS};
            brix_token_issuer   "{ISSUER}";
            brix_token_audience "{AUDIENCE}";
        }

        # ------------------------------------------------------------------ #
        # brix_s3_list_cache — the per-worker sorted-listing cache             #
        # ------------------------------------------------------------------ #
        # Writable: the only way to ask whether a listing was cached is to
        # change what a fresh listing would say, and then ask again.
        location /lcon/ {
            brix_s3                  on;
            brix_storage_backend     posix:{DATA_ROOT}/lcon;
            brix_s3_bucket           lcon;
            brix_s3_access_key       {ACCESS_KEY};
            brix_s3_secret_key       {SECRET_KEY};
            brix_s3_region           {REGION};
            brix_allow_write         on;
            brix_s3_list_cache       on;
            brix_s3_list_cache_ttl   60s;
        }

        location /lcoff/ {
            brix_s3                  on;
            brix_storage_backend     posix:{DATA_ROOT}/lcoff;
            brix_s3_bucket           lcoff;
            brix_s3_access_key       {ACCESS_KEY};
            brix_s3_secret_key       {SECRET_KEY};
            brix_s3_region           {REGION};
            brix_allow_write         on;
            brix_s3_list_cache       off;
            brix_s3_list_cache_ttl   60s;
        }

        location /lcdef/ {
            brix_s3                  on;
            brix_storage_backend     posix:{DATA_ROOT}/lcdef;
            brix_s3_bucket           lcdef;
            brix_s3_access_key       {ACCESS_KEY};
            brix_s3_secret_key       {SECRET_KEY};
            brix_s3_region           {REGION};
            brix_allow_write         on;
            brix_s3_list_cache_ttl   60s;
        }

        # ------------------------------------------------------------------ #
        # brix_zip_access — ZIP member access over GetObject                #
        # ------------------------------------------------------------------ #
        location /zipon/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/zipon;
            brix_s3_bucket       zipon;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_zip_access   on;
        }

        location /zipoff/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/zipoff;
            brix_s3_bucket       zipoff;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
            brix_zip_access   off;
        }

        location /zipdef/ {
            brix_s3              on;
            brix_storage_backend posix:{DATA_ROOT}/zipdef;
            brix_s3_bucket       zipdef;
            brix_s3_access_key   {ACCESS_KEY};
            brix_s3_secret_key   {SECRET_KEY};
            brix_s3_region       {REGION};
        }

        # The exposition face: same listener, no bucket, no credentials.
        location /metrics {
            brix_metrics on;
        }
    }
}

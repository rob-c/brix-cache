# FOUR cleartext GridFTP gateways and one /metrics face in ONE process — the
# measuring half of `brix_allow_write`, the fourth GridFTP gate and the
# one test_audit16ae_gridftp_gate_off_arms.py (file 31) left
# (test_audit16ai_gridftp_write_gate.py, 16th tranche).
#
# THIRTY-ONE configs in this tree write the token `on`.  The token `off` appears
# in NO config at all, and the two places that mean to be a read-only export are
# both absences:
#
#   nginx_gridftp_plain_ev_ro.conf   deletes the line and says so in its header
#   nginx_gridftp_metrics.conf       its header says the RO_PORT server writes
#                                    `brix_allow_write off` — the server
#                                    block below it writes no such line
#
# So the flag's disabling arm has never been written, and the only live probe of
# a disabled gate anywhere is one STOR
# (test_gridftp_engine_event.py::test_stor_readonly_export_denied).  The gate
# has SEVEN verbs behind it, in two places that behave differently:
#
#   ev_xfer_guards (ftp_ev_xfer.c:333)   STOR, APPE — refused BEFORE the data
#                                        channel and METERED, forbidden
#   ftp_ev_ns_mutate (ftp_ev_cmd.c:177)  MKD/XMKD, DELE, RMD/XRMD — each with
#                                        its own reply string, NO metric
#   brix_ftp_ev_cmd_rnfr (:406)          RNFR — no metric
#   brix_ftp_ev_cmd_rnto (:431)          RNTO — no metric, and reached only
#                                        after the rnfr_set pairing is consumed
#
# Every gateway carries its own export subtree.  The gate is the only thing that
# stands between a client and the tree, so a shared root would let one face's
# refused mutation be confused with another face's successful one — and the
# whole file is about which face let what through.
#
#   PORT      G_ON  — `brix_allow_write on`.  The control: every verb
#                     the gate governs must succeed here, or a 550 on another
#                     face proves nothing about the flag.
#   OFF_PORT  G_OFF — the literal `off`.  The never-written token.
#   ABS_PORT  G_ABS — the same server with the line DELETED: byte for byte what
#                     nginx_gridftp_plain_ev_ro.conf renders, and the control
#                     every G_OFF cell is compared against.
#   VER_PORT  G_VER — `off` beside an armed `brix_verify_write on`.  A
#                     checksum-verify knob on a server that can never write: the
#                     inert-companion shape #101 and #102 found on other planes,
#                     asked here of a knob file 31 measured only while writable.
#
# The metrics zone is process-wide (one slab from the stream postconfiguration),
# so the HTTP face reads the counters all four gateways feed.  That is the only
# way to see the asymmetry: a refused STOR books a {proto="gridftp"} row and a
# refused DELE books nothing.
#
# Cleartext, no RFC 2228 layer, so ftplib can drive the whole dialogue — the
# gate sits below the security layer and refuses identically either way.
#
# worker_processes 1 so a PASV listener opened by one command and dialled by the
# next is always the same worker's.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT + the four extra ports.
# Test-provided: BIND_HOST.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

http {
    access_log {LOG_DIR}/access.log;
    client_body_temp_path {TMP_DIR};

    server {
        listen {BIND_HOST}:{HTTP_PORT};

        location /metrics { brix_metrics on; }
    }
}

stream {
    # --- the writable control ---------------------------------------------
    server {
        listen {BIND_HOST}:{PORT};
        brix_gridftp             on;
        brix_export      {DATA_ROOT}/on;
        brix_allow_write on;
    }

    # --- the never-written token ------------------------------------------
    server {
        listen {BIND_HOST}:{OFF_PORT};
        brix_gridftp             on;
        brix_export      {DATA_ROOT}/off;
        brix_allow_write off;
    }

    # --- the same server with nothing written -----------------------------
    server {
        listen {BIND_HOST}:{ABS_PORT};
        brix_gridftp        on;
        brix_export {DATA_ROOT}/abs;
    }

    # --- a verify knob armed on a server that can never write --------------
    server {
        listen {BIND_HOST}:{VER_PORT};
        brix_gridftp              on;
        brix_export       {DATA_ROOT}/ver;
        brix_allow_write  off;
        brix_verify_write on;
    }
}

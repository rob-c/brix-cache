# Phase-116 reverse-DNS template WITHOUT a brix_resolver and WITHOUT a
# thread_pool directive, for tests/test_phase116_reverse_no_resolver.py.
# Launcher-provided: LOG_DIR TMP_DIR DATA_ROOT PORT ROOT_PORT.  Test-provided:
# BIND_HOST AUTHDB_PATH.
#
# The absence is the subject.  `brix_acc_resolve_hosts on` makes the authdb `h`
# rule depend on the peer's PTR name, and with no resolver policy the only
# backend is the thread-pool getnameinfo() in src/net/dns/reverse.c — a pool
# this configuration never declares.  brix_dns_backend_prepare() registers the
# default pool at merge time for exactly this shape; before it existed the
# lookup failed, was negative-cached, and every `h` rule silently stopped
# granting (the phase-116 regression against test_audit16q_acc_engine_flag_arms).
# Do NOT add `thread_pool` or `brix_resolver` here — that is the test.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 256; }

stream {
    brix_kv_zone zone=authz:1m key=32 val=8;

    server {
        listen {BIND_HOST}:{ROOT_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_authdb_engine xrdacc;
        brix_authdb {AUTHDB_PATH};
        brix_acc_audit all;
        brix_acc_resolve_hosts on;
        brix_access_log {LOG_DIR}/access.log;
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR};
    proxy_temp_path       {TMP_DIR};
    fastcgi_temp_path     {TMP_DIR};
    uwsgi_temp_path       {TMP_DIR};
    scgi_temp_path        {TMP_DIR};

    server {
        listen {BIND_HOST}:{PORT};
        location /metrics { brix_metrics on; }
    }
}

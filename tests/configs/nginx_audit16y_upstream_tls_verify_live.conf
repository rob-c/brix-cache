# Audit 16y — the outbound redirector TLS leg, driven live against a
# kXR_gotoTLS upstream whose certificate the test chooses.
#
# Eight listeners, one export, one worker.  Every plane differs only in what it
# trusts and what it pins: `brix_upstream_tls_verify` is server-scoped, and so
# are the CA and the pinned name, so each cell needs a `listen` of its own.
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 64; }

stream {
    # 1. The armed default: a CA that signs the peer, a pinned name the peer
    #    carries, and `brix_upstream_tls_verify` left unwritten (merges to on).
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_HOST}:{STUB_GOOD_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_ca {GOOD_CA};
        brix_upstream_tls_name {UP_HOST};
    }

    # 2. The same cell with the arm the corpus never wrote: `verify on`.
    server {
        listen {BIND_HOST}:{ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_HOST}:{STUB_GOOD_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_ca {GOOD_CA};
        brix_upstream_tls_name {UP_HOST};
        brix_upstream_tls_verify on;
    }

    # 3. Verification armed against an upstream the CA never signed.
    server {
        listen {BIND_HOST}:{EVIL_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_HOST}:{STUB_EVIL_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_ca {GOOD_CA};
        brix_upstream_tls_name {UP_HOST};
        brix_upstream_tls_verify on;
    }

    # 4. The documented opt-out: verification off and no CA at all, pointed at
    #    the upstream only that opt-out could ever have accepted.
    server {
        listen {BIND_HOST}:{NOCA_OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_HOST}:{STUB_EVIL_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_verify off;
    }

    # 5. Verification off WITH a CA: the chain still has to validate, the name
    #    no longer does — the peer here is signed by {OTHER_CA} and names a host
    #    that is not the one the leg dialled.
    server {
        listen {BIND_HOST}:{CA_OFF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_HOST}:{STUB_OTHER_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_ca {OTHER_CA};
        brix_upstream_tls_verify off;
    }

    # 6. The same peer with verification armed: the chain validates and the
    #    hostname pin is the only thing left to fail.
    server {
        listen {BIND_HOST}:{HOSTPIN_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_HOST}:{STUB_OTHER_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_ca {OTHER_CA};
        brix_upstream_tls_name {UP_HOST};
        brix_upstream_tls_verify on;
    }

    # 7. No pinned name and an upstream spelled as an address literal: the pin
    #    falls back to that spelling.  The peer's certificate carries the
    #    matching IP SAN.
    server {
        listen {BIND_HOST}:{IP_PIN_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_IP}:{STUB_GOOD_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_ca {GOOD_CA};
        brix_upstream_tls_verify on;
    }

    # 8. No pinned name and an upstream spelled as a DNS name the certificate
    #    carries: the same fallback, resolved the other way.
    server {
        listen {BIND_HOST}:{FALLBACK_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_upstream {UP_HOST}:{STUB_GOOD_PORT};
        brix_upstream_tls on;
        brix_upstream_tls_ca {GOOD_CA};
        brix_upstream_tls_verify on;
    }
}

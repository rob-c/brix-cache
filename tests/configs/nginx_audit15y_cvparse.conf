# Parse-tier scaffold for the three CVMFS origin-policy enums
# (test_audit15y_cvmfs_origin_policy.py).
#
# The running instances live in nginx_audit15y_cvsolo.conf and
# nginx_audit15y_cvpair.conf; this one is never started — it exists so
# `nginx -t` can be asked about a single line.  It writes none of the three
# directives itself, so a case supplies whichever it needs: a duplicate-
# directive error would land before the value under test and would look exactly
# like the rejection a negative case is trying to prove.
#
# Four slots, named here without their braces because the renderer substitutes
# every occurrence of a placeholder, comments included, and a multi-line value
# spliced into a comment turns the tail of that comment into live config:
#
#   KNOBS      location-level lines — the token under test.
#   LOC_EXTRA  a SECOND cvmfs location, for the case that asks whether two
#              locations disagreeing about a process-global directive are
#              diagnosed at parse time (they are not).
#   HTTP_EXTRA http-level lines.  All three directives are MAIN|SRV|LOC within
#              http, so a line here must parse.
#   OUTER      main-context lines, outside http {} entirely — the placement
#              negative.  "MAIN_CONF" reads like "the top of the file", and
#              nginx must refuse that rather than silently ignore it.
#
# `nginx -t` does not bind, so the listen port is a placeholder and BACKEND is
# never connected to; both only have to survive the parser.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

{OUTER}events { worker_connections 64; }

http {
    # `nginx -t` opens the access log, and the default path is under a prefix
    # this scaffold never creates.
    access_log off;

{HTTP_EXTRA}    server {
        listen {PORT};

        location /cvmfs/ {
            brix_cvmfs           on;
            brix_cache_store     posix:{CACHE};
            brix_storage_backend "{BACKEND}";
{KNOBS}        }
{LOC_EXTRA}    }
}

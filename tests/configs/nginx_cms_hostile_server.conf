# CMS server for the hostile-wire test fixture.  A short login deadline keeps
# the slowloris safety assertion fast while retaining a separate deadline from
# the default production configuration.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 128; }
stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
        brix_manager_mode on;
        brix_cms_server on;
        brix_cms_server_interval 60;
        brix_cms_server_login_timeout 2s;
    }
}

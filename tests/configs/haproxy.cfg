global
    log /dev/null local0
    maxconn 512
    daemon
    stats socket {LOG_DIR}/haproxy.sock mode 600 level user

defaults
    mode tcp
    timeout connect 2s
    timeout check   2s
    timeout client  60s
    timeout server  60s
    retries         3
    option          redispatch

frontend brix_frontend
    bind {BIND_HOST}:{PORT}
    default_backend brix_backends

backend brix_backends
    balance roundrobin
    option tcp-check
    tcp-check connect
    # Verify the repo-defined root handshake before marking a member healthy.
    tcp-check send-binary 00000000000000000000000000000004000007dc
    tcp-check expect binary 0000000000000008
    server nginx1 {MAP_A_HOST}:{MAP_A_PORT} check inter 500ms
    server nginx2 {MAP_B_HOST}:{MAP_B_PORT} check inter 500ms

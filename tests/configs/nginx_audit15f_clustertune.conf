# Cluster-selection and cluster-panel tuning (test_audit15f_cluster_tuning.py,
# registry lifecycle) — audit §B1: brix_cms_load_weight and
# brix_dashboard_cluster_stale_after are configured nowhere in the suite, so
# neither the manager's load-weighted selection blend nor the per-location
# staleness verdict has ever been driven.
#
# One process, one registry, four faces: the root:// redirector face kXR_locate
# probes read the selection verdict off, the CMS server face fake Python data
# nodes register into, and two dashboard faces over the SAME registry whose
# staleness windows differ (90s and 1ms).  Two SERVER blocks rather than two
# locations: the dashboard routes on the literal URI /brix/api/v1/cluster
# (module_dispatch.c), so a second location could never be reached for it.
# Both dashboard faces carry a password AND brix_dashboard_anonymous: without
# a password check_auth returns OK for everyone (auth.c:233) and the payload is
# never redacted, so a cookie-less GET here is a genuine anonymous read.  The
# cluster panel is on the anon-allowed list, and every field these tests assert
# on survives redaction — only host/port/paths/vnid/stage are withheld, which
# is itself asserted.
#
# The per-test manager policy (brix_cms_load_weight) arrives as a substituted
# directive block rather than being written here because it is a process-global
# set once at merge: the two arms of the weight cross are two PROCESSES.  The
# accept-leg dead-peer knobs (brix_cms_server_tcp_keepalive / _tcp_user_timeout)
# arrive the same way on the CMS server face.  Keep this header free of loose
# placeholder tokens: a substituted multi-line block would break out of the
# comment.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + CMS_PORT HTTP_PORT
# HTTP2_PORT.  Test-provided: BIND_HOST CMS_EXTRA CMSSRV_EXTRA (either extra
# may be empty).
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    # root:// redirector face — clients locate here.
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_manager_mode on;
        brix_listen_port {PORT};
        {CMS_EXTRA}
    }

    # CMS server face — fake data nodes register here.
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_server on;
        brix_cms_server_interval 1;
        {CMSSRV_EXTRA}
    }
}

http {
    access_log off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    # face A — the generous window: a node heartbeating every second is fresh.
    server {
        listen {BIND_HOST}:{HTTP_PORT};
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;  # whole suite shares one client IP
            brix_dashboard_password "pw";
            brix_dashboard_anonymous on;
            brix_dashboard_cluster_stale_after 90s;
        }
    }

    # face B — the same registry through a 1ms window: any heartbeat age at all
    # is over it, so every live node reads as stale.
    server {
        listen {BIND_HOST}:{HTTP2_PORT};
        location /brix/ {
            brix_dashboard on;
            brix_admin_rate_limit off;
            brix_dashboard_password "pw";
            brix_dashboard_anonymous on;
            brix_dashboard_cluster_stale_after 1ms;
        }
    }
}

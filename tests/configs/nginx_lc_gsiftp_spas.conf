# phase-115 W5.3 — SPAS, the striped data channel, on the outbound FTP driver.
#
# Five WebDAV fronts over three origins.  `streams=<n>` is the only knob, and
# it is a CEILING rather than a demand: unlike `mode=e` and `prot=p`, which say
# what the bytes ARE and never degrade, this one says how FAST the same,
# identically verified bytes arrive, so every way of not striping ends at the
# single pinned connection the driver has always opened.
#
#   PORT            streams=4 over the striping origin      — the subject
#   UNSTRIPED_PORT  no streams= over the SAME origin        — the control
#   PLAIN_PORT      streams=4 over an origin that never advertises SPAS
#   BUDGET_PORT     streams=2 over an origin that lists 4   — over budget
#   BOUNCE_PORT     streams=4 over an origin advertising a stripe on
#                   127.0.0.2 — an address it does not own  — THE negative
#
# The control front matters as much as the subject: it holds the origin fixed
# and varies only the store line, so a byte-for-byte difference between it and
# PORT is attributable to striping and to nothing about the lab.  PORT and
# BUDGET_PORT do the reverse — same origin, different budget — which is what
# makes "the driver refused an over-budget stripe list" a statement about the
# budget rather than about the origin.
#
# Read-only: SPOR, the striped-STORE counterpart, would require this driver to
# LISTEN, and a passive client that never binds is a deliberate boundary — see
# the phase-115 register, W5.3.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
thread_pool gsiftp_io threads=8 max_queue=128;
events { worker_connections 128; }

http {
    server {
        listen {BIND_HOST}:{PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {SPAS_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE} mode=e streams=4;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{UNSTRIPED_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {UNSTRIPED_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE} mode=e;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{PLAIN_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {PLAIN_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{PLAIN_ORIGIN_PORT}{ORIGIN_BASE} mode=e streams=4;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{BUDGET_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {BUDGET_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{ORIGIN_PORT}{ORIGIN_BASE} mode=e streams=2;
            brix_thread_pool gsiftp_io;
        }
    }
    server {
        listen {BIND_HOST}:{BOUNCE_PORT};
        location / {
            brix_webdav on;
            brix_webdav_auth none;
            brix_export {BOUNCE_EXPORT};
            brix_storage_backend ftp://{BIND_HOST}:{BOUNCE_ORIGIN_PORT}{ORIGIN_BASE} mode=e streams=4;
            brix_thread_pool gsiftp_io;
        }
    }
}

# Parse-tier scaffold for brix_signing_policy (test_audit15v_signing_policy.py).
#
# The running instance lives in nginx_audit15v_sigpolicy.conf; this one is never
# started — it exists so `nginx -t` can be asked about a single line.  It writes
# no brix_auth and no PKI of its own, so a case supplies whichever of those it
# needs: a duplicate-directive error would land before the value under test and
# would look exactly like the rejection a negative case is trying to prove.
#
# Two slots, named here without their braces because the renderer substitutes
# every occurrence of a placeholder, comments included, and a multi-line value
# spliced into a comment turns the tail of that comment into live config:
#
#   KNOBS         server-level lines — the token under test, plus the GSI block
#                 around it for the cases that need the store to be BUILT (the
#                 "require needs a hashed CA directory" refusal is raised by the
#                 store builder, not by the enum parser).
#   STREAM_EXTRA  stream-level lines, for the placement negatives: the directive
#                 is NGX_STREAM_SRV_CONF, so a line here must be refused with
#                 "directive is not allowed here".
#
# `nginx -t` does not bind, so the listen port is a placeholder.
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;

events { worker_connections 64; }

stream {
{STREAM_EXTRA}    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
{KNOBS}    }
}

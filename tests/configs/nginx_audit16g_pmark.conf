# The six pmark flags at VALUE granularity (audit tranche 16, file 7;
# test_audit16g_pmark_flags.py).  Thirteen WebDAV locations on ONE listener plus
# /metrics.
#
# WHY LOCATIONS AND NOT LISTENERS
#   brix_pmark* is NGX_HTTP_LOC_CONF (directives.h's X-macro instantiated at
#   webdav/directives_zones.h:75), so an arm is a location.  Every location
#   repeats brix_webdav/backend/auth because a NESTED location inherits the
#   merged conf but NOT the content handler (audit DEFECT CANDIDATE #71), so a
#   parent-plus-children layout would be served by nginx's static handler.
#
# WHY ONE LISTENER IS BOUND TWICE
#   {V6_LISTEN} adds `listen [::1]:{PORT};` when the host has an IPv6 loopback.
#   The in-band flow-label technique only exists over real IPv6
#   (brix_pmark_flowlabel_apply declines an AF_INET or v4-mapped peer), so the
#   flowlabel arms are unreachable as a subject over 127.0.0.1 — but they are
#   still the same server, so this is a second listen and not a second instance.
#
# THE ARMS  (three per flag: on / off / absent — `base` IS the absent arm of the
# four flags whose merge default it already carries, which is the point rather
# than a shortcut; see config.c:44-50)
#
#   base    brix_pmark on + http_plain on, nothing else.  The reference arm:
#           master ON, firefly ABSENT(=1), flowlabel ABSENT(=1),
#           scitag_cgi ABSENT(=1), firefly_origin ABSENT(=0).
#   moff    brix_pmark off              mabs   brix_pmark absent
#   ffon    brix_pmark_firefly on       ffoff  brix_pmark_firefly off
#   cgion   brix_pmark_scitag_cgi on    cgioff brix_pmark_scitag_cgi off
#   ploff   brix_pmark_http_plain off   plabs  brix_pmark_http_plain absent
#   oron    firefly_origin on           oroff  firefly_origin off
#   flon    brix_pmark_flowlabel on     floff  brix_pmark_flowlabel off
#
# brix_allow_write is on for `base` and `ploff` ONLY, because those two carry the
# COPY probe that shows TPC is marked whatever http_plain says (dispatch.c:108).
# It costs two [warn] advisories at startup and no more; every other arm is
# read-only so it earns none.
#
# Every arm names itself in brix_pmark_appname, so a captured firefly is
# attributable to the location that produced it (context.application) even when
# several arms map to the same experiment/activity pair.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT DATA_ROOT.
# Test-provided: BIND_HOST V6_LISTEN DEFS FIREFLY_HOST FIREFLY_PORT.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

# 40 keep-alive client connections are held open at once by the flow-label
# exhaustion probe, which is more than the 64 the other pmark config allots.
events { worker_connections 256; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};
        {V6_LISTEN}

        # ---- the reference arm ------------------------------------------- #
        location /base/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-base;
        }

        # ---- brix_pmark: the master switch ------------------------------- #
        location /moff/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                off;
            brix_pmark_http_plain     on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-moff;
        }

        location /mabs/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark_http_plain     on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-mabs;
        }

        # ---- brix_pmark_firefly: out-of-band reporting -------------------- #
        location /ffon/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_firefly        on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-ffon;
        }

        location /ffoff/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_firefly        off;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-ffoff;
        }

        # ---- brix_pmark_scitag_cgi: the client-supplied override ---------- #
        location /cgion/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_scitag_cgi     on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-cgion;
        }

        location /cgioff/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_scitag_cgi     off;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-cgioff;
        }

        # ---- brix_pmark_http_plain: mark plain GET/PUT at all ------------- #
        location /ploff/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_allow_write          on;
            brix_pmark                on;
            brix_pmark_http_plain     off;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-ploff;
        }

        location /plabs/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-plabs;
        }

        # ---- brix_pmark_firefly_origin: the copy to the client ------------ #
        location /oron/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_firefly_origin on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-oron;
        }

        location /oroff/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_firefly_origin off;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-oroff;
        }

        # ---- brix_pmark_flowlabel: the in-band IPv6 technique ------------- #
        location /flon/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_flowlabel      on;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-flon;
        }

        location /floff/ {
            brix_webdav               on;
            brix_storage_backend      posix:{DATA_ROOT};
            brix_webdav_auth          none;
            brix_pmark                on;
            brix_pmark_http_plain     on;
            brix_pmark_flowlabel      off;
            brix_pmark_firefly_dest   {FIREFLY_HOST}:{FIREFLY_PORT};
            brix_pmark_defsfile       {DEFS};
            brix_pmark_map_experiment default atlas;
            brix_pmark_map_activity   atlas default write;
            brix_pmark_appname        arm-floff;
        }

        location /metrics {
            brix_metrics on;
        }
    }
}

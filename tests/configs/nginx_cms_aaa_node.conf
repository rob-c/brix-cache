# CMS/AAA leaf data node registering UP to a redirector across a WAN link that
# a brix-fault-proxy impairs (latency/jitter/segmentation/loss/black-hole).
# Template for test_cms_aaa_join_noise.py.
#
# Shape mirrors a real AAA site node: a /store namespace advertised to the
# redirector, a short heartbeat so join/rejoin is observable inside a test
# budget, and an HTTP /metrics listener so the federation-join counters
# (brix_cms_logins_total / _connect_failures_total / _registered_links) can be
# scraped while the link is being abused.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT BIND_HOST METRICS_PORT.
# Test-provided: MANAGER_PORT (the fault proxy's listen port, not the peer's).
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
daemon on;
events { worker_connections 512; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on; brix_storage_backend posix:{DATA_ROOT}; brix_auth none;
        brix_listen_port {PORT};
        brix_cms_manager {BIND_HOST}:{MANAGER_PORT};
        brix_cms_paths /store;
        brix_cms_interval 1;
        brix_cms_read_timeout 3s;
    }
}

http {
    server {
        listen {BIND_HOST}:{METRICS_PORT};
        location /metrics {
            brix_metrics on;
        }
    }
}

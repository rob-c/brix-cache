# brix_oss_cgroup postures (test_oss_cgroup.py, registry lifecycle): a posix
# root:// export whose kXR_Qspace report advertises the configured space-group
# name as oss.cgroup.
# Launcher-provided: LOG_DIR PORT.  Test-provided: BIND_HOST DATA_DIR
# CGROUP_LINE ("brix_oss_cgroup <name>;" or empty for the "default" default).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_DIR};
        brix_auth none;
        {CGROUP_LINE}
    }
}

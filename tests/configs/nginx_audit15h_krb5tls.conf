# krb5 x TLS (test_audit15h_krb5_tls.py, §B1.8 — `brix_auth krb5` was only ever
# configured on cleartext listeners; the acceptor had never been asked to run
# under an in-protocol TLS upgrade).
#
# Three planes off ONE realm and ONE keytab, so the only variable between them
# is the transport:
#
#   {PORT}         krb5 + `brix_tls on`: the client authenticates with an AP-REQ
#                  and then upgrades the channel (roots://).  This is the row.
#   {PLAIN_PORT}   the identical acceptor with the TLS block removed.  It is the
#                  control: if the ticket works here and not on {PORT}, the
#                  failure belongs to the cross rather than to the KDC, the
#                  keytab or the principal.
#   {TLSREQ_PORT}  krb5 + TLS + `brix_tls_require all`, which refuses a
#                  cleartext kXR_login with kXR_TLSRequired
#                  (handshake/policy.c:119).  Without this plane nothing proves
#                  a krb5 server can be stopped from authenticating in the
#                  clear — the acceptor would happily do the AP-REQ exchange on
#                  a plain socket, ticket session key and all.
#
# `listen {PORT};` with no address (the gsi-handshake templates' shape) rather
# than {BIND_HOST}: the TLS half is verified against the host cert's SANs, so
# the test connects by a name, and the server has to answer on whichever
# loopback address that name resolves to.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + PLAIN_PORT TLSREQ_PORT.
# Test-provided: PRINCIPAL KEYTAB CERT KEY CA (keytab, cert, key and CA must all
# exist at config-parse time — `nginx -t` runs before the daemon starts).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- krb5 over an in-protocol TLS upgrade -------------------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_allow_write on;
        brix_tls on;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
    }

    # --- the same acceptor, no TLS: the attribution control ------------------
    server {
        listen {PLAIN_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_allow_write on;
    }

    # --- krb5 + TLS with every capability gated on TLS -----------------------
    server {
        listen {TLSREQ_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth krb5;
        brix_krb5_principal {PRINCIPAL};
        brix_krb5_keytab    {KEYTAB};
        brix_allow_write on;
        brix_tls on;
        brix_tls_require all;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
    }
}

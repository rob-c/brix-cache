# Fixed-extent `block:<device>` server export — registry lifecycle template.
#
# The device is a REGULAR FILE used as one (sd_block_init probes st_size when
# the target is not S_ISBLK), so the plane is drivable by an unprivileged test
# with no loop device.  `brix_storage_backend` carries no block_size argument,
# so extent_size stays 0 and the whole device is the single extent "/0"; every
# other name ("/1", "/etc", any escape) is ENOENT by sd_block_parse_index.
#
# `brix_allow_write on` is deliberate: it is what lets a test reach the
# driver's own extent-confinement guard (a write crossing the extent end is
# refused ENOSPC, never truncated into a neighbour) instead of stopping at the
# export ACL.  The test supplies {DEVIMG} (which must already exist — the
# backend is built at config time) and {BIND_HOST}; the launcher injects
# {PORT} and {LOG_DIR}.  {LOG_DIR}/nginx.pid is the registry's stop pidfile —
# do not rename.
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;
worker_processes 1;
events { worker_connections 64; }
stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        # The namespace comes from the DEVICE, not the filesystem: brix_export is
        # only the ACL root the write check runs against (the default "/" is not
        # writable for an unprivileged worker, which fails the config-time check).
        brix_export {DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_storage_backend block:{DEVIMG};
        brix_access_log {LOG_DIR}/access.log;
    }
}

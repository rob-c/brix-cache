# The WebDAV response surface — §Method step 2 sharpened
# (test_audit15n_webdav_cors.py).
#
# Tranche 13 closed the last block-granularity pair, so tranche 14 sharpens the
# instrument instead: step 2 counted a directive as covered when its NAME
# appeared anywhere in the test corpus, which counts a directive as covered for
# merely sitting in a template some test launches.  `nginx -t` then proves it
# parses and merges, and nothing whatever proves what it DOES.  Four of the
# thirteen survivors are this file's subject, and they are all response-shaping:
#
#   brix_webdav_cors_origin · brix_webdav_cors_credentials
#   brix_webdav_cors_max_age · brix_webdav_redirect_window
#
# They are co-resident on purpose.  CORS is emitted in the ACCESS phase
# (access.c:426) and the 307 is built in the CONTENT phase (dispatch.c:579), so
# a browser following a redirect-to-dataserver depends on the two interacting —
# a 307 with no Access-Control-Allow-Origin is a redirect a fetch() can never
# follow, and no file in the tree had ever put the two on one listener.
#
# THE LOCATIONS ({PORT}, one http server block)
#   /nocors/    no allowlist at all.  CORS is opt-in (origin_allowed(),
#               cors.c:31 — an empty list denies), so this is the control that
#               says the headers below come from the directive and not from
#               nginx.
#   /cors/      two concrete origins and an explicit max-age.  The directive is
#               repeatable (webdav_conf_add_cors_origin appends), so both
#               entries must match and nothing else may.
#   /wild/      the "*" entry with credentials OFF — the only shape allowed to
#               answer the literal "*".
#   /wildcred/  the "*" entry with credentials ON.  cors_emit_allow_origin()
#               (cors.c:72) then echoes the CONCRETE origin, which keeps the
#               letter of the CORS rule (never "*" with credentials) while
#               handing every origin on the internet credentialed access.  See
#               DEFECT CANDIDATE #48 in the test module.
#   /rdr45/     redirect-to-dataserver with a 45-second signing window, and its
#               own allowlist so the 307 is browser-followable.
#   /rdr2/      the same with a 2-second window — short enough that a test can
#               outlive it and watch the data-server half refuse the handoff.
#               Both faces are ALSO the data server: the redirect points back at
#               {PORT} and the same URI, where the loop guard (rdr_eligible(),
#               redirect.c:206 — a request already carrying brixrdr.mac is not
#               eligible) turns the second visit into a local serve.
#   = /metrics  brix_webdav_cors_total{event="allowed"|"denied"|"preflight"}.
#
# THE STREAM BLOCKS exist only so brix_srv_select() has something to select.
# webdav_redirect_dataserver() DECLINES (serves locally) when the CMS registry
# is empty, so a member must register before any 307 can be observed:
#   {MEMBER_PORT}  a root data server that registers with the manager below.
#                  Its advertised port is overridden by brix_webdav_redirect_
#                  port, so what it exports is irrelevant — only its presence.
#   {CMS_PORT}     the CMS listener it registers with.  brix_cms_server replaces
#                  the stream handler for its whole server block, so it needs a
#                  port of its own.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR + ledger extras MEMBER_PORT
# CMS_PORT.  Session-provided: BIND_HOST.  Test-provided: SECRET.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    # --- a cluster member, so the redirect has a target -------------------- #
    server {
        listen {BIND_HOST}:{MEMBER_PORT};
        brix_listen_port     {MEMBER_PORT};
        brix_root            on;
        brix_auth            none;
        brix_storage_backend posix:{DATA_ROOT};
        brix_cms_manager     {BIND_HOST}:{CMS_PORT};
        brix_cms_paths       /;
        brix_cms_interval    1;
    }

    # --- the manager's CMS registration face ------------------------------- #
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_cms_server          on;
        brix_cms_server_interval 1;
    }
}

http {
    access_log            off;
    client_body_temp_path {TMP_DIR}/cb;
    proxy_temp_path       {TMP_DIR}/pr;
    fastcgi_temp_path     {TMP_DIR}/fc;
    uwsgi_temp_path       {TMP_DIR}/uw;
    scgi_temp_path        {TMP_DIR}/sc;

    server {
        listen {BIND_HOST}:{PORT};
        server_name localhost;

        # The control: WebDAV with no CORS directives at all.  cors_origins is
        # a PTR field (BRIX_MERGE_PTR, config_merge.c:94), so leaving the
        # server level free of brix_webdav_cors_origin is what keeps this
        # location's allowlist genuinely empty rather than inherited.
        location /nocors/ {
            brix_webdav          on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth     none;
        }

        # Two concrete origins, one explicit max-age.
        location /cors/ {
            brix_webdav              on;
            brix_storage_backend     posix:{DATA_ROOT};
            brix_webdav_auth         none;
            brix_webdav_cors_origin  https://portal.example.org;
            brix_webdav_cors_origin  https://notebook.example.org;
            brix_webdav_cors_max_age 900;
        }

        # "*" without credentials: the literal star is legal here and only here.
        # No brix_webdav_cors_max_age — the 86400 default (config_merge.c:96)
        # is a claim this location makes and /cors/ cannot.
        location /wild/ {
            brix_webdav             on;
            brix_storage_backend    posix:{DATA_ROOT};
            brix_webdav_auth        none;
            brix_webdav_cors_origin *;
        }

        # "*" WITH credentials.  DEFECT CANDIDATE #48 lives here.
        location /wildcred/ {
            brix_webdav                  on;
            brix_storage_backend         posix:{DATA_ROOT};
            brix_webdav_auth             none;
            brix_webdav_cors_origin      *;
            brix_webdav_cors_credentials on;
        }

        # The two signing windows.  brix_webdav_redirect_port points the 307
        # back at this same listener, so this block is both manager and data
        # server and the handoff is verified by the same brix_http_secretkey.
        location /rdr45/ {
            brix_webdav                      on;
            brix_storage_backend             posix:{DATA_ROOT};
            brix_webdav_auth                 none;
            brix_webdav_cors_origin          https://portal.example.org;
            brix_webdav_redirect_dataserver  on;
            brix_webdav_redirect_port        {PORT};
            brix_webdav_redirect_window      45;
            brix_http_secretkey              {SECRET};
        }

        location /rdr2/ {
            brix_webdav                      on;
            brix_storage_backend             posix:{DATA_ROOT};
            brix_webdav_auth                 none;
            brix_webdav_redirect_dataserver  on;
            brix_webdav_redirect_port        {PORT};
            brix_webdav_redirect_window      2;
            brix_http_secretkey              {SECRET};
        }

        location = /metrics { brix_metrics on; }
    }
}

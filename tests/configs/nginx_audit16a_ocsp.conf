# brix_ocsp / brix_ocsp_soft_fail at VALUE granularity
# (test_audit16a_ocsp_flags.py) — the 16th tranche.  The audit's Method counts
# directive NAMES, and a flag's name is answered by ONE of its two tokens; run
# per (directive, VALUE) over the 128 `ngx_conf_set_flag_slot` directives, 106
# pairs have never been written in any form.  These three are worse than that:
# `brix_ocsp`, `brix_ocsp_soft_fail` and `brix_ocsp_stapling` are the
# only flags whose BOTH arms are unwritten AND whose branch is a security
# decision — src/auth/gsi/auth_cert.c:291 `if (conf->ocsp.enable)` has never
# been entered by any test in the tree.
#
# Both flags are `server {}`-level and their whole observable is a GSI login
# verdict, so every arm is a listener on ONE instance sharing ONE trust store:
#
#   {PORT}       brix_ocsp off             — no query is ever sent
#   {ON_PORT}    enable on + soft_fail on         — query, tolerate no answer
#   {HARD_PORT}  enable on + soft_fail off        — query, REQUIRE an answer
#   {DEF_PORT}   enable on, soft_fail ABSENT      — pins the merge default (on)
#
# The responder URL is NOT a directive: brix_ocsp_check_cert() takes it from the
# leaf certificate's authorityInfoAccess extension (X509_get1_ocsp(leaf), ocsp.c
# :143), so which responder a login talks to — and whether one answers at all —
# is a property of the CREDENTIAL, not of this file.  The test mints one proxy
# per verdict, each with its own AIA, and all four listeners see all of them.
#
# brix_crl is deliberately absent: the credentials differ in what the RESPONDER
# says about them, and a CRL would put a second revocation verdict in front of
# the one under test.  (`brix_crl_mode` defaults to `try`, which arms nothing
# when no CRL was loaded — see test_audit15u_crl_mode.py §C.)
#
# brix_allow_write is off everywhere: every assertion is a login verdict on a
# read, and a write gate would give the refusals a second possible reason.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT + ON_PORT HARD_PORT DEF_PORT (and
# RESP_PORT / DEAD_PORT, which belong to the responder and to nothing in this
# file).  Test-provided: CERT KEY CA (every path must exist at config-parse
# time).
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

stream {
    # --- enable off: the revocation branch is never entered ------------------
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_ocsp     off;
    }

    # --- enable on, soft_fail on: only REVOKED denies ------------------------
    server {
        listen {ON_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_ocsp     on;
        brix_ocsp_soft_fail  on;
    }

    # --- enable on, soft_fail off: anything short of a GOOD answer denies ----
    server {
        listen {HARD_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_ocsp     on;
        brix_ocsp_soft_fail  off;
    }

    # --- enable on, soft_fail absent: whatever the merge default is ----------
    server {
        listen {DEF_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth gsi;
        brix_certificate     {CERT};
        brix_certificate_key {KEY};
        brix_trusted_ca      {CA};
        brix_ocsp     on;
    }
}

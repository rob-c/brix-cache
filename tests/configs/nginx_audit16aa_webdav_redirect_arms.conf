# Audit 16aa — §6.1 brix_webdav_redirect_dataserver, both arms on ONE manager.
#
# The `off` arm is only observable against an `on` arm that really redirects,
# and that needs a populated CMS registry: the stream faces below are what makes
# the five http locations differ by one directive rather than by whether a data
# node exists.  Three faces on one worker and one SHM registry:
#   * stream root:// manager ({PORT}) — the instance's readiness port;
#   * stream root:// CMS server ({CMS_PORT}) — a fake data node registers here;
#   * http WebDAV front ({HTTP_PORT}) — five locations, one flag apart.
#
# {DS_HTTP_PORT} is the port the Location is BUILT to name; the test listens
# there with a recording server, so "the handoff went somewhere" and "the signed
# CGI arrived with it" are wire facts rather than a parse of the header.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT TMP_DIR CMS_PORT HTTP_PORT
# DS_HTTP_PORT.  Test-provided: BIND_HOST SECRET.
worker_processes 1;
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;

events { worker_connections 128; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_manager_mode on;
        brix_listen_port {PORT};
    }
    server {
        listen {BIND_HOST}:{CMS_PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_cms_server on;
        brix_cms_server_interval 1;
    }
}

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path {TMP_DIR}/pt;
    fastcgi_temp_path {TMP_DIR}/ft;
    uwsgi_temp_path {TMP_DIR}/ut;
    scgi_temp_path {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{HTTP_PORT};

        # Armed: the manager hands the data-bearing methods off.
        location /on/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_allow_write on;
            brix_webdav_redirect_dataserver on;
            brix_webdav_redirect_port {DS_HTTP_PORT};
            brix_webdav_redirect_window 120;
            brix_webdav_secretkey {SECRET};
        }

        # The arm no test has written, though the corpus claims it in prose.
        location /off/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_allow_write on;
            brix_webdav_redirect_dataserver off;
            brix_webdav_redirect_port {DS_HTTP_PORT};
            brix_webdav_redirect_window 120;
            brix_webdav_secretkey {SECRET};
        }

        # The same thing unwritten, so the merge default is measured and not
        # read off config_merge.c.
        location /absent/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_allow_write on;
            brix_webdav_redirect_port {DS_HTTP_PORT};
            brix_webdav_redirect_window 120;
            brix_webdav_secretkey {SECRET};
        }

        # Redirect off AND authentication required: the half of §6.1 that
        # ACCEPTS a handoff is in the access phase, not behind this flag.
        location /off-authed/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth required;
            brix_webdav_redirect_dataserver off;
            brix_webdav_secretkey {SECRET};
        }

        # Armed with no shared key: the handoff is still made, unsigned.
        location /on-nokey/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_ROOT};
            brix_webdav_auth none;
            brix_webdav_redirect_dataserver on;
            brix_webdav_redirect_port {DS_HTTP_PORT};
            brix_webdav_redirect_window 120;
        }
    }
}

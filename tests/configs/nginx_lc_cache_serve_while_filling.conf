# brix_cache_serve_while_filling (audit §4.5) — test_phase115_serve_while_filling.py.
#
# A root:// front whose cache decorator sits over a posix source. With the knob
# set, a cache MISS whose whole-file fill is already in flight FOLLOWS that fill
# (sd_cache_follow.c) instead of serialising behind it: it reads the staged
# bytes below the fill frontier and is told to retry past it. The coordination
# channel is a plain marker file under the cache store, so the tests drive it
# by planting a marker + staged file rather than racing a real fill.
#
# The source is posix rather than a remote origin to keep this to ONE listener
# (lifecycle ladder slots are a packed, shared budget); the follower sits in the
# cache decorator's miss path above the source driver and behaves the same
# whatever source is composed under it.
#
# Launcher-provided: LOG_DIR PORT TMP_DIR DATA_ROOT.
# Session-provided: BIND_HOST.
# Test-provided: CACHE_ROOT EXPORT_ROOT SWF (the no-progress deadline, seconds)
#                VERIFY (an optional `brix_cache_verify ...;` line, else "")
daemon on;
worker_processes 1;
thread_pool default threads=2 max_queue=256;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 256; }

stream {
    server {
        listen {BIND_HOST}:{PORT};
        brix_root            on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth            none;
        brix_export          {EXPORT_ROOT}/swf;
        brix_cache_store     posix:{CACHE_ROOT}/swf;
        brix_cache_serve_while_filling {SWF};
{VERIFY}        brix_access_log      {LOG_DIR}/brix_access.log;
    }
}

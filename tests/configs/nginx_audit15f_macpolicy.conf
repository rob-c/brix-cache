# WebDAV macaroon issuance policy (test_audit15f_macaroon_issue_policy.py,
# registry lifecycle) — audit §B1: brix_webdav_macaroon_location and
# brix_webdav_macaroon_max_validity are configured nowhere in the suite, so
# neither the stamped issuer location nor the ceiling on a requested validity
# has ever been driven.
#
# Both knobs are loc-conf, so ONE server with two locations is the whole cross:
# /open/ is the untouched default face (location derived from the request's
# scheme + Host header, the merged 86400s maximum), /tight/ carries a foreign
# issuer URI and a 120s maximum.  Everything else — backend, auth mode, secret
# — is identical between the two, so any difference in an issued macaroon is
# these two directives and nothing else.
#
# brix_webdav_token_issuer is deliberately NOT set: it would pin validation to
# a single location (validate.c token_validate_macaroon) and mask which of the
# three sources mac_build_location actually picked.
#
# Launcher-provided: LOG_DIR TMP_DIR PORT.  Test-provided via template_values
# (the directories are seeded under tmp_path and must exist at config-parse
# time): BIND_HOST DATA_DIR CADIR SECRET_HEX ISSUER_URI.
worker_processes 1;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
daemon on;

events { worker_connections 64; }

http {
    client_body_temp_path {TMP_DIR}/cbt;
    proxy_temp_path       {TMP_DIR}/pt;
    fastcgi_temp_path     {TMP_DIR}/ft;
    uwsgi_temp_path       {TMP_DIR}/ut;
    scgi_temp_path        {TMP_DIR}/st;
    access_log off;

    server {
        listen {BIND_HOST}:{PORT};

        # default face — no location pin, the merged 86400s ceiling.
        location /open/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth required;
            brix_webdav_cadir {CADIR};
            brix_allow_write on;
            brix_webdav_macaroon_secret {SECRET_HEX};
        }

        # policed face — a stamped issuer location and a two-minute ceiling.
        location /tight/ {
            brix_webdav on;
            brix_storage_backend posix:{DATA_DIR};
            brix_webdav_auth required;
            brix_webdav_cadir {CADIR};
            brix_allow_write on;
            brix_webdav_macaroon_secret {SECRET_HEX};
            brix_webdav_macaroon_location {ISSUER_URI};
            brix_webdav_macaroon_max_validity 120s;
        }
    }
}

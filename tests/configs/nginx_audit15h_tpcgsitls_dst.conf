# native TPC pull DESTINATION for the TLS x GSI cross
# (test_audit15h_tpc_gsi_tls.py) — audit §C.  One template, four instances: the
# outbound half is entirely in OUTBOUND_KNOBS so that the full cross, the
# cleartext destination, the destination with no credential to present and the
# destination pointed at the wrong trust anchor differ by nothing else.
#
# The write face is anonymous and cleartext on purpose — the test client drives
# it directly, and the credential this file is about is the one the destination
# presents OUTBOUND, on the pull socket.
#
# thread_pool is not optional: the pull runs on a thread-pool worker (the TLS
# handshake and the GSI rounds are blocking, src/tpc/outbound/tls.c).
#
# Keep placeholders out of comments — substitution is textual, and a multi-line
# value expanded inside a comment leaks directives into the enclosing context.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: OUTBOUND_KNOBS.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

thread_pool default threads=2 max_queue=256;
events { worker_connections 64; }

stream {
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_tpc_allow_local on;
        brix_tpc_allow_private on;
        brix_access_log {LOG_DIR}/acc.log;
{OUTBOUND_KNOBS}    }
}

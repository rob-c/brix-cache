# native TPC pull SOURCE guarded by SSS (test_audit15h_tpc_sss.py) — audit §C.
#
# One face, brix_auth sss.  Unlike the GSI/TLS cross there is no separate
# anonymous arm face here and that is the point: the INITIATING client can
# satisfy this source (it holds the shared secret and mints its own credential),
# while the pulling DESTINATION cannot — src/tpc/gsi/gsi_outbound_finish.c only
# ever selects "ztn" or "gsi" from the source's advertised protocol list, so a
# source that offers sss alone leaves the outbound leg with nothing to send.
# The rendezvous is therefore armable and the pull still refused, which is the
# only shape in which that boundary is observable.
#
# The keytab must exist, be 0600 and parse at config-parse time —
# lifecycle.start runs `nginx -t` first, and src/auth/sss/config.c loads and
# validates the keytab there.
#
# Launcher-provided: LOG_DIR PORT DATA_ROOT.
# Test-provided: KEYTAB.
daemon on;
worker_processes 1;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    server {
        listen {PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth sss;
        brix_sss_keytab {KEYTAB};
        brix_access_log {LOG_DIR}/acc.log;
    }
}

# Composite name-space data server with the durable backend-async mutation queue
# ON — registry-lifecycle template for test_cns.py::test_manager_reflects_async_*.
# Identical to nginx_cns_data.conf but adds brix_backend_async: a kXR_rm/kXR_rmdir
# is enqueued durably and the reply (and the §6 CNS DEL/RMDIR emit) is delivered
# LATE by the queue waker (baq_root_done) once the batch flushes — proving the
# async removal path converges into the manager inventory, not just the inline one.
# batch 1 + a short wait flush promptly so the test does not stall on coalescing.
# Launcher-provided: LOG_DIR PORT DATA_ROOT.  Test-provided: CMS_PORT.
worker_processes 1;
daemon on;
error_log {LOG_DIR}/error.log info;
pid {LOG_DIR}/nginx.pid;

events { worker_connections 64; }

stream {
    server {
        listen 127.0.0.1:{PORT};
        brix_root on;
        brix_storage_backend posix:{DATA_ROOT};
        brix_auth none;
        brix_allow_write on;
        brix_backend_async on;
        brix_backend_async_batch 1;
        brix_backend_async_wait 200ms;
        brix_cns emit;
        brix_cms_manager 127.0.0.1:{CMS_PORT};
        brix_cms_paths /;
        brix_cms_interval 1;
        brix_listen_port {PORT};
    }
}

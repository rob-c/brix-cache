# Phase-44 P44-C subject (tests/test_io_uring_rxtx.py).
#
# The client-side cleartext RECV/SEND multishot tier (§13.4 ii-b) is a *client*
# engine, so this server carries no io_uring itself — it is just a plain anon
# root:// data plane the C harness (aio_smoke) drives under
# XRDC_IO_URING_LOOP=rxtx.  Two listeners over ONE data dir:
#   * cleartext {PORT}     — `ac->ssl == NULL`, so the rxtx ring engages here
#     (multishot IORING_OP_RECV over the provided-buffer ring + one-shot SEND);
#   * TLS {TLS_PORT}       — `roots://`, so `ac->ssl != NULL` and the rxtx path
#     MUST decline and fall back to SSL_* (raw RECV on an encrypted socket would
#     read ciphertext and corrupt the stream — the security-negative).
# PORT/TLS_PORT come from the lc-uring-rxtx ledger entry
# (tests/fleet_lifecycle_ports.py); CERT/KEY/CA (host cert/key + trusted CA)
# and DATA_DIR/BIND_HOST ride in template_values.
daemon on;
pid {LOG_DIR}/nginx.pid;
error_log {LOG_DIR}/error.log info;
worker_processes 1;
events { worker_connections 64; }

stream {
  server {
    listen {BIND_HOST}:{PORT};
    brix_root on;
    brix_storage_backend posix:{DATA_DIR};
    brix_allow_write on;
    brix_auth none;
  }

  server {
    listen {BIND_HOST}:{TLS_PORT};
    brix_root on;
    brix_storage_backend posix:{DATA_DIR};
    brix_allow_write on;
    brix_auth none;
    brix_tls on;
    brix_certificate     {CERT};
    brix_certificate_key {KEY};
    brix_trusted_ca      {CA};
  }
}

worker_processes 1;
error_log /var/log/brix/error.log info;
pid       /var/log/brix/nginx.pid;

events { worker_connections 64; }

# pb-gsi per-UNIX-GROUP multi-user role (charts/pb-gsi,
# remote-suite/tests/test_pbgsi_multiuser.py): a root://+GSI front over a LOCAL
# pblock:// store.  The authenticated GSI **EEC DN** (post-P80.11 identity) is
# mapped worker-side to a local username via {gridmap} (P80.21 — no
# impersonation broker involved); that user's unix group membership feeds the
# {authdb} g-rule gate, and the pblock catalog stamps the resolved {uid,gid}
# as attribution ground truth (P80.22).  The gate decides, the catalog
# attests — see docs/05-operations/pblock-multiuser.md.
#
# The governed prefixes /phys + /eng are pre-seeded world-writable (0777,
# service-owned) by the chart's data-seed init container so the pblock POSIX
# layer is permissive (a no-VOMS GSI identity has no VO -> private catalog gid)
# and the g-rule gate is the sole differentiator.
stream {
    # EEC DN -> local username, resolved at login independent of any broker.
    brix_gridmap        /etc/brix/extra/gridmap;
    brix_idmap_min_uid  1000;

    server {
        listen {{ (index .Values.role.ports 0).port }};
        brix_root on;
        brix_auth gsi;
        brix_certificate     /etc/grid-security/hostcert.pem;
        brix_certificate_key /etc/grid-security/hostkey.pem;
        brix_trusted_ca      /etc/grid-security/certificates/ca.pem;

        brix_export           {{ .Values.role.data.root }};
        brix_storage_backend  pblock://{{ .Values.role.data.root }};
        brix_allow_write      on;
        # pblock stages whole-object writes; the local .part+rename resume
        # engine bypasses the catalog seam, so keep it off (same class as s3gsi).
        brix_upload_resume    off;

        brix_authdb_format xrdacc;
        brix_authdb        /etc/brix/extra/authdb;
        brix_authdb_audit  all;
        brix_access_log    /var/log/brix/brix_access.log;
    }
}

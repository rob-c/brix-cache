worker_processes 1;
error_log /var/log/brix/error.log info;
pid       /var/log/brix/nginx.pid;
thread_pool default threads=4 max_queue=65536;

events { worker_connections 256; }

# s3-voms zero-provisioning role (charts/s3-voms,
# remote-suite/tests/test_s3voms_multiuser.py): a root://+GSI front whose
# storage plane is an UPSTREAM MinIO S3 bucket, where BOTH authorization and
# backend-credential selection are driven entirely by the client's VOMS
# Attribute Certificate — nothing is provisioned per user.
#
#  - Identity: brix_auth gsi + VOMS extraction (brix_vomsdir + brix_voms_cert_dir);
#    the AC's VO ("atlas"/"cms") becomes the identity's vorg + VO list.
#  - Authz: brix_require_vo gates each governed prefix by VO (P80.13); the
#    two-line brix_authdb ('o atlas /atlas a' + 'o cms /cms a') grants the
#    matching org and DEFAULT-DENIES everywhere else.  A no-AC identity has no
#    vorg/VO and is denied by both.
#  - Backend credentials: brix_storage_credential_dir holds exactly two VO-tier
#    files (vo-atlas.s3 / vo-cms.s3, P80.12).  ucred.c resolves them after the
#    per-user hash miss, so an atlas user signs MinIO with the atlas group key
#    with no per-user file.  fallback=deny: an identity with no VO credential
#    is refused (never silently promoted to the service credential).
stream {
    brix_credential svc {
        s3_access_key {{ .Values.role.backend.accessKey }};
        s3_secret_key {{ .Values.role.backend.secretKey }};
        s3_region     {{ .Values.role.backend.region }};
    }

    server {
        listen {{ (index .Values.role.ports 0).port }};
        brix_root on;
        brix_auth gsi;
        brix_allow_write on;
        brix_certificate     /etc/grid-security/hostcert.pem;
        brix_certificate_key /etc/grid-security/hostkey.pem;
        brix_trusted_ca      /etc/grid-security/certificates/ca.pem;

        # VOMS AC -> VO/vorg.  voms_cert_dir is the CA bundle (the VOMS signer
        # chains to the test CA); vomsdir carries the per-VO LSC trust anchors.
        brix_vomsdir       /etc/grid-security/vomsdir;
        brix_voms_cert_dir /etc/grid-security/certificates;
        brix_require_vo /atlas atlas;
        brix_require_vo /cms   cms;

        # upload_resume stages writes in a LOCAL .part + rename — that engine
        # bypasses the VFS staged path to the s3 backend (same class as s3gsi).
        brix_upload_resume   off;
        brix_authdb          /etc/brix/extra/authdb;
        # Explicit export root so request paths and authdb rules canonicalize
        # identically ("/atlas/..." both sides) — see s3_gsi_multiuser.conf.
        brix_export          {{ .Values.role.data.root }};
        brix_storage_backend s3://{{ .Values.role.backend.host | default (printf "%s-minio" .Release.Name) }}:{{ .Values.role.backend.port }}/{{ .Values.role.backend.bucket }};
        brix_storage_credential          svc;
        brix_storage_credential_dir      /etc/brix/extra;
        # Zero-provisioning posture: no VO credential -> denied, never the
        # service credential.
        brix_storage_credential_fallback deny;
        brix_access_log /var/log/brix/brix_access.log;
    }
}

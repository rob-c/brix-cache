worker_processes 1;
error_log /var/log/brix/error.log info;
pid       /var/log/brix/nginx.pid;
thread_pool gsiftp_io threads=4 max_queue=128;

events { worker_connections 128; }

# Outbound GridFTP lane (phase-115 W5.5, k8s-tests/remote-suite/tests/
# test_gridftp_outbound_interop.py).
#
# This is the OTHER direction from gridftp_gateway.conf.  There brix IS the
# door and the reference Globus client drives it; here brix is the CLIENT of
# somebody else's door — a real Globus or dCache endpoint the operator names in
# values — and the reference implementation is the thing under test.  That is
# the only way W5.1-W5.4 get exercised against a server nobody here wrote: the
# in-repo suites all drive brix_suite/servers/ftp_origin_server.py, which was
# written from the same reading of GFD.020 as the driver it tests.
#
# Four fronts over ONE external door, differing only in the store line, so any
# difference between them is attributable to the data-channel parameters and
# not to the door, the export or the credential:
#
#   ports[0] plain    stream mode, cleartext — the RFC 959 control.  A door
#                     that fails HERE is broken or unreachable, and the other
#                     three fronts' failures mean nothing until this one passes.
#   ports[1] mode-e   mode=e — GFD.020 extended block mode.  A requirement: a
#                     door that will not do MODE E fails the transfer.
#   ports[2] prot-p   mode=e prot=p — TLS on the data channel with the leaf DN
#                     pinned to the control identity.  Also a requirement, and
#                     the phase's stated security negative: this front must
#                     never quietly become the cleartext one.
#   ports[3] streams  mode=e streams=<n> — SPAS striping.  A CEILING, and the
#                     one front that is ALLOWED to serve the same bytes over a
#                     single connection when the door declines to stripe.
#
# All four are read/write so the same suite can prove same-origin COPY (W5.4)
# and staged PUT against a real door, and all four use one thread pool: these
# are blocking VFS worker threads, and a door that stalls must stall a bounded
# number of them.
http {
    client_body_temp_path /tmp;
    proxy_temp_path        /tmp;
    fastcgi_temp_path      /tmp;
    uwsgi_temp_path        /tmp;
    scgi_temp_path         /tmp;

    {{- $door := .Values.role.outbound }}
    {{- $url := printf "%s://%s:%v%s" $door.scheme $door.host $door.port $door.basePath }}

    {{- if eq $door.scheme "gsiftp" }}
    # The proxy the door will authenticate.  Mounted from the operator's own
    # secret: a lab that mints its own credential would be testing brix against
    # a CA the real door has never heard of.
    brix_credential door {
        x509_proxy {{ $door.proxyPath }};
        ca_dir     {{ $door.caDir }};
    }
    {{- end }}

    server {
        listen {{ (index .Values.role.ports 0).port }};
        client_max_body_size 256m;
        access_log /var/log/brix/outbound_plain_access.log;
        location / {
            dav_methods PUT DELETE;
            brix_webdav          on;
            brix_webdav_auth     none;
            brix_export          {{ .Values.role.data.root }};
            brix_storage_backend {{ $url }};
            {{- if eq $door.scheme "gsiftp" }}
            brix_storage_credential door;
            {{- end }}
            brix_allow_write     on;
            brix_thread_pool     gsiftp_io;
        }
    }

    server {
        listen {{ (index .Values.role.ports 1).port }};
        client_max_body_size 256m;
        access_log /var/log/brix/outbound_mode_e_access.log;
        location / {
            dav_methods PUT DELETE;
            brix_webdav          on;
            brix_webdav_auth     none;
            brix_export          {{ .Values.role.data.root }};
            brix_storage_backend {{ $url }} mode=e;
            {{- if eq $door.scheme "gsiftp" }}
            brix_storage_credential door;
            {{- end }}
            brix_allow_write     on;
            brix_thread_pool     gsiftp_io;
        }
    }

    {{- if eq $door.scheme "gsiftp" }}
    # prot=p is refused at nginx -t on an ftp:// origin, and rightly: the value
    # of PROT P here is the DN pin, and an anonymous control channel
    # authenticates no identity to pin against.  So this front exists only for
    # a GSI door — rendering it for a cleartext one would not fail the test, it
    # would fail the config parse and take the whole lane with it.
    server {
        listen {{ (index .Values.role.ports 2).port }};
        client_max_body_size 256m;
        access_log /var/log/brix/outbound_prot_p_access.log;
        location / {
            dav_methods PUT DELETE;
            brix_webdav          on;
            brix_webdav_auth     none;
            brix_export          {{ .Values.role.data.root }};
            brix_storage_backend {{ $url }} mode=e prot=p;
            brix_storage_credential door;
            brix_allow_write     on;
            brix_thread_pool     gsiftp_io;
        }
    }
    {{- end }}

    server {
        listen {{ (index .Values.role.ports 3).port }};
        client_max_body_size 256m;
        access_log /var/log/brix/outbound_streams_access.log;
        location / {
            dav_methods PUT DELETE;
            brix_webdav          on;
            brix_webdav_auth     none;
            brix_export          {{ .Values.role.data.root }};
            brix_storage_backend {{ $url }} mode=e streams={{ $door.streams | default 4 }};
            {{- if eq $door.scheme "gsiftp" }}
            brix_storage_credential door;
            {{- end }}
            brix_allow_write     on;
            brix_thread_pool     gsiftp_io;
        }
    }
}

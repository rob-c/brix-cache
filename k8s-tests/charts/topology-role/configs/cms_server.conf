worker_processes 1;
error_log /var/log/brix/error.log debug;
pid       /var/log/brix/nginx.pid;

events { worker_connections 128; }

stream {
    server {
        listen {{ (index .Values.role.ports 0).port }};
        brix_cms_server on;
        brix_cms_server_allow 10.244.0.0/16 fd00:10:244::/64;
    }
}

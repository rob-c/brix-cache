# s3-voms — root://+GSI gateway whose storage plane is MinIO S3, with
# VO-DERIVED backend credentials selected from a live VOMS Attribute
# Certificate and ORG-SCOPED authz — the P80.14 zero-provisioning posture.
#
# The distinction from s3-gsi: NOTHING is provisioned per user.  The server
# ships exactly two credential files (vo-atlas.s3, vo-cms.s3 — P80.12 VO tier)
# and a two-line authdb (o atlas /atlas a ; o cms /cms a) plus two
# brix_require_vo lines.  A NEVER-SEEN user cert bearing a valid atlas VOMS AC
# immediately reads/writes/deletes under /atlas/*, is denied on /cms and
# everywhere else, and MinIO attributes every request to the atlas group key —
# no gridmap, no per-user file, no reload.
#
# Provisioned identities (fixed, see templates/pki-bootstrap-job.yaml).  The
# users exist ONLY so the test has proxies to drive; the server has no
# knowledge of them:
#   bob, alice   -> VOMS AC  vo=atlas  -> vo-atlas.s3 (atlas-svc, prefix atlas/*)
#   tom, jane    -> VOMS AC  vo=cms    -> vo-cms.s3   (cms-svc,   prefix cms/*)
#   mallory      -> valid GSI proxy, NO VOMS AC -> no VO -> denied everywhere
# Published object names are release-independent:
#   Secret    s3voms-pki           (CA, host cert, per-user VOMS proxies, identities.env)
#   ConfigMap s3voms-ca-bundle     (hashed CA dir for /etc/grid-security/certificates)
#   ConfigMap s3voms-jwks          (jwks.json — only to satisfy client-pki-init)
#   Secret    s3voms-vomsdir       (per-VO LSC entries -> /etc/grid-security/vomsdir/<vo>/*.lsc)
#   Secret    s3voms-server-extra  (authdb + vo-atlas.s3 + vo-cms.s3 -> /etc/brix/extra)
minio:
  image: minio/minio:latest
  pullPolicy: IfNotPresent
  rootUser: minioadmin
  rootPassword: minioadmin
  port: 9000

mc:
  image: minio/mc:latest
  pullPolicy: IfNotPresent

pki:
  image: brix-authority:dev
  pullPolicy: Never

bucket: brixvoms

# Backend (MinIO) users the provision job creates.  atlas/cms are scoped to
# their VO prefix (atlas additionally DENIED PutObject on atlas/wprobe/* — the
# write-attribution probe); svc is the static service credential.
backendUsers:
  atlas: { accessKey: atlas-svc, secretKey: atlas-secret-1 }
  cms:   { accessKey: cms-svc,   secretKey: cms-secret-1 }
  svc:   { accessKey: svc,       secretKey: svc-secret-11 }

s3voms:
  enabled: true
  role:
    name: s3voms
    configKey: s3_voms_multiuser
    ports:
      - { name: rootvoms, port: 1097 }
    data: { root: /data/xrootd }
    auth:
      caBundle: s3voms-ca-bundle
      hostCertSecret: s3voms-pki
      # VOMS certificate dir = the CA bundle (the VOMS signer chains to the
      # test CA); vomsLsc lays out /etc/grid-security/vomsdir/<vo>/*.lsc.
      vomsLsc: s3voms-vomsdir
      # authdb (org rules) + vo-*.s3 credential files delivered to /etc/brix/extra.
      extraSecret: s3voms-server-extra
    backend:
      # host defaults to "<release>-minio" in the conf template
      host: ""
      port: 9000
      bucket: brixvoms
      region: us-east-1
      accessKey: svc
      secretKey: svc-secret-11

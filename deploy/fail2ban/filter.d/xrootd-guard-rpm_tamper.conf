# fail2ban filter — nginx xrootd guard audit log, signal=rpm_tamper lines.
# An RPM mirror fill FAILED its repodata verification: createrepo names every
# file beside repomd.xml "<checksum>-<name>", and the bytes the upstream
# served did not hash to the checksum their own key carries. Repository
# metadata is the index every `dnf install` on the site trusts, so wrong
# metadata is wrong packages; the part was quarantined rather than cached.
# The HOST on these lines is the UPSTREAM mirror that served them, not a
# client: fills are detached and request-coalesced, so there is no client to
# blame. That is why the matching jail ships DISABLED (see jail.d) — banning
# an upstream mirror at the firewall takes the repository offline for every
# user, which is worse than the corruption it answers. Enable it only for an
# upstream you are willing to cut off, e.g. one mirror of a failover set.
# Line format (src/net/guard/guard_audit.c — the fail2ban contract):
#   <iso8601> ip=<upstream> proto=rpm signal=rpm_tamper op=read path="<key>" status=<n>
[Definition]
failregex = ^\S+ ip=<HOST> proto=\S+ signal=rpm_tamper\b
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

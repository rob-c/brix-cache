# fail2ban filter — nginx xrootd guard audit log, signal=rpmwrite lines.
# A write-class method (POST/PUT/PATCH/DELETE) aimed at an RPM pull-through
# MIRROR location. A mirror is read-only by construction and dnf never writes
# to one: yum/dnf, createrepo and every package tool GET. What produces these
# lines is a scanner probing for a writable repository to drop a package into
# — and a package planted in a repo an entire site installs from is a
# supply-chain compromise with a very short path to root everywhere.
# The HOST here IS the client: it chose the method and the target.
# Line format (src/net/guard/guard_audit.c — the fail2ban contract):
#   <iso8601> ip=<client> proto=rpm signal=rpmwrite op=write path="<uri>" status=405
[Definition]
failregex = ^\S+ ip=<HOST> proto=\S+ signal=rpmwrite\b
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

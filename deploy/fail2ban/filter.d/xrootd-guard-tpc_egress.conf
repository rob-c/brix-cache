# fail2ban filter — nginx xrootd guard audit log, signal=tpc_egress lines.
# A native TPC pull named a SOURCE authority that is not on the operator's
# brix_tpc_source_allow allowlist, so the gateway refused to originate the
# outbound connection BEFORE dialling it (SSRF egress control). A legitimate
# transfer only ever names an approved source endpoint, so a client probing
# arbitrary source hosts through the gateway is reaching for an SSRF pivot.
# The refused source host rides the path field (sanitized).
# Line format (src/net/guard/guard_audit.c — the fail2ban contract):
#   <iso8601> ip=<addr> proto=root signal=tpc_egress op=write path="<host>" status=<n>
[Definition]
failregex = ^\S+ ip=<HOST> proto=\S+ signal=tpc_egress\b
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

# fail2ban filter — nginx xrootd guard audit log, signal=ocipush lines.
# A write-class method (POST/PUT/PATCH/DELETE) aimed at a pull-through MIRROR
# location. A mirror is read-only by construction; no registry client ever
# pushes to one by accident — podman pushes to the registry it was told to
# push to. What produces these lines is a scanner hunting for an open
# registry to plant an image in, which is a supply-chain attack with a very
# short path to "every node on the site runs it".
# The HOST here IS the client: it chose the method and the target.
# Line format (src/net/guard/guard_audit.c — the fail2ban contract):
#   <iso8601> ip=<client> proto=oci signal=ocipush op=write path="<uri>" status=405
[Definition]
failregex = ^\S+ ip=<HOST> proto=\S+ signal=ocipush\b
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

# fail2ban filter — nginx xrootd guard audit log, signal=oci_tamper lines.
# An OCI mirror fill FAILED its digest verification: the bytes the upstream
# registry (or the CDN it redirected us to) served did not hash to the digest
# their own key names. A registry's content addresses are self-certifying, so
# this is never bit-rot that a retry fixes — it is the wrong bytes, and they
# were quarantined rather than cached.
# The HOST on these lines is the UPSTREAM that served them, not a client:
# fills are detached and request-coalesced, so there is no client to blame.
# That is exactly why the matching jail ships DISABLED (see jail.d): banning
# an upstream registry at the firewall takes the mirror offline for every
# user, which is a worse outcome than the corruption it answers. Enable it
# only for an upstream you are willing to cut off, e.g. one CDN edge out of a
# failover set.
# Line format (src/net/guard/guard_audit.c — the fail2ban contract):
#   <iso8601> ip=<upstream> proto=oci signal=oci_tamper op=read path="<key>" status=<n>
[Definition]
failregex = ^\S+ ip=<HOST> proto=\S+ signal=oci_tamper\b
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

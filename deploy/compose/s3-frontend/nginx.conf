# s3-frontend: SigV4 S3 API (9000) and WebDAV (8443) over one POSIX bucket
# Rendered into the container at /etc/brix/nginx.conf. Paths follow the image
# layout: PKI under /etc/brix/pki (minted by brix-pki-init), data under /data,
# cache under /var/cache/brix, runtime state under /run/brix and /var/lib/brix.
worker_processes auto;
error_log /dev/stderr info;
pid /run/brix/nginx.pid;
thread_pool default threads=4 max_queue=65536;

events { worker_connections 1024; }

http {
    # S3-compatible endpoint. Bucket name maps to /data; keys are paths.
    # SigV4 is verified against the static key pair below — rotate before
    # exposing; brix_backend_s3_sts_* exists for STS-issued credentials.
    server {
        listen 9000;
        location / {
            brix_s3              on;
            brix_storage_backend posix:/data;
            brix_s3_bucket       data;
            brix_s3_region       us-east-1;
            brix_s3_access_key   AKIAEXAMPLEDEMO00001;
            brix_s3_secret_key   demo-secret-change-me-0123456789abcdef;
            brix_allow_write     on;
        }
    }

    # The same objects as a WebDAV tree.
    server {
        listen 8443 ssl;
        ssl_certificate     /etc/brix/pki/hostcert.pem;
        ssl_certificate_key /etc/brix/pki/hostkey.pem;
        location / {
            brix_webdav          on;
            brix_webdav_auth     none;
            brix_storage_backend posix:/data;
        }
    }
    # Prometheus metrics + liveness probe (plain HTTP, internal network only).
    server {
        listen 9100;
        location /metrics { brix_metrics on; }
        location /healthz { brix_health on; }
    }
}

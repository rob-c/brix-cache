services:
  pki:
    image: ${BRIX_IMAGE:-ghcr.io/rob-c/brix-cache:latest}
    command: ["brix-pki-init"]
    environment:
      OUT: /etc/brix/pki
      HOSTS: "localhost brix server origin manager ds1 ds2 gateway backend proxy cache"
    volumes:
      - pki:/etc/brix/pki
  manager:
    image: ${BRIX_IMAGE:-ghcr.io/rob-c/brix-cache:latest}
    depends_on:
      pki:
        condition: service_completed_successfully
    volumes:
      - pki:/etc/brix/pki:ro
      - ./nginx-manager.conf:/etc/brix/nginx.conf:ro
      - data:/data
    ports:
      - "1094:1094"
      - "1213:1213"
      - "9100:9100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
  ds1:
    image: ${BRIX_IMAGE:-ghcr.io/rob-c/brix-cache:latest}
    depends_on:
      pki:
        condition: service_completed_successfully
      manager:
        condition: service_healthy
    volumes:
      - pki:/etc/brix/pki:ro
      - ./nginx-ds1.conf:/etc/brix/nginx.conf:ro
      - data1:/data
    ports:
      - "1095:1095"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
  ds2:
    image: ${BRIX_IMAGE:-ghcr.io/rob-c/brix-cache:latest}
    depends_on:
      pki:
        condition: service_completed_successfully
      manager:
        condition: service_healthy
    volumes:
      - pki:/etc/brix/pki:ro
      - ./nginx-ds2.conf:/etc/brix/nginx.conf:ro
      - data2:/data
    ports:
      - "1096:1096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
  client:
    image: ${BRIX_IMAGE:-ghcr.io/rob-c/brix-cache:latest}
    profiles: ["smoke"]
    depends_on:
      ds1:
        condition: service_healthy
      ds2:
        condition: service_healthy
    command: ["sh", "/smoke.sh"]
    environment:
      BRIX_HOST: manager
      DS1_HOST: ds1
      DS2_HOST: ds2
    volumes:
      - pki:/etc/brix/pki:ro
      - ./smoke.sh:/smoke.sh:ro
volumes:
  pki: {}
  data1: {}
  data2: {}

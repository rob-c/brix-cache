# xcache: read-through CACHE in front of the origin
# Rendered into the container at /etc/brix/nginx.conf. Paths follow the image
# layout: PKI under /etc/brix/pki (minted by brix-pki-init), data under /data,
# cache under /var/cache/brix, runtime state under /run/brix and /var/lib/brix.
worker_processes auto;
error_log /dev/stderr info;
pid /run/brix/nginx.pid;
thread_pool default threads=4 max_queue=65536;

events { worker_connections 1024; }

stream {
    # Misses are filled from the origin (brix_storage_backend) into the local
    # store; hits are served from disk. Clients see the origin namespace.
    server {
        listen 1094;
        brix_root            on;
        brix_auth            none;
        brix_export          /data;
        brix_storage_backend root://origin:1095;
        brix_cache_store     posix:/var/cache/brix;
        brix_cache_export    /;
        brix_cache_lock_timeout       300s;
        brix_cache_eviction_threshold 90%;
        brix_cache_max_file_size      100g;
    }
}

http {
    # Prometheus metrics + liveness probe (plain HTTP, internal network only).
    server {
        listen 9100;
        location /metrics { brix_metrics on; }
        location /healthz { brix_health on; }
    }
}

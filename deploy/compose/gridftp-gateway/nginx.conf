# gridftp-gateway: GSI gsiftp:// door (2811) + anonymous ftp:// door (2121) on one export
# Rendered into the container at /etc/brix/nginx.conf. Paths follow the image
# layout: PKI under /etc/brix/pki (minted by brix-pki-init), data under /data,
# cache under /var/cache/brix, runtime state under /run/brix and /var/lib/brix.
worker_processes auto;
error_log /dev/stderr info;
pid /run/brix/nginx.pid;
thread_pool default threads=4 max_queue=65536;

events { worker_connections 1024; }

stream {
    # RFC 2228 GSI control channel: client presents an X.509 proxy, MODE E
    # parallel data channels, PROT C/S/P per transfer.
    server {
        listen 2811;
        brix_gridftp         on;
        brix_gridftp_gsi     on;
        brix_certificate     /etc/brix/pki/hostcert.pem;
        brix_certificate_key /etc/brix/pki/hostkey.pem;
        brix_trusted_ca      /etc/brix/pki/ca;
        brix_export          /data;
        brix_allow_write     on;
        brix_gridftp_pasv_port_range 50000 50019;
    }

    # Cleartext anonymous FTP on the same bytes — for curl/lftp demos.
    server {
        listen 2121;
        brix_gridftp         on;
        brix_gridftp_gsi     off;
        brix_export          /data;
        brix_allow_write     on;
        brix_gridftp_pasv_port_range 50020 50039;
    }
}

http {
    # Prometheus metrics + liveness probe (plain HTTP, internal network only).
    server {
        listen 9100;
        location /metrics { brix_metrics on; }
        location /healthz { brix_health on; }
    }
}

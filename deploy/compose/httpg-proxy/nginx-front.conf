# httpg-proxy: FRONT — terminates httpg (proxy-cert TLS), forwards as the caller
# Rendered into the container at /etc/brix/nginx.conf. Paths follow the image
# layout: PKI under /etc/brix/pki (minted by brix-pki-init), data under /data,
# cache under /var/cache/brix, runtime state under /run/brix and /var/lib/brix.
worker_processes auto;
error_log /dev/stderr info;
pid /run/brix/nginx.pid;
thread_pool default threads=4 max_queue=65536;

events { worker_connections 1024; }

http {
    server {
        listen 8443 ssl;
        ssl_certificate        /etc/brix/pki/hostcert.pem;
        ssl_certificate_key    /etc/brix/pki/hostkey.pem;
        ssl_verify_client      on;
        ssl_verify_depth       10;
        ssl_session_tickets    off;
        ssl_session_cache      off;
        brix_client_certificate_folder /etc/brix/pki/ca;
        brix_client_ca_store           /etc/brix/pki/ca;
        brix_webdav_proxy_certs        on;      # accept RFC 3820 proxy chains
        client_max_body_size           256m;
        brix_storage_credential_dir    /var/lib/brix/creds;

        # Users deposit their own proxy here once (PUT body = proxy PEM).
        location /.well-known/brix-delegation {
            brix_webdav              on;
            brix_webdav_auth         required;
            brix_trusted_ca_dir      /etc/brix/pki/ca;
            brix_export              /data;
            brix_allow_write         on;
            brix_delegation_endpoint on;
        }

        # Everything else is forwarded with the CALLER's delegated credential.
        location / {
            # The backend is a brix WebDAV server, not an ARC CE: the `arc`
            # profile only admits the A-REX namespaces (/arex, /rest,
            # /datadelivery) and bounces every other path. `xrdhttp` is the
            # WebDAV grammar — root-open, GET/HEAD/PUT/POST/DELETE/PROPFIND/
            # OPTIONS only; narrow it with brix_guard_valid_prefix once the
            # export layout is fixed.
            brix_guard              on;
            brix_guard_profile      xrdhttp;
            brix_guard_audit_log    /var/log/brix/guard-audit.log;
            proxy_pass              https://backend:8444;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        Host $http_host;
            proxy_ssl_certificate     $brix_delegated_cred;
            proxy_ssl_certificate_key $brix_delegated_cred;
            brix_backend_ca_dir       /etc/brix/pki/ca;
            proxy_ssl_verify          on;
            proxy_ssl_name            backend;
            proxy_ssl_server_name     on;
        }
    }
    # Prometheus metrics + liveness probe (plain HTTP, internal network only).
    server {
        listen 9100;
        location /metrics { brix_metrics on; }
        location /healthz { brix_health on; }
    }
}

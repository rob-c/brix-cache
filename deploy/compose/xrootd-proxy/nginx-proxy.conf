# xrootd-proxy: the transparent frame-relay PROXY clients talk to
# Rendered into the container at /etc/brix/nginx.conf. Paths follow the image
# layout: PKI under /etc/brix/pki (minted by brix-pki-init), data under /data,
# cache under /var/cache/brix, runtime state under /run/brix and /var/lib/brix.
worker_processes auto;
error_log /dev/stderr info;
pid /run/brix/nginx.pid;
thread_pool default threads=4 max_queue=65536;

events { worker_connections 1024; }

stream {
    # Clients connect here; every post-login opcode is relayed to the origin
    # with file handles translated. Auth to the origin is anonymous — use
    # `forward` to replay bearer tokens or `sss` for a shared secret.
    server {
        listen 1094;
        brix_root                on;
        brix_auth                none;
        brix_tap_proxy           on;
        brix_tap_proxy_upstream  origin:1095;
        brix_tap_proxy_auth      anonymous;
    }
}

http {
    # Prometheus metrics + liveness probe (plain HTTP, internal network only).
    server {
        listen 9100;
        location /metrics { brix_metrics on; }
        location /healthz { brix_health on; }
    }
}

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "brixtest"
version = "0.15.0"
description = "Pythonic, isolated, backend-neutral server/client testing for pytest."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "BriXTest contributors" }]
keywords = ["pytest", "testing", "servers", "containers", "kubernetes", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pluggy>=1.5,<2",
    "pytest>=8,<10",
]

[project.optional-dependencies]
xdist = ["pytest-xdist>=3.6,<4"]
crypto = ["cryptography>=3.0,<49"]
s3 = ["botocore>=1.43.66,<2"]
analytics = ["pyarrow>=15,<26", "duckdb>=1.1,<2"]
all = [
    "pytest-xdist>=3.6,<4",
    "cryptography>=3.0,<49",
    "botocore>=1.43.66,<2",
    "pyarrow>=15,<26",
    "duckdb>=1.1,<2",
]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3.6,<4",
    "pytest-cov>=5,<8",
    "mypy>=1.10,<2",
    "ruff>=0.8,<1",
    "tox>=4.15,<5",
    "build>=1,<2",
]

[project.urls]
Documentation = "https://github.com/rob-c/brix-cache/tree/main/brixtest/docs"
Issues = "https://github.com/rob-c/brix-cache/issues"
Source = "https://github.com/rob-c/brix-cache/tree/main/brixtest"

[project.scripts]
brixtest = "brixtest.cli.main:main"

[project.entry-points.pytest11]
brixtest = "brixtest.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/brixtest"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "brixtest: case runs in a supervised helper",
    "brixtest_budget: enforce a managed-case metric bound",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
files = ["tests/typing/author_surface.py"]
mypy_path = "src"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["brixtest.*"]
ignore_errors = true

[tox]
requires = tox>=4.15
env_list = py39-pytest8, py310-pytest8, py311-pytest9, py312-pytest9, py313-pytest9
isolated_build = true

[testenv]
package = wheel
deps =
    pytest8: pytest>=8,<9
    pytest9: pytest>=9,<10
    complexipy>=6,<8
    lizard>=1.17,<2
    radon>=6,<7
commands =
    pytest tests examples -q --no-brixtest-fail-fast
    pytest compat_tests -q
pass_env =
    BRIXTEST_*
    KUBECONFIG
    PATH

[testenv:quality]
package = wheel
deps =
    complexipy>=6,<8
    lizard>=1.17,<2
    mypy>=1.10,<2
    pytest>=8,<10
    radon>=6,<7
    ruff>=0.8,<1
commands =
    ruff check --select E9,F63,F7,F82 src tests examples compat_tests
    mypy tests/typing/author_surface.py
    pytest tests/test_code_quality.py -q --no-brixtest-fail-fast

[testenv:minikube]
package = wheel
deps = pytest>=8,<10
set_env = BRIXTEST_MINIKUBE=1
commands = pytest tests/integration -v
